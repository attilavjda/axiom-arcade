//   Ellen J. Langer, "The Power of Mindful Learning".

// ===========================================================================
// ENGINE: pure logic for COULD-BE Ω (no drawing, no input).
// Every round is generated from a seeded random generator. A round carries
//   prompt / lens captions / hint / notice  (text),
//   d      (diagram: points, wires, boxes, texts, tables, all in screen pixels),
//   cells  (points whose value the player sets), choices (multiple choice),
//   check(ans) -> {ok, msg, notice?}, solve() -> one correct answer.
// An answer is {cells: [value index per cell, -1 = unset], choice: index or -1}.
// ===========================================================================

const W = 320, H = 200;

function RNG(seed) {
  let s = (seed >>> 0) || 1;
  const f = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const int = (a, b) => a + Math.floor(f() * (b - a + 1));
  const pick = a => a[Math.floor(f() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { f, int, pick, shuffle, bool: p => f() < (p == null ? 0.5 : p) };
}

const range = n => Array.from({ length: n }, (_, i) => i);
const LC = "abcdefghjkmn".split("");
const DG = "1234567".split("");
const BN = ["p", "q", "r"];
function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }
function randInj(rng, k, n) { return rng.shuffle(range(n)).slice(0, k); }
function randSubset(rng, n, kmin, kmax) { const k = rng.int(kmin, kmax); return new Set(rng.shuffle(range(n)).slice(0, k)); }
function setStr(labs, set) { const a = [...set].sort((x, y) => x - y).map(i => labs[i]); return a.length ? "{" + a.join(",") + "}" : "∅"; }
function rowX(n, x0, x1, maxStep) {
  if (n <= 1) return [Math.round((x0 + x1) / 2)];
  const step = Math.min(maxStep || 40, (x1 - x0) / (n - 1));
  const start = (x0 + x1) / 2 - step * (n - 1) / 2;
  return range(n).map(i => Math.round(start + i * step));
}
function mapStr(srcLabs, tgtLabs, f) { return srcLabs.map((s, i) => s + "↦" + tgtLabs[f[i]]).join(" "); }

// ---- diagram builder ----
function Diagram() {
  const d = { pts: [], wires: [], boxes: [], texts: [], tables: [], marks: [] };
  d.pt = (x, y, lab, lp, o) => { d.pts.push(Object.assign({ x, y, lab, lp: lp || "u", ring: false, col: "ink", cell: -1, kind: "dot" }, o || {})); return d.pts.length - 1; };
  d.wire = (a, b, o) => { d.wires.push(Object.assign({ a, b, col: "blue", dash: false }, o || {})); };
  d.text = (x, y, s, col, align) => { d.texts.push({ x, y, s, col: col || "ink", align: align || "left" }); };
  d.box = (x, y, w, h, lab, col) => { d.boxes.push({ x, y, w, h, lab: lab || "", col: col || "faint" }); };
  return d;
}
function addCell(r, pt, vals, labs, o) {
  const c = Object.assign({ pt, vals, labs, style: "val", targets: null }, o || {});
  r.cells.push(c); r.d.pts[pt].cell = r.cells.length - 1;
  return c;
}
function blank(r) {
  return { cells: r.cells.map(c => (c.style === "mark" ? 0 : -1)), choice: -1 };
}
function cellVal(r, ans, i) { const v = ans.cells[i]; return v < 0 ? undefined : r.cells[i].vals[v]; }
function idxOf(c, val) { return c.vals.indexOf(val); }

function mkRound(kind, o) {
  return Object.assign({ kind, prompt: [], lens: { MATH: [], STORY: [], TABLE: [] }, hint: [], notice: [],
    cells: [], choices: null, open: false, d: Diagram() }, o || {});
}

// Fill in the "cells" part of a round whose answer is a fixed vector of values.
function fixedAnswer(r, want, explain) {
  r.want = want;
  r.solve = () => ({ cells: r.cells.map((c, i) => idxOf(c, want[i])), choice: -1 });
  r.check = ans => {
    for (let i = 0; i < r.cells.length; i++) if (ans.cells[i] < 0) return { ok: false, unset: true, msg: ["Some points still show ?. Give each one a value first."] };
    for (let i = 0; i < r.cells.length; i++) if (cellVal(r, ans, i) !== want[i]) return { ok: false, at: i, msg: explain(i, cellVal(r, ans, i)) };
    return { ok: true, msg: ["Yes. That is the one value each point could take here."] };
  };
}
function choiceRound(r, choices, ans, explain) {
  r.choices = choices; r.answer = ans;
  r.solve = () => ({ cells: [], choice: ans });
  r.check = a => (a.choice === ans ? { ok: true, msg: ["Yes: " + choices[ans] + "."] } :
    { ok: false, msg: explain ? explain(a.choice) : ["Not this time. One more look at the picture could help."] });
}

// ---- small helpers used by several worlds ----
function terminalAndOmega(r, y, x0, x1, trueAt, labs) {
  // Ω = {0,1} at (x0,y),(x1,y); the terminal 1 = {0} to the right with the arrow true.
  const d = r.d;
  const o0 = d.pt(x0, y, labs ? labs[0] : "0", "d", { col: "purple" });
  const o1 = d.pt(x1, y, labs ? labs[1] : "1", "d", { col: "purple" });
  d.text(x0 - 22, y - 2, "Ω:", "purple");
  const t = d.pt(x1 + 56, y, "1={0}", "d", { kind: "term" });
  d.wire(t, trueAt === 0 ? o0 : o1, { col: "gold", lab: trueAt === 0 ? "true'" : "true" });
  return [o0, o1];
}

// ===========================================================================
// WORLD 1  §4.1 SUBOBJECTS
// ===========================================================================
const GEN = {};

GEN.sub_image = rng => {
  const r = mkRound("sub_image");
  const n = rng.int(4, 7), k = rng.int(1, Math.min(4, n - 1)), f = randInj(rng, k, n);
  const d = r.d, ax = rowX(k, 40, 280, 44), dx = rowX(n, 30, 290, 40);
  const A = range(k).map(i => d.pt(ax[i], 46, LC[i], "u", { col: "blue" }));
  const D = range(n).map(j => d.pt(dx[j], 112, DG[j], "d"));
  d.text(12, 44, "A", "blue"); d.text(12, 110, "D", "ink");
  A.forEach((p, i) => d.wire(p, D[f[i]], { col: "blue" }));
  D.forEach(p => addCell(r, p, [0, 1], ["", ""], { style: "mark" }));
  const img = new Set(f);
  fixedAnswer(r, range(n).map(j => (img.has(j) ? 1 : 0)), (j, got) => {
    const i = f.indexOf(j);
    return i >= 0 ? [`Look again at ${DG[j]}: f sends ${LC[i]} to it, so ${DG[j]} is in the image.`]
      : [`Nothing in A lands on ${DG[j]}, so ${DG[j]} is outside the image of f.`];
  });
  r.prompt = ["A monic f: A → D could be seen as a part of D.", "Mark the points of D that f hits: its image."];
  r.lens = {
    MATH: ["§4.1: a subobject of D is a monic into D, taken up to ≃.", "In Set, f ≃ g exactly when f and g have the same image."],
    STORY: ["A = guests, D = chairs, f = who sits where. No two guests share a chair.", "Which chairs are taken?"],
    TABLE: ["f: " + mapStr(LC.slice(0, k), DG, f)],
  };
  r.hint = ["Follow each wire from A down to D.", "Mark a point of D when some wire ends on it."];
  r.notice = ["Notice: the names in A played no part in the answer.", "Any monic with the same image names the same subobject."];
  r.data = { n, f };
  return r;
};

GEN.sub_compare = rng => {
  const r = mkRound("sub_compare");
  const n = rng.int(4, 7);
  const cs = rng.pick(["eq", "fg", "gf", "none"]);
  let S, T;
  for (let tries = 0; ; tries++) {
    if (cs === "eq") { S = randSubset(rng, n, 1, Math.min(4, n)); T = new Set(S); }
    else if (cs === "fg" || cs === "gf") {
      const big = randSubset(rng, n, 2, Math.min(4, n));
      const arr = rng.shuffle([...big]); const small = new Set(arr.slice(0, rng.int(1, arr.length - 1)));
      if (cs === "fg") { S = small; T = big; } else { S = big; T = small; }
    } else {
      S = randSubset(rng, n, 1, 3); T = randSubset(rng, n, 1, 3);
      if (![...S].every(x => T.has(x)) && ![...T].every(x => S.has(x))) break;
      continue;
    }
    break;
  }
  const fS = rng.shuffle([...S]), gT = rng.shuffle([...T]);
  const d = r.d;
  const ax = rowX(fS.length, 50, 270, 44), bx = rowX(gT.length, 50, 270, 44), dx = rowX(n, 30, 290, 40);
  const A = fS.map((_, i) => d.pt(ax[i], 40, LC[i], "u", { col: "blue" }));
  const D = range(n).map(j => d.pt(dx[j], 84, DG[j], "l"));
  const B = gT.map((_, i) => d.pt(bx[i], 128, BN[i] || LC[i + 6], "d", { col: "orange" }));
  d.text(12, 38, "A", "blue"); d.text(12, 82, "D"); d.text(12, 126, "B", "orange");
  A.forEach((p, i) => d.wire(p, D[fS[i]], { col: "blue" }));
  B.forEach((p, i) => d.wire(p, D[gT[i]], { col: "orange", dash: true }));
  const fg = [...S].every(x => T.has(x)), gf = [...T].every(x => S.has(x));
  const ans = fg && gf ? 2 : fg ? 0 : gf ? 1 : 3;
  const choices = ["f ≤ g, but not g ≤ f", "g ≤ f, but not f ≤ g", "f ≃ g: both ways", "neither way"];
  const why = () => {
    const out = [];
    const miss1 = [...S].find(x => !T.has(x)), miss2 = [...T].find(x => !S.has(x));
    out.push(fg ? "f ≤ g holds: every point f hits, g hits too." : `f ≤ g fails: f hits ${DG[miss1]}, but g does not.`);
    out.push(gf ? "g ≤ f holds: every point g hits, f hits too." : `g ≤ f fails: g hits ${DG[miss2]}, but f does not.`);
    return out;
  };
  choiceRound(r, choices, ans, why);
  r.prompt = ["f: A → D (solid) and g: B → D (dashed) are monics. f ≤ g if f factors", "through g; in Set that means: image of f ⊆ image of g. Which holds?"];
  r.lens = {
    MATH: ["§4.1: f ⊆ g iff f = g ∘ h for some h; f ≃ g iff f ⊆ g and g ⊆ f.", "Sub(D) is the set of ≃-classes, ordered by ⊆."],
    STORY: ["Two seating plans for the same hall D. Plan f ≤ plan g when", "every chair f uses is also used by g."],
    TABLE: ["f: " + mapStr(LC.slice(0, fS.length), DG, fS), "g: " + mapStr(gT.map((_, i) => BN[i] || LC[i + 6]), DG, gT)],
  };
  r.hint = ["List the points of D hit by f, then the points hit by g.", "Compare the two lists."];
  r.notice = ans === 2 ? ["Notice: different sets, different wires, and still one subobject."]
    : ans === 3 ? ["Notice: ≤ is only a partial order. Two parts of D", "need not be comparable at all."]
      : ["Notice: the smaller part factors through the bigger one: there is", "an arrow h between the domains with (bigger) ∘ h = (smaller)."];
  r.data = { n, S: [...S], T: [...T] };
  return r;
};

GEN.sub_couldbe = rng => {
  const r = mkRound("sub_couldbe");
  const n = rng.int(5, 7), k = rng.int(2, 3), S = [...randSubset(rng, n, k, k)].sort((a, b) => a - b);
  const d = r.d, bx = rowX(k, 80, 240, 60), dx = rowX(n, 30, 290, 40);
  const B = range(k).map(i => d.pt(bx[i], 50, BN[i], "u", { col: "orange" }));
  const D = range(n).map(j => d.pt(dx[j], 122, DG[j], "d", { ring: S.includes(j) }));
  d.text(12, 48, "B", "orange"); d.text(12, 120, "D");
  B.forEach(p => addCell(r, p, range(n), DG.slice(0, n), { targets: D }));
  r.open = true;
  r.solve = () => ({ cells: S.map(j => j), choice: -1 });
  r.check = ans => {
    if (ans.cells.some(v => v < 0)) return { ok: false, unset: true, msg: ["Give every point of B a target in D (click it, or type the digit)."] };
    const t = ans.cells.map((v, i) => r.cells[i].vals[v]);
    for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++)
      if (t[i] === t[j]) return { ok: false, msg: [`${BN[i]} and ${BN[j]} both go to ${DG[t[i]]}: then g would not be monic.`] };
    for (let i = 0; i < k; i++) if (!S.includes(t[i])) return { ok: false, msg: [`g sends ${BN[i]} to ${DG[t[i]]}, but ${DG[t[i]]} is not in the gold part.`] };
    return { ok: true, msg: ["Yes. Your g is a monic onto the gold part: g ≃ the inclusion."] };
  };
  r.prompt = [`The gold part of D could be named by many monics. Wire a monic g: B → D`, "whose image is exactly the gold part. Any such g will do."];
  r.lens = {
    MATH: ["§4.1: [f] = {g : g ≃ f}. Each class has many members;", "in Set they are the bijections onto the same subset, followed by inclusion."],
    STORY: ["Three new guests p, q, r and some reserved gold chairs.", "Seat them so that exactly the gold chairs are used."],
    TABLE: ["gold part: " + setStr(DG, new Set(S)), "B = {" + BN.slice(0, k).join(",") + "}"],
  };
  r.hint = ["Each point of B needs its own gold point.", "There is no single right wiring here."];
  r.notice = [`Notice: there were ${fact(k)} correct wirings. Each could be "the" subobject:`, "they are all ≃, so they name the same part of D."];
  r.data = { n, S };
  return r;
};

// ===========================================================================
// WORLD 2  §4.2 CLASSIFYING SUBOBJECTS (in Set)
// ===========================================================================
function chiPaint(rng, swap, remix) {
  const r = mkRound(swap ? "chi_swap" : "chi_paint");
  const n = rng.int(4, 7), k = rng.int(1, n - 1), f = randInj(rng, k, n);
  const d = r.d, ax = rowX(k, 40, 280, 44), dx = rowX(n, 30, 290, 40);
  const vl = remix ? ["F", "T"] : ["0", "1"];
  const A = range(k).map(i => d.pt(ax[i], 40, LC[i], "u", { col: "blue" }));
  const D = range(n).map(j => d.pt(dx[j], 84, DG[j], "l"));
  d.text(12, 38, "A", "blue"); d.text(12, 82, "D");
  A.forEach((p, i) => d.wire(p, D[f[i]], { col: "blue" }));
  const om = terminalAndOmega(r, 128, 110, 190, swap ? 0 : 1, vl);
  D.forEach(p => addCell(r, p, [0, 1], vl, { targets: om }));
  const img = new Set(f), tv = swap ? 0 : 1;
  fixedAnswer(r, range(n).map(j => (img.has(j) ? tv : 1 - tv)), j => {
    const i = f.indexOf(j);
    return i >= 0 ? [`f sends ${LC[i]} to ${DG[j]}, so ${DG[j]} is in the subobject:`, `χ(${DG[j]}) must be the value that ${swap ? "true'" : "true"} picks, ${vl[tv]}.`]
      : [`Nothing in A lands on ${DG[j]}, so χ(${DG[j]}) is the other value, ${vl[1 - tv]}.`];
  });
  r.prompt = swap
    ? ["A second classifier: same Ω, but now true' picks " + vl[0] + ". Paint χ': D → Ω", "so that pulling true' back along χ' gives the image of f."]
    : ["Paint the characteristic arrow χ: D → Ω of the monic f. Then", "pulling true back along χ gives exactly the image of f."];
  r.lens = {
    MATH: swap ? ["§4.2: a classifier is unique only up to iso. Here χ' = ¬ ∘ χ,", "where ¬ swaps the two values: an iso Ω → Ω."]
      : ["§4.2, Ω-axiom: for each monic f there is one and only one χ", "making the square with true a pullback."],
    STORY: swap ? ["The same guest list, but now the host writes " + vl[0] + " for \"taken\".", "The marks flip; the seating does not."]
      : ["Each chair gets a tag: 1 = someone sits here, 0 = empty.", "The tags remember the seating plan."],
    TABLE: ["f: " + mapStr(LC.slice(0, k), DG, f), (swap ? "true'" : "true") + ": 0 ↦ " + vl[tv]],
  };
  r.hint = ["A point of D in the image of f goes where true points.", "Every other point goes to the other value."];
  r.notice = swap ? ["Notice: \"the\" right χ depended on which arrow we called true.", "Both answers classify the same subobject."]
    : ["Notice: there was exactly one χ that works. The Ω-axiom says", "this happens for every monic: Sub(D) ≅ Set(D, Ω)."];
  r.data = { n, f, swap };
  return r;
}
GEN.chi_paint = rng => chiPaint(rng, false, false);
GEN.chi_swap = rng => chiPaint(rng, true, false);
GEN.chi_swap_remix = rng => { const r = chiPaint(rng, true, true); r.kind = "chi_swap_remix"; return r; };

GEN.chi_pull = rng => {
  const r = mkRound("chi_pull");
  const n = rng.int(4, 7);

function countArrowSubs(g, n, m) {
  let c = 0;
  for (let a = 0; a < (1 << n); a++) for (let b = 0; b < (1 << m); b++) {
    let ok = true; for (let x = 0; x < n; x++) if ((a >> x & 1) && !(b >> g[x] & 1)) { ok = false; break; }
    if (ok) c++;
  }
  return c;
}
function countClosed(f, n) {
  let c = 0;
  for (let a = 0; a < (1 << n); a++) { let ok = true; for (let x = 0; x < n; x++) if ((a >> x & 1) && !(a >> f[x] & 1)) { ok = false; break; } if (ok) c++; }
  return c;
}
function distractors(rng, ans, extra) {
  const pool = [...new Set(extra.concat([ans + 1, ans - 1, ans * 2, Math.max(1, Math.floor(ans / 2))]))].filter(v => v !== ans && v > 0);
  return rng.shuffle([ans].concat(rng.shuffle(pool).slice(0, 3)));
}

function glyph(ch) { return FONT[ch] || FONT[ch.toUpperCase()] || FONT["?"]; }
function glyphW(ch) { return glyph(ch).length === 25 ? 5 : 3; }
function textWidth(s) { let w = 0; for (const ch of s) w += glyphW(ch) + 1; return Math.max(0, w - 1); }
function text(s, x, y, color, align, scale) {
  scale = scale || 1;
  const tw = textWidth(s) * scale;
  if (align === "center") x = Math.round(x - tw / 2); else if (align === "right") x = Math.round(x - tw);
  x = Math.round(x); y = Math.round(y);
  if (TL) TL.push({ s, x, y, w: tw, h: 5 * scale, c: color });
  ctx.fillStyle = C(color || "ink");
  for (const ch of s) {
    const g = glyph(ch), gw = g.length === 25 ? 5 : 3;
    for (let p = 0; p < g.length; p++) if (g[p] === "1") ctx.fillRect(x + SX + (p % gw) * scale, y + SY + ((p / gw) | 0) * scale, scale, scale);
    x += (gw + 1) * scale;
  }
}
function rect(x, y, w, h, c) { ctx.fillStyle = C(c); ctx.fillRect(Math.round(x) + SX, Math.round(y) + SY, Math.round(w), Math.round(h)); }
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function line(x0, y0, x1, y1, c, dash) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, k = 0;
  ctx.fillStyle = C(c);
  for (;;) {
    if (!dash || (k % 6) < 3) ctx.fillRect(x0 + SX, y0 + SY, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    k++;
  }
}
function wrap(s, maxw) {
  const out = []; let cur = "";
  for (const w of s.split(" ")) {
    const t = cur ? cur + " " + w : w;
    if (textWidth(t) > maxw && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}

let seedBase = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, seedCount = 0;
let doneInfo = null;
let hover = -1;

function nextSeed() { seedCount++; return (seedBase + seedCount * 7919) >>> 0; }
function worldOfKind(k) { const w = WORLDS.find(w => w.rounds.includes(k)); return w ? w.id : 1; }

function startWorld(w) {
  cur = { mode: "world", w, idx: 0, score: 0 };
  newRound(); screen = "play"; sfx.open();
}
function startFree() {
  cur = { mode: "free", w: 0, idx: 0, score: 0 };
  newRound(); screen = "play"; sfx.open();
}
function newRound() {
  let kind, world;
  if (cur.mode === "world") { const W_ = WORLDS[cur.w - 1]; kind = W_.rounds[cur.idx]; world = cur.w; }
  else { kind = ALL_KINDS[Math.floor(RNG(nextSeed()).f() * ALL_KINDS.length)]; world = worldOfKind(kind); if (kind === "quiz") world = 1 + (seedCount % 7); }
  cur.round = makeRound(kind, nextSeed(), world);

  cursor = 0;

// ---- geometry of the play screen ----
function cellBox(r, i) {
  const c = r.cells[i], p = r.d.pts[c.pt];
  const w = c.style === "mark" ? 9 : Math.max(9, Math.max(...c.labs.map(textWidth), 3) + 4);
  return { x: p.x - Math.floor(w / 2), y: p.y - 4, w, h: 9 };
}
function choiceBoxes(r) {
  if (!r.choices) return [];
  if (r.kind === "quiz") return r.choices.map((s, i) => ({ x: 16, y: 44 + 18 * i, w: 288, h: 13 }));
  const fits = r.choices.every(s => textWidth(s) + 14 <= 150);
  if (fits) return r.choices.map((s, i) => ({ x: i % 2 ? 164 : 8, y: 146 + 12 * Math.floor(i / 2), w: 148, h: 11 }));
  return r.choices.map((s, i) => ({ x: 8, y: 136 + 12 * i, w: 304, h: 11 }));
}
const PLAY_BTNS = [["check", "ENTER:CHECK"], ["hint", "H:HINT"], ["lens", "L:LENS"], ["codex", "K:CODEX"], ["map", "ESC:MAP"]];
function playButtons() {
  const out = []; let x = 4;
  for (const [id, lab] of PLAY_BTNS) {
    const s = id === "lens" ? "L:" + LENSES[lens] : lab, w = textWidth(s) + 8;
    out.push({ id, s, x, y: 189, w, h: 10 }); x += w + 4;
  }
  return out;
}
function focusList() {
  if (screen !== "play" || !cur) return [];
  const r = cur.round, out = [];
  r.cells.forEach((c, i) => out.push(Object.assign({ type: "cell", i }, cellBox(r, i))));
  choiceBoxes(r).forEach((b, i) => out.push(Object.assign({ type: "choice", i }, b)));
  playButtons().forEach(b => { if (!(b.id === "check" && r.choices)) out.push(Object.assign({ type: "btn" }, b)); });
  return out;
}

// ---- play actions ----
function cycleCell(i, dir) {
  const r = cur.round, c = r.cells[i], n = c.vals.length;
  let v = cur.ans.cells[i];
  if (c.style === "mark") v = 1 - v;
  else v = v < 0 ? (dir < 0 ? n - 1 : 0) : (v + (dir || 1) + n) % n;
  cur.ans.cells[i] = v; sfx.tick();
}
function setCellByKey(i, key) {
  const r = cur.round, c = r.cells[i];
  let k = c.labs.indexOf(key);
  if (k < 0 && (key === "/" || key === ".")) k = c.labs.indexOf("1/2");
  if (k < 0 && key.toLowerCase() === "i") k = c.labs.indexOf("∞");
  if (k < 0 && c.style === "mark" && (key === "0" || key === "1")) k = +key;
  if (k < 0 && /^[a-z]$/i.test(key)) k = c.labs.indexOf(key.toLowerCase());
  if (k < 0 && /^[0-9]$/.test(key) && c.style !== "mark" && c.labs.indexOf(key) < 0 && +key < c.vals.length && !c.labs.some(l => /^[0-9]/.test(l))) k = +key;
  if (k >= 0) { cur.ans.cells[i] = k; sfx.tick(); return true; }
  return false;
}
function submit() {
  const r = cur.round;
  if (cur.fb) return;
  const res = r.check(cur.ans);
  if (res.unset) { cur.fb = { kind: "info", msg: res.msg, notice: [] }; return; }
  cur.tries++;
  if (res.ok) {
    const stars = cur.tries === 1 && !cur.hinted ? 3 : 2;
    finishRound(stars, { kind: "ok", msg: res.msg, notice: res.notice || r.notice });
    sfx.ok();
  } else {
    save.notebook.push({ w: r.world, k: r.kind, m: res.msg[0] }); if (save.notebook.length > 40) save.notebook.shift(); persist();
    if (cur.tries >= 2) {
      const sol = r.solve(); cur.ans = { cells: sol.cells.slice(), choice: sol.choice };
      cur.revealed = true;
      finishRound(1, { kind: "reveal", msg: ["One way to see it:"].concat(res.msg), notice: r.notice });
    } else {
      cur.fb = { kind: "no", msg: res.msg.concat(["That is information, not a verdict. Press ENTER and look again."]), notice: [] };
    }
    sfx.no(); SX = 2;
  }
}
function finishRound(stars, fb) {
  cur.fb = Object.assign(fb, { done: true, stars });
  cur.score += stars;
  if (cur.mode === "world") {
    const k = String(cur.w); save.stars[k] = save.stars[k] || [];
    save.stars[k][cur.idx] = Math.max(save.stars[k][cur.idx] || 0, stars);
  } else if (cur.score > save.best) save.best = cur.score;
  persist();
}
function advance() {
  if (!cur.fb) return;
  if (!cur.fb.done) { cur.fb = null; return; }
  if (cur.mode === "world") {
    cur.idx++;
    if (cur.idx >= WORLDS[cur.w - 1].rounds.length) { doneInfo = { w: cur.w, score: cur.score, max: 3 * WORLDS[cur.w - 1].rounds.length }; save.seen[cur.w] = 1; persist(); screen = "done"; cursor = 0; return; }
  } else cur.idx++;
  newRound();
}
function playActivate(f, dir) {
  if (!f) return;
  if (f.type === "cell") { if (!cur.fb) cycleCell(f.i, dir); }
  else if (f.type === "choice") { if (!cur.fb) { cur.ans.choice = f.i; submit(); } }
  else if (f.id === "check") { if (cur.fb) advance(); else submit(); }
  else if (f.id === "hint") toggleHint();
  else if (f.id === "lens") { lens = (lens + 1) % 3; sfx.tick(); }
  else if (f.id === "codex") { codexFrom = "play"; screen = "codex"; codexPage = cur.round.world; }
  else if (f.id === "map") { screen = "map"; cursor = 0; }
}
function toggleHint() { if (!cur.fb) { cur.showHint = true; cur.hinted = true; sfx.tick(); } }
let codexFrom = "map";
function backFrom() { return codexFrom === "play" && cur ? "play" : codexFrom === "title" ? "title" : "map"; }

// ---- menus ----
function mapItems() {
  const out = [];
  WORLDS.forEach((w, i) => out.push({ type: "world", wid: w.id, x: i % 2 ? 164 : 8, y: 30 + 30 * Math.floor(i / 2), w_: 148, h: 26 }));
  out.push({ type: "free", x: 164, y: 120, w_: 148, h: 26 });
  out.push({ type: "codex", x: 8, y: 152, w_: 96, h: 14 }, { type: "help", x: 112, y: 152, w_: 96, h: 14 }, { type: "title", x: 216, y: 152, w_: 96, h: 14 });
  return out.map(o => Object.assign(o, { w: o.w_ }));

function worldStars(w) { const a = save.stars[String(w)] || []; return a.reduce((s, v) => s + (v || 0), 0); }

function drawPoint(r, p, i) {
  const ci = p.cell;
  if (p.ring) {
    const rb = ci >= 0 ? cellBox(r, ci) : { x: p.x - 4, y: p.y - 3, w: 9, h: 7 };
    frame(rb.x - 3, rb.y - 3, rb.w + 6, rb.h + 6, "gold"); frame(rb.x - 2, rb.y - 2, rb.w + 4, rb.h + 4, "gold");
  }
  if (ci >= 0) {
    const b = cellBox(r, ci), c = r.cells[ci], v = cur.ans.cells[ci];
    if (c.style === "mark") { rect(b.x, b.y, b.w, b.h, v ? "gold" : "white"); frame(b.x, b.y, b.w, b.h, "ink"); if (v) rect(b.x + 3, b.y + 3, 3, 3, "ink"); }
    else { rect(b.x, b.y, b.w, b.h, v < 0 ? "light" : "paleBlue"); frame(b.x, b.y, b.w, b.h, "ink"); text(v < 0 ? "?" : c.labs[v], p.x, p.y - 2, v < 0 ? "grey" : "ink", "center"); }
  } else if (p.kind === "term") {
    rect(p.x - 3, p.y - 3, 7, 7, "navy");
  } else {
    rect(p.x - 2, p.y - 2, 5, 5, p.col === "ink" ? "ink" : p.col); rect(p.x - 1, p.y - 3, 3, 7, p.col === "ink" ? "ink" : p.col); rect(p.x - 3, p.y - 1, 7, 3, p.col === "ink" ? "ink" : p.col);
  }
  if (p.lab) {
    const half = ci >= 0 ? Math.ceil(cellBox(r, ci).w / 2) : 4;
    const col = p.col === "purple" ? "purple" : "ink";
    if (p.lp === "u") text(p.lab, p.x, p.y - 12, col, "center");
    else if (p.lp === "d") text(p.lab, p.x, p.y + 7, col, "center");
    else if (p.lp === "l") text(p.lab, p.x - half - 3, p.y - 2, col, "right");
    else text(p.lab, p.x + half + 3, p.y - 2, col, "left");
  }
}
function drawWire(r, a, b, col, dash, head, lab, loop) {
  const A = r.d.pts[a], B = r.d.pts[b];
  if (loop || a === b) { frame(A.x + 5, A.y - 9, 7, 7, col); return; }
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const sa = A.cell >= 0 ? 6 : 4, sb = B.cell >= 0 ? 7 : 5;
  const x0 = A.x + ux * sa, y0 = A.y + uy * sa, x1 = B.x - ux * sb, y1 = B.y - uy * sb;
  line(x0, y0, x1, y1, col, dash);
  if (head !== false) {
    const px = -uy, py = ux;
    line(x1, y1, x1 - ux * 3 + px * 2, y1 - uy * 3 + py * 2, col); line(x1, y1, x1 - ux * 3 - px * 2, y1 - uy * 3 - py * 2, col);
  }
  if (lab) text(lab, (x0 + x1) / 2, (y0 + y1) / 2 - 8, col, "center");
}
function drawTableObj(t) {
  const n = t.colHead.length;
  rect(t.x, t.y, t.cw * (n + 1), t.rh * (t.rows.length + 1), "card");
  if (t.gold) for (const j of t.gold) rect(t.x + t.cw * (j + 1), t.y, t.cw, t.rh * (t.rows.length + 1), "paleGold");
  text(t.head, t.x + t.cw / 2, t.y + 2, "grey", "center");
  t.colHead.forEach((h, j) => text(h, t.x + t.cw * (j + 1.5), t.y + 2, "blue", "center"));
  t.rows.forEach((row, i) => row.forEach((s, j) => text(s, t.x + t.cw * (j + 0.5), t.y + t.rh * (i + 1) + 2, j === 0 ? "blue" : "ink", "center")));
  rect(t.x, t.y + t.rh - 1, t.cw * (n + 1), 1, "faint"); rect(t.x + t.cw - 1, t.y, 1, t.rh * (t.rows.length + 1), "faint");
  frame(t.x - 1, t.y - 1, t.cw * (n + 1) + 2, t.rh * (t.rows.length + 1) + 2, "ink");
  if (t.sel != null) frame(t.x + t.cw * (t.sel + 1), t.y - 1, t.cw, t.rh * (t.rows.length + 1) + 2, "red");
}
function drawDiagram(r) {

  d.boxes.forEach(b => { rect(b.x, b.y, b.w, b.h, b.col); if (b.lab) text(b.lab, b.x + 2, b.y + 2, "grey"); });
  d.tables.forEach(drawTableObj);
  d.wires.forEach(w => drawWire(r, w.a, w.b, w.col, w.dash, w.head, w.lab, w.loop));
  r.cells.forEach((c, i) => { const v = cur.ans.cells[i]; if (c.targets && v >= 0 && c.targets[v] != null) drawWire(r, c.pt, c.targets[v], c.style === "mark" ? "gold" : (r.kind === "sub_couldbe" ? "orange" : "purple"), false, true); });

  d.texts.forEach(t => text(t.s, t.x, t.y, t.col, t.align));
}

function drawPlay() {

  const prog = cur.mode === "world" ? `ROUND ${cur.idx + 1}/${WORLDS[cur.w - 1].rounds.length}  ★${cur.score}` : `ROUND ${cur.idx + 1}  ★${cur.score}  BEST ${save.best}`;

  drawDiagram(r);
  const cb = choiceBoxes(r);
  cb.forEach((b, i) => {
    const f = fl.findIndex(o => o.type === "choice" && o.i === i);
    const picked = cur.fb && cur.ans.choice === i;
    const isAns = cur.fb && cur.fb.done && r.answer === i;
    rect(b.x, b.y, b.w, b.h, isAns ? "paleGreen" : picked ? "paleRed" : (cursor === f || hover === f) ? "paleGold" : "card");
    frame(b.x, b.y, b.w, b.h, cursor === f ? "gold" : "ink");
    text((i + 1) + "", b.x + 4, b.y + Math.round((b.h - 5) / 2), "grey");

  text(m.title, W / 2, 40, "purple", "center");
  m.idea.forEach((s, i) => text(s, W / 2, 52 + 7 * i, "ink", "center"));
  m.game.forEach((s, i) => text(s, W / 2, 74 + 7 * i, "grey", "center"));
  const card = INSIGHTS[(w.id - 1) % INSIGHTS.length];
  text("Insight: " + card[0], W / 2, 100, "purple", "center"); text(card[1], W / 2, 108, "ink", "center"); text(card[2], W / 2, 115, "ink", "center");
  button({ x: 60, y: 140, w: 90, h: 14 }, cursor === 0, "ENTER: MAP");
  button({ x: 170, y: 140, w: 90, h: 14 }, cursor === 1, "R: REPLAY");
  text("A replay is generated afresh: new sets, new arrows.", W / 2, 164, "grey", "center");
}

function draw(t) {
  ctx.fillStyle = C("bg"); ctx.fillRect(0, 0, W, H);
  if (screen === "title") drawTitle(t);
  else if (screen === "map") drawMap();
  else if (screen === "play") { rect(0, 0, W, H, "bg"); drawPlay(); }
  else if (screen === "codex") drawCodex();
  else if (screen === "help") drawHelp();
  else if (screen === "done") drawDone();
  if (SX !== 0) SX = SX > 0 ? -(SX - 1) : -SX - 1;
}

// ===========================================================================
// INPUT
// ===========================================================================
function itemsForScreen() {
  if (screen === "play") return focusList();
  if (screen === "map") return mapItems();
  if (screen === "done") return [{ id: "map", x: 60, y: 140, w: 90, h: 14 }, { id: "replay", x: 170, y: 140, w: 90, h: 14 }];
  if (screen === "title") return [{ id: "play", x: 110, y: 136, w: 100, h: 14 }];
  return [];
}
function activate(it, dir) {
  if (!it) return;
  if (screen === "play") return playActivate(it, dir);
  if (screen === "map") {
    if (it.type === "world") startWorld(it.wid);
    else if (it.type === "free") startFree();
    else if (it.type === "codex") { codexFrom = "map"; screen = "codex"; codexPage = 0; }
    else if (it.type === "help") { codexFrom = "map"; screen = "help"; }
    else if (it.type === "title") screen = "title";
    return;
  }
  if (screen === "done") { if (it.id === "replay") startWorld(doneInfo.w); else { screen = "map"; cursor = 0; } return; }
  if (screen === "title") { screen = "map"; cursor = 0; sfx.open(); }
}
function moveCursor(dx, dy) {
  const items = itemsForScreen();
  if (!items.length) return;
  if (cursor >= items.length) cursor = 0;
  const a = items[cursor];
  const ax = a.x + a.w / 2, ay = a.y + a.h / 2;
  let best = -1, bd = 1e9;
  items.forEach((b, i) => {
    if (i === cursor) return;
    const bx = b.x + b.w / 2, by = b.y + b.h / 2, ddx = bx - ax, ddy = by - ay;
    if (dx && Math.sign(ddx) !== dx) return; if (dy && Math.sign(ddy) !== dy) return;
    const main = dx ? Math.abs(ddx) : Math.abs(ddy), side = dx ? Math.abs(ddy) : Math.abs(ddx);
    if (main < 1) return;
    const score = main + side * 2.5;
    if (score < bd) { bd = score; best = i; }
  });
  if (best < 0) best = (cursor + (dx || dy) + items.length) % items.length;
  cursor = best;
}
function onKey(e) {
  const k = e.key || "", code = e.code || "";
  if (k === "m" || k === "M") { muted = !muted; return; }
  if (screen === "title") {
    if (k === "Enter" || k === " ") activate({ id: "play" });
    else if (k === "?") { codexFrom = "title"; screen = "help"; } else if (k === "k" || k === "K") { codexFrom = "title"; screen = "codex"; codexPage = 0; }
    return;
  }
  if (screen === "help") { if (k === "Escape" || k === "Enter" || k === "?") screen = backFrom(); return; }
  if (screen === "codex") {
    if (k === "ArrowRight") codexPage++; else if (k === "ArrowLeft") codexPage = Math.max(0, codexPage - 1);
    else if (k === "Escape" || k === "k" || k === "K" || k === "Enter") screen = backFrom();
    return;
  }
  if (screen === "done") {
    if (k === "r" || k === "R") startWorld(doneInfo.w);
    else if (k === "ArrowLeft" || k === "ArrowRight") cursor = 1 - cursor;
    else if (k === "Enter" || k === " ") activate(itemsForScreen()[cursor] || { id: "map" });
    else if (k === "Escape") { screen = "map"; cursor = 0; }
    return;
  }
  if (screen === "map") {
    if (/^[1-7]$/.test(k)) startWorld(+k);
    else if (k === "f" || k === "F") startFree();
    else if (k === "k" || k === "K") { codexFrom = "map"; screen = "codex"; codexPage = 0; }
    else if (k === "?") { codexFrom = "map"; screen = "help"; }
    else if (k === "t" || k === "T" || k === "Escape") screen = "title";
    else if (k.startsWith("Arrow")) moveCursor(k === "ArrowLeft" ? -1 : k === "ArrowRight" ? 1 : 0, k === "ArrowUp" ? -1 : k === "ArrowDown" ? 1 : 0);
    else if (k === "Enter" || k === " ") activate(mapItems()[cursor]);
    return;
  }
  // play
  const r = cur.round, fl = focusList();
  if (cursor >= fl.length) cursor = 0;
  if (cur.fb) {
    if (k === "Enter" || k === " " || k === "Escape") { if (k === "Escape" && cur.fb.done) { advance(); return; } advance(); }
    else if (k === "l" || k === "L") lens = (lens + 1) % 3;
    else if (k === "k" || k === "K") { codexFrom = "play"; screen = "codex"; codexPage = r.world; }
    return;
  }
  if (k === "Escape") { screen = "map"; cursor = 0; return; }
  if (k === "Enter") { if (r.choices) { const f = fl[cursor]; if (f && f.type === "choice") activate(f); } else submit(); return; }
  if (k === "h" || k === "H") { toggleHint(); return; }
  if (k === "l" || k === "L") { lens = (lens + 1) % 3; return; }
  if (k === "k" || k === "K") { codexFrom = "play"; screen = "codex"; codexPage = r.world; return; }
  if (k === "?") { codexFrom = "play"; screen = "help"; return; }
  if (k === "Tab") { cursor = (cursor + (e.shiftKey ? -1 : 1) + fl.length) % fl.length; return; }
  if (k.startsWith("Arrow")) { moveCursor(k === "ArrowLeft" ? -1 : k === "ArrowRight" ? 1 : 0, k === "ArrowUp" ? -1 : k === "ArrowDown" ? 1 : 0); return; }
  const f = fl[cursor];
  if (k === " " || k === "Spacebar") { if (f) activate(f, e.shiftKey ? -1 : 1); return; }
  if (r.choices && /^[1-9]$/.test(k)) { const i = +k - 1; if (i < r.choices.length) { cur.ans.choice = i; submit(); } return; }
  if (f && f.type === "cell" && k.length === 1) {
    if (setCellByKey(f.i, k)) { const nx = fl.findIndex((o, j) => j > cursor && o.type === "cell"); if (nx >= 0) cursor = nx; }
  }
  void code;
}
function toCanvas(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
function hitIndex(x, y) {
  const items = itemsForScreen();
  for (let i = 0; i < items.length; i++) { const b = items[i]; if (x >= b.x - 2 && x <= b.x + b.w + 2 && y >= b.y - 2 && y <= b.y + b.h + 2) return i; }
  return -1;
}
function onPointerDown(e) {
  const { x, y } = toCanvas(e);
  if (screen === "play" && cur.fb) {
    const i = hitIndex(x, y), it = itemsForScreen()[i];
    if (it && it.type === "btn" && it.id !== "check") { activate(it); return; }
    advance(); return;
  }
  if (screen === "codex") { if (x > W / 2) codexPage++; else if (codexPage > 0) codexPage--; else screen = backFrom(); return; }
  if (screen === "help") { screen = backFrom(); return; }
  const i = hitIndex(x, y);
  if (i >= 0) { cursor = i; activate(itemsForScreen()[i], e.button === 2 ? -1 : 1); }
  else if (screen === "title") activate({ id: "play" });
}
function onPointerMove(e) {
  const { x, y } = toCanvas(e);
  hover = hitIndex(x, y);
  cv.className = hover >= 0 ? "hot" : "";
}

window.addEventListener("keydown", e => { if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter", "Tab"].includes(e.key) && e.preventDefault) e.preventDefault(); onKey(e); });
cv.addEventListener("pointerdown", onPointerDown);
cv.addEventListener("pointermove", onPointerMove);
cv.addEventListener("contextmenu", e => e.preventDefault && e.preventDefault());
function loop(t) { draw(t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
draw(0);

// ---- hooks for the automated tests ----
window.__cb = {
  W, H, FONT, GEN, WORLDS, ALL_KINDS, MONOIDS, QUIZ, MYTHS, INSIGHTS, makeRound, blank, leftIdeals, isLeftIdeal, RNG,
  countArrowSubs, countClosed, psiOf,
  draw, setTL: l => { TL = l; }, focusList, itemsForScreen, mapItems, codexPages,
  get screen() { return screen; }, set screen(s) { screen = s; }, get cur() { return cur; }, get save() { return save; },
  get cursor() { return cursor; }, set cursor(c) { cursor = c; }, get lens() { return lens; }, get codexPage() { return codexPage; },
  setSeed: s => { seedBase = s >>> 0; seedCount = 0; }, startWorld, startFree,
};
