<body>
<header>
  <span class="logo" aria-hidden="true">▣ PROOF ATELIER</span>
  <nav id="nav" aria-label="Main"></nav>
  <div id="counter" aria-live="polite"></div>
</header>
<main><div id="app" tabindex="-1"></div></main>
<footer>Proofs are checked by a small CIC kernel in this page; every reference solution is also checked by Lean 4. Progress is saved in this browser only.
  <button type="button" id="reset">start over</button></footer>
<script id="engine">
// ===================================================================
// Proof Atelier — kernel: a small checker for a fragment of the
// Calculus of Inductive Constructions, shaped like Lean 4's kernel.
//   * universes  Sort u  (Prop = Sort 0, Type = Sort 1, ...)
//   * Π-types, λ-terms, application, Nat literals
//   * inductive types with constructors and recursors (iota reduction,
//     K-like reduction for Eq, Nat literal acceleration)
//   * definitional equality: β, δ, ι, η, proof irrelevance
// This file has no DOM code; it is shared by the game and the tests.
// ===================================================================
'use strict';

class KernelError extends Error {
  constructor(msg, extra) { super(msg); this.extra = extra || null; }
}

// ------------------------------------------------------------ levels
const Lv = {
  num: n => ({ k: 'n', n }),
  param: name => ({ k: 'p', name }),
  mvar: id => ({ k: 'm', id }),
  succ: l => (l.k === 'n' ? { k: 'n', n: l.n + 1 } : { k: 's', l }),
  max: (a, b) => (a.k === 'n' && b.k === 'n' ? { k: 'n', n: Math.max(a.n, b.n) }
    : (a.k === 'n' && a.n === 0 ? b : (b.k === 'n' && b.n === 0 ? a : { k: 'max', a, b }))),
  imax: (a, b) => (b.k === 'n' ? (b.n === 0 ? b : Lv.max(a, b))
    : (a.k === 'n' && a.n === 0 ? b : { k: 'imax', a, b })),
};
const LZERO = Lv.num(0), LONE = Lv.num(1);

function levelMapLeaves(l, f) {
  switch (l.k) {
    case 'n': return l;
    case 'p': case 'm': return f(l);
    case 's': return Lv.succ(levelMapLeaves(l.l, f));
    case 'max': return Lv.max(levelMapLeaves(l.a, f), levelMapLeaves(l.b, f));
    case 'imax': return Lv.imax(levelMapLeaves(l.a, f), levelMapLeaves(l.b, f));
  }
  throw new KernelError('bad level');
}
function levelHasMVar(l) {
  switch (l.k) {
    case 'm': return true;
    case 's': return levelHasMVar(l.l);
    case 'max': case 'imax': return levelHasMVar(l.a) || levelHasMVar(l.b);
    default: return false;
  }
}
function levelParams(l, acc) {
  switch (l.k) {
    case 'p': acc.add(l.name); break;
    case 's': levelParams(l.l, acc); break;
    case 'max': case 'imax': levelParams(l.a, acc); levelParams(l.b, acc); break;
  }
  return acc;
}
function evalLevel(l, env) {
  switch (l.k) {
    case 'n': return l.n;
    case 'p': return env[l.name];
    case 'm': return NaN;
    case 's': return evalLevel(l.l, env) + 1;
    case 'max': return Math.max(evalLevel(l.a, env), evalLevel(l.b, env));
    case 'imax': { const b = evalLevel(l.b, env); return b === 0 ? 0 : Math.max(evalLevel(l.a, env), b); }
  }
  return NaN;
}
function levelStructEq(a, b) {
  if (a.k !== b.k) return false;
  switch (a.k) {
    case 'n': return a.n === b.n;
    case 'p': return a.name === b.name;
    case 'm': return a.id === b.id;
    case 's': return levelStructEq(a.l, b.l);
    default: return levelStructEq(a.a, b.a) && levelStructEq(a.b, b.b);
  }
}
// Equality of meta-free levels: compare on all assignments of the
// parameters to 0..4.  The level expressions used here are built from
// succ/max/imax with small offsets, so this decides equality for them.
function levelEqClosed(a, b) {
  const ps = [...levelParams(b, levelParams(a, new Set()))];
  const env = {};
  const go = i => {
    if (i === ps.length) return evalLevel(a, env) === evalLevel(b, env);
    for (let v = 0; v <= 4; v++) { env[ps[i]] = v; if (!go(i + 1)) return false; }
    return true;
  };
  return go(0);
}
function levelToString(l) {
  switch (l.k) {
    case 'n': return String(l.n);
    case 'p': return l.name;
    case 'm': return '?u';
    case 's': { let n = 1, x = l.l; while (x.k === 's') { n++; x = x.l; }
      return (x.k === 'p' || x.k === 'm' ? levelToString(x) : '(' + levelToString(x) + ')') + ' + ' + n; }
    case 'max': return 'max ' + levelAtom(l.a) + ' ' + levelAtom(l.b);
    case 'imax': return 'imax ' + levelAtom(l.a) + ' ' + levelAtom(l.b);
  }
  return '?';
}
function levelAtom(l) { const s = levelToString(l); return /\s/.test(s) ? '(' + s + ')' : s; }

// ------------------------------------------------------------ expressions
// Every node caches: r = loose bvar range, f = has fvar, m = has (level) mvar.
function mk(o, r, f, m) { o.r = r; o.f = f; o.m = m; return o; }
const E = {
  sort: l => mk({ k: 'sort', l }, 0, false, levelHasMVar(l)),
  bvar: i => mk({ k: 'bvar', i }, i + 1, false, false),
  fvar: id => mk({ k: 'fvar', id }, 0, true, false),
  mvar: id => mk({ k: 'mvar', id }, 0, false, true),
  cnst: (name, ls) => { ls = ls || []; return mk({ k: 'const', name, ls }, 0, false, ls.some(levelHasMVar)); },
  app: (fn, a) => mk({ k: 'app', fn, a }, Math.max(fn.r, a.r), fn.f || a.f, fn.m || a.m),
  lam: (name, ty, body, bi) => mk({ k: 'lam', name, ty, body, bi: bi || 'default' },
    Math.max(ty.r, body.r - 1), ty.f || body.f, ty.m || body.m),
  pi: (name, ty, body, bi) => mk({ k: 'pi', name, ty, body, bi: bi || 'default' },
    Math.max(ty.r, body.r - 1), ty.f || body.f, ty.m || body.m),
  lit: n => mk({ k: 'lit', n }, 0, false, false),
};
const PROP = E.sort(LZERO), TYPE = E.sort(LONE);

function mkApps(f, args) { for (const a of args) f = E.app(f, a); return f; }
function getAppFn(e) { while (e.k === 'app') e = e.fn; return e; }
function getAppArgs(e) { const out = []; while (e.k === 'app') { out.push(e.a); e = e.fn; } return out.reverse(); }
function cnst(name, ls) { return E.cnst(name, ls); }

// lift loose bvars >= c by n
function liftLoose(e, n, c) {
  if (n === 0 || e.r <= c) return e;
  switch (e.k) {
    case 'bvar': return e.i >= c ? E.bvar(e.i + n) : e;
    case 'app': return E.app(liftLoose(e.fn, n, c), liftLoose(e.a, n, c));
    case 'lam': return E.lam(e.name, liftLoose(e.ty, n, c), liftLoose(e.body, n, c + 1), e.bi);
    case 'pi': return E.pi(e.name, liftLoose(e.ty, n, c), liftLoose(e.body, n, c + 1), e.bi);
  }
  return e;
}
// substitute v for bvar d (and lower the bvars above d)
function instantiate1(e, v, d) {
  d = d || 0;
  if (e.r <= d) return e;
  switch (e.k) {
    case 'bvar': return e.i === d ? liftLoose(v, d, 0) : (e.i > d ? E.bvar(e.i - 1) : e);
    case 'app': return E.app(instantiate1(e.fn, v, d), instantiate1(e.a, v, d));
    case 'lam': return E.lam(e.name, instantiate1(e.ty, v, d), instantiate1(e.body, v, d + 1), e.bi);
    case 'pi': return E.pi(e.name, instantiate1(e.ty, v, d), instantiate1(e.body, v, d + 1), e.bi);
  }
  return e;
}
// replace fvar id by bvar d
function abstract1(e, id, d) {
  d = d || 0;
  if (!e.f) return e;
  switch (e.k) {
    case 'fvar': return e.id === id ? E.bvar(d) : e;
    case 'app': return E.app(abstract1(e.fn, id, d), abstract1(e.a, id, d));
    case 'lam': return E.lam(e.name, abstract1(e.ty, id, d), abstract1(e.body, id, d + 1), e.bi);
    case 'pi': return E.pi(e.name, abstract1(e.ty, id, d), abstract1(e.body, id, d + 1), e.bi);
  }
  return e;
}
// simultaneous substitution of fvars by terms (which may have loose bvars)
function replaceFVars(e, ids, vals, d) {
  d = d || 0;
  if (!e.f) return e;
  switch (e.k) {
    case 'fvar': { const i = ids.indexOf(e.id); return i < 0 ? e : liftLoose(vals[i], d, 0); }
    case 'app': return E.app(replaceFVars(e.fn, ids, vals, d), replaceFVars(e.a, ids, vals, d));
    case 'lam': return E.lam(e.name, replaceFVars(e.ty, ids, vals, d), replaceFVars(e.body, ids, vals, d + 1), e.bi);
    case 'pi': return E.pi(e.name, replaceFVars(e.ty, ids, vals, d), replaceFVars(e.body, ids, vals, d + 1), e.bi);
  }
  return e;
}
function replaceFVar(e, id, v) { return replaceFVars(e, [id], [v], 0); }
function hasFVar(e, id) {
  if (!e.f) return false;
  switch (e.k) {
    case 'fvar': return e.id === id;
    case 'app': return hasFVar(e.fn, id) || hasFVar(e.a, id);
    case 'lam': case 'pi': return hasFVar(e.ty, id) || hasFVar(e.body, id);
  }
  return false;
}
function collectFVars(e, acc) {
  if (!e.f) return acc;
  switch (e.k) {
    case 'fvar': acc.add(e.id); break;
    case 'app': collectFVars(e.fn, acc); collectFVars(e.a, acc); break;
    case 'lam': case 'pi': collectFVars(e.ty, acc); collectFVars(e.body, acc); break;
  }
  return acc;
}
function substLevelsExpr(e, map) {
  const sub = l => levelMapLeaves(l, y => (y.k === 'p' && map[y.name]) ? map[y.name] : y);
  const go = x => {
    switch (x.k) {
      case 'sort': return E.sort(sub(x.l));
      case 'const': return x.ls.length ? E.cnst(x.name, x.ls.map(sub)) : x;
      case 'app': return E.app(go(x.fn), go(x.a));
      case 'lam': return E.lam(x.name, go(x.ty), go(x.body), x.bi);
      case 'pi': return E.pi(x.name, go(x.ty), go(x.body), x.bi);
    }
    return x;
  };
  return go(e);
}
// structural equality up to binder names
function exprEq(a, b) {
  if (a === b) return true;
  if (a.k !== b.k) return false;
  switch (a.k) {
    case 'sort': return levelStructEq(a.l, b.l);
    case 'bvar': return a.i === b.i;
    case 'fvar': case 'mvar': return a.id === b.id;
    case 'const': return a.name === b.name && a.ls.length === b.ls.length && a.ls.every((l, i) => levelStructEq(l, b.ls[i]));
    case 'app': return exprEq(a.fn, b.fn) && exprEq(a.a, b.a);
    case 'lam': case 'pi': return exprEq(a.ty, b.ty) && exprEq(a.body, b.body);
    case 'lit': return a.n === b.n;
  }
  return false;
}
function exprSize(e) {
  switch (e.k) {
    case 'app': return 1 + exprSize(e.fn) + exprSize(e.a);
    case 'lam': case 'pi': return 1 + exprSize(e.ty) + exprSize(e.body);
  }
  return 1;
}

// ------------------------------------------------------------ local fvars
// fvar ids are globally unique; their declarations live in one table.
const FV = new Map();
let fvCounter = 0;
function mkFVar(name, type, bi) {
  const id = 'f' + (++fvCounter);
  FV.set(id, { id, name, type, bi: bi || 'default' });
  return E.fvar(id);
}
function fvDecl(id) {
  const d = FV.get(id);
  if (!d) throw new KernelError('unknown local ' + id);
  return d;
}

// ------------------------------------------------------------ environment
class Env {
  constructor() { this.consts = new Map(); this.order = []; }
  add(c) {
    if (this.consts.has(c.name)) throw new KernelError('already declared: ' + c.name);
    this.consts.set(c.name, c); this.order.push(c.name);
  }
  get(name) { return this.consts.get(name); }
  has(name) { return this.consts.has(name); }
}

// ------------------------------------------------------------ state
// A State bundles the environment with the metavariable context.  The
// kernel uses a State with kernel = true, which rejects metavariables.
class State {
  constructor(env) {
    this.env = env;
    this.mvars = new Map();   // id -> {id, type, lctx:[fvarIds], kind, userName, assign, delayed}
    this.lmvars = new Map();  // id -> level | null
    this.counter = 0;
    this.kernel = false;
    this.trace = null;        // optional array collecting reduction steps
    this.natAccel = true;
  }
  snapshot() {
    const a = new Map(); for (const [k, v] of this.mvars) a.set(k, v.assign);
    return { a, l: new Map(this.lmvars) };
  }
  restore(s) {
    for (const [k, v] of this.mvars) v.assign = s.a.has(k) ? s.a.get(k) : null;
    this.lmvars = new Map(s.l);
  }
  newMVar(type, lctx, kind, userName) {
    const id = 'm' + (++this.counter);
    this.mvars.set(id, { id, type, lctx: lctx.slice(), kind: kind || 'natural', userName: userName || null, assign: null, delayed: null });
    return E.mvar(id);
  }
  newLMVar() { const id = 'l' + (++this.counter); this.lmvars.set(id, null); return Lv.mvar(id); }
  mdecl(id) { const d = this.mvars.get(id); if (!d) throw new KernelError('unknown metavariable'); return d; }
}
function kernelState(env) { const s = new State(env); s.kernel = true; return s; }

// --------------------------------------------- instantiate metavariables
function instLevel(l, st) {
  if (!levelHasMVar(l)) return l;
  return levelMapLeaves(l, x => {
    if (x.k === 'm') { const v = st.lmvars.get(x.id); return v ? instLevel(v, st) : x; }
    return x;

//   opts.binderTypes : show binder types in fun
// ===================================================================
'use strict';

const NOTATION = {
  'And': { op: '∧', p: 35, assoc: 'r', arity: 2 },
  'Or': { op: '∨', p: 30, assoc: 'r', arity: 2 },
  'Iff': { op: '↔', p: 20, assoc: 'n', arity: 2 },
  'Eq': { op: '=', p: 50, assoc: 'n', arity: 3 },
  'Ne': { op: '≠', p: 50, assoc: 'n', arity: 3 },
  'Nat.add': { op: '+', p: 65, assoc: 'l', arity: 2 },
  'Nat.mul': { op: '*', p: 70, assoc: 'l', arity: 2 },
};
const SUBSCRIPTS = '₀₁₂₃₄₅₆₇₈₉';

function sortToString(l) {
  if (l.k === 'n') return l.n === 0 ? 'Prop' : (l.n === 1 ? 'Type' : 'Type ' + (l.n - 1));
  if (l.k === 's') return 'Type ' + levelAtom(l.l);
  return 'Sort ' + levelAtom(l);
}

class Printer {
  constructor(st, opts) {
    this.st = st; this.opts = opts || {};
    this.used = new Set();
  }
  fvName(id) {
    const d = FV.get(id);
    return d ? d.name : '?' + id;
  }
  fresh(name, body, names) {
    let base = (!name || name === '_') ? 'x' : name;
    if (base.endsWith('✝')) base = base.slice(0, -1) || 'x';
    let cand = base, i = 0;
    const clash = c => names.includes(c) || this.used.has(c);
    while (clash(cand)) { i++; cand = base + String(i).split('').map(d => SUBSCRIPTS[+d]).join(''); }
    return cand;
  }
  print(e, names, prec, right) {
    names = names || [];
    prec = prec || 0;
    if (right === undefined) right = true;
    switch (e.k) {
      case 'sort': return this.paren(sortToString(this.st ? instLevel(e.l, this.st) : e.l), prec, /\s/.test(sortToString(e.l)) ? 1024 : 2000);
      case 'bvar': return names[names.length - 1 - e.i] || ('#' + e.i);
      case 'fvar': return this.fvName(e.id);
      case 'mvar': return this.mvarName(e.id);
      case 'lit': return String(e.n);
      case 'const': {
        if (this.opts.explicit) return this.constName(e);
        return this.printApp(e, [], names, prec, right);
      }
      case 'app': return this.printApp(getAppFn(e), getAppArgs(e), names, prec, right);
      case 'lam': return this.printLam(e, names, prec, right);
      case 'pi': return this.printPi(e, names, prec, right);
    }
    return '?';
  }
  mvarName(id) {
    const d = this.st && this.st.mvars.get(id);
    if (d && d.assign) return this.print(instMVars(E.mvar(id), this.st), []);
    if (d && d.userName) return '?' + d.userName;
    return '?_';
  }
  constName(e) {
    if (this.opts.explicit && e.ls.length) return e.name + '.{' + e.ls.map(l => levelToString(this.st ? instLevel(l, this.st) : l)).join(', ') + '}';
    return e.name;
  }
  paren(s, prec, myPrec) { return myPrec < prec ? '(' + s + ')' : s; }
  printApp(f, args, names, prec, right) {
    if (f.k === 'mvar' && this.st) {
      const d = this.st.mvars.get(f.id);
      if (d && d.delayed) return '?_';
      if (d && d.assign) return this.print(instMVars(mkApps(f, args), this.st), names, prec, right);
    }
    if (f.k === 'lam' && args.length) {
      const s = this.print(f, names, 1025) + ' ' + args.map(a => this.print(a, names, 1025)).join(' ');
      return this.paren(s, prec, 1024);
    }
    if (f.k === 'const') {
      const c = this.st && this.st.env.get(f.name);
      const nt = NOTATION[f.name];
      if (!this.opts.explicit && nt && args.length === nt.arity) {
        const l = args[nt.arity - 2], r = args[nt.arity - 1];
        const lp = nt.assoc === 'l' ? nt.p : nt.p + 1;
        const rp = nt.assoc === 'r' ? nt.p : nt.p + 1;
        const s = this.print(l, names, lp, false) + ' ' + nt.op + ' ' + this.print(r, names, rp, right);
        return this.paren(s, prec, nt.p);
      }
      if (!this.opts.explicit && f.name === 'Not' && args.length === 1)
        return this.paren('¬' + this.print(args[0], names, 40, right), prec, 40);
      if (!this.opts.explicit && f.name === 'Exists' && args.length === 2 && args[1].k === 'lam') {
        const lam = args[1];
        const nm = this.fresh(lam.name, lam.body, names);
        const inner = this.print(lam.body, names.concat([nm]), 0, true);
        const ty = this.opts.binderTypesInExists ? ' : ' + this.print(lam.ty, names, 0) : '';
        return this.parenLead('∃ ' + nm + ty + ', ' + inner, prec, right);
      }
      if (c && !this.opts.explicit) {
        // hide implicit arguments
        const shown = [];
        let ty = c.type, i = 0;
        const isRec = c.kind === 'rec';
        for (; i < args.length; i++) {
          if (ty.k !== 'pi') { shown.push({ a: args[i] }); continue; }
          if (ty.bi === 'default') shown.push({ a: args[i] });
          else if (isRec && ty.name === 'motive') shown.push({ a: args[i], named: 'motive' });
          ty = ty.body;
        }
        if (!shown.length) return f.name;
        const parts = shown.map(x => x.named ? '(' + x.named + ' := ' + this.print(x.a, names, 0) + ')' : this.print(x.a, names, 1025));
        return this.paren(f.name + ' ' + parts.join(' '), prec, 1024);
      }
      if (!args.length) return this.constName(f);
      const head = (this.opts.explicit && c && hasImplicitBinder(c.type) ? '@' : '') + this.constName(f);
      return this.paren(head + ' ' + args.map(a => this.print(a, names, 1025)).join(' '), prec, 1024);
    }
    if (!args.length) return this.print(f, names, prec, right);
    const s = this.print(f, names, 1024, false) + ' ' + args.map(a => this.print(a, names, 1025)).join(' ');
    return this.paren(s, prec, 1024);
  }
  parenLead(s, prec, right) { return (prec > 0 && !right) || prec > 1000 ? '(' + s + ')' : s; }
  printLam(e, names, prec, right) {
    const binders = [];
    let cur = e, ns = names;
    while (cur.k === 'lam') {
      const nm = this.fresh(cur.name, cur.body, ns);
      binders.push({ nm, ty: this.print(cur.ty, ns, 0), bi: cur.bi });
      ns = ns.concat([nm]); cur = cur.body;
    }
    const bs = binders.map(b => {
      if (b.bi === 'implicit') return '{' + b.nm + ' : ' + b.ty + '}';
      return this.opts.binderTypes ? '(' + b.nm + ' : ' + b.ty + ')' : b.nm;
    }).join(' ');
    return this.parenLead('fun ' + bs + ' => ' + this.print(cur, ns, 0, true), prec, right);
  }
  printPi(e, names, prec, right) {
    // non-dependent: arrow
    if (e.body.r === 0 || !looseBVarOccurs(e.body, 0)) {
      if (e.bi === 'default') {
        const s = this.print(e.ty, names, 26, false) + ' → ' + this.print(e.body, names.concat(['_']), 25, right);
        return this.paren(s, prec, 25);
      }
    }
    const groups = [];
    let cur = e, ns = names;
    while (cur.k === 'pi' && (looseBVarOccurs(cur.body, 0) || cur.bi !== 'default')) {
      const nm = this.fresh(cur.name, cur.body, ns);
      const ty = this.print(cur.ty, ns, 0);
      const last = groups[groups.length - 1];
      if (last && last.ty === ty && last.bi === cur.bi && !looseBVarOccurs(cur.ty, 0)) last.nms.push(nm);
      else groups.push({ nms: [nm], ty, bi: cur.bi });
      ns = ns.concat([nm]); cur = cur.body;
    }
    let bs;
    if (groups.length === 1 && groups[0].bi === 'default') bs = groups[0].nms.join(' ') + ' : ' + groups[0].ty;
    else bs = groups.map(g => (g.bi === 'implicit' ? '{' : '(') + g.nms.join(' ') + ' : ' + g.ty + (g.bi === 'implicit' ? '}' : ')')).join(' ');
    return this.parenLead('∀ ' + bs + ', ' + this.print(cur, ns, 0, true), prec, right);
  }
}
function hasImplicitBinder(t) { while (t.k === 'pi') { if (t.bi !== 'default') return true; t = t.body; } return false; }
function looseBVarOccurs(e, i) {
  if (e.r <= i) return false;
  switch (e.k) {
    case 'bvar': return e.i === i;
    case 'app': return looseBVarOccurs(e.fn, i) || looseBVarOccurs(e.a, i);
    case 'lam': case 'pi': return looseBVarOccurs(e.ty, i) || looseBVarOccurs(e.body, i + 1);
  }
  return false;
}

function pp(e, st, opts) {
  try {
    if (st && !st.kernel) e = instMVars(e, st);
    const p = new Printer(st, opts);
    for (const id of collectFVars(e, new Set())) p.used.add(p.fvName(id));
    return p.print(e, [], 0, true);
  } catch (err) { return '<' + err.message + '>'; }
}

// Names of hypotheses as Lean shows them: shadowed names get a dagger.
function displayNames(lctx) {
  const out = new Map();
  for (let i = 0; i < lctx.length; i++) {
    const d = FV.get(lctx[i]);
    let nm = d.name;
    const shadowed = lctx.slice(i + 1).some(j => FV.get(j).name === nm);
    if (shadowed && !nm.endsWith('✝')) nm += '✝';
    out.set(lctx[i], nm);
  }
  return out;
}
// A goal in Lean's infoview format.
function ppGoal(st, mvarId, opts) {
  const d = st.mdecl(mvarId);
  const names = displayNames(d.lctx);
  const saved = [];
  for (const [id, nm] of names) { const fd = FV.get(id); saved.push([fd, fd.name]); fd.name = nm; }
  try {
    const groups = [];
    for (const id of d.lctx) {
      const fd = FV.get(id);
      if (fd.hidden) continue;
      const ty = pp(fd.type, st, opts);
      const last = groups[groups.length - 1];
      if (last && last.ty === ty) last.names.push(fd.name); else groups.push({ names: [fd.name], ty });
    }
    return {
      tag: d.userName || null,
      hyps: groups.map(g => ({ names: g.names, type: g.ty })),
      target: pp(d.type, st, opts),
      text: (d.userName ? 'case ' + d.userName + '\n' : '') + groups.map(g => g.names.join(' ') + ' : ' + g.ty).join('\n') + (groups.length ? '\n' : '') + '⊢ ' + pp(d.type, st, opts),
    };
  } finally { for (const [fd, nm] of saved) fd.name = nm; }
}
;
// ===================================================================
// Proof Atelier — surface syntax: a parser for a subset of Lean 4
// (terms and tactic blocks).  Positions are character offsets.
// ===================================================================
'use strict';

class ParseError extends Error {
  constructor(msg, pos) { super(msg); this.pos = pos; }
}

const KEYWORDS = new Set(['fun', 'λ', 'forall', 'show', 'from', 'have', 'by', 'at', 'with', 'Prop', 'Type', 'Sort', 'then', 'else', 'if', 'match', 'let', 'in']);
const SYMS = ['<;>', ':=', '=>', '->', '<->', '/\\', '\\/', '<-', '?_', '(', ')', '⟨', '⟩', '{', '}', '[', ']', ',', ':', '→', '↔', '∧', '∨', '¬', '=', '≠', '+', '*', '▸', '@', '|', '·', '.', ';', '←', '∀', '∃', 'λ', '⊢', '-', '!', '<', '>', '∘', '×', '⁻'];
const SYM_ALIAS = { '->': '→', '<->': '↔', '/\\': '∧', '\\/': '∨', '<-': '←' };

function isIdStart(c) { return /[A-Za-z_\u0370-\u03BA\u03BC-\u03FF\u1F00-\u1FFF\u2100-\u214F𝓐-𝔷]/u.test(c) && c !== 'λ'; }
function isIdRest(c) { return isIdStart(c) || /[0-9'!?₀-₉✝ᵢ]/.test(c); }

function tokenize(src, base) {
  base = base || 0;
  const toks = [];
  let i = 0, nl = false;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { nl = true; i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    if (c === '-' && src[i + 1] === '-') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i + 1] === '-') { const j = src.indexOf('-/', i + 2); i = j < 0 ? n : j + 2; continue; }
    const sp = i === 0 || /\s/.test(src[i - 1]);
    const start = i;
    if (/[0-9]/.test(c)) {
      while (i < n && /[0-9]/.test(src[i])) i++;
      toks.push({ t: 'num', v: src.slice(start, i), s: base + start, e: base + i, sp, nl }); nl = false; continue;
    }
    if (c === '?' && i + 1 < n && isIdStart(src[i + 1]) && src[i + 1] !== '_') {
      i++; while (i < n && isIdRest(src[i])) i++;
      toks.push({ t: 'shole', v: src.slice(start + 1, i), s: base + start, e: base + i, sp, nl }); nl = false; continue;
    }
    if (isIdStart(c)) {
      i++;
      while (i < n && isIdRest(src[i])) i++;
      // dotted continuation: .ident or .digits, immediately adjacent
      while (i + 1 < n && src[i] === '.' && (isIdStart(src[i + 1]) || /[0-9]/.test(src[i + 1]))) {
        i++;
        if (/[0-9]/.test(src[i])) { while (i < n && /[0-9]/.test(src[i])) i++; }
        else { while (i < n && isIdRest(src[i])) i++; }
      }
      const v = src.slice(start, i);
      if (v === '_') toks.push({ t: 'hole', v, s: base + start, e: base + i, sp, nl });
      else if (KEYWORDS.has(v)) toks.push({ t: 'kw', v, s: base + start, e: base + i, sp, nl });
      else toks.push({ t: 'id', v, s: base + start, e: base + i, sp, nl });
      nl = false; continue;
    }
    let matched = null;
    for (const s of SYMS) if (src.startsWith(s, i)) { matched = s; break; }
    if (!matched) throw new ParseError('unexpected character ' + JSON.stringify(c), [base + i, base + i + 1]);
    i += matched.length;
    let v = SYM_ALIAS[matched] || matched;
    if (v === 'λ') toks.push({ t: 'kw', v: 'fun', s: base + start, e: base + i, sp, nl });
    else if (v === '?_') toks.push({ t: 'shole', v: '', s: base + start, e: base + i, sp, nl });
    else toks.push({ t: 'sym', v, s: base + start, e: base + i, sp, nl });
    nl = false;
  }
  toks.push({ t: 'eof', v: '', s: base + n, e: base + n, sp: true, nl: true });
  return toks;
}

// -------------------------------------------------------------- terms
const INFIX = {
  '→': { p: 25, assoc: 'r' }, '↔': { p: 20, assoc: 'n' }, '∨': { p: 30, assoc: 'r' }, '∧': { p: 35, assoc: 'r' },
  '=': { p: 50, assoc: 'n' }, '≠': { p: 50, assoc: 'n' }, '+': { p: 65, assoc: 'l' }, '*': { p: 70, assoc: 'l' },
  '▸': { p: 75, assoc: 'r' },
};

class Parser {
  constructor(src, base, opts) {
    this.src = src; this.base = base || 0;
    this.toks = tokenize(src, this.base);
    this.i = 0;
    this.opts = opts || {};
  }
  peek(k) { return this.toks[Math.min(this.i + (k || 0), this.toks.length - 1)]; }
  next() { return this.toks[this.i++]; }
  isSym(v, k) { const t = this.peek(k); return t.t === 'sym' && t.v === v; }
  isKw(v, k) { const t = this.peek(k); return t.t === 'kw' && t.v === v; }
  expectSym(v) {
    const t = this.peek();
    if (t.t === 'sym' && t.v === v) return this.next();
    throw new ParseError("expected '" + v + "'" + (t.t === 'eof' ? ' before the end' : " but found '" + t.v + "'"), [t.s, t.e]);
  }
  expectKw(v) {
    const t = this.peek();
    if (t.t === 'kw' && t.v === v) return this.next();
    throw new ParseError("expected '" + v + "'", [t.s, t.e]);
  }
  atEnd() { return this.peek().t === 'eof'; }
  pos(a, b) { return [a, b === undefined ? this.toks[Math.max(0, this.i - 1)].e : b]; }

  parseTermToEnd() {
    const t = this.parseTerm(0);
    if (!this.atEnd()) { const k = this.peek(); throw new ParseError("unexpected '" + k.v + "'", [k.s, k.e]); }
    return t;
  }

  parseTerm(min) {
    const start = this.peek().s;
    let lhs = this.parseLead();
    for (;;) {
      const t = this.peek();
      if (t.t !== 'sym' || !INFIX[t.v]) break;
      const { p, assoc } = INFIX[t.v];
      if (p < min) break;
      this.next();
      const rhs = this.parseTerm(assoc === 'l' || assoc === 'n' ? p + 1 : p);
      const pos = [start, this.toks[this.i - 1].e];
      if (t.v === '→') lhs = { t: 'arrow', dom: lhs, cod: rhs, pos };
      else if (t.v === '▸') lhs = { t: 'subst', h: lhs, e: rhs, pos };
      else lhs = { t: 'binop', op: t.v, l: lhs, r: rhs, pos };
      if (assoc === 'n') { const q = this.peek(); if (q.t === 'sym' && INFIX[q.v] && INFIX[q.v].p === p) throw new ParseError("ambiguous: add parentheses around '" + q.v + "'", [q.s, q.e]); }
    }
    return lhs;
  }

  parseLead() {
    const t = this.peek();
    const start = t.s;
    if (t.t === 'kw' && t.v === 'fun') {
      this.next();
      const binders = this.parseFunBinders();
      this.expectSym('=>');
      const body = this.parseTerm(0);
      return { t: 'fun', binders, body, pos: [start, this.toks[this.i - 1].e] };
    }
    if ((t.t === 'sym' && (t.v === '∀' || t.v === '∃')) || (t.t === 'kw' && t.v === 'forall')) {
      this.next();
      const binders = this.parseQuantBinders();
      this.expectSym(',');
      const body = this.parseTerm(0);
      return { t: t.v === '∃' ? 'exists' : 'pi', binders, body, pos: [start, this.toks[this.i - 1].e] };
    }
    if (t.t === 'sym' && t.v === '¬') {
      this.next();
      const a = this.parseTerm(40);
      return { t: 'not', a, pos: [start, this.toks[this.i - 1].e] };
    }
    if (t.t === 'kw' && t.v === 'show') {
      this.next();
      const type = this.parseTerm(0);
      if (this.isKw('from')) { this.next(); const e = this.parseTerm(0); return { t: 'show', type, e, pos: [start, this.toks[this.i - 1].e] }; }
      if (this.isKw('by')) { const e = this.parseLead(); return { t: 'show', type, e, pos: [start, this.toks[this.i - 1].e] }; }
      throw new ParseError("expected 'from' or 'by' after 'show T'", [this.peek().s, this.peek().e]);
    }
    if (t.t === 'kw' && t.v === 'have') {
      this.next();
      let name = 'this';
      if (this.peek().t === 'id') name = this.next().v;
      let type = null;
      if (this.isSym(':')) { this.next(); type = this.parseTerm(0); }
      this.expectSym(':=');
      const val = this.parseTerm(0);
      if (this.isSym(';')) this.next();
      else if (!this.peek().nl) throw new ParseError("expected ';' or a new line after 'have'", [this.peek().s, this.peek().e]);
      const body = this.parseTerm(0);
      return { t: 'have', name, type, val, body, pos: [start, this.toks[this.i - 1].e] };
    }
    if (t.t === 'kw' && t.v === 'by') {
      this.next();
      // the tactic block extends to the first unmatched closer or comma at depth 0
      let depth = 0, j = this.i;
      for (; j < this.toks.length; j++) {
        const k = this.toks[j];
        if (k.t === 'eof') break;
        if (k.t === 'sym' && ['(', '⟨', '[', '{'].includes(k.v)) depth++;
        if (k.t === 'sym' && [')', '⟩', ']', '}'].includes(k.v)) { if (depth === 0) break; depth--; }
        if (k.t === 'sym' && k.v === ',' && depth === 0 && this.opts.byStopsAtComma !== false) break;
      }
      const endTok = this.toks[j];
      const s = this.toks[this.i].s, e = endTok.t === 'eof' ? this.base + this.src.length : endTok.s;
      const text = this.src.slice(s - this.base, e - this.base);
      this.i = j;
      return { t: 'by', tactics: parseTacticBlock(text, s), pos: [start, e] };
    }
    if (t.t === 'kw' && (t.v === 'match' || t.v === 'let' || t.v === 'if'))
      throw new ParseError("'" + t.v + "' is not part of this studio's Lean subset; try a recursor, `.elim`, or a tactic", [t.s, t.e]);
    return this.parseApp();
  }

  canStartArg() {
    const t = this.peek();
    if (t.t === 'id' || t.t === 'num' || t.t === 'hole' || t.t === 'shole') return true;
    if (t.t === 'kw') return t.v === 'Prop' || t.v === 'Type' || t.v === 'Sort' || t.v === 'fun';
    if (t.t === 'sym') return ['(', '⟨', '@'].includes(t.v);
    return false;
  }

  parseApp() {
    const start = this.peek().s;
    const fn = this.parseAtom();
    const args = [];
    while (this.canStartArg()) {
      if (this.isSym('(') && this.peek(1).t === 'id' && this.isSym(':=', 2)) {
        const s0 = this.next().s; const name = this.next().v; this.next();
        const val = this.parseTerm(0);
        this.expectSym(')');
        args.push({ named: name, val, pos: [s0, this.toks[this.i - 1].e] });
        continue;
      }
      if (this.isKw('fun')) { args.push({ val: this.parseLead() }); break; }
      args.push({ val: this.parseAtom() });
    }
    if (!args.length) return fn;
    return { t: 'app', fn, args, pos: [start, this.toks[this.i - 1].e] };
  }

  parseLevel() {
    const t = this.peek();
    if (t.t === 'num') { this.next(); return { n: parseInt(t.v, 10) }; }
    if (t.t === 'id' && (this.opts.levelParams || []).includes(t.v)) { this.next(); return { p: t.v }; }
    return null;
  }

  parseAtom() {

    case 'lam': return E.lam(e.name, betaNorm(e.ty), betaNorm(e.body), e.bi);
    case 'pi': return E.pi(e.name, betaNorm(e.ty), betaNorm(e.body), e.bi);
  }
  return e;
}

class Elab {
  constructor(st, lctx, opts) {
    this.st = st;
    this.lctx = lctx.slice();
    this.opts = opts || {};
    this.mismatches = [];
    this.newGoals = [];      // synthetic holes ?_ created while elaborating
    this.created = [];       // natural metavariables created (for "can't synthesize" errors)
  }
  // ---------------------------------------------------------- utilities
  pp(e, opts) { return pp(e, this.st, opts); }
  withLocal(name, type, bi, fn) {
    const x = mkFVar(name, type, bi);
    this.lctx.push(x.id);
    try { return fn(x); } finally { this.lctx.pop(); }
  }
  lookupLocal(name) {
    for (let i = this.lctx.length - 1; i >= 0; i--) {
      const d = FV.get(this.lctx[i]);
      if (d.name === name && !d.hidden) return E.fvar(d.id);
    }
    return null;
  }
  mkConst(name) {
    const c = this.st.env.get(name);
    const ls = c.lparams.map(() => this.st.newLMVar());
    const e = E.cnst(name, ls);
    return { e, ty: instConstType(c, ls) };
  }
  newMeta(type, userName) {
    const m = this.st.newMVar(type, this.lctx, 'natural', userName);
    this.created.push({ id: m.id, pos: this.curPos, userName });
    return m;
  }
  newTypeMeta() {
    const u = this.st.newLMVar();
    return this.newMeta(E.sort(u));
  }
  whnf(e) { return whnf(instMVars(e, this.st), this.st, true); }
  infer(e) { return infer(e, this.st, false); }
  defeq(a, b) {
    try { return isDefEq(a, b, this.st); } catch (err) { if (err instanceof KernelError) return false; throw err; }
  }
  tryDefeq(a, b) {
    const snap = this.st.snapshot();
    if (this.defeq(a, b)) return true;
    this.st.restore(snap); return false;
  }
  mkLambdaFVars(xs, e) { return this.bindFVars(xs, e, 'lam'); }
  mkPiFVars(xs, e) { return this.bindFVars(xs, e, 'pi'); }
  bindFVars(xs, e, kind) {
    const st = this.st;
    e = instMVars(e, st);
    const ids = xs.map(x => x.id);
    for (const mid of collectMVars(e, st, [])) {
      const d = st.mdecl(mid);
      if (d.assign || d.delayed) continue;
      const ys = ids.filter(id => d.lctx.includes(id));
      if (!ys.length) continue;
      const newType = this.bindFVars(ys.map(id => E.fvar(id)), d.type, 'pi');
      const smaller = d.lctx.filter(id => !ys.includes(id));
      if (d.kind === 'natural') {
        const n = st.newMVar(newType, smaller, 'natural', d.userName);
        d.assign = mkApps(n, ys.map(id => E.fvar(id)));
      } else {
        const n = st.newMVar(newType, smaller, 'delayed', d.userName);
        st.mdecl(n.id).delayed = { fvars: ys, pending: mid };
        e = replaceMVar(e, mid, mkApps(n, ys.map(id => E.fvar(id))));
      }
    }
    e = instMVars(e, st);
    for (let i = xs.length - 1; i >= 0; i--) {
      const d = fvDecl(xs[i].id);
      const ty = instMVars(d.type, st);
      const body = abstract1(e, d.id);
      e = kind === 'lam' ? E.lam(d.name, ty, body, d.bi) : E.pi(d.name, ty, body, d.bi);
    }
    // abstract earlier binders occurring in later binder types
    return e;
  }

  // ---------------------------------------------------------- errors
  mismatchError(stx, e, ty, expected) {
    let extra = '';
    try {
      const t = instMVars(ty, this.st), x = this.whnf(expected);
      const th = getAppFn(t), xh = getAppFn(x);
      if (th.k === 'const' && th.name === 'Eq' && xh.k === 'const' && xh.name === 'Eq') {
        const ta = getAppArgs(t), xa = getAppArgs(x);
        if (ta.length === 3 && xa.length === 3 && exprEq(instMVars(ta[1], this.st), instMVars(ta[2], this.st))) {
          const nf = v => this.pp(normalizeForDisplay(v, this.st));
          extra = '\n\nrfl proves an equation only when both sides compute to the same term. Here\n  ' + this.pp(xa[1]) + '\ncomputes to\n  ' + nf(xa[1]) + '\nand\n  ' + this.pp(xa[2]) + '\ncomputes to\n  ' + nf(xa[2]);
        }
      }
    } catch (err) { extra = ''; }
    return new ElabError('type mismatch\n  ' + this.pp(e) + '\nhas type\n  ' + this.pp(ty) + '\nbut is expected to have type\n  ' + this.pp(expected) + extra,
      stx && stx.pos, { kind: 'mismatch', got: ty, expected });
  }
  // fill in what can be filled: unify argument by argument, keeping successes
  softUnify(got, expected) {
    const g = instMVars(got, this.st), x = instMVars(expected, this.st);
    if (this.tryDefeq(g, x)) return;
    if (g.k === 'pi' && x.k === 'pi') {
      this.softUnify(g.ty, x.ty);
      if (this.defeq(g.ty, x.ty)) this.withLocal(g.name, g.ty, g.bi, v => this.softUnify(instantiate1(g.body, v), instantiate1(x.body, v)));
      return;
    }
    const gh = getAppFn(g), xh = getAppFn(x);
    if (gh.k === 'const' && xh.k === 'const' && gh.name === xh.name) {
      const ga = getAppArgs(g), xa = getAppArgs(x);
      if (ga.length === xa.length) for (let i = 0; i < ga.length; i++) this.softUnify(ga[i], xa[i]);
    }
  }
  ensureHasType(expected, r, stx, soft) {
    if (!expected) return r;
    if (this.defeq(r.ty, expected)) return r;
    if (soft) {
      this.softUnify(r.ty, expected);
      this.mismatches.push({ pos: stx && stx.pos, expected: instMVars(expected, this.st), got: instMVars(r.ty, this.st), term: instMVars(r.e, this.st) });
      return r;
    }
    throw this.mismatchError(stx, r.e, r.ty, expected);
  }

  // ---------------------------------------------------------- types
  elabType(stx) {
    const r = this.elab(stx, null, false);
    let s;
    try { s = ensureSortOf(r.ty, this.st); }
    catch (err) {
      throw new ElabError('type expected, but\n  ' + this.pp(r.e) + '\nhas type\n  ' + this.pp(r.ty) + '\nwhich is not a sort', stx.pos);
    }
    return { e: r.e, ty: r.ty, level: s };
  }

  // ---------------------------------------------------------- main
  elab(stx, expected, soft) {
    const saved = this.curPos; this.curPos = stx.pos;
    try {
      const r = this.elabCore(stx, expected ? instMVars(expected, this.st) : null, !!soft);
      return r;
    } catch (err) {
      if (err instanceof KernelError) throw new ElabError(err.message, stx.pos);
      throw err;
    } finally { this.curPos = saved; }
  }

  elabCore(stx, expected, soft) {
    switch (stx.t) {
      case 'ident': return this.elabApp(stx, [], expected, soft);
      case 'explicit': return this.elabApp(stx, [], expected, soft);
      case 'app': return this.elabApp(stx.fn, stx.args, expected, soft);
      case 'proj': return this.elabApp(stx, [], expected, soft);
      case 'num': return this.ensureHasType(expected, { e: E.lit(stx.n), ty: cnst('Nat') }, stx, soft);
      case 'sort': {
        const l = stx.level.n !== undefined ? Lv.num(stx.level.n) : (stx.level.succ ? Lv.succ(Lv.param(stx.level.p)) : Lv.param(stx.level.p));
        return this.ensureHasType(expected, { e: E.sort(l), ty: E.sort(Lv.succ(l)) }, stx, soft);
      }
      case 'hole': {
        const ty = expected || this.newTypeMeta();
        const m = this.newMeta(ty);
        return { e: m, ty };
      }
      case 'shole': {
        if (!expected) throw new ElabError("don't know the type of this hole: add a type ascription", stx.pos);
        if (!this.opts.allowHoles) throw new ElabError('unsolved goal: holes ?_ are allowed with `refine` (or in a tactic proof)', stx.pos);
        const m = this.st.newMVar(expected, this.lctx, 'syntheticOpaque', stx.name || null);
        this.newGoals.push(m.id);
        return { e: m, ty: expected };
      }
      case 'fun': return this.elabFun(stx, expected, soft);
      case 'pi': case 'arrow': return this.ensureHasType(expected, this.elabPi(stx), stx, soft);
      case 'exists': return this.ensureHasType(expected, this.elabExists(stx), stx, soft);
      case 'not': return this.elabConstApp('Not', [stx.a], expected, soft, stx);
      case 'binop': {
        const name = { '∧': 'And', '∨': 'Or', '↔': 'Iff', '=': 'Eq', '≠': 'Ne', '+': 'Nat.add', '*': 'Nat.mul' }[stx.op];
        return this.elabConstApp(name, [stx.l, stx.r], expected, soft, stx);
      }
      case 'anon': return this.elabAnon(stx, expected, soft);
      case 'ascr': {
        const T = this.elabType(stx.type).e;
        const r = this.elab(stx.e, T, false);
        this.ensureHasType(T, r, stx.e, false);
        return this.ensureHasType(expected, { e: r.e, ty: T }, stx, soft);
      }
      case 'show': {
        const T = this.elabType(stx.type).e;
        const r = this.elab(stx.e, T, false);
        this.ensureHasType(T, r, stx.e, false);
        return this.ensureHasType(expected, { e: r.e, ty: T }, stx, soft);
      }
      case 'have': {
        let T, v;
        if (stx.type) { T = this.elabType(stx.type).e; v = this.elab(stx.val, T, false); this.ensureHasType(T, v, stx.val, false); }
        else { v = this.elab(stx.val, null, false); T = v.ty; }
        T = instMVars(T, this.st);
        return this.withLocal(stx.name, T, 'default', x => {
          const b = this.elab(stx.body, expected, soft);
          const lam = this.mkLambdaFVars([x], b.e);
          const bty = instMVars(b.ty, this.st);
          return { e: E.app(lam, v.e), ty: replaceFVar(bty, x.id, v.e) };
        });
      }
      case 'subst': return this.elabSubst(stx, expected, soft);
      case 'by': {
        if (!expected) throw new ElabError("a `by` block needs a known expected type here", stx.pos);
        const goal = this.st.newMVar(expected, this.lctx, 'syntheticOpaque', null);
        const ts = new TacticRunner(this.st, this.opts);
        ts.run(stx.tactics, [goal.id], stx.pos);
        return { e: goal, ty: expected };
      }
    }
    throw new ElabError('unsupported syntax', stx.pos);
  }

  // ---------------------------------------------------------- binders
  elabFun(stx, expected, soft) {
    // each binder closes its own λ, so binders after a pattern ⟨a, b⟩
    // end up inside the recursor's minor premise
    const go = (i, exp) => {
      if (i === stx.binders.length) return this.elab(stx.body, exp, soft);
      const b = stx.binders[i];
      let dom = null, piBody = null;
      if (exp) {
        const w = this.whnf(exp);
        if (w.k === 'pi') { dom = w.ty; piBody = w; }
      }
      let ty;
      if (b.type) {
        ty = this.elabType(b.type).e;
        if (dom && !this.defeq(ty, dom)) {
          if (!soft) throw new ElabError('type mismatch: the binder `' + b.name + '` has type\n  ' + this.pp(ty) + '\nbut the expected type says\n  ' + this.pp(dom), b.pos);
          piBody = null;
        }
      } else if (dom) ty = dom;
      else if (b.pattern) throw new ElabError('fun ⟨…⟩ => … needs a known expected type here', b.pos);
      else ty = this.newTypeMeta();
      const name = b.pattern ? 'x' : b.name;
      return this.withLocal(name, instMVars(ty, this.st), b.bi, x => {
        const next = piBody ? instantiate1(piBody.body, x) : null;
        let r;
        if (!b.pattern) r = go(i + 1, next);
        else {
          if (!next) throw new ElabError('fun ⟨…⟩ => … needs a known expected type here', b.pos);
          // fun ⟨a, b⟩ => body   ~>   fun x => C.rec (motive := fun x => T) (fun a b => body) x
          const xty = this.whnf(fvDecl(x.id).type);
          const head = getAppFn(xty);
          const ind = head.k === 'const' ? this.st.env.get(head.name) : null;
          if (!ind || ind.kind !== 'ind' || ind.indInfo.ctors.length !== 1)
            throw new ElabError('the pattern ⟨…⟩ needs a type with exactly one constructor (such as ∧, ↔ or ∃), but got\n  ' + this.pp(xty), b.pos);
          const sk = buildCasesSkeleton(this, x, xty, next, [b.pattern]);
          r = sk.finish((ci, fs, ihs, goalTy) => go(i + 1, goalTy));
        }
        return { e: this.mkLambdaFVars([x], r.e), ty: this.mkPiFVars([x], r.ty) };
      });
    };
    const r = go(0, expected);
    return this.ensureHasType(expected, r, stx, soft);
  }
  elabBinderGroup(binders, fn) {
    const xs = [];
    const go = i => {
      if (i === binders.length) return fn(xs);
      const b = binders[i];
      const ty = b.type ? this.elabType(b.type).e : this.newTypeMeta();
      return this.withLocal(b.name, instMVars(ty, this.st), b.bi, x => { xs.push(x); return go(i + 1); });
    };
    return go(0);
  }
  elabPi(stx) {
    if (stx.t === 'arrow') {
      const d = this.elabType(stx.dom);
      const c = this.elabType(stx.cod);
      return { e: E.pi('a', d.e, c.e, 'default'), ty: E.sort(Lv.imax(instLevel(d.level, this.st), instLevel(c.level, this.st))) };
    }
    return this.elabBinderGroup(stx.binders, xs => {
      const c = this.elabType(stx.body);
      let lvl = instLevel(c.level, this.st);
      for (let i = xs.length - 1; i >= 0; i--) {
        const s = ensureSortOf(this.infer(fvDecl(xs[i].id).type), this.st);
        lvl = Lv.imax(instLevel(s, this.st), lvl);
      }
      return { e: this.mkPiFVars(xs, c.e), ty: E.sort(lvl) };
    });
  }
  elabExists(stx) {
    const build = (i) => {
      const b = stx.binders[i];
      const ty = b.type ? this.elabType(b.type).e : this.newTypeMeta();
      const T = instMVars(ty, this.st);
      return this.withLocal(b.name, T, 'default', x => {
        const body = i + 1 === stx.binders.length ? this.elab(stx.body, PROP, false) : build(i + 1);
        this.ensureHasType(PROP, body, stx.body, false);
        const lam = this.mkLambdaFVars([x], body.e);
        const u = ensureSortOf(this.infer(T), this.st);
        const e = mkApps(E.cnst('Exists', [u]), [instMVars(T, this.st), lam]);
        return { e, ty: PROP };
      });
    };
    return build(0);
  }

  // ---------------------------------------------------------- applications
  elabConstApp(name, argStxs, expected, soft, stx) {
    const f = this.mkConst(name);
    return this.elabAppArgs(f, argStxs.map(a => ({ val: a })), expected, soft, false, null, stx, name);
  }
  resolveHead(stx) {
    // returns {r:{e,ty}, fields:[...], explicit}
    if (stx.t === 'explicit') {
      const loc = this.lookupLocal(stx.name);
      if (loc) return { r: { e: loc, ty: fvDecl(loc.id).type }, fields: [], explicit: true };
      if (!this.st.env.has(stx.name)) throw new ElabError("unknown identifier '" + stx.name + "'", stx.pos);
      return { r: this.mkConst(stx.name), fields: [], explicit: true, constName: stx.name };
    }
    if (stx.t === 'proj') {
      const base = this.elab(stx.e, null, false);
      return { r: base, fields: [stx.field], explicit: false, pos: stx.pos };
    }
    if (stx.t !== 'ident') return { r: this.elab(stx, null, false), fields: [], explicit: false };
    const name = stx.name;
    const loc = this.lookupLocal(name);
    if (loc) return { r: { e: loc, ty: fvDecl(loc.id).type }, fields: [] };
    if (this.st.env.has(name)) return { r: this.mkConst(name), fields: [], constName: name };
    const parts = name.split('.');
    for (let k = parts.length - 1; k >= 1; k--) {
      const pre = parts.slice(0, k).join('.');
      const l = this.lookupLocal(pre);
      if (l) return { r: { e: l, ty: fvDecl(l.id).type }, fields: parts.slice(k) };
      if (this.st.env.has(pre)) return { r: this.mkConst(pre), fields: parts.slice(k), constName: pre };
    }
    const hint = HINT_NAMES[name] ? ' (' + HINT_NAMES[name] + ')' : '';
    throw new ElabError("unknown identifier '" + name + "'" + hint, stx.pos);
  }
  elabApp(fnStx, args, expected, soft) {
    const h = this.resolveHead(fnStx);
    let base = h.r;
    const fields = h.fields;
    for (let i = 0; i < fields.length; i++) {
      const last = i === fields.length - 1;
      base = this.elabField(base, fields[i], last ? args : [], last ? expected : null, last ? soft : false, fnStx);
    }
    if (fields.length) return base;
    return this.elabAppArgs(base, args, expected, soft, !!h.explicit, null, fnStx, h.constName);
  }
  elabField(base, field, args, expected, soft, stx) {
    const tryHead = (ty) => {
      const hd = getAppFn(ty);
      if (hd.k !== 'const') return null;
      let fname;
      if (/^[0-9]+$/.test(field)) {
        const fs = STRUCT_FIELDS[hd.name];
        const i = parseInt(field, 10) - 1;
        if (!fs) return { err: 'invalid projection: `.' + field + '` needs a structure such as ∧ or ↔, but the type is\n  ' + this.pp(ty) + (hd.name === 'Exists' ? '\n(∃ is not a structure here: use `obtain ⟨w, h⟩ := …`, `.elim` or `Exists.elim`)' : '') };
        if (i < 0 || i >= fs.length) return { err: 'invalid projection: ' + hd.name + ' has only ' + fs.length + ' fields' };
        fname = hd.name + '.' + fs[i];
      } else fname = hd.name + '.' + field;
      if (!this.st.env.has(fname)) return null;
      return { fname, head: hd.name };
    };
    const ty0 = instMVars(base.ty, this.st);
    let info = tryHead(ty0);
    if (!info || info.err) {
      const w = this.whnf(ty0);
      const info2 = tryHead(w);
      if (info2 && !info2.err) info = info2;
      else if (!info) info = info2;
    }
    if (!info) {
      const hd = getAppFn(this.whnf(ty0));
      throw new ElabError("invalid field '" + field + "': " + (hd.k === 'const' ? "there is no '" + hd.name + '.' + field + "' in this studio" : 'the type\n  ' + this.pp(ty0) + '\nis not of the form (C ...)'), stx.pos);
    }
    if (info.err) throw new ElabError(info.err, stx.pos);
    const f = this.mkConst(info.fname);
    return this.elabAppArgs(f, args, expected, soft, false, { e: base.e, ty: base.ty, head: info.head }, stx, info.fname);
  }
  isPostponable(stx) {
    return stx.t === 'fun' || stx.t === 'anon' || stx.t === 'hole' || stx.t === 'shole' || stx.t === 'by' || stx.t === 'subst';
  }
  elabAppArgs(f, args, expected, soft, explicit, selfArg, stx, fname) {
    let e = f.e, ty = f.ty;
    const positional = args.filter(a => !a.named).map(a => a.val);
    const named = new Map(args.filter(a => a.named).map(a => [a.named, a]));
    const postponed = [];
    const handleArg = (argStx, dom, binderName) => {
      const domI = instMVars(dom, this.st);
      if (this.isPostponable(argStx) && hasUnassignedMVar(domI, this.st) &&
          !(argStx.t === 'fun' && this.whnf(domI).k === 'pi')) {
        const m = this.newMeta(domI);
        postponed.push({ m, stx: argStx, dom: domI });
        return m;
      }
      const r = this.elab(argStx, domI, false);
      if (!this.defeq(r.ty, domI)) throw this.appMismatch(e, r, domI, argStx);
      return r.e;
    };
    // Propagate the expected type first (as Lean does) when the result type
    // does not depend on the explicit arguments.
    const reuse = [];
    if (expected && !soft && !explicit) {
      const snap = this.st.snapshot();
      let t = ty, nPos = positional.length, ok = true;
      const dummies = [];
      let self = !!selfArg;
      for (let guard = 0; guard < 64; guard++) {
        let w = instMVars(t, this.st);
        if (w.k !== 'pi') w = this.whnf(w);
        if (w.k !== 'pi') break;
        let m;
        if (named.has(w.name)) { m = this.st.newMVar(instMVars(w.ty, this.st), this.lctx, 'natural'); dummies.push(m.id); reuse.push(null); }
        else if (self && w.bi === 'default' && headConstName(this, w.ty) === selfArg.head) { m = selfArg.e; self = false; reuse.push(null); }
        else if (w.bi !== 'default') { m = this.newMeta(instMVars(w.ty, this.st), w.name); reuse.push(m); }
        else { if (!nPos) break; nPos--; m = this.st.newMVar(instMVars(w.ty, this.st), this.lctx, 'natural'); dummies.push(m.id); reuse.push(null); }
        t = instantiate1(w.body, m);
      }
      const R = instMVars(t, this.st);
      if (nPos > 0 || dummies.some(id => occursMVar(id, R, this.st)) || !this.defeq(R, expected)) { this.st.restore(snap); ok = false; }
      if (!ok) reuse.length = 0;
    }
    let reuseIdx = 0;
    for (;;) {
      let tyW = instMVars(ty, this.st);
      if (tyW.k !== 'pi') tyW = this.whnf(tyW);
      if (tyW.k !== 'pi') {
        if (positional.length || named.size) {
          if (named.size && !positional.length) { const [nm, a] = [...named][0]; throw new ElabError("invalid argument name '" + nm + "'", a.pos); }
          throw new ElabError('function expected: \n  ' + this.pp(e) + '\nhas type\n  ' + this.pp(ty) + '\nso it cannot be applied to another argument', positional[0].pos, { kind: 'functionExpected' });
        }
        break;
      }
      const b = tyW;
      let arg;
      const reused = reuseIdx < reuse.length ? reuse[reuseIdx] : null;
      reuseIdx++;
      if (named.has(b.name)) {
        const a = named.get(b.name); named.delete(b.name);
        arg = handleArg(a.val, b.ty, b.name);
      } else if (selfArg && b.bi === 'default' && headConstName(this, b.ty) === selfArg.head) {
        if (!this.defeq(selfArg.ty, b.ty)) throw this.appMismatch(e, selfArg, b.ty, stx);

  checkNoNewMVars(el, e, tac, allowGoals) {

  // ------------------------------------------------------------- intro
  intro(g, names, tac) {

      if (T.k !== 'pi') T = whnf(T, this.st, true);

  // ------------------------------------------------------------- apply

  constructor_(g, tac, which) {

  }

  // ------------------------------------------------------------- closers
  assumption(g) {

      const snap = this.st.snapshot();
      let ok = false;
      try { ok = isDefEq(h.type, T, this.st); } catch (err) { ok = false; }
      if (ok) { this.assign(g, E.fvar(h.id)); return true; }

    }

  }
  rfl(g, tac) {

        const snap = this.st.snapshot();
        let ok = false;
        try { ok = isDefEq(args[1], args[2], this.st); } catch (err) { ok = false; }
        if (ok) { this.assign(g, mkApps(E.cnst('Eq.refl', hd.ls), [args[0], args[1]])); return; }
        this.st.restore(snap);
        const tr = (x) => { try { return pp(normalizeForDisplay(x, this.st), this.st); } catch (err) { return pp(x, this.st); } };

  // ------------------------------------------------------------- context edits

  }
  // replace hypothesis h (fvar id) by a new one of type T2, proved by `proof`
  replaceHyp(g, hid, T2, proof) {

  revert(g, ids, tac) {

      return { motive, M };
    });
    if (!res) this.fail("rw failed: did not find an instance of the pattern\n  " + pp(lhs, this.st) + '\nin\n  ' + pp(subject, this.st), { pos: rule.pos || tac.pos });
    eq = instMVars(eq, this.st); lhs = instMVars(lhs, this.st); rhs = instMVars(rhs, this.st);
    for (const m of collectMVars(eq, this.st, [])) if (this.st.mdecl(m).kind === 'natural') this.fail('rw: could not determine all arguments of the rewrite rule', tac);
    const motive = instMVars(res.motive, this.st);
    const newSubject = betaNorm(E.app(motive, rhs));
    const Tsort = instLevel(ensureSortOf(infer(subject, this.st, false), this.st), this.st);
    // congrArg motive eq : motive lhs = motive rhs
    const cong = mkApps(E.cnst('congrArg', [instLevel(u, this.st), Lv.succ(Tsort)]), [instMVars(alpha, this.st), E.sort(Tsort), lhs, rhs, motive, eq]);
    if (at) {
      const h = this.findHyp(g, at, tac);
      // Eq.mp cong h : new type
      const proof = mkApps(E.cnst('Eq.mp', [Tsort]), [subject, newSubject, cong, E.fvar(h.id)]);
      return this.replaceHyp(g, h.id, newSubject, proof);
    }
    const ng = this.newGoal(newSubject, d.lctx, d.userName);
    this.assign(g, mkApps(E.cnst('Eq.mpr', [Tsort]), [subject, newSubject, cong, E.mvar(ng)]));
    return ng;
  }

  // ------------------------------------------------------------- cases / induction
  majorOf(g, termStx, tac) {
    const el = this.elabIn(g);
    const r = el.elab(termStx, null, false);
    this.checkNoNewMVars(el, r.e, tac);
    return { e: instMVars(r.e, this.st), ty: instMVars(r.ty, this.st) };
  }
  casesTac(g, tac) {
    const isInd = tac.t === 'induction';
    const maj = this.majorOf(g, tac.term, tac);
    let w = whnf(maj.ty, this.st, true);
    const hd = getAppFn(w);
    const ind = hd.k === 'const' ? this.st.env.get(hd.name) : null;
    if (!ind || ind.kind !== 'ind') this.fail("'" + tac.t + "' needs a term of an inductive type, but it has type\n  " + pp(maj.ty, this.st), tac);
    if (isInd && maj.e.k !== 'fvar') this.fail("'induction' needs a variable here", tac);
    const ctors = ind.indInfo.ctors;
    const ctorShort = ctors.map(c => c.split('.').pop());
    let names = ctors.map(() => []);
    if (tac.alts) {
      for (const a of tac.alts) {
        const i = ctorShort.indexOf(a.name);
        if (i < 0) this.fail("'" + a.name + "' is not a constructor of " + hd.name + ' (the cases are: ' + ctorShort.join(', ') + ')', { pos: a.pos });
        names[i] = a.names;
      }
      for (let i = 0; i < ctors.length; i++) if (!tac.alts.some(a => a.name === ctorShort[i])) this.fail("missing alternative '| " + ctorShort[i] + " ...'", tac);
    }
    // Eq: constructor clash closes the goal; otherwise substitute
    if (hd.name === 'Eq') {
      const clash = this.discriminate(g, maj);
      if (clash) {
        if (tac.alts && tac.alts.length) this.fail('there are no cases left: the two sides start with different constructors', tac);
        this.closeWithFalse(g, clash); return [];
      }
      if (maj.e.k !== 'fvar') this.fail('cases on an equation needs a hypothesis', tac);
      const ng = this.subst(g, FV.get(maj.e.id).name, tac);
      if (tac.alts) return this.runAlternatives([ng], tac.alts);
      return [ng];
    }
    const goals = this.casesCore(g, maj, w, names, isInd, tac);
    // tag goals with constructor names
    goals.forEach((x, i) => { this.goalDecl(x).userName = ctorShort[i]; });
    if (tac.alts) {
      const out = [];
      tac.alts.forEach(a => {
        const i = ctorShort.indexOf(a.name);
        const left = this.runSeq(a.tactics, [goals[i]]);
        if (left.length) throw new TacticError('unsolved goals in case ' + a.name + '\n' + this.ppGoals(left).map(x => x.text).join('\n\n'), a.pos, left);
      });
      return out;
    }
    return goals;
  }
  runAlternatives(goals, alts) {
    for (let i = 0; i < alts.length; i++) {
      const left = this.runSeq(alts[i].tactics, [goals[i]]);
      if (left.length) throw new TacticError('unsolved goals\n' + this.ppGoals(left).map(x => x.text).join('\n\n'), alts[i].pos, left);
    }
    return [];
  }
  // Case analysis on major (with type w, whnf'd) in goal g.
  casesCore(g, maj, w, names, keepIH, tac) {
    const d = this.goalDecl(g);
    let cur = g, reverted = [];
    let major = maj.e;
    if (major.k === 'fvar') {
      // revert hypotheses that depend on the major premise
      const deps = d.lctx.filter(id => id !== major.id && hasFVar(instMVars(FV.get(id).type, this.st), major.id));
      if (deps.length) { const rv = this.revert(g, deps, tac); cur = rv.goal; reverted = rv.reverted; }
    }
    const cd = this.goalDecl(cur);
    const lctx = major.k === 'fvar' ? cd.lctx.filter(id => id !== major.id) : cd.lctx;
    const el = new Elab(this.st, cd.lctx);
    const T = this.target(cur);
    const sk = buildCasesSkeleton(el, major, w, T, names);
    const goals = [];
    let built;
    try {
      built = sk.finish((i, fs, ihs, goalTy) => {
        if (!keepIH) for (const ih of ihs) FV.get(ih.id).hidden = true;
        // inside the minor premise the major premise is gone (when it is a variable)
        const ng = this.newGoal(goalTy, el.lctx.filter(id => id !== major.id), null);
        goals.push(ng);
        return { e: E.mvar(ng), ty: null };
      });
    } catch (err) {
      if (err instanceof ElabError && err.data && err.data.kind === 'largeElim') throw new TacticError(err.message, tac.pos);
      throw err;
    }
    this.assign(cur, built.e);
    // re-introduce reverted hypotheses in each new goal
    if (reverted.length) {
      return goals.map(x => this.intro(x, reverted.map(id => FV.get(id).name), tac)[0]);
    }
    return goals;
  }
  // h : c₁ … = c₂ … with different constructors of Nat or Bool gives False,
  // by a large elimination into Prop (this is what `Nat.noConfusion` does).
  discriminate(g, maj) {
    const st = this.st;
    let w;
    try { w = whnf(instMVars(maj.ty, st), st, true); } catch (err) { return null; }
    const hd = getAppFn(w), args = getAppArgs(w);
    if (!(hd.k === 'const' && hd.name === 'Eq' && args.length === 3)) return null;
    const ctorOf = x => {
      let v = whnf(x, st, true);
      if (v.k === 'lit') v = natLitToCtor(v);
      const f = getAppFn(v);
      const c = f.k === 'const' ? st.env.get(f.name) : null;
      return c && c.kind === 'ctor' ? c : null;
    };
    const c1 = ctorOf(args[1]), c2 = ctorOf(args[2]);
    if (!c1 || !c2 || c1.name === c2.name || c1.ctorInfo.induct !== c2.ctorInfo.induct) return null;
    const ind = st.env.get(c1.ctorInfo.induct);
    const rec = st.env.get(ind.indInfo.recName);
    if (rec.lparams.length === ind.lparams.length || rec.recInfo.nparams !== 0) return null;
    const d = this.goalDecl(g);
    const el = new Elab(st, d.lctx);
    const motive = el.withLocal('k', args[0], 'default', k => {
      const sk = buildCasesSkeleton(el, k, instMVars(args[0], st), PROP, null);
      const body = sk.finish(i => ({ e: cnst(ind.indInfo.ctors[i] === c1.name ? 'True' : 'False'), ty: PROP }));
      return el.mkLambdaFVars([k], body.e);
    });
    const u = hd.ls[0];
    return mkApps(E.cnst('Eq.subst', [u]), [args[0], motive, args[1], args[2], maj.e, cnst('True.intro')]);
  }
  closeWithFalse(g, proofOfFalse) {
    const T = this.target(g);
    const lvl = instLevel(ensureSortOf(infer(T, this.st, false), this.st), this.st);
    this.assign(g, mkApps(E.cnst('False.elim', [lvl]), [T, proofOfFalse]));
  }
  rcases(g, termStx, pat, tac) {
    const maj = this.majorOf(g, termStx, tac);
    return this.rcasesOn(g, maj, pat, tac);
  }
  rcasesOn(g, maj, pat, tac) {
    // a plain name: just keep the term as a new hypothesis (or rename)
    if (!pat || pat.k === 'name') {
      if (!pat) pat = { k: 'tuple', elems: [] };
      else {
        if (maj.e.k === 'fvar') { if (pat.name !== '_') FV.get(maj.e.id).name = pat.name; return [g]; }
        const d = this.goalDecl(g);
        const x = mkFVar(pat.name === '_' ? 'h✝' : pat.name, maj.ty, 'default');
        const ng = this.newGoal(this.target(g), d.lctx.concat([x.id]), d.userName);
        this.assign(g, E.app(new Elab(this.st, d.lctx).mkLambdaFVars([x], E.mvar(ng)), maj.e));
        return [ng];
      }
    }
    if (pat.k === 'clear') return maj.e.k === 'fvar' ? [this.clear(g, maj.e.id, tac)] : [g];
    let w = whnf(maj.ty, this.st, true);
    const hd = getAppFn(w);
    const ind = hd.k === 'const' ? this.st.env.get(hd.name) : null;
    if (!ind || ind.kind !== 'ind') {
      if (pat.k === 'tuple' && pat.elems.length <= 1) return pat.elems.length ? this.rcasesOn(g, maj, pat.elems[0], tac) : [g];
      this.fail('rcases: this pattern needs an inductive type, but the term has type\n  ' + pp(maj.ty, this.st), tac);
    }
    const ctors = ind.indInfo.ctors;
    if (hd.name === 'Eq') {
      if (maj.e.k !== 'fvar') this.fail('rcases on an equation needs a hypothesis', tac);
      return [this.subst(g, FV.get(maj.e.id).name, tac)];
    }
    // alternatives per constructor
    let altPats;
    if (pat.k === 'alts') altPats = pat.alts;
    else altPats = [pat];
    if (ctors.length === 0) altPats = [];
    else if (altPats.length !== ctors.length) {
      if (ctors.length === 1) altPats = [pat];
      else if (altPats.length === 1 && pat.k === 'tuple' && pat.elems.length === 0) altPats = ctors.map(() => ({ k: 'tuple', elems: [] }));
      else this.fail('rcases: ' + hd.name + ' has ' + ctors.length + ' cases, so the pattern needs ' + ctors.length + ' alternatives separated by |', tac);
    }
    // per constructor, the fields get sub-patterns
    const names = [];
    const subPats = [];
    for (let i = 0; i < ctors.length; i++) {
      const rule = this.st.env.get(ind.indInfo.recName).recInfo.rules[i];
      let elems = altPats[i].k === 'tuple' ? altPats[i].elems.slice() : [altPats[i]];
      if (elems.length > rule.nfields && rule.nfields > 0) elems = elems.slice(0, rule.nfields - 1).concat([{ k: 'tuple', elems: elems.slice(rule.nfields - 1) }]);
      while (elems.length < rule.nfields) elems.push({ k: 'name', name: '_' });
      names.push(elems.map(p => p.k === 'name' ? p.name : '_'));
      subPats.push(elems);
    }
    const goals = this.casesCore(g, maj, w, names, false, tac);
    // recurse into nested patterns
    let out = [];
    goals.forEach((ng, i) => {
      const dd = this.goalDecl(ng);
      const k = subPats[i].length;
      const fieldIds = dd.lctx.filter(id => !FV.get(id).hidden).slice(-k);
      let cur = [ng];
      subPats[i].forEach((sp, j) => {
        if (sp.k === 'name') return;
        const id = fieldIds[j];
        const next = [];
        for (const cg of cur) {
          const fd = FV.get(id);
          next.push(...this.rcasesOn(cg, { e: E.fvar(id), ty: fd.type }, sp, tac));
        }
        cur = next;
      });
      out = out.concat(cur);
    });
    return out;
  }
}

// unfold named definitions everywhere in e (then β-reduce)
function unfoldConsts(e, names, st) {
  const go = x => {
    switch (x.k) {
      case 'const': {
        if (names.includes(x.name)) { const c = st.env.get(x.name); return instConstValue(c, x.ls); }
        return x;
      }
      case 'app': return E.app(go(x.fn), go(x.a));
      case 'lam': return E.lam(x.name, go(x.ty), go(x.body), x.bi);
      case 'pi': return E.pi(x.name, go(x.ty), go(x.body), x.bi);
    }
    return x;
  };
  return betaNorm(go(e));
}
// full normal form (for messages and the "look closer" view)
function normalizeForDisplay(e, st, fuel) {
  fuel = fuel || { n: 4000 };
  const go = x => {
    if (--fuel.n < 0) throw new KernelError('too long');
    const w = whnf(x, st, true);
    switch (w.k) {
      case 'app': return mkApps(go(getAppFn(w)), getAppArgs(w).map(go));
      case 'lam': { const v = mkFVar(w.name, w.ty, w.bi); return E.lam(w.name, go(w.ty), abstract1(go(instantiate1(w.body, v)), v.id), w.bi); }
      case 'pi': { const v = mkFVar(w.name, w.ty, w.bi); return E.pi(w.name, go(w.ty), abstract1(go(instantiate1(w.body, v)), v.id), w.bi); }
    }
    return w;
  };
  return natPretty(go(e));
}

// Langer's insights (paraphrased; short quotes are marked) and CIC notes.
const CARDS = {
  'pml-conditional': { book: 'The Power of Mindful Learning', where: 'ch. 1 and ch. 4', title: '“Could be” instead of “is”',
    text: 'Langer reports that material taught conditionally — “this could be …” — is remembered better and used more flexibly than the same material taught as absolute fact. In one study a math lesson was given as “1 plus 1 could be 2” rather than “1 plus 1 is 2”.',
    studio: 'A sketch that does not prove the goal is not marked wrong. The studio asks what it could be, and usually finds the theorem it does prove. (And 1 + 1 = 2 holds in Nat; in Fin 2, 1 + 1 = 0 — both are checked in Lean in this project.)' },
  'pml-basics': { book: 'The Power of Mindful Learning', where: 'ch. 1, “Whose Basics?”', title: 'Overlearned basics',
    text: 'Skills practised until they are automatic stop being looked at. Langer argues that basics should be learned in a way that keeps them open to change in new contexts.',
    studio: '`rfl` seems like a basic you can stop thinking about. It proves `n + 0 = n` and fails on `0 + n = n`. Why it works is the definition of +, not the look of the equation.' },
  'pml-sideways': { book: 'The Power of Mindful Learning', where: 'ch. 1, “Sideways Learning”', title: 'Sideways learning',
    text: 'Besides top-down lectures and bottom-up drill there is a third way: varying the basics while you use them, noticing differences, contexts and perspectives (her example: a cheesecake recipe used as a rough guide, not a formula).',
    studio: 'Every puzzle accepts many proofs: a term, a pattern, a recursor, tactics. Each new one is kept as a variation, and the studio shows you how the terms differ.' },
  'pml-novelty': { book: 'The Power of Mindful Learning', where: 'ch. 2, “Creative Distraction”', title: 'Soft vigilance and novelty',
    text: 'Attention is easier to keep on something that keeps changing. Langer suggests looking for what is new in a familiar object rather than staring harder at it.',
    studio: 'The Look closer lens shows the same proof three ways: as Lean prints it, with every implicit argument and universe level, and as the reduction steps the kernel performs.' },
  'pml-play': { book: 'The Power of Mindful Learning', where: 'ch. 3, “Turning Work into Play”', title: 'Work into play',
    text: 'The same task feels like play or like work depending on how it is framed. Langer questions the idea that learning has to be unpleasant now to pay off later.',
    studio: 'There are no scores, timers or hearts here, and nothing is locked.' },
  'pml-distinctions': { book: 'The Power of Mindful Learning', where: 'ch. 4, “Drawing Distinctions”', title: 'Drawing distinctions',
    text: 'Memorising a fact as a whole locks it up; noticing distinctions within it keeps it available for new uses.',
    studio: 'The “Same or different?” rounds ask the kernel whether two expressions are definitionally equal. ¬A and A → False are the same term; A → ¬B and B → ¬A are equivalent but different.' },
  'pml-present': { book: 'The Power of Mindful Learning', where: 'ch. 5, “Staying in the Present”', title: 'Staying in the present',
    text: 'Langer looks at forgetting as a sign of attention elsewhere, not only as a loss, and asks what we need to keep in mind at all.',
    studio: 'You never need to remember the goal: the infoview always shows the current state, just as in a Lean editor, and the Library is always one key away.' },
  'pml-right-answers': { book: 'The Power of Mindful Learning', where: 'ch. 7, “When Right Becomes Wrong”', title: 'The illusion of right answers',
    text: 'In a story she tells, a judge hears two quarrelling men and says “That’s right” to each, and then to a bystander who objects that they cannot both be right. The answer depends on the perspective.',
    studio: 'In the type rounds every answer that Lean considers the same type is accepted. And a move that is right in one goal (`rfl` for n + 0 = n) is wrong in another (0 + n = n).' },
  'pml-observer': { book: 'The Power of Mindful Learning', where: 'ch. 7, “Actor/Observer”', title: 'Actor and observer',
    text: 'People explain their own actions by the situation and other people’s by their character. Taking the other perspective changes what you see.',
    studio: 'In The Blank Canvas you are the observer: you read a term and say what it is. In the other rooms you are the actor who writes one.' },
  'art-mistakes': { book: 'On Becoming an Artist', where: 'ch. 4, “The Mindfulness of Mistakes”', title: 'Four ways to treat a mistake',
    text: 'Langer lists four responses to a mistake in a drawing: throw the drawing away, live with it, fix it so nothing changed, or reconsider it and take advantage of it. She tells of trying to paint over a canvas she disliked, ending up with a thin whitewash she liked better, and of asking a hospital aide “Did you make a mistake yet?” — the fun starts with the first error.',
    studio: 'When a sketch proves another theorem, you get the same four choices. Its theorem is framed in the Salon des Refusés, and “take advantage” opens it in your Studio.' },
  'art-evaluation': { book: 'On Becoming an Artist', where: 'ch. 3, “The Tyranny of Evaluation”', title: 'Events come without evaluations',
    text: '“Events do not come with evaluations; we impose evaluations on our experiences” (quoted). Good and bad are judgements we add, and they depend on the context.',

  'art-absolutes': { book: 'On Becoming an Artist', where: 'ch. 5, “The Rule of Absolutes”', title: 'Rules are made by people',
    text: 'Rules feel absolute, but people made them for particular purposes; knowing that makes it possible to use them mindfully.',
    studio: 'Many rules of Lean’s type theory are design choices: Prop is impredicative, proofs are definitionally irrelevant, ∨ and ∃ can only be taken apart to prove propositions, equality has a K-like rule. Other type theories choose differently (Agda’s universes, for example, are predicative).' },
  'art-comparison': { book: 'On Becoming an Artist', where: 'ch. 6', title: 'No social comparison',

  'art-talent': { book: 'On Becoming an Artist', where: 'ch. 7, “The Myth of Talent”', title: 'The myth of talent',

  'art-knowing': { book: 'On Becoming an Artist', where: 'ch. 8, “The Blindness of Knowing”', title: 'The blindness of knowing',
    text: 'Once we think we know what something is, we stop looking at it.',

  'art-preference': { book: 'On Becoming an Artist', where: 'ch. 9, “From Reference to Preference”', title: 'From reference to preference',

  'art-authentic': { book: 'On Becoming an Artist', where: 'ch. 2, “Becoming Authentic”', title: 'Make the copy new',

  'art-choice': { book: 'On Becoming an Artist', where: 'ch. 10, “The Mindful Choice”', title: 'Choosing',

  'cic-sorts': { book: 'CIC', where: 'Sorts', title: 'Sorts and universes',
