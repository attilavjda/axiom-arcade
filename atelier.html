    panel.appendChild(h('pre', { class: 'stmt' }, 'def f : ' + p.type + ' :=\n  ?'));
    panel.appendChild(rich('Write any term of type `' + p.type + '` whose values are:'));
    panel.appendChild(h('pre', { class: 'couldbe' }, p.tests.map(([i, o]) => 'f ' + i + ' = ' + o).join('\n')));
    const out = h('div', { class: 'result', 'aria-live': 'polite' });
    const ed = editor({
      label: 'definition of type ' + p.type, initial: S.drafts[p.id] || '',
      check: (src) => { const g = Atelier.elabStatement(ctx, p.type); return Atelier.check(ctx, g, src); },
      onChange: (v) => { S.drafts[p.id] = v; save(); },
      submit: () => run(),
    });
    panel.appendChild(ed.el);
    panel.appendChild(h('div', { class: 'row' }, btn('Run the tests', () => run(), 'btn primary')));
    panel.appendChild(out);
    gallery(panel, p);
    function run() {
      clear(out);
      const src = ed.ta.value;
      if (!src.trim()) return;
      const g = Atelier.elabStatement(ctx, p.type);
      const r = Atelier.check(ctx, g, src);
      if (!r.ok) { countMistake(); if (r.kind === 'mistake') showMistake(out, r, { ctxSrc, goalText: p.type, from: p.id, editor: ed }); else showError(out, r, ed); return; }
      const rows = []; let all = true;
      for (const [i, o] of p.tests) {
        let val = '?', good = false;
        try { val = Atelier.reduceTrace(ctx, '(' + src + ') ' + i, { accel: true, max: 400 }).normal; good = Atelier.check(ctx, Atelier.elabStatement(ctx, '(' + src + ') ' + i + ' = ' + o), 'rfl').ok; }
        catch (e) { val = e.message; }
        if (!good) all = false;
        rows.push(h('li', { class: good ? 'pass' : 'diff' }, h('code', { text: 'f ' + i + '  ⟶  ' + val }), good ? '  ✓' : '  (wanted ' + o + ')'));
      }
      if (all) {
        const rec = recordSolution(p.id, src, r.key);
        out.appendChild(h('div', { class: 'okbox' }, h('h3', { text: rec.isNew ? 'A function that fits — number ' + solvedList(p.id).length + '.' : 'You found this one before.' }), h('ul', null, rows),
          rich('Many different functions fit three values. Try another one: with `*`, with `Nat.rec`, with `+`…')));
      } else {
        countMistake();
        out.appendChild(h('div', { class: 'salonbox' }, h('div', null, h('h3', { text: 'A different function — maybe for a different picture.' }), h('ul', null, rows),
          rich('This is a perfectly good function of type `' + p.type + '`. It just paints other values.'))));
      }
      gallery(panel, p, true);
    }
    work = { p, ed, frameIt: run, result: out };
  }

  // ---------------------------------------------------------------- notebook
  function renderNotebook(view) {
    app.appendChild(h('h1', { text: 'Notebook' }));
    app.appendChild(rich('Notes from Ellen Langer\'s The Power of Mindful Learning and On Becoming an Artist (paraphrased; short quotations are marked), and notes on the Calculus of Inductive Constructions. Each says how the idea shows up in the atelier. Cards you have met in the rooms are marked ✦; all of them are open.'));
    const groups = [['The Power of Mindful Learning', 'pml-'], ['On Becoming an Artist', 'art-'], ['The Calculus of Inductive Constructions', 'cic-']];
    for (const [title, pre] of groups) {
      app.appendChild(h('h2', { text: title }));
      const g = h('div', { class: 'cardgrid' });
      for (const id of Object.keys(CARDS).filter(k => k.startsWith(pre))) {
        const c = CARDS[id];
        const art = h('article', { class: 'card' + (view && view.card === id ? ' focus' : ''), id: 'card-' + id, tabindex: '-1' },
          h('h3', null, (S.seenCards.indexOf(id) >= 0 ? '✦ ' : '') + c.title),
          h('p', { class: 'where', text: c.book === 'CIC' ? c.where : c.book + ', ' + c.where }),
          rich(c.text), h('p', { class: 'inatelier' }, h('strong', { text: 'In the atelier: ' }), rich(c.studio, 'span')));
        g.appendChild(art);
        if (view && view.card === id && art.focus) later(() => { try { art.focus(); if (art.scrollIntoView) art.scrollIntoView(); } catch (e) { /* ignore */ } }, 0);
      }
      app.appendChild(g);
    }
    if (view && view.card) markCard(view.card);
  }

  // ---------------------------------------------------------------- library
  function preludeSource(name) { const d = PRELUDE.find(x => x.name === name); return d && d.value ? d.value : null; }
  function renderLibrary() {
    app.appendChild(h('h1', { text: 'Library' }));
    app.appendChild(rich('Everything the kernel knows: inductive types with their constructors and recursors, and definitions and theorems built from them. These are the names you can use in proofs. (Lean\'s real library is much larger; these behave the same way.)'));
    const env = Atelier.env();
    const filter = h('input', { type: 'search', class: 'answer', placeholder: 'filter by name, e.g. Nat or Eq', 'aria-label': 'filter the library' });
    const list = h('div', { class: 'lib' });
    function fill() {
      clear(list);
      const q = (filter.value || '').trim().toLowerCase();
      for (const name of env.order) {
        if (q && name.toLowerCase().indexOf(q) < 0) continue;
        const c = env.get(name);
        const kind = { ind: 'inductive', ctor: 'constructor', rec: 'recursor', def: 'def', thm: 'theorem' }[c.kind] || c.kind;
        const lv = c.lparams && c.lparams.length ? '.{' + c.lparams.join(', ') + '}' : '';
        const src = preludeSource(name);
        const more = h('div', { class: 'libmore' });
        list.appendChild(h('div', { class: 'libitem k-' + c.kind },
          h('span', { class: 'lk', text: kind }), ' ', h('code', { class: 'ln', text: name + lv }), h('code', { class: 'lt', text: ' : ' + Atelier.ppIn(c.type) }),
          src ? btn('Look closer', () => { clear(more); more.appendChild(h('pre', { class: 'couldbe' }, (c.kind === 'def' ? 'def ' : 'theorem ') + name + ' :=\n  ' + src)); }, 'btn small') : null,
          more));
      }
    }
    filter.oninput = fill;
    app.appendChild(filter);
    app.appendChild(list);
    fill();
  }

  // ---------------------------------------------------------------- studio
  function renderStudio(view) {
    app.appendChild(h('h1', { text: 'Studio' }));
    app.appendChild(rich('Your own theorems. State anything, prove it any way you like. Sketches taken from the Salon des Refusés arrive here with the theorem they prove.'));
    const ctxIn = h('input', { type: 'text', class: 'answer wide', 'aria-label': 'variables', spellcheck: 'false', value: '' });
    ctxIn.value = view.ctx !== undefined ? view.ctx : '(A B C : Prop) (P Q : Nat → Prop) (n m : Nat)';
    const stmtIn = h('input', { type: 'text', class: 'answer wide', 'aria-label': 'statement', spellcheck: 'false', value: '' });
    stmtIn.value = view.stmt || 'A ∧ B → A';
    ctxIn.oninput = () => { expandAbbrev(ctxIn, false); ed.refresh(); };
    stmtIn.oninput = () => { expandAbbrev(stmtIn, false); ed.refresh(); };
    const status = h('p', { class: 'small', 'aria-live': 'polite' });
    function current() {
      try {
        const ctx = Atelier.makeContext(ctxIn.value);
        const g = Atelier.elabStatement(ctx, stmtIn.value);
        status.textContent = g.isProp ? 'A proposition — prove it.' : 'A type of data — any term of this type will do.';
        return { ctx, g };
      } catch (e) { status.textContent = 'The statement cannot be read yet: ' + e.message; return null; }
    }
    const result = h('div', { class: 'result', 'aria-live': 'polite' });
    const ed = editor({
      label: 'proof in the studio', initial: view.src || '',
      check: (src) => { const c = current(); if (!c) return { kind: 'error', message: status.textContent }; return Atelier.check(c.ctx, c.g, src); },
      initialGoal: () => { const c = current(); return c ? Atelier.initialGoal(c.ctx, c.g) : null; },
      submit: () => frameIt(),
    });
    app.appendChild(h('div', { class: 'studioform' },
      h('label', null, 'variables ', ctxIn), h('label', null, 'theorem : ', stmtIn), status));
    app.appendChild(ed.el);
    app.appendChild(h('div', { class: 'row' }, btn('Frame it', () => frameIt(), 'btn primary')));
    app.appendChild(result);
    const works = h('div', { class: 'gallery' });
    app.appendChild(works);
    function fillWorks() {
      clear(works);
      if (!S.studio.length) return;
      works.appendChild(h('h2', { text: 'Your works' }));
      const row = h('div', { class: 'thumbs' });
      S.studio.forEach((w, k) => {
        const c = canvas(96, 64, 'painting of ' + w.stmt);
        const g = ctx2d(c); if (g) Paint.paint(g, 'studio:' + w.stmt, w.key, { scale: 2 });
        row.appendChild(h('figure', { class: 'thumb' }, c, h('figcaption', null, h('code', { text: w.stmt })),
          btn('open', () => go({ name: 'studio', ctx: w.ctx, stmt: w.stmt, src: w.src }), 'btn small'),
          btn('remove', () => { S.studio.splice(k, 1); save(); fillWorks(); }, 'btn small')));
      });
      works.appendChild(row);
    }
    fillWorks();
    function frameIt() {
      clear(result);
      const c = current();
      if (!c) { countMistake(); result.appendChild(h('pre', { class: 'msg' }, status.textContent)); return; }
      const src = ed.ta.value;
      if (!src.trim()) return;
      const r = Atelier.check(c.ctx, c.g, src);
      if (r.ok) {
        const exists = S.studio.find(w => w.stmt === stmtIn.value && w.ctx === ctxIn.value && w.key === r.key);
        if (!exists) { S.studio.push({ ctx: ctxIn.value, stmt: stmtIn.value, src, key: r.key }); save(); }
        const cv = canvas(192, 128, 'painting of your theorem'); const g = ctx2d(cv);
        if (g) { Paint.frame(g, 8, 8, 176, 112, true); Paint.paint(g, 'studio:' + stmtIn.value, r.key, { w: 44, h: 28, scale: 4, x: 8, y: 8 }); }
        result.appendChild(h('div', { class: 'proofbox' }, cv, h('div', null, h('h3', { text: exists ? 'Already in your works.' : 'Framed and hung in your works.' }),
          rich('`' + stmtIn.value + '` — checked by the kernel.'))));
        result.appendChild(lens(r));
        fillWorks();
      } else if (r.kind === 'mistake') { countMistake(); showMistake(result, r, { ctxSrc: ctxIn.value, goalText: stmtIn.value, editor: ed }); }
      else { countMistake(); showError(result, r, ed); }
    }
    work = { ed, frameIt, result, ctxIn, stmtIn };
  }

  // ---------------------------------------------------------------- salon
  function renderSalon() {
    app.appendChild(h('h1', { text: 'Salon des Refusés' }));
    app.appendChild(rich('In 1863 the paintings rejected by the official Paris Salon were shown in a salon of their own. Here hang the sketches that did not prove what they were meant to prove — each next to the theorem it does prove.'));
    if (!S.refuses.length) { app.appendChild(rich('The walls are bare. When a sketch turns out to prove something else, choose “Live with it” or “Take advantage of it” and it will hang here.')); return; }
    const grid = h('div', { class: 'salon' });
    S.refuses.forEach((e, k) => {
      const c = canvas(144, 96, 'painting of ' + e.typeText);
      const g = ctx2d(c); if (g) { Paint.frame(g, 8, 8, 128, 80, true); Paint.paint(g, e.typeText, e.key || e.typeText, { w: 64, h: 40, scale: 2, x: 8, y: 8, refuse: true }); }
      grid.appendChild(h('figure', { class: 'refuse' }, c,
        h('figcaption', null,
          h('code', { class: 'src', text: e.src }),
          rich('meant for `' + e.goal + '`', 'p'),
          rich((e.isProp === false ? 'is a term of type ' : 'proves ') + '`' + e.typeText + '`', 'p'),
          h('div', { class: 'row' },
            btn('Take advantage of it', () => go({ name: 'studio', ctx: e.ctx, stmt: e.typeText, src: e.src }), 'btn small'),
            e.from ? btn('Back to its room', () => { const r = roomOf[e.from]; go({ name: 'room', room: r.id, i: r.puzzles.findIndex(q => q.id === e.from) }); }, 'btn small') : null,
            btn('Throw it out', () => { S.refuses.splice(k, 1); save(); go({ name: 'salon' }); }, 'btn small')))));
    });
    app.appendChild(grid);
  }

  // ---------------------------------------------------------------- boot
  renderCounter();
  go(S.view && S.view.name ? S.view : { name: 'map' });
  return { get state() { return S; }, go, get work() { return work; }, expandAbbrev, goalsAt, reset() { S = fresh(); save(); renderCounter(); go({ name: 'map' }); } };
})();
if (typeof window !== 'undefined') window.AtelierUI = AtelierUI;
document.getElementById('reset').onclick = () => { if (typeof confirm !== 'function' || confirm('Forget all paintings, drafts and notes in this browser?')) AtelierUI.reset(); };
</script>
</body>
</html>
