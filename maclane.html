"use strict";

      arrow(s[0] + ox, s[1] + oy, t[0] + ox, t[1] + oy, e.col, e.dash, 8);
      if (e.label) { var mx = (s[0] + t[0]) / 2, my = (s[1] + t[1]) / 2 - 8; text(e.label, mx, my, e.col, "c"); } });
    p.nodes.forEach(function (nd, i) { var q = pos(i); chip(q[0], q[1], nd.label, "#e9e2cc"); });
  }
  function drawPicture(pic) { bg(); if (!pic || pic.type === "none") { drawNone(); return; } if (pic.type === "sets") drawSets(pic); else drawGraph(pic); }
  function drawNone() { var w = C.WORLDS[S.world]; for (var i = 0; i < 9; i++) { var x = 40 + i * 30, y = 80 + Math.round(18 * Math.sin(i * 1.3 + S.roundNo)); chip(x, y, i % 2 ? "→" : "★", w.col); } text("ELEMENTS ARE OPTIONAL", 160, 130, "#8c86b0", "c"); }
  function drawTitle() { bg(); var cols = ["#6fa8dc", "#6cc28a", "#c38be0", "#f2c14e", "#e0605a"];
    var pts = [[60, 60], [130, 34], [200, 62], [260, 36], [160, 116]];
    [[0, 1], [1, 2], [2, 3], [0, 4], [4, 2], [1, 4]].forEach(function (e, i) { arrow(pts[e[0]][0], pts[e[0]][1], pts[e[1]][0], pts[e[1]][1], cols[i % 5], i > 3, 8); });
    pts.forEach(function (p, i) { chip(p[0], p[1], "abcde"[i], cols[i]); });
    text("ARROW ATLAS", 160, 140, "#f2c14e", "c"); text("MAC LANE §I.1-5", 160, 150, "#8c86b0", "c"); }
  function drawMap() { bg(); var pts = [[50, 110], [110, 50], [170, 105], [230, 48], [285, 110]];
    for (var i = 0; i + 1 < pts.length; i++) arrow(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], "#3b3760", true, 18);
    C.WORLDS.forEach(function (w, i) { var p = pts[i]; rect(p[0] - 16, p[1] - 10, 33, 21, "#000"); rect(p[0] - 15, p[1] - 9, 31, 19, w.col);
      for (var k = 0; k < 4; k++) rect(p[0] - 12 + k * 7, p[1] - 6 + (k % 2) * 6, 3, 3, "#101820");
      text(String(i + 1), p[0], p[1] + 14, S.done[w.id] ? "#f2c14e" : "#e9e2cc", "c"); if (S.done[w.id]) text("★", p[0] + 18, p[1] - 14, "#f2c14e"); });
    text("ALL ISLANDS ARE OPEN. START ANYWHERE.", 160, 8, "#8c86b0", "c"); }

  // ------------------------------------------------------------------ DOM helpers
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function btn(label, role, fn, cls) { var b = el("button", "btn" + (cls ? " " + cls : ""), label); b.setAttribute("data-role", role); b.onclick = function () { fn(); render(); }; return b; }
  function canvas(drawFn) { var c = el("canvas", "screen"); c.width = W; c.height = H; ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false; drawFn(); return c; }

  // ------------------------------------------------------------------ game flow
  function startWorld(i) { S.world = i; S.roundNo = 0; S.order = E.shuffle(E.range(C.WORLDS[i].gens.length)); S.screen = "round"; newRound(); }
  function newRound(kindGen) { var w = C.WORLDS[S.world], g = kindGen || w.gens[S.order[S.roundNo % S.order.length]];
    S.round = g(); S.vals = {}; S.answered = false; S.verdict = null; S.lens = "elements"; S.flip = false; S.perm = null;
    if (S.round.widget.type === "cells") S.round.widget.groups.forEach(function (gr) { gr.cells.forEach(function (c) { S.vals[c.id] = c.v; }); });
    S.seen[S.round.kind] = (S.seen[S.round.kind] || 0) + 1; }
  function submit(id) { if (S.answered) return; var v = S.round.check(S.vals, id || "submit"); S.verdict = v; S.answered = true; S.answers++;
    if (!v.ok) S.notebook.push({ kind: S.round.title, world: C.WORLDS[S.world].name, msg: v.msg, could: v.could || "", gen: S.round.kind });
    save(); }
  function next() { S.roundNo++; if (S.roundNo === C.ROUNDS_PER_WORLD) { S.done[C.WORLDS[S.world].id] = true; save(); S.screen = "cleared"; return; } newRound(); }
  function redraw() { S.flip = !S.flip; var p = S.round.live ? S.round.live(S.vals) : S.round.pic; if (p && p.type === "graph") S.perm = E.shuffle(E.range(p.nodes.length)); }

  // ------------------------------------------------------------------ screens
  function header(root) { var top = el("div", "top"); top.appendChild(el("span", "logo", "ARROW ATLAS"));
    top.appendChild(btn("MAP", "map", function () { S.screen = "map"; }));
    top.appendChild(btn("CODEX", "codex", function () { S.screen = "codex"; }));
    top.appendChild(btn("NOTEBOOK (" + S.notebook.length + ")", "notebook", function () { S.screen = "notebook"; }));
    root.appendChild(top); }
  function titleScreen(root) { var p = el("div", "panel title"); p.appendChild(el("h1", "", "ARROW ATLAS"));
    p.appendChild(el("div", "sub", "A PIXEL TOUR OF MAC LANE, CATEGORIES FOR THE WORKING MATHEMATICIAN, §I.1–I.5"));
    p.appendChild(canvas(drawTitle));
    p.appendChild(el("p", "", "Five islands, one per section: axioms, categories, functors, natural transformations, and monics, epis and zeros. There is no score, no timer and no lives. A wrong answer gets a COULD BE: the context in which it would be right."));
    p.appendChild(el("p", "small", "Ideas from Ellen Langer, The Power of Mindful Learning: conditional ('could be') teaching, novelty, many right answers, and noticing new things."));
    p.appendChild(btn("START", "start", function () { S.screen = "map"; }, "big")); root.appendChild(p); }
  function mapScreen(root) { var p = el("div", "panel"); p.appendChild(el("h2", "", "THE ATLAS")); p.appendChild(canvas(drawMap));
    var g = el("div", "worlds");
    C.WORLDS.forEach(function (w, i) { var c = el("div", "world"); c.setAttribute("data-role", "world-" + i); c.onclick = function () { startWorld(i); render(); };
      c.appendChild(el("div", "wname", (i + 1) + ". " + w.name + (S.done[w.id] ? " ★" : ""))); c.appendChild(el("div", "wch", w.sec)); c.appendChild(el("div", "wmu", w.myth)); g.appendChild(c); });
    p.appendChild(g); root.appendChild(p); }
  function roundScreen(root) { var r = S.round, w = C.WORLDS[S.world], p = el("div", "panel");
    p.appendChild(el("h2", "", w.name + " · " + r.title + " · ROUND " + (S.roundNo + 1)));
    p.appendChild(el("div", "small", w.sec));
    p.appendChild(el("div", "prompt", r.prompt));
    var pic = r.live ? r.live(S.vals) : r.pic; p.appendChild(canvas(function () { drawPicture(pic); }));
    if (r.table) { var t = el("table", "tbl"), tr = el("tr"); tr.appendChild(el("th", "", r.table.corner)); r.table.cols.forEach(function (c) { tr.appendChild(el("th", "", c)); }); t.appendChild(tr);
      r.table.rows.forEach(function (rw, i) { var row = el("tr"); row.appendChild(el("th", "", rw)); r.table.cols.forEach(function (c, j) { row.appendChild(el("td", "", r.table.cell(i, j))); }); t.appendChild(row); });
      p.appendChild(t); }
    var wd = r.widget, area = el("div", "widget");
    if (wd.type === "choice") { var opts = el("div", "opts"); wd.choices.forEach(function (c) { var b = btn(c.label, "choice-" + c.id, function () { submit(c.id); }, S.answered && S.verdict && S.verdict.pick === c.id ? "on" : ""); opts.appendChild(b); }); area.appendChild(opts); }
    else { wd.groups.forEach(function (gr) { var row = el("div", "row"); row.appendChild(el("span", "glabel", gr.label));
        gr.cells.forEach(function (c) { var b = btn(c.label + ":" + c.values[S.vals[c.id]], "cell-" + c.id, function () { if (S.answered || c.fixed) return; S.vals[c.id] = (S.vals[c.id] + 1) % c.values.length; }, (c.fixed ? "fixed" : "") + (c.values.length === 2 && S.vals[c.id] === 1 ? " on" : "")); row.appendChild(b); });
        area.appendChild(row); });
      var br = el("div", "row"); br.appendChild(btn("SUBMIT", "submit", function () { submit("submit"); }, "big")); wd.buttons.forEach(function (b) { br.appendChild(btn(b.label, "btn-" + b.id, function () { submit(b.id); })); }); area.appendChild(br); }
    p.appendChild(area);
    var tools = el("div", "row"); tools.appendChild(btn("REDRAW", "redraw", redraw)); tools.appendChild(btn("ANOTHER VIEW", "another", function () { newRound(C.KINDS[r.kind]); })); p.appendChild(tools);
    if (S.answered) { var v = S.verdict, out = el("div", "verdict " + (v.ok ? "good" : "slip"));
      out.appendChild(el("div", "vline", (v.ok ? "YES. " : "NOT YET. ") + v.msg)); if (!v.ok && v.could) out.appendChild(el("div", "could", v.could));
      var tabs = el("div", "tabs"); [["elements", "ELEMENTS"], ["arrows", "ARROWS"], ["book", "BOOK"]].forEach(function (l) { tabs.appendChild(btn(l[1], "lens-" + l[0], function () { S.lens = l[0]; }, S.lens === l[0] ? "on" : "")); });
      out.appendChild(tabs); out.appendChild(el("div", "lens", r.views[S.lens])); out.appendChild(el("div", "notice", "NOTICE: " + r.notice));
      var nr = el("div", "row"); nr.appendChild(btn("NEXT", "next", next, "big"));
      nr.appendChild(btn(v.ok && r.allowRetry ? "FIND ANOTHER ANSWER" : "TRY AGAIN", "retry", function () { S.answered = false; S.verdict = null; }));
      out.appendChild(nr); p.appendChild(out); }
    root.appendChild(p); }
  function clearedScreen(root) { var w = C.WORLDS[S.world], p = el("div", "panel title"); p.appendChild(el("h1", "", "★ " + w.name + " ★"));
    p.appendChild(el("p", "", "You have walked through " + w.sec + ". Nothing was unlocked, because nothing was locked."));
    p.appendChild(el("p", "small", "Round kinds seen so far: " + Object.keys(S.seen).length + " of " + Object.keys(C.KINDS).length + ". Slips in your notebook: " + S.notebook.length + "."));
    var row = el("div", "row"); row.appendChild(btn("KEEP PLAYING HERE", "keep", function () { S.screen = "round"; newRound(); })); row.appendChild(btn("BACK TO THE MAP", "map2", function () { S.screen = "map"; })); p.appendChild(row); root.appendChild(p); }
  function codexScreen(root) { var p = el("div", "panel"); p.appendChild(el("h2", "", "CODEX: SEVEN MYTHS, AND WHAT THIS GAME DOES INSTEAD"));
    p.appendChild(el("div", "small", "From Ellen J. Langer, The Power of Mindful Learning (the seven myths of the Introduction)."));
    C.CODEX.myths.forEach(function (m, i) { var d = el("div", "myth"); d.appendChild(el("div", "mq", (i + 1) + ". " + m.myth)); d.appendChild(el("div", "ma", "→ " + m.game)); p.appendChild(d); });
    p.appendChild(el("h2", "", "FIVE MINDFUL STATES"));
    C.CODEX.states.forEach(function (s, i) { p.appendChild(el("div", "ma", "• " + s + ": " + C.CODEX.stateGame[i])); });
    p.appendChild(el("h2", "", "THE ISLANDS"));
    C.WORLDS.forEach(function (w) { p.appendChild(el("div", "ma", w.name + " (" + w.sec + "): " + w.myth)); });
    root.appendChild(p); }
  function notebookScreen(root) { var p = el("div", "panel"); p.appendChild(el("h2", "", "NOTEBOOK"));
    p.appendChild(el("div", "small", "Slips are kept here, not counted against you. Each one names a context where your answer would be right. REVISIT gives a fresh instance of the same kind."));
    if (!S.notebook.length) p.appendChild(el("p", "", "No slips yet. Try a COULD BE on purpose: pick an answer you think is wrong and see where it would be right."));
    S.notebook.slice(-20).reverse().forEach(function (n, i) { var d = el("div", "myth"); d.appendChild(el("div", "mq", n.world + " · " + n.kind)); d.appendChild(el("div", "ma", n.msg)); if (n.could) d.appendChild(el("div", "could", n.could));
      d.appendChild(btn("REVISIT", "revisit-" + i, function () { var wi = C.WORLDS.findIndex(function (w) { return w.gens.some(function (g) { return g === C.KINDS[n.gen]; }); }); S.world = wi < 0 ? 0 : wi; S.order = E.range(C.WORLDS[S.world].gens.length); S.screen = "round"; newRound(C.KINDS[n.gen]); })); p.appendChild(d); });
    root.appendChild(p); }

  function render() { var root = document.getElementById("app"); root.innerHTML = ""; if (S.screen !== "title") header(root);
    ({ title: titleScreen, map: mapScreen, round: roundScreen, cleared: clearedScreen, codex: codexScreen, notebook: notebookScreen })[S.screen](root); }
  // remember which choice was picked (for highlighting)
  var _submit = submit; submit = function (id) { _submit(id); if (S.verdict) S.verdict.pick = id; };
  render();
  return { state: S, render: render, submit: function (id) { submit(id); render(); } };
})();
