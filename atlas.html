<title>Proof Atlas — a pixel game about the proofs of this project</title>

<style>
:root {

  --codefont: "JuliaMono", "DejaVu Sans Mono", "Menlo", "Consolas", monospace;
  --track: 0.02em; --lh: 1.55; --caps: uppercase;
}
html { font-size: calc(16px * var(--scale)); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: var(--lh);
       letter-spacing: var(--track); }
body.theme-light { --bg: #f7f3e3; --panel: #fffdf4; --panel2: #efe8cf; --ink: #1d1a2e; --muted: #4b4566;
       --accent: #7a4d00; --good: #0b6b2e; --warn: #8a4600; --stop: #a3002a; --file: #004f8c; --line: #1d1a2e;
       --code: #ffffff; --codeink: #1d1a2e; --hl: #ffe9a8; }
body.theme-contrast { --bg: #000; --panel: #000; --panel2: #111; --ink: #fff; --muted: #fff; --accent: #ffff00;
       --good: #00ff66; --warn: #ffcc00; --stop: #ff6680; --file: #66ccff; --line: #fff; --code: #000;
       --codeink: #fff; --hl: #333300; }
body.readable { --font: "Atkinson Hyperlegible", "Verdana", "Tahoma", "Arial", sans-serif; --track: 0.06em;
       --lh: 1.8; --caps: none; word-spacing: 0.12em; }
* { box-sizing: border-box; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
       clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--accent); color: #000; padding: 8px 12px;
       z-index: 10; }
.skip:focus { top: 8px; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
header.top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
       background: var(--panel); border-bottom: 4px solid var(--line); }
header.top .brand { font-weight: bold; margin-right: auto; display: flex; align-items: center; gap: 8px;
       text-transform: var(--caps); }
nav.top { display: flex; flex-wrap: wrap; gap: 6px; }
button, .btn { font: inherit; letter-spacing: inherit; color: var(--ink); background: var(--panel2);
       border: 0; padding: 10px 14px; min-height: 44px; min-width: 44px; cursor: pointer; text-align: left;
       box-shadow: 0 -3px 0 0 var(--line) inset, 3px 0 0 0 var(--line) inset, -3px 0 0 0 var(--line) inset,
                   0 3px 0 0 var(--line) inset; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { background: var(--hl); }
button[aria-pressed="true"], button[aria-selected="true"], button[aria-checked="true"] {
       background: var(--accent); color: #000; }
body.theme-light button[aria-pressed="true"], body.theme-light button[aria-selected="true"],
body.theme-light button[aria-checked="true"] { color: #fff; }
button:disabled { opacity: 0.55; cursor: default; }
kbd { font-family: var(--font); border: 2px solid var(--muted); padding: 0 4px; font-size: 0.85em; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
main:focus { outline: none; }
h1, h2, h3 { line-height: 1.25; }
h1 { font-size: 1.6rem; text-transform: var(--caps); letter-spacing: 0.06em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p, li { max-width: 72ch; }
.muted { color: var(--muted); }
.panel { background: var(--panel); padding: 14px; margin: 12px 0;
       box-shadow: 0 0 0 4px var(--line), 6px 6px 0 4px var(--line); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.tile { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px; }
.tile .t-name { font-weight: bold; display: block; }
.tile .t-sub { display: block; color: var(--muted); font-size: 0.9rem; }
canvas.sprite { image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
.stamps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 0.8rem; }
.stamp { padding: 1px 6px; border: 2px solid var(--muted); }
.stamp.on { border-color: var(--good); color: var(--good); }
pre.lean { background: var(--code); color: var(--codeink); padding: 10px 12px; overflow-x: auto; margin: 8px 0;
       font-family: var(--codefont); font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap;
       box-shadow: 0 0 0 3px var(--line); }
.words { font-size: 0.9rem; color: var(--muted); margin: 4px 0 10px; }
.words.hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
ol.proof { list-style: none; padding: 0; margin: 8px 0; background: var(--code); box-shadow: 0 0 0 3px var(--line);
       font-family: var(--codefont); }
ol.proof li { display: flex; gap: 10px; padding: 2px 10px; max-width: none; white-space: pre-wrap; color: var(--codeink); }
ol.proof li .ln { color: var(--muted); min-width: 2.5ch; text-align: right; user-select: none; flex: none; }
ol.proof li.hl { background: var(--hl); }
ol.proof li.current { box-shadow: 4px 0 0 0 var(--accent) inset; }
ol.proof li.hidden-line .code { color: var(--muted); font-style: italic; }
ol.proof li button.linebtn { all: unset; cursor: pointer; flex: 1; white-space: pre-wrap; }
ol.proof li button.linebtn:focus-visible { outline: 3px solid var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.tabs button { text-transform: var(--caps); }
.goal { background: var(--code); color: var(--codeink); padding: 8px 10px; margin: 6px 0; white-space: pre-wrap;
       font-family: var(--codefont); box-shadow: 0 0 0 3px var(--line); }
.goal .turnstile { color: var(--accent); font-weight: bold; }
.verdict { padding: 10px 12px; margin: 10px 0; border-left: 8px solid var(--muted); background: var(--panel2); }
.verdict.file { border-color: var(--file); } .verdict.works { border-color: var(--good); }
.verdict.later { border-color: var(--warn); } .verdict.here { border-color: var(--stop); }
.verdict.ok { border-color: var(--good); } .verdict.fail { border-color: var(--stop); }
.verdict .vlabel { font-weight: bold; }
.choices { display: grid; gap: 8px; margin: 8px 0; }
.choices button { width: 100%; }
.choices button .key { display: inline-block; min-width: 2ch; font-weight: bold; color: var(--accent); }
.choices button[aria-pressed="true"] .key { color: #000; }
.cardtext { font-family: var(--codefont); }
del { text-decoration: line-through; color: var(--stop); } ins { text-decoration: underline; color: var(--good); }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--line); vertical-align: top; }
.bar { display: inline-block; height: 0.9em; background: var(--accent); vertical-align: middle; }
textarea, select, input[type=text] { font: inherit; color: var(--ink); background: var(--code); border: 3px solid var(--line);
       width: 100%; padding: 8px; min-height: 44px; }
textarea { min-height: 5em; }
fieldset { border: 3px solid var(--line); margin: 10px 0; padding: 10px; }
legend { font-weight: bold; padding: 0 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { border-left: 6px solid var(--accent); padding: 6px 10px; background: var(--panel2); margin: 6px 0; }
.patlist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.patlist button { display: flex; gap: 10px; align-items: flex-start; width: 100%; }
.bob { animation: bob 1.6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
body.reduce-motion * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
footer { max-width: 1100px; margin: 24px auto; padding: 0 16px 24px; color: var(--muted); font-size: 0.85rem; }
</style>

m","decide","simp","simpa","field_simp"],"when":"Linear (linarith), polynomial (nlinarith, ring), signs (positivity), ℕ/ℤ (omega), finite (decide)."},{"id":"library","name":"Use a library fact","sprite":"book","what":"Someone may already have proved the step: Mathlib or an earlier lemma of the project.","tokens":null,"when":"When the step is a known theorem (a bound on π, a digit-sum fact, a lemma of the file)."}],"tactics":{"intro":"Names the variables and hypotheses of a ∀ or → goal. intro x h: the goal ∀ x, P x → Q x becomes Q x.","rintro":"intro that can also unpack: rintro ⟨x, hx⟩ opens an ∃ or ∧ as it introduces; rintro rfl substitutes.","exact":"Closes the goal with a term of exactly the goal's type.","refine":"Like exact, but ?_ leaves holes that become new goals.","constructor":"Splits ∧ or ↔ (or any one-constructor structure) into one goal per field.","obtain":"Unpacks a hypothesis: obtain ⟨N, hN⟩ := h gives names to the witness and the property of an ∃.","rcases":"Unpacks with cases: rcases h with h1 | h2 handles each side of an ∨.","cases":"Splits on the constructors of a value: n is 0 or n + 1, a Bool is true or false. No induction hypothesis.","induction":"Proof by induction: a case for each constructor, with an induction hypothesis in the step case.","have":"States and proves an intermediate fact, then keeps it as a hypothesis (named `this` if unnamed).","haveI":"have for an instance, so that type class search can use it.","subst":"Uses a hypothesis x = t (or t = x) to replace the variable x everywhere.","rw":"Rewrites with equations, left to right: rw [h] replaces the left side of h by its right side. rw [← h] goes back.","simp":"Simplifies with a large set of rewrite rules; simp [f] also unfolds f. simp at h works on h.","simpa":"simp the goal and a term, then close the goal with the term: simpa using h.","show":"Restates the goal in a form that is equal by definition, to make the next step readable or possible.","unfold":"Replaces a defined name by and every station is worth visiting for its own sake."],["Rote memorization is necessary in education.","Nothing is tested from memory. The Tactic Book and Pattern Codex are always one key away."],["Forgetting is a problem.","Coming back to a theorem shows it fresh. Your notebook keeps what you noticed, not a score."],["Intelligence is knowing ‘what’s out there’.","VARY asks you to change the statement and predict, not to recall. ‘Not sure’ is always an answer."],["There are right and wrong answers.","Inside Lean a proof checks or it does not, and the game shows Lean's verdict as it is. Around that verdict, many cards also work, and every wrong card says where it could be right."]],"symbols":[["∀","for all","∀ x, P x: P holds for every x."],["∃","there exists","∃ x, P x: some x satisfies P. A proof gives one."],["¬","not","¬ P means P → False."],["∧","and","A ∧ B: both A and B."],["∨","or","A ∨ B: at least one of A, B."],["↔","if and only if","A ↔ B: each implies the other."],["→","implies / maps to","Between statements: implies. Between types: a function."],["∑","sum","∑ k ∈ range n, g k = g 0 + … + g (n-1)."],["∈","is in","x ∈ S: x belongs to the set S."],["∉","is not in","x ∉ S means ¬ (x ∈ S)."],["⊆","subset","S ⊆ T: every element of S is in T."],["∩","intersection","S ∩ T: the elements in both."],["√","square root","Real.sqrt; in Lean √x = 0 for x < 0."],["|","absolute value","|x| is the distance from x to 0."],["≫","then (composition)","f ≫ g: first f, then g (diagram order)."],["⟶","arrow","a ⟶ b: the arrows (morphisms) from a to b in a category."],["𝟙","identity arrow","𝟙 a: the arrow that does nothing."],["∘","composed with","g ∘ f: first f, then g (function order)."],["𝓝","neighbourhoods","S ∈ 𝓝 a: S contains an open interval around a."],["ℕ","natural numbers","0, 1, 2, …"],["ℤ","integers","…, -1, 0, 1, …"],["ℝ","real numbers","The real line."],["π","pi","Real.pi."],["Fin 3","three elements","The type {0, 1, 2}."],["ZMod","integers mod n","ZMod n: arithmet   route = r; render(true);
}
function back() { if (history.length) { route = history.pop(); render(true); } else { route = { screen: 'map' }; render(true); } }

function renderNav() {
  const nav = document.getElementById('nav'); clear(nav);
  const items = [['map', 'Map', 'M'], ['codex', 'Patterns', 'K'], ['book', 'Tactics', 'T'], ['notebook', 'Notebook', 'N'],
    ['why', 'Why it plays like this', 'Y'], ['settings', 'Settings', 'O'], ['help', 'Help', 'H']];
  items.forEach(([scr, label, k]) => nav.appendChild(h('button', {
    'aria-current': route.screen === scr ? 'page' : null, 'aria-keyshortcuts': k,
    on: { click: () => go({ screen: scr }) } }, label)));

function render(focus) {
  // keep keyboard focus on the same control when a screen is redrawn in place
  const act = document.activeElement;
  const keep = !focus && act && act.tagName === 'BUTTON' ? act.textContent : null;
  applySettings(); renderNav();
  const main = document.getElementById('main'); clear(main);
  const f = SCREENS[route.screen] || SCREENS.title;
  f(main);
  if (keep !== null && main.querySelectorAll) {
    const same = Array.prototype.filter.call(main.querySelectorAll('button'), x => x.textContent === keep)[0];
    if (same && same.focus) same.focus();
  }
  if (focus) { const h1 = main.querySelector ? main.querySelector('h1') : null; (h1 || main).setAttribute && (h1 || main).setAttribute('tabindex', '-1'); (h1 || main).focus && (h1 || main).focus(); }

  text = (text || '').trim();
  if (!text) { say('The note is empty, so nothing was saved.'); return; }

function maybeICan(s) {

    S.notes.push({ kind: 'ican', spec: s.id, text: s.ican, t: Date.now() });
    say('All four lenses explored. Added to your notebook: ' + s.ican);
  }

function proofList(s, opts) {
  opts = opts || {};
  const ol = h('ol', { class: 'proof', 'aria-label': 'The proof, line by line' });
  ol.appendChild(h('li', null, h('span', { class: 'ln' }, ''), h('span', { class: 'code' }, s.sig.join('\n'))));
  s.body.forEach((line, i) => {
    let cls = opts.highlight && opts.highlight.has(i) ? 'hl' : '';

    let text = line;
    if (opts.hideFrom !== undefined && i >= opts.hideFrom) {
      if (i === opts.hideFrom && opts.mask) { text = indentOf(line) + '?? which line could come next?'; cls += ' hidden-line'; }
      else return;
    }
    const content = opts.onLine && (opts.hideFrom === undefined || i < opts.hideFrom)
      ? h('button', { class: 'linebtn', 'aria-label': 'Line ' + (i + 1) + ': ' + line.trim() + '. Show the goals before this line.', on: { click: () => opts.onLine(i) } }, text)
      : h('span', { class: 'code' }, text);

function indentOf(line) { return line.slice(0, line.length - line.trimStart().length); }

function goalsView(goals, note) {

  if (goals === null || goals === undefined) { box.appendChild(h('p', { class: 'muted' }, note || 'This line continues the line above (a calc step), so Lean shows no separate goal here.')); return box; }
  if (!goals.length) { box.appendChild(h('p', null, h('strong', null, 'No goals. '), 'The proof is complete.')); return box; }
  box.appendChild(h('p', null, goals.length === 1 ? '1 goal' : goals.length + ' goals'));

// ---------------------------------------------- STEP
const VERDICT = {
  file: ['\u2605 The project\u2019s line', 'file'],
  works: ['\u2713 Lean accepts this too', 'works'],
  later: ['\u26A0 Lean accepts this line, but the proof fails further down', 'later'],
  here: ['\u2717 Lean stops on this line', 'here']
};
function stepState(s) { return S.stepPos[s.id] || (S.stepPos[s.id] = { pos: 0, view: null, resolved: {} }); }
function markAt(s, i) { const k = s.marks.findIndex(m => m.at === i); return k >= 0 ? k : null; }

LENS.step = function (p, s) {
  const st = stepState(s);
  p.appendChild(h('h2', null, 'Step: walk through the proof with Lean'));
  p.appendChild(h('p', null, 'Run the proof one line at a time and watch the goals change. At a marked line the line is hidden: pick a card. Every card was tried in Lean; try as many as you like.'));
  const n = s.body.length;
  const mk = st.pos < n ? markAt(s, st.pos) : null;
  const masked = mk !== null && !st.resolved[mk];
  const viewLine = st.view !== null && st.view !== undefined ? st.view : st.pos;
  p.appendChild(proofList(s, { hideFrom: st.pos < n ? st.pos : undefined, mask: true, current: st.pos < n ? st.pos : null,
    onLine: i => { st.view = i; save(); render(false); say('Showing the goals before line ' + (i + 1) + '.'); } }));
  p.appendChild(h('h3', null, viewLine < n ? 'Goals before line ' + (viewLine + 1) : 'After the last line'));
  p.appendChild(goalsView(viewLine < n ? s.goals[viewLine] : []));
  if (st.view !== null && st.view !== undefined && st.view !== st.pos) {
    p.appendChild(h('button', { on: { click: () => { st.view = null; save(); render(false); } } }, 'Back to the current line'));
  }
  if (st.pos >= n) {
    p.appendChild(h('div', { class: 'verdict ok' }, h('p', null, h('span', { class: 'vlabel' }, 'Proof complete.'), ' Lean has no goals left. ', s.ican)));
    p.appendChild(h('div', { class: 'row' },
      h('button', { on: { click: () => { S.stepPos[s.id] = { pos: 0, view: null, resolved: {} }; save(); render(false); } } }, 'Walk through again'),
      h('button', { on: { click: () => go({ screen: 'spec', id: s.id, lens: 'vary' }, false) } }, 'Now vary the statement')));
    return;
  }
  if (!masked) {
    const runBtn = h('button', { id: 'run-line', 'aria-keyshortcuts': 'Enter', on: { click: () => { st.pos += 1; st.view = null; if (st.pos >= n) visits(s.id).step = true; save(); render(false); focusRun();
      say(st.pos >= n ? 'Proof complete.' : 'Ran line ' + st.pos + '. Goals before line ' + (st.pos + 1) + ' are shown.'); } } },
      'Run line ' + (st.pos + 1) + ': ' + s.body[st.pos].trim());
    p.appendChild(h('div', { class: 'row', style: 'margin-top:10px' }, runBtn));
    return;
  }
  // a marked line: cards
  const m = s.marks[mk];
  const tried = ((S.stepTried[s.id] = S.stepTried[s.id] || {})[mk] = (S.stepTried[s.id][mk] || []));
  const order = shuffled(m.cards.map((c, i) => i), s.id + 'mark' + mk);
  p.appendChild(h('h3', null, 'Which line could come next?'));
  const ch = h('div', { class: 'choices', role: 'group', 'aria-label': 'Cards for line ' + (m.at + 1) });
  order.forEach((ci, k) => {
    const c = m.cards[ci]; const was = tried.indexOf(ci) >= 0;
    ch.appendChild(h('button', { 'aria-pressed': st.last === ci && st.lastMark === mk ? 'true' : 'false', 'data-choice': String(k), 'aria-keyshortcuts': 'ABCD'[k],
      on: { click: () => { if (tried.indexOf(ci) < 0) tried.push(ci); st.last = ci; st.lastMark = mk; save(); render(false); focusChoice(k);
        say(VERDICT[c.verdict][0] + '. ' + c.why); } } },
      h('span', { class: 'key' }, 'ABCD'[k] + ' '), h('span', { class: 'cardtext' }, c.text), was ? h('span', { class: 'muted' }, '  (tried: ' + VERDICT[c.verdict][0].slice(2) + ')') : null));
  });
  p.appendChild(ch);
  if (st.lastMark === mk && st.last !== undefined && st.last !== null) {
    const c = m.cards[st.last];
    const where = c.errorAt !== undefined ? (c.errorAt < 0 ? 'Lean reports it at the start of the proof (the unsolved goals of the whole proof).' : 'Lean reports it on line ' + (c.errorAt + 1) + '.') : null;
    p.appendChild(h('div', { class: 'verdict ' + VERDICT[c.verdict][1] },
      h('p', null, h('span', { class: 'vlabel' }, VERDICT[c.verdict][0] + '.'), ' ', c.why),
      c.error ? h('div', null, h('p', null, 'Lean\u2019s message' + (c.verdict === 'later' ? ' (further down)' : '') + ': ', where), code(c.error, 'The message in words')) : null));
    p.appendChild(h('div', { class: 'row' },
      h('button', { id: 'continue-line', on: { click: () => { st.resolved[mk] = true; st.pos += 1; st.view = null; st.last = null; if (st.pos >= n) visits(s.id).step = true; save(); render(false); focusRun();
        say('Continued with the project\u2019s line.'); } } }, 'Continue with the project\u2019s line'),
      tried.length < m.cards.length ? h('span', { class: 'muted' }, 'Or try another card: ' + (m.cards.length - tried.length) + ' left to explore.') : h('span', { class: 'muted' }, 'You have tried every card here.')));
  }
};

  const pre = h('pre', { class: 'lean' }, h('code', null, sig.slice(0, k), h('span', { class: 'sr-only' }, ' [removed: '), h('del', null, v.old), h('span', { class: 'sr-only' }, '] [added: '), h('ins', null, v.new), h('span', { class: 'sr-only' }, '] '), sig.slice(k + v.old.length)));
  p.appendChild(pre);
  p.appendChild(h('p', null, h('strong', null, 'Changed: '), h('span', { class: 'cardtext' }, v.old), ' \u2192 ', h('span', { class: 'cardtext' }, v.new)));
  p.appendChild(h('p', null, 'Before Lean runs: what do you expect?'));
  const opts = [['works', 'The same proof still works'], ['breaks', 'The proof breaks somewhere'], ['unsure', 'Not sure \u2014 let\u2019s see']];
  const ch = h('div', { class: 'choices', role: 'group', 'aria-label': 'Your prediction' });
  opts.forEach(([key, label], i) => ch.appendChild(h('button', { 'aria-pressed': pred === key ? 'true' : 'false', 'data-choice': String(i), 'aria-keyshortcuts': 'ABC'[i],
    on: { click: () => { const first = S.varyPred[s.id] === undefined; S.varyPred[s.id] = key; visits(s.id).vary = true;
      const outcome = v.result === 'ok' ? 'works' : 'breaks';
      if (first && key !== 'unsure' && key !== outcome) S.notes.push({ kind: 'surprise', spec: s.id, t: Date.now(),
        text: 'I expected the proof to ' + (key === 'works' ? 'survive' : 'break') + ' when ' + v.old + ' became ' + v.new + '. Lean: ' + v.why });
      save(); render(false); focusChoice(i);
      say((v.result === 'ok' ? 'Lean accepts the same proof. ' : 'Lean stops. ') + v.why); } } },
    h('span', { class: 'key' }, 'ABC'[i] + ' '), label)));
  p.appendChild(ch);
  if (pred === undefined) return;
  const outcome = v.result === 'ok' ? 'works' : 'breaks';
  const where = v.errorAt !== undefined ? (v.errorAt < 0 ? 'at the start of the proof' : 'on line ' + (v.errorAt + 1) + ': ' + s.body[v.errorAt].trim()) : '';
  p.appendChild(h('div', { class: 'verdict ' + (v.result === 'ok' ? 'ok' : 'fail') },
    h('p', null, h('span', { class: 'vlabel' }, v.result === 'ok' ? '\u2713 Lean accepts the same proof.' : '\u2717 Lean stops ' + where + '.')),
    h('p', null, v.why),
    v.error ? code(v.error, 'The message in words') : null,
    pred === 'unsure' ? h('p', { class: 'muted' }, 'Uncertainty is a fine place to start: now you have seen what happens.') :
      (pred === outcome ? h('p', { class: 'muted' }, 'As you expected. What told you?') :
        h('p', { class: 'muted' }, 'A surprise \u2014 it was added to your notebook. Surprises are where noticing begins.'))));
  if (v.fact) p.appendChild(h('div', { class: 'note' }, h('p', null, 'About the new statement, proved in RequestProject/ProofAtlas.lean as ', h('span', { class: 'cardtext' }, v.fact), ':'),
    code(v.factSource, 'The fact in words')));
};

// ---------------------------------------------- codex
SCREENS.codex = function (main) {

    tbl));

// ---------------------------------------------- tactic book
SCREENS.book = function (main) {
  heading(main, 'Tactic Book', 'Every tactic that appears in the Atlas, with one example from its proofs.');
  const keys = Object.keys(ATLAS.tactics).sort();
  const dl = h('dl', null);
  keys.forEach(k => {
    const ex = findExample(k);
    dl.appendChild(h('dt', null, h('strong', { class: 'cardtext' }, k)));
    dl.appendChild(h('dd', null, h('p', null, ATLAS.tactics[k]), ex ? h('p', { class: 'muted' }, 'Example (' + ex.s.name + '): ', h('span', { class: 'cardtext' }, ex.line.trim())) : null));
  });
  main.appendChild(h('div', { class: 'panel' }, dl));
};
function findExample(t) {
  const re = new RegExp('(^|[\\s;·>(])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$|\\b)');
  for (const s of ATLAS.specimens) for (const l of s.body) if (re.test(l)) return { s: s, line: l };
  return null;
}

// ---------------------------------------------- notebook
const KINDS = { notice: 'Noticed', question: 'My questions', surprise: 'Surprises', ican: 'I can\u2026' };
SCREENS.notebook = function (main) {
  heading(main, 'Notebook', 'What you noticed, asked and can now do. It stays in this browser.');
  const ta = h('textarea', { id: 'nb-new' });
  main.appendChild(h('div', { class: 'panel' }, h('label', { for: 'nb-new' }, 'Write a note or question (not tied to a theorem):'), ta,
    h('div', { class: 'row' }, h('button', { on: { click: () => { addNote('notice', null, ta.value); render(false); } } }, 'Save as a noticing'),
      h('button', { on: { click: () => { addNote('question', null, ta.value); render(false); } } }, 'Save as a question'))));
  Object.keys(KINDS).forEach(kind => {
    const items = S.notes.filter(n => n.kind === kind);
    main.appendChild(h('section', { class: 'panel' }, h('h2', null, KINDS[kind] + ' (' + items.length + ')'),
      items.length ? h('ul', null, items.map(n => h('li', null, n.spec && SPEC[n.spec] ? h('strong', null, SPEC[n.spec].title + ': ') : null, n.text))) :
        h('p', { class: 'muted' }, kind === 'ican' ? 'Explore all four lenses of a theorem (choose a reading, compare patterns, finish the walk-through, make a prediction) to add its sentence here.' : 'Nothing yet.')));
  });
  main.appendChild(h('div', { class: 'row' },
    h('button', { on: { click: exportNotes } }, 'Download as a text file'),
    h('button', { on: { click: () => { if (!window.confirm || window.confirm('Delete all notes? Progress marks are kept.')) { S.notes = []; S.ican = {}; save(); render(false); say('Notebook cleared.'); } } } }, 'Clear the notebook')));
};
function notesText() {
  return Object.keys(KINDS).map(kind => '## ' + KINDS[kind] + '\n' + S.notes.filter(n => n.kind === kind)
    .map(n => '- ' + (n.spec && SPEC[n.spec] ? SPEC[n.spec].title + ': ' : '') + n.text).join('\n')).join('\n\n') + '\n';
}
function exportNotes() {
  const text = '# Proof Atlas notebook\n\n' + notesText();
  try {
    const blob = new Blob([text], { type: 'text/plain' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'proof-atlas-notebook.txt' });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    say('Downloaded proof-atlas-notebook.txt.');
  } catch (e) { say('Download is not available here.'); }
}

// ------------------------------------------------------------------ keyboard
function onKey(e) {
  const t = e.target; const tag = t && t.tagName ? t.tagName.toLowerCase() : '';
  if (tag === 'textarea' || tag === 'input' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  const map = { m: 'map', k: 'codex', t: 'book', n: 'notebook', o: 'settings', h: 'help', y: 'why', '?': 'help' };
  if (k === 'Escape') { e.preventDefault(); back(); return; }
  if (route.screen === 'spec' && /^[1-4]$/.test(k)) { e.preventDefault(); const lens = LENSES[+k - 1][0]; go({ screen: 'spec', id: route.id, lens: lens }, false); focusTab(lens); return; }
  if (route.screen === 'spec' && /^[a-dA-D]$/.test(k)) {
    const m = document.getElementById('main'); const b = m && m.querySelector && m.querySelector('[data-choice="' + 'abcd'.indexOf(k.toLowerCase()) + '"]');
    if (b) { e.preventDefault(); b.click(); return; }
  }
  const scr = map[k.toLowerCase()];
  if (scr) { e.preventDefault(); go({ screen: scr }); }
}

// ------------------------------------------------------------------ start
function start() {
  load();
  drawSprite(document.getElementById('logo'), 'compass');
  document.addEventListener('keydown', onKey);
  render(false);
}
window.ProofAtlas = { start: start, go: go, back: back, state: () => S, route: () => route, inWords: inWords, shuffled: shuffled,
  onKey: onKey, notesText: notesText, setState: o => { S = o; } };
start();
})();
