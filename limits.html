/* ───────────────────────── engine ───────────────────────── */
let cur = null;
const REFLECT = ["a game between two players (∀ and ∃)", "a picture: bands and windows on a graph", "an arrow in a category", "a program (proof term) in Lean", "an algebraic identity", "something from everyday life (tolerances, zooming in, …)"];

function home() {
  cur = null;
  const cards = STAGES.map((st, i) => `<button class="card" onclick="startStage(${i})"><div class="num">${st.sec}</div><div class="ttl">${st.title}</div><div class="sym m">${st.sym}</div><div class="stars">${"★".repeat(S.stars[st.id] || 0)}${"☆".repeat(3 - (S.stars[st.id] || 0))}</div></button>`).join("");
  $("app").innerHTML = `<div class="panel"><h1>Limit Quest</h1><div class="sub m" style="font-size:18px">∀ε &gt; 0 ∃δ &gt; 0 ∀x, 0 &lt; |x − c| &lt; δ → |f(x) − L| &lt; ε</div>
    <p class="sub">A game about limits and continuity — rates of change, limit laws, the precise definition, one-sided limits, continuity and limits at infinity.
    Every stage can be viewed through several <b>lenses</b>: intuition, natural-deduction trees, sequents, category-theory patterns, type theory, algebra and checked Lean 4 proofs.</p></div>
    <div class="panel"><h2>Play mindfully</h2><div class="sub">Ellen Langer's <i>The Power of Mindful Learning</i> names seven myths about learning. This game answers each of them:</div>
    <table class="t" style="width:100%"><tr><th>Myth</th><th>How Limit Quest responds</th></tr>
    <tr><td>1. Basics must become second nature</td><td>Facts are given conditionally (“could be”, “in this context”), never as unconditional rules.</td></tr>
    <tr><td>2. Attention = focus on one thing</td><td>Values change on every attempt, and lenses switch, so there is always something new to notice.</td></tr>
    <tr><td>3. Delay gratification</td><td>Play first (sliders, duels), formal definitions after. No lives to lose.</td></tr>
    <tr><td>4. Rote memorization</td><td>You build limit laws into proof trees rather than recite them.</td></tr>
    <tr><td>5. Forgetting is a problem</td><td>The Sideways Shuffle brings ideas back in a different form.</td></tr>
    <tr><td>6. Intelligence = knowing what's out there</td><td>Several routes count: plot, bisect, argue, prove. Many questions accept several answers.</td></tr>
    <tr><td>7. Right and wrong answers</td><td>A wrong answer is answered with the context in which it <i>would</i> be right. The boss asks “when is it true?”.</td></tr></table></div>
    <div class="panel"><h2>Stages</h2><div class="sub">All stages are open — wander in any order.</div><div class="grid">${cards}</div></div>`;
  hud();
}

function startStage(i) {
  const st = STAGES[i];
  cur = { idx: i, st, tasks: st.make(), i: 0, step: 0, mistakes: 0, firstTry: true, done: false, fb: "", lens: choose(LENSES)[0], lensSeen: {}, multiSel: {}, slider: 1, reflected: false };
  cur.lensSeen[cur.lens] = true;
  renderTask();
}

function lensPanel() {
  const st = cur.st;
  const tabs = LENSES.map(([k, lab]) => `<button class="${cur.lens === k ? "sel" : ""}" onclick="setLens('${k}')">${lab}</button>`).join("");
  return `<div class="panel"><h2>Lenses <span class="tag">${Object.keys(cur.lensSeen).length}/${LENSES.length} seen</span></h2><div class="tabs">${tabs}</div><div class="lensbody" id="lens">${st.lenses[cur.lens]()}</div></div>`;
}
function setLens(k) {
  if (!cur) return;
  if (!cur.lensSeen[k]) { cur.lensSeen[k] = true; S.insight += 2; save(); }
  cur.lens = k; renderTask();
}

function taskBody(t) {
  let h = "";
  if (t.intro) h += `<div class="sub" style="margin-bottom:6px">${t.intro}</div>`;
  if (t.kind === "steps") {
    const resolved = t.steps.slice(0, cur.step).filter((s) => s.node != null).length + (cur.done ? 999 : 0);
    if (t.visual) h += `<div class="visual">${t.visual(resolved)}</div>`;
    if (!cur.done) { const s = t.steps[cur.step]; h += `<div class="question">${s.prompt}</div><div class="choices">${s.opts.map((o, j) => `<button onclick="pick(${j})">${o.h}</button>`).join("")}</div>`; }
    h += `<div class="sub">step ${Math.min(cur.step + 1, t.steps.length)} / ${t.steps.length}</div>`;
  } else {
    h += `<div class="question">${t.prompt}</div>`;
    if (t.kind === "number" && t.slider) h += `<div class="visual" id="vis">${t.visual(cur.slider)}</div><input type="range" min="1" max="100" value="${Math.round(cur.slider * 100)}" oninput="slide(this.value)">`;
    if (t.kind === "number" && t.duel) h += `<div class="visual" id="vis">${t.visual(cur.lastNum)}</div>`;
    if (t.kind === "choice" && !cur.done) h += `<div class="choices">${t.opts.map((o, j) => `<button onclick="pick(${j})">${o.h}</button>`).join("")}</div>`;
    if (t.kind === "multi" && !cur.done) h += `<div class="choices">${t.opts.map((o, j) => `<button class="${cur.multiSel[j] ? "sel" : ""}" onclick="toggleMulti(${j})">${cur.multiSel[j] ? "☑" : "☐"} ${o.h}</button>`).join("")}</div><div class="choices"><button class="primary" onclick="submitMulti()">Check</button></div>`;
    if (t.kind === "number" && !cur.done) h += `<div class="choices"><input type="text" id="num" placeholder="e.g. 3, -1.5, 5/3" onkeydown="if(event.key==='Enter')submitNum()"><button class="primary" onclick="submitNum()">Check</button><button onclick="reveal()">Show me</button></div>`;
  }
  return h;
}

function renderTask() {
  const st = cur.st, n = cur.tasks.length;
  if (cur.i >= n) return reflect();
  const t = cur.tasks[cur.i];
  const left = `<div class="panel"><div class="progress"><div style="width:${100 * cur.i / n}%"></div></div>
    <h2>${st.sec} · ${st.title} — ${t.title || ""} <span class="tag">${cur.i + 1}/${n}</span></h2>
    ${cur.i === 0 && cur.step === 0 && !cur.done ? `<div class="myth">${st.myth}</div><div class="sub" style="margin-bottom:8px">${st.intro}</div>` : `<div class="myth" style="opacity:.85">${st.myth}</div>`}
    ${taskBody(t)}
    <div id="fb">${cur.fb}</div>
    ${cur.done ? `<div class="choices"><button class="primary" onclick="nextTask()">Next ▶</button></div>` : ""}
    <div class="choices"><button class="small" onclick="home()">◀ Map</button></div></div>`;
  $("app").innerHTML = `<div class="split"><div>${left}</div><div>${lensPanel()}</div></div>`;
  hud();
}

function good(explain) {
  S.insight += cur.firstTry ? 10 : 5; save();
  return `<div class="feedback good">✓ ${explain || ""}</div>`;
}
function bad(msg, ctx) {
  cur.mistakes++; cur.firstTry = false;
  return `<div class="feedback bad">Not in this context. ${msg || "Try again — or open another lens for a hint."}</div>` + (ctx ? `<div class="feedback ctx">💡 <b>When could your answer be right?</b> ${ctx}</div>` : "");
}
function pick(j) {
  const t = cur.tasks[cur.i]; if (cur.done) return;
  if (t.kind === "steps") {
    const s = t.steps[cur.step], o = s.opts[j];
    if (o.ok) { cur.step++; cur.fb = good(s.explain); if (cur.step >= t.steps.length) cur.done = true; }
    else cur.fb = bad(null, o.ctx);
  } else if (t.kind === "choice") {
    const o = t.opts[j];
    if (o.ok) { cur.done = true; cur.fb = good(t.explain); } else cur.fb = bad(null, o.ctx);
  }
  renderTask();
}
function toggleMulti(j) { cur.multiSel[j] = !cur.multiSel[j]; renderTask(); }
function submitMulti() {
  const t = cur.tasks[cur.i];
  const okAll = t.opts.every((o, j) => !!cur.multiSel[j] === o.ok);
  if (okAll) { cur.done = true; cur.fb = good(t.explain); }
  else {
    const missed = t.opts.filter((o, j) => o.ok && !cur.multiSel[j]).length, extra = t.opts.filter((o, j) => !o.ok && cur.multiSel[j]).length;
    cur.fb = bad(`${missed ? `There ${missed === 1 ? "is" : "are"} ${missed} more context${missed === 1 ? "" : "s"} where it holds. ` : ""}${extra ? `${extra} of your picks ${extra === 1 ? "is a context" : "are contexts"} where it fails.` : ""}`);
  }
  renderTask();
}
function submitNum() {
  const t = cur.tasks[cur.i]; const el = $("num"); const v = parseNum(el ? el.value : "");
  if (isNaN(v)) { cur.fb = `<div class="feedback bad">Please type a number (fractions like 5/3 are fine).</div>`; return renderTask(); }
  cur.lastNum = v;
  if (t.check(v)) { cur.done = true; cur.fb = good(t.explain); }
  else cur.fb = bad(null, t.onWrong ? t.onWrong(v) : null);
  renderTask();
}
function reveal() {
  const t = cur.tasks[cur.i]; cur.mistakes++; cur.firstTry = false; cur.done = true;
  cur.fb = `<div class="feedback ctx">One answer: <b>${t.answerText}</b>. ${t.explain || ""}</div>`; renderTask();
}
function slide(v) { cur.slider = Math.max(0.01, v / 100); const t = cur.tasks[cur.i]; if ($("vis")) $("vis").innerHTML = t.visual(cur.slider); }
function nextTask() { cur.i++; cur.step = 0; cur.done = false; cur.fb = ""; cur.firstTry = true; cur.multiSel = {}; cur.lastNum = undefined; renderTask(); }

function reflect() {
  const st = cur.st;
  $("app").innerHTML = `<div class="panel"><h2>${st.sec} · ${st.title} — reflection</h2>
    <div class="question">No right answer here. Which other way of seeing today's idea feels useful? (Langer: “noticing new things” is the core of mindfulness.)</div>
    <div class="choices">${REFLECT.map((r, j) => `<button onclick="finishStage(${j})">${r}</button>`).join("")}</div>
    <div class="choices"><textarea id="note" rows="2" cols="60" placeholder="Optional: one thing you noticed that surprised you…"></textarea></div></div>`;
}
function finishStage(j) {
  const st = cur.st, note = $("note") ? $("note").value : "";
  const stars = cur.mistakes === 0 ? 3 : cur.mistakes <= 3 ? 2 : 1;
  S.stars[st.id] = Math.max(S.stars[st.id] || 0, stars); S.insight += 15;
  S.journal.push({ stage: `${st.sec} ${st.title}`, view: REFLECT[j], note: note, lenses: Object.keys(cur.lensSeen).length });
  save();
  $("app").innerHTML = `<div class="panel"><h2>Stage complete: ${st.title}</h2><div style="font-size:30px;color:var(--accent)">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <p class="sub">Mistakes: ${cur.mistakes} · Lenses explored: ${Object.keys(cur.lensSeen).length}/${LENSES.length}. Mistakes only change stars — each one came with a context in which it was right.</p>
    <div class="choices"><button class="primary" onclick="home()">Back to the map</button><button onclick="startStage(${cur.idx})">Replay (new numbers)</button></div></div>`;
  cur = null;
}

function codex() {
  const rows = [["⊢", "turnstile: “from these hypotheses, conclude…” (sequents Γ ⊢ φ)"], ["∀ ∃", "for all / there exists — the two players of the ε–δ game"], ["→ ↔ ∧ ¬ ⊥", "implies, iff, and, not, contradiction"],
    ["Π Σ", "dependent function / pair types: ∀ and ∃ under Curry–Howard"], ["λ", "function abstraction; proofs are λ-terms"], ["∘", "composition: (g ∘ f)(x) = g(f(x))"], ["⟶", "an arrow (morphism) in a category"],
    ["≤ ⊔", "order and join of filters; ⊔ is a coproduct in the poset category"], ["⊣", "adjunction / Galois connection, e.g. map f ⊣ comap f"], ["×  ⟨f, g⟩", "product and pairing; π₁, π₂ projections"],
    ["𝓝 c", "Lean: neighbourhood filter of c (“x → c”)"], ["𝓝[≠] c", "punctured: x → c with x ≠ c"], ["𝓝[<] c  𝓝[>] c", "one-sided: x → c⁻, x → c⁺"], ["atTop", "x → +∞"],
    ["Tendsto f F G", "f maps the approach F into the approach G (a limit)"], ["ε, δ", "error tolerance in y, control tolerance in x"], ["[A]¹ … →I¹", "natural deduction: assume A, discharge it at rule ¹"]];
  $("app").innerHTML = `<div class="panel"><h2>Symbols ⊢ codex</h2><table class="t codex" style="width:100%">${rows.map(([a, b]) => `<tr><td class="m">${a}</td><td style="text-align:left">${b}</td></tr>`).join("")}</table>
    <h3>Category patterns in this game</h3><table class="t" style="width:100%">${CARDS.map((c) => `<tr><td style="text-align:left" class="m">${c.calc}</td><td style="text-align:left">${c.cat}</td></tr>`).join("")}</table>
    <div class="choices"><button onclick="home()">◀ Map</button></div></div>`;
}
function journal() {
  const items = S.journal.slice().reverse().map((j) => `<li><b>${esc(j.stage)}</b> — seen as <i>${esc(j.view)}</i>; ${j.lenses} lenses explored.${j.note ? `<br>“${esc(j.note)}”` : ""}</li>`).join("");
  $("app").innerHTML = `<div class="panel"><h2>Mindful journal ✎</h2>${items ? `<ul class="journal">${items}</ul>` : `<p class="sub">Finish a stage to add an entry.</p>`}
    <div class="choices"><button onclick="home()">◀ Map</button><button onclick="if(confirm('Reset all progress?')){S={insight:0,stars:{},journal:[]};save();home();}">Reset progress</button></div></div>`;
}

home();
</script>
</body>
</html>
