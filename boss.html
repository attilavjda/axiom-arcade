<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow Quest Expansion — The Exercise Dojo / 射の冒険 拡張：演習道場</title>
<style>
  :root {
    --bg: #14152b; --panel: #1f2142; --panel2: #2a2d5a; --ink: #f2f0ff;
    --muted: #a9a7c9; --accent: #ffcc4d; --good: #5be49b; --bad: #ff6b81;
    --node: #6ec8ff; --arrow: #d8d6ff; --code: #15162e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(circle at 30% 10%, #2b2e63, var(--bg) 60%);
    color: var(--ink); min-height: 100vh;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
                 "Noto Sans JP", Meiryo, sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 10px 18px; background: rgba(0,0,0,.25); gap: 10px; flex-wrap: wrap; }
  header .brand { font-weight: 700; letter-spacing: .5px; cursor: pointer; }
  header .hud { display: flex; gap: 16px; align-items: center; font-size: 15px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel2); border: 2px solid #4a4e95;
    border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: transform .08s, background .15s;
  }
  button:hover { background: #3a3e7a; transform: translateY(-1px); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  button.primary { background: var(--accent); color: #2a1d00; border-color: #ffe08f; font-weight: 700; }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.tab { border-radius: 10px 10px 0 0; border-bottom: none; }
  button.tab.active { background: var(--panel); border-color: var(--accent); color: var(--accent); }
  a { color: var(--accent); }
  main { max-width: 1000px; margin: 0 auto; padding: 18px; }
  .panel { background: var(--panel); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
           box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  h1 { font-size: 28px; margin: 6px 0 4px; }
  h2 { font-size: 21px; margin: 0 0 10px; color: var(--accent); }
  h3 { font-size: 17px; margin: 12px 0 8px; }
  .sub { color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { text-align: left; padding: 14px; border-radius: 14px; }
  .card .num { font-size: 13px; color: var(--muted); }
  .card .ttl { font-size: 16px; font-weight: 700; margin: 2px 0 6px; }
  .card .stars { color: var(--accent); font-size: 14px; }
  .quote { background: #191a36; border-left: 4px solid var(--accent); padding: 10px 14px;
           border-radius: 8px; margin: 8px 0; line-height: 1.65; font-style: italic; }
  .bridge { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .question { font-size: 17px; margin-bottom: 10px; line-height: 1.6; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .feedback { margin-top: 12px; padding: 10px 14px; border-radius: 10px; line-height: 1.6; }
  .feedback.good { background: rgba(91,228,155,.13); border: 1px solid var(--good); }
  .feedback.bad { background: rgba(255,107,129,.13); border: 1px solid var(--bad); }
  .hearts { color: var(--bad); letter-spacing: 2px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: -2px; }
  svg.diagram { width: 100%; max-width: 600px; display: block; margin: 0 auto; }
  .edge-hit { cursor: pointer; }
  .proof-list { list-style: none; padding: 0; margin: 0; counter-reset: st; }
  .proof-list li { counter-increment: st; background: #191a36; border-radius: 10px;
                   padding: 8px 12px 8px 42px; margin: 6px 0; position: relative; line-height: 1.55; }
  .proof-list li::before { content: counter(st); position: absolute; left: 12px; top: 8px;
                           color: var(--accent); font-weight: 700; }
  .proof-list li.latest { outline: 2px solid var(--accent); }
  .pool { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .pool button { text-align: left; line-height: 1.5; }
  .lean-wrap { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
  @media (max-width: 800px) { .lean-wrap { grid-template-columns: 1fr; } }
  pre.code { background: var(--code); border-radius: 10px; padding: 10px 0; margin: 0; overflow-x: auto;
             font-family: "JetBrains Mono", "Fira Code", Consolas, "Noto Sans Mono CJK JP", monospace;
             font-size: 13px; line-height: 1.55; }
  pre.code .ln { display: block; padding: 0 12px; white-space: pre; cursor: pointer; }
  pre.code .ln:hover { background: rgba(255,255,255,.04); }
  pre.code .ln .no { color: #5c5f99; display: inline-block; width: 2.4em; user-select: none; }
  pre.code .ln.sel { background: rgba(255,204,77,.13); }
  pre.code .ln.gap { color: var(--accent); }
  pre.code .ln.hidden { color: #4b4d7a; }
  pre.code .hdr { color: #c9b8ff; }
  .goal { background: #101126; border: 1px solid #34366e; border-radius: 10px; padding: 10px 12px;
          font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 13px;
          white-space: pre-wrap; line-height: 1.5; min-height: 80px; }
  .goal-title { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .note { background: #191a36; border-radius: 10px; padding: 8px 12px; margin-top: 10px; line-height: 1.55; font-size: 14px; }
  .opt { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 13px;
         white-space: pre-wrap; text-align: left; }
  details.lean-err summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 6px; }
  details.lean-err pre { white-space: pre-wrap; font-size: 12px; background: #101126; padding: 8px;
                          border-radius: 8px; margin: 6px 0 0; }
  code { background: #191a36; padding: 1px 6px; border-radius: 5px; }
  .footer { color: var(--muted); font-size: 13px; text-align: center; margin: 20px 0; line-height: 1.6; padding: 0 12px; }
  .center { text-align: center; }
  .big { font-size: 54px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: #191a36;
         color: var(--muted); font-size: 13px; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" onclick="Game.home()"></div>
  <div class="hud">
    <span id="hud-hearts" class="hearts"></span>
    <span id="hud-score"></span>
    <button class="small" id="lang-btn" onclick="Game.toggleLang()"></button>
  </div>
</header>
<main id="app"></main>
<div class="footer" id="footer"></div>

922875f2d6215"}, {"n": 2, "title": {"en": "Composites of monics and epis", "ja": "モニック射・エピ射の合成"}, "statement": {"en": "Prove that the composite of monics is monic, and likewise for epis.", "ja": "モニック射の合成はモニックであることを証明せよ。エピ射についても同様。"}, "answer": {"en": "Cancel the outer arrow first, then the inner one.", "ja": "外側の射を先に簡約し、次に内側の射を簡約する。"}, "nodes": {"z": {"x": 60, "y": 170, "label": "z"}, "a": {"x": 200, "y": 170, "label": "a"}, "b": {"x": 345, "y": 170, "label": "b"}, "c": {"x": 490, "y": 170, "label": "c"}}, "edges": [{"id": "u", "src": "z", "dst": "a", "label": "u", "bend": -28, "dashed": false, "color": null}, {"id": "v", "src": "z", "dst": "a", "label": "v", "bend": 28, "dashed": false, "color": null}, {"id": "f", "src": "a", "dst": "b", "label": "f", "bend": 0, "dashed": false, "color": null}, {"id": "g", "src": "b", "dst": "c", "label": "g", "bend": 0, "dashed": false, "color": null}, {"id": "gf", "src": "a", "dst": "c", "label": "g∘f", "bend": -95, "dashed": true, "color": null}], "click": {"q": {"en": "We know (g∘f)∘u = (g∘f)∘v with f, g monic. Which arrow do we cancel <b>first<\/b>? Click it.", "ja": "f, g がモニックで (g∘f)∘u = (g∘f)∘v とする。<b>最初に<\/b>簡約する射はどれ？クリックしよう。"}, "answer": "g", "explain": {"en": "After reassociating, g∘(f∘u) = g∘(f∘v): g is the outermost arrow, so it is cancelled first. Then f∘u = f∘v, and f is cancelled.", "ja": "結合し直すと g∘(f∘u) = g∘(f∘v)。一番外側は g なので g を先に簡約する。すると f∘u = f∘v となり、次に f を簡約する。"}}, "steps": [{"text": {"en": "Let f : a → b and g : b → c be monic, and let u, v : z → a satisfy (g∘f)∘u = (g∘f)∘v.", "ja": "f : a → b と g : b → c をモニックとし、u, v : z → a が (g∘f)∘u = (g∘f)∘v を満たすとする。"}, "hi": ["u", "v", "gf"]}, {"text": {"en": "By associativity, g∘(f∘u) = g∘(f∘v).", "ja": "結合律より g∘(f∘u) = g∘(f∘v)。"}, "hi": ["g", "f", "u", "v"]}, {"text": {"en": "g is monic, so cancel it: f∘u = f∘v.", "ja": "g はモニックなので簡約できる：f∘u = f∘v。"}, "hi": ["g"]}, {"text": {"en": "f is monic, so cancel it: u = v. Hence g∘f is monic.", "ja": "f はモニックなので簡約できる：u = v。よって g∘f はモニック。"}, "hi": ["f", "u", "v"]}, {"text": {"en": "Dually, for epis f, g and arrows x, y out of c with x∘(g∘f) = y∘(g∘f): cancel f first, then g. The composite of epis is epi.", "ja": "双対的に、エピ射 f, g と c から出る射 x, y で x∘(g∘f) = y∘(g∘f) のとき：先に f、次に g を簡約する。エピ射の合成はエピ。"}, "hi": ["gf"]}], "distractors": [{"text": {"en": "f is monic, so cancel f first: g∘u = g∘v.", "ja": "f はモニックなので先に f を簡約する：g∘u = g∘v。"}, "why": {"en": "In g∘(f∘u) the outermost arrow is g, not f. Also g∘u does not even make sense: u lands in a, but g starts at b.", "ja": "g∘(f∘u) で一番外側にあるのは f ではなく g。そもそも g∘u は意味をなさない：u の終域は a だが g の始域は b。"}}, {"text": {"en": "Since g∘f is monic, f and g are both monic.", "ja": "g∘f はモニックなので、f も g もモニックである。"}, "why": {"en": "That is the converse direction, and it is false for g (Exercise 3). Here we prove that the composite is monic.", "ja": "それは逆向きの主張で、g については偽である（演習問題 3）。ここで示すのは合成がモニックであること。"}}], "lean": [{"name": "ex2_mono", "header": "theorem ex2_mono {C : Type*} [Category C] {a b c : C} (f : a ⟶ b) (g : b ⟶ c)\n    [Mono f] [Mono g] : Mono (f ≫ g) := by", "initial": "C : Type u_1\ninst✝² : Category.{u_2, u_1} C\na b c : C\nf : a ⟶ b\ng : b ⟶ c\ninst✝¹ : Mono f\ninst✝ : Mono g\n⊢ Mono (f ≫ g)", "lines": [{"code": "  constructor", "note": {"en": "Unfold `Mono`: we must show left cancellation for `f ≫ g` (= g∘f).", "ja": "`Mono` を展開する：`f ≫ g`（= g∘f）の左簡約可能性を示す。"}, "state": "case right_cancellation\nC : Type u_1\ninst✝² : Category.{u_2, u_1} C\na b c : C\nf : a ⟶ b\ng : b ⟶ c\ninst✝¹ : Mono f\ninst✝ : Mono g\n⊢ ∀ {Z : C} (g_1 h : Z ⟶ a), g_1 ≫ f ≫ g = h ≫ f ≫ g → g_1 = h"}, {"code": "  intro z u v h", "note": {"en": "Take u, v : z ⟶ a with u ≫ (f ≫ g) = v ≫ (f ≫ g).", "ja": "u, v : z ⟶ a で u ≫ (f ≫ g) = v ≫ (f ≫ g) となるものをとる。"}, "state": "case right_cancellation\nC : Type u_1\ninst✝² : Category.{u_2, u_1} C\na b c : C\nf : a ⟶ b\ng : b ⟶ c\ninst✝¹ : Mono f\ninst✝ : Mono g\nz : C\nu v : z ⟶ a\nh : u ≫ f ≫ g = v ≫ f ≫ g\n⊢ u = v"}, {"code": "  rw [← Category.assoc, ← Catego (1/d) = v(1/d).", "ja": "= u((1/d)·d)·v(1/d) = u(1)·v(1/d) = v(1/d)。"}, "state": null}, {"code": "  ext q", "note": {"en": "Now compare f and g at an arbitrary rational q.", "ja": "任意の有理数 q で f と g を比べる。"}, "state": "case a\nR : Type u_1\ninst✝ : Ring R\nf g : ℚ →+* R\nh : f.comp (Int.castRingHom ℚ) = g.comp (Int.castRingHom ℚ)\nhz : ∀ (n : ℤ), f ↑n = g ↑n\nhinv : ∀ (d : ℕ), d ≠ 0 → f (↑d)⁻¹ = g (↑d)⁻¹\nq : ℚ\n⊢ f q = g q", "wrong": [{"code": "  rfl", "why": {"en": "f and g are not equal by definition; we have to compute.", "ja": "f と g は定義的に等しくはない。計算が必要。"}, "lean_error": "Tactic `rfl` failed: The left-hand side\n  f\nis not definitionally equal to the right-hand side\n  g\n\nR : Type u_1\ninst✝ : Ring R\nf g : ℚ →+* R\nh : f.comp (Int.castRingHom ℚ) = g.comp (Int.castRingHom ℚ)\nhz : ∀ (n : ℤ), f ↑n = g ↑n\nhinv : ∀ (d : ℕ), d ≠ 0 → f (↑d)⁻¹ = g (↑d)⁻¹\n⊢ f = g"}, {"code": "  intro q", "why": {"en": "The goal f = g is an equation, not a ∀-statement; use `ext`.", "ja": "ゴール f = g は等式であって ∀ 文ではない。`ext` を使う。"}, "lean_error": "Tactic `introN` failed: There are no additional binders or `let` bindings in the goal to introduce\n\nR : Type u_1\ninst✝ : Ring R\nf g : ℚ →+* R\nh : f.comp (Int.castRingHom ℚ) = g.comp (Int.castRingHom ℚ)\nhz : ∀ (n : ℤ), f ↑n = g ↑n\nhinv : ∀ (d : ℕ), d ≠ 0 → f (↑d)⁻¹ = g (↑d)⁻¹\n⊢ f = g"}]}, {"code": "  rw [← Rat.num_div_den q, div_eq_mul_inv, map_mul, map_mul, hz, hinv q.den q.den_nz]", "note": {"en": "Write q = n · (1/d): f(q) = f(n)·f(1/d) = g(n)·g(1/d) = g(q).", "ja": "q = n · (1/d) と書く：f(q) = f(n)·f(1/d) = g(n)·g(1/d) = g(q)。"}, "state": "", "wrong": [{"code": "  rw [← Rat.num_div_den q, div_eq_mul_inv, map_mul, map_mul, hz]", "why": {"en": "Agreement on integers alone is not enough: we also need f(1/d) = g(1/d).", "ja": "整数上の一致だけでは足りない。f(1/d) = g(1/d) も必要。"}, "lean_error": "unsolved goals\ncase a\nR : Type u_1\ninst✝ : Ring R\nf g : ℚ →+* R\nh : f.comp (Int.castRingHom ℚ) = g.comp (Int.castRingHom ℚ)\nhz : ∀ (n : ℤ), f ↑n = g ↑n\nhinv : ∀ (d : ℕ), d ≠ 0 → f (↑d)⁻¹ = g (↑d)⁻¹\nq : ℚ\n⊢ g ↑q.num * f (↑q.den)⁻¹ = g ↑q.num * g (↑q.den)⁻¹"}, {"code": "  rw [map_mul, hz]", "why": {"en": "q is not written as a product yet, so `map_mul` has nothing to rewrite.", "ja": "q はまだ積の形になっていないので、`map_mul` で書き換えるものがない。"}, "lean_error": "Tactic `rewrite` failed: Did not find an occurrence of the pattern\n  ?f (?x * ?y)\nin the target expression\n  f q = g q\n\ncase a\nR : Type u_1\ninst✝ : Ring R\nf g : ℚ →+* R\nh : f.comp (Int.castRingHom ℚ) = g.comp (Int.castRingHom ℚ)\nhz : ∀ (n : ℤ), f ↑n = g ↑n\nhinv : ∀ (d : ℕ), d ≠ 0 → f (↑d)⁻¹ = g (↑d)⁻¹\nq : ℚ\n⊢ f q = g q"}]}]}], "lean_sha256": "d41634e76eba0607efae93d796bf8aa52d3ee30107885b906fb887c35e4f4f7a"}, {"n": 5, "title": {"en": "In Grp, epi ⇒ surjective", "ja": "Grp ではエピ ⇒ 全射"}, "statement": {"en": "In Grp prove that every epi is surjective (Hint: if φ : G → H has image M not H, use the factor group H/M if M has index 2. Otherwise, let Perm H be the group of all permutations of the set H, choose three different cosets M, Mu and Mv of M, define σ ∈ Perm H by σ(xu) = xv, σ(xv) = xu for x ∈ M, and σ otherwise the identity. Let ψ : H → Perm H send each h to left multiplication ψ_h by h, while ψ′_h = σ⁻¹ψ_hσ. Then ψφ = ψ′φ, but ψ ≠ ψ′).", "ja": "Grp ではすべてのエピ射が全射であることを証明せよ（ヒント：φ : G → H の像 M が H でないとする。M の指数が 2 なら剰余群 H/M を使う。そうでなければ、集合 H の置換全体の群を Perm H とし、M の相異なる三つの剰余類 M, Mu, Mv を選び、x ∈ M に対して σ(xu) = xv, σ(xv) = xu、それ以外では恒等写像となる σ ∈ Perm H を定める。ψ : H → Perm H を各 h をh による左乗法 ψ_h に送る写像とし、ψ′_h = σ⁻¹ψ_hσ とする。すると ψφ = ψ′φ だが ψ ≠ ψ′）。"}, "answer": {"en": "If the image M were not H, two different maps out of H would agree on M.", "ja": "像 M が H でなければ、H から出る相異なる二つの射が M 上で一致してしまう。"}, "nodes": {"G": {"x": 70, "y": 120, "label": "G"}, "H": {"x": 300, "y": 120, "label": "H"}, "M": {"x": 185, "y": 250, "label": "M"}, "P": {"x": 500, "y": 120, "label": "Perm H"}}, "edges": [{"id": "phi", "src": "G", "dst": "H", "label": "φ", "bend": 0, "dashed": false, "color": null}, {"id": "onto", "src": "G", "dst": "M", "label": "onto", "bend": 0, "dashed": true, "color": null}, {"id": "incl", "src": "M", "dst": "H", "label": "⊆", "bend": 0, "dashed": false, "color": null}, {"id": "psi", "src": "H", "dst": "P", "label": "ψ", "bend": -40, "dashed": false, "color": null}, {"id": "psi2", "src": "H", "dst": "P", "label": "ψ′ = σ⁻¹ψσ", "bend": 40, "dashed": false, "color": null}], "click": {"q": {"en": "Assume the image of φ is not all of H. Click the arrow that is assumed <b>not<\/b> to be onto.", "ja": "φ の像が H 全体でないと仮定する。全射で<b>ない<\/b>と仮定される射をクリックしよう。"}, "answer": "incl", "explain": {"en": "φ factors as G ↠ M ⊆ H. φ is onto exactly when the inclusion M ⊆ H is all of H; we show M ≠ H is impossible.", "ja": "φ は G ↠ M ⊆ H と分解する。φ が全射 ⇔ 包含 M ⊆ H が H 全体。M ≠ H が不可能であることを示す。"}}, "steps": [{"text": {"en": "Let φ : G → H be epi with image M, and suppose M ≠ H.", "ja": "φ : G → H をエピ射、その像を M とし、M ≠ H と仮定する。"}, "hi": ["phi", "onto", "incl"]}, {"text": {"en": "If M has index 2, M is normal; the projection H → H/M and the trivial map H → H/M agree on M, hence after φ, but they differ. Contradiction.", "ja": "M の指数が 2 なら M は正規部分群。射影 H → H/M と自明な射 H → H/M は M 上で、したがって φ の後で一致するが、両者は異なる。矛盾。"}, "hi": ["phi"]}, {"text": {"en": "Otherwise choose three different cosets M, Mu, Mv and the permutation σ of H swapping xu ↔ xv (x ∈ M), identity elsewhere.", "ja": "そうでなければ相異なる三つの剰余類 M, Mu, Mv と、xu ↔ xv（x ∈ M）を入れ替え、それ以外は動かさない H の置換 σ をとる。"}, "hi": ["incl"]}, {"text": {"en": "Let ψ_h = left multiplication by h and ψ′_h = σ⁻¹ψ_hσ. For m ∈ M, ψ_m preserves each coset and commutes with σ, so ψ∘φ = ψ′∘φ.", "ja": "ψ_h を h による左乗法、ψ′_h = σ⁻¹ψ_hσ とする。m ∈ M なら ψ_m は各剰余類を保ち σ と可換なので ψ∘φ = ψ′∘φ。"}, "hi": ["psi", "psi2", "phi"]}, {"text": {"en": "But ψ ≠ ψ′: otherwise σ commutes with every left multiplication, so σ(h) = h·σ(1) = h for all h — yet σ(u) = v ≠ u.", "ja": "しかし ψ ≠ ψ′：そうでなければ σ はすべての左乗法と可換なので、すべての h で σ(h) = h·σ(1) = h となるが、σ(u) = v ≠ u。"}, "hi": ["psi", "psi2"]}, {"text": {"en": "This contradicts φ being epi. So M = H: φ is surjective.", "ja": "これは φ がエピであることに矛盾。よって M = H、φ は全射。"}, "hi": ["phi"]}], "distractors": [{"text": {"en": "Epi means right-cancellable, which in every category means surjective.", "ja": "エピとは右簡約可能ということで、どの圏でもそれは全射を意味する。"}, "why": {"en": "False in Rng (ℤ → ℚ, Exercise 4). In Grp it takes this real argument.", "ja": "Rng では偽（ℤ → ℚ、演習問題 4）。Grp ではこの実質的な議論が必要。"}}, {"text": {"en": "Use the quotient H → H/M in every case.", "ja": "どの場合も商 H → H/M を使う。"}, "why": {"en": "H/M is a group only when M is normal. Index 2 guarantees that, but in general it fails — hence the Perm H trick.", "ja": "H/M が群になるのは M が正規のときだけ。指数 2 ならそれが保証されるが、一般には成り立たない。だから Perm H の技法を使う。"}}], "lean": [{"name": "ex5", "header": "theorem ex5 {G H : GrpCat} (φ : G ⟶ H) [Epi φ] : Function.Surjective φ := by", "initial": "G H : GrpCat\nφ : G ⟶ H\ninst✝ : Epi φ\n⊢ Function.Surjective ⇑(ConcreteCategory.hom φ)", "lines": [{"code": "  exact (GrpCat.epi_iff_surjective φ).mp inferInstance", "note": {"en": "Mathlib proves the hard direction (the argument of the hint) as `GrpCat.epi_iff_surjective`; we use its forward direction.", "ja": "難しい向き（ヒントの議論）は Mathlib の `GrpCat.epi_iff_surjective` に証明されている。その順方向を使う。"}, "state": "", "wrong": [{"code": "  exact (GrpCat.epi_iff_surjective φ).mpr inferInstance", "why": {"en": "`.mpr` goes from surjective to epi — the wrong direction.", "ja": "`.mpr` は全射からエピへの向きで、逆向き。"}, "lean_error": "type class instance expected\n  Function.Surjective ⇑(ConcreteCategory.hom φ)"}, {"code": "  exact inferInstance", "why": {"en": "Surjectivity is not a type-class instance that Lean can find automatically.", "ja": "全射性は Lean が自動的に見つけられる型クラスのインスタンスではない。"}, "lean_error": "type class instance expected\n  Function.Surjective ⇑(ConcreteCategory.hom φ)"}]}]}, {"name": "ex5_converse", "header": "theorem ex5_converse {G H : GrpCat} (φ : G ⟶ H) (hφ : Function.Surjective φ) :\n    Epi φ := by", "initial": "G H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\n⊢ Epi φ", "lines": [{"code": "  constructor", "note": {"en": "The easy converse: surjective ⇒ epi. Unfold `Epi`.", "ja": "やさしい逆向き：全射 ⇒ エピ。`Epi` を展開する。"}, "state": "case left_cancellation\nG H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\n⊢ ∀ {Z : GrpCat} (g h : H ⟶ Z), φ ≫ g = φ ≫ h → g = h"}, {"code": "  intro K u v h", "note": {"en": "Take u, v : H ⟶ K with φ ≫ u = φ ≫ v.", "ja": "u, v : H ⟶ K で φ ≫ u = φ ≫ v となるものをとる。"}, "state": "case left_cancellation\nG H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\nK : GrpCat\nu v : H ⟶ K\nh : φ ≫ u = φ ≫ v\n⊢ u = v"}, {"code": "  ext y", "note": {"en": "Compare u and v at an element y of H.", "ja": "H の元 y で u と v を比べる。"}, "state": "case left_cancellation.hf.h\nG H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\nK : GrpCat\nu v : H ⟶ K\nh : φ ≫ u = φ ≫ v\ny : ↑H\n⊢ (GrpCat.Hom.hom u) y = (GrpCat.Hom.hom v) y"}, {"code": "  obtain ⟨x, rfl⟩ := hφ y", "note": {"en": "y = φ(x) for some x, by surjectivity.", "ja": "全射性より、ある x について y = φ(x)。"}, "state": "case left_cancellation.hf.h\nG H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\nK : GrpCat\nu v : H ⟶ K\nh : φ ≫ u = φ ≫ v\nx : ↑G\n⊢ (GrpCat.Hom.hom u) ((ConcreteCategory.hom φ) x) = (GrpCat.Hom.hom v) ((ConcreteCategory.hom φ) x)", "wrong": [{"code": "  obtain ⟨x, hx⟩ := hφ y", "why": {"en": "Without substituting y = φ x, the last line cannot see that y is an image.", "ja": "y = φ x を代入しないと、最後の行で y が像であることが使えない。"}, "lean_error": "Type mismatch\n  congrArg (fun k => k x) (congrArg (fun w => ConcreteCategory.hom w) h)\nhas type\n  ((fun w => ConcreteCategory.hom w) (φ ≫ u)) x = ((fun w => ConcreteCategory.hom w) (φ ≫ v)) x\nbut is expected to have type\n  (GrpCat.Hom.hom u) y = (GrpCat.Hom.hom v) y"}, {"code": "  intro x", "why": {"en": "The goal is an equation, not a ∀-statement.", "ja": "ゴールは等式であって ∀ 文ではない。"}, "lean_error": "Tactic `introN` failed: There are no additional binders or `let` bindings in the goal to introduce\n\ncase left_cancellation.hf.h\nG H : GrpCat\nφ : G ⟶ H\nhφ : Function.Surjective ⇑(ConcreteCategory.hom φ)\nK : GrpCat\nu v : H ⟶ K\nh : φ ≫ u = φ ≫ v\ny : ↑H\n⊢ (GrpCat.Hom.hom u) y = (GrpCat.Hom.hom v) y"}]}, {"code": "  exact congrArg (fun k => k x) (congrArg (fun w => ConcreteCategory.hom w) h)", "note": {"en": "Apply both sides of φ ≫ u = φ ≫ v to x: u(φ x) = v(φ x).", "ja": "φ ≫ u = φ ≫ v の両辺を x に適用する：u(φ x) = v(φ x)。"}, "state": ""}]}], "lean_sha256": "2f1d67c613ca12f97e5800b502703b2af2fea049f60828ca25799bceeb6563db"}, {"n": 6, "title": {"en": "Idempotents split in Set", "ja": "Set では冪等射は分裂する"}, "statement": {"en": "In Set, show that all idempotents split.", "ja": "Set ではすべての冪等射が分裂することを示せ。"}, "answer": {"en": "Split f : X → X through its image Y = f(X).", "ja": "f : X → X をその像 Y = f(X) を経由して分裂させる。"}, "nodes": {"X": {"x": 150, "y": 160, "label": "X"}, "Y": {"x": 410, "y": 160, "label": "Y = f(X)"}}, "edges": [{"id": "f", "src": "X", "dst": "X", "label": "f", "bend": -1, "dashed": false, "color": null}, {"id": "g", "src": "X", "dst": "Y", "label": "g", "bend": -45, "dashed": false, "color": null}, {"id": "h", "src": "Y", "dst": "X", "label": "h ⊆", "bend": -45, "dashed": false, "color": null}, {"id": "idY", "src": "Y", "dst": "Y", "label": "1_Y", "bend": 1, "dashed": false, "color": null}], "click": {"q": {"en": "f = h∘g with g∘h = 1_Y. Click the arrow that is the <b>inclusion<\/b> of the image.", "ja": "f = h∘g かつ g∘h = 1_Y。像の<b>包含<\/b>である射をクリックしよう。"}, "answer": "h", "explain": {"en": "h : Y → X is the inclusion of the image; g : X → Y is f with its codomain cut down to Y.", "ja": "h : Y → X は像の包含。g : X → Y は f の終域を Y に制限したもの。"}}, "steps": [{"text": {"en": "Let f : X → X be idempotent: f∘f = f.", "ja": "f : X → X を冪等射（f∘f = f）とする。"}, "hi": ["f"]}, {"text": {"en": "Let Y = f(X) = {f(x) | x ∈ X}, the image of f.", "ja": "Y = f(X) = {f(x) | x ∈ X}（f の像）とおく。"}, "hi": []}, {"text": {"en": "Let g : X → Y, g(x) = f(x), and let h : Y → X be the inclusion.", "ja": "g : X → Y を g(x) = f(x)、h : Y → X を包含写像とする。"}, "hi": ["g", "h"]}, {"text": {"en": "Then h∘g = f, by definition.", "ja": "定義より h∘g = f。"}, "hi": ["g", "h", "f"]}, {"text": {"en": "And g∘h = 1_Y: a point y = f(x) of Y goes to f(f(x)) = f(x) = y, because f∘f = f.", "ja": "さらに g∘h = 1_Y：Y の点 y = f(x) は f(f(x)) = f(x) = y に移る（f∘f = f より）。"}, "hi": ["h", "g", "idY"]}], "distractors": [{"text": {"en": "Take Y = X, g = f and h = 1_X.", "ja": "Y = X, g = f, h = 1_X とする。"}, "why": {"en": "Then g∘h = f, which is 1_X only when f = 1_X.", "ja": "このとき g∘h = f で、これが 1_X になるのは f = 1_X のときだけ。"}}, {"text": {"en": "g∘h = 1_Y holds for every f, idempotent or not.", "ja": "g∘h = 1_Y は冪等かどうかに関係なくすべての f で成り立つ。"}, "why": {"en": "It needs f∘f = f: the point y = f(x) goes to f(f(x)), which must equal f(x).", "ja": "f∘f = f が必要：点 y = f(x) は f(f(x)) に移り、これが f(x) に等しくなければならない。"}}], "lean": [{"name": "ex6", "header": "theorem ex6 {X : Type} (f : X → X) (hf : f ∘ f = f) :\n    ∃ (Y : Type) (g : X → Y) (h : Y → X), h ∘ g = f ∧ g ∘ h = id := by", "initial": "X : Type\nf : X → X\nhf : f ∘ f = f\n⊢ ∃ Y g h, h ∘ g = f ∧ g ∘ h = id", "lines": [{"code": "  refine ⟨Set.range f, fun x => ⟨f x, x, rfl⟩, Subtype.val, rfl, ?_⟩", "note": {"en": "Y = image of f, g = f with codomain Y, h = inclusion; h∘g = f holds by rfl.", "ja": "Y = f の像、g = 終域を Y にした f、h = 包含。h∘g = f は rfl で成り立つ。"}, "state": "X : Type\nf : X → X\nhf : f ∘ f = f\n⊢ (fun x => ⟨f x, ⋯⟩) ∘ Subtype.val = id", "wrong": [{"code": "  refine ⟨X, f, id, rfl, ?_⟩", "why": {"en": "With Y = X, g = f, h = id the remaining goal is f ∘ id = id, which is false in general (and the points of Y are no longer pairs ⟨y, hy⟩).", "ja": "Y = X, g = f, h = id とすると残るゴールは f ∘ id = id で、一般には偽（しかも Y の点はもはや組 ⟨y, hy⟩ ではない）。"}, "lean_error": "Invalid `⟨...⟩` notation: The expected type `X` is not an inductive type\n\nNote: This notation can only be used when the expected type is an inductive type with a single constructor"}, {"code": "  refine ⟨Set.range f, fun x => ⟨f x, x, rfl⟩, Subtype.val, ?_, rfl⟩", "why": {"en": "g ∘ h = id does not hold by `rfl`; it needs the idempotence of f.", "ja": "g ∘ h = id は `rfl` では成り立たない。f の冪等性が必要。"}, "lean_error": "Application type mismatch: The argument\n  rfl\nhas type\n  ?m.39 = ?m.39\nbut is expected to have type\n  (fun x => ⟨f x, ⋯⟩) ∘ Subtype.val = id\nin the application\n  ⟨?m.37, rfl⟩"}]}, {"code": "  funext ⟨y, hy⟩", "note": {"en": "Check g∘h = 1_Y at a point y of the image.", "ja": "像の点 y で g∘h = 1_Y を確かめる。"}, "state": "case h\nX : Type\nf : X → X\nhf : f ∘ f = f\ny : X\nhy : y ∈ Set.range f\n⊢ ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨y, hy⟩ = id ⟨y, hy⟩"}, {"code": "  obtain ⟨x, rfl⟩ := hy", "note": {"en": "y = f(x) for some x.", "ja": "ある x について y = f(x)。"}, "state": "case h\nX : Type\nf : X → X\nhf : f ∘ f = f\nx : X\n⊢ ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨f x, ⋯⟩ = id ⟨f x, ⋯⟩", "wrong": [{"code": "  obtain ⟨x, hx⟩ := hf", "why": {"en": "`hf` is an equation of functions, not an existence statement.", "ja": "`hf` は関数の等式であって存在命題ではない。"}, "lean_error": "Tactic `cases` failed with a nested error:\nDependent elimination failed: Failed to solve equation\n  f = f ∘ f"}, {"code": "  intro x", "why": {"en": "There is nothing to introduce: the goal is an equation.", "ja": "導入するものはない。ゴールは等式である。"}, "lean_error": "Tactic `introN` failed: There are no additional binders or `let` bindings in the goal to introduce\n\ncase h\nX : Type\nf : X → X\nhf : f ∘ f = f\ny : X\nhy : y ∈ Set.range f\n⊢ ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨y, hy⟩ = id ⟨y, hy⟩"}]}, {"code": "  exact Subtype.ext (congrFun hf x)", "note": {"en": "f(f(x)) = f(x), by idempotence.", "ja": "冪等性より f(f(x)) = f(x)。"}, "state": "", "wrong": [{"code": "  rfl", "why": {"en": "f(f(x)) = f(x) is not true by definition — it uses `hf`.", "ja": "f(f(x)) = f(x) は定義からは出ない。`hf` を使う。"}, "lean_error": "Tactic `rfl` failed: The left-hand side\n  ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨f x, ⋯⟩\nis not definitionally equal to the right-hand side\n  id ⟨f x, ⋯⟩\n\ncase h\nX : Type\nf : X → X\nhf : f ∘ f = f\nx : X\n⊢ ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨f x, ⋯⟩ = id ⟨f x, ⋯⟩"}, {"code": "  exact congrFun hf x", "why": {"en": "The goal is an equality in the subtype Y; first reduce it with `Subtype.ext`.", "ja": "ゴールは部分型 Y での等式。まず `Subtype.ext` で帰着させる。"}, "lean_error": "Type mismatch\n  congrFun hf x\nhas type\n  (f ∘ f) x = f x\nbut is expected to have type\n  ((fun x => ⟨f x, ⋯⟩) ∘ Subtype.val) ⟨f x, ⋯⟩ = id ⟨f x, ⋯⟩"}]}]}], "lean_sha256": "94a26beb880937fd88afa0ee186bb92eb46062201f286503ba725cbe6c15549e"}, {"n": 7, "title": {"en": "Regular arrows", "ja": "正則な射"}, "statement": {"en": "An arrow f : a → b in a category C is regular when there exists an arrow g : b → a such that f g f = f. Show that f is regular if it has either a left or a right inverse, and prove that every arrow in Set with a ≠ ∅ is regular.", "ja": "圏 C の射 f : a → b が正則であるとは、f g f = f となる射 g : b → a が存在することである。f が左逆射または右逆射をもてば正則であることを示し、a ≠ ∅ である Set のすべての射が正則であることを証明せよ。"}, "answer": {"en": "Use the inverse as g; in Set, let g pick a preimage (or a fixed point a₀).", "ja": "逆射を g とする。Set では g に逆像の点（なければ固定した点 a₀）を選ばせる。"}, "nodes": {"a": {"x": 150, "y": 160, "label": "a"}, "b": {"x": 410, "y": 160, "label": "b"}}, "edges": [{"id": "f", "src": "a", "dst": "b", "label": "f", "bend": -45, "dashed": false, "color": null}, {"id": "g", "src": "b", "dst": "a", "label": "g", "bend": -45, "dashed": false, "color": null}, {"id": "ida", "src": "a", "dst": "a", "label": "1_a", "bend": -1, "dashed": false, "color": null}, {"id": "idb", "src": "b", "dst": "b", "label": "1_b", "bend": 1, "dashed": false, "color": null}], "click": {"q": {"en": "Suppose g is a <b>left<\/b> inverse of f (g∘f = 1). Which identity arrow does g∘f equal? Click it.", "ja": "g が f の<b>左<\/b>逆射（g∘f = 1）だとする。g∘f はどちらの恒等射に等しい？クリックしよう。"}, "answer": "ida", "explain": {"en": "g∘f goes a → b → a, so it is 1_a. Then f∘g∘f = f∘1_a = f.", "ja": "g∘f は a → b → a なので 1_a。よって f∘g∘f = f∘1_a = f。"}}, "steps": [{"text": {"en": "f is regular if some g : b → a has f∘g∘f = f.", "ja": "f が正則 ⇔ ある g : b → a で f∘g∘f = f。"}, "hi": ["f", "g"]}, {"text": {"en": "If g is a left inverse (g∘f = 1_a): f∘g∘f = f∘(g∘f) = f∘1_a = f.", "ja": "g が左逆射（g∘f = 1_a）なら：f∘g∘f = f∘(g∘f) = f∘1_a = f。"}, "hi": ["ida"]}, {"text": {"en": "If g is a right inverse (f∘g = 1_b): f∘g∘f = (f∘g)∘f = 1_b∘f = f.", "ja": "g が右逆射（f∘g = 1_b）なら：f∘g∘f = (f∘g)∘f = 1_b∘f = f。"}, "hi": ["idb"]}, {"text": {"en": "In Set with a ≠ ∅, fix a₀ ∈ a. Let g(y) be some x with f(x) = y if y is in the image of f, and a₀ otherwise.", "ja": "a ≠ ∅ の Set で a₀ ∈ a を固定する。y が f の像にあれば f(x) = y となる x を g(y) とし、そうでなければ g(y) = a₀ とする。"}, "hi": ["g"]}, {"text": {"en": "For every x, g(f(x)) is a preimage of f(x), so f(g(f(x))) = f(x). Hence f∘g∘f = f.", "ja": "すべての x で g(f(x)) は f(x) の逆像の点なので f(g(f(x))) = f(x)。よって f∘g∘f = f。"}, "hi": ["f", "g"]}], "distractors": [{"text": {"en": "The condition a ≠ ∅ is not needed: take any function g : b → a.", "ja": "a ≠ ∅ という条件は不要：任意の関数 g : b → a をとればよい。"}, "why": {"en": "If a = ∅ and b ≠ ∅, there is no function b → ∅ at all.", "ja": "a = ∅ かつ b ≠ ∅ なら、b → ∅ という関数はそもそも存在しない。"}}, {"text": {"en": "g(f(x)) = x for every x.", "ja": "すべての x で g(f(x)) = x。"}, "why": {"en": "Only if f is injective. We only need f(g(f(x))) = f(x).", "ja": "それは f が単射のときだけ。必要なのは f(g(f(x))) = f(x) だけ。"}}], "lean": [{"name": "ex7_left", "header": "theorem ex7_left {C : Type*} [Category C] {a b : C} (f : a ⟶ b) (g : b ⟶ a)\n    (hg : f ≫ g = 𝟙 a) : f ≫ g ≫ f = f := by", "initial": "C : Type u_1\ninst✝ : Category.{u_2, u_1} C\na b : C\nf : a ⟶ b\ng : b ⟶ a\nhg : f ≫ g = 𝟙 a\n⊢ f ≫ g ≫ f = f", "lines": [{"code": "  rw [← Category.assoc, hg, Category.id_comp]", "note": {"en": "(f ≫ g) ≫ f = 𝟙 ≫ f = f, i.e. f∘(g∘f) = f∘1_a = f.", "ja": "(f ≫ g) ≫ f = 𝟙 ≫ f = f、すなわち f∘(g∘f) = f∘1_a = f。"}, "state": "", "wrong": [{"code": "  rw [hg, Category.comp_id]", "why": {"en": "`f ≫ g` does n 7_set", "header": "theorem ex7_set {a b : Type} [Nonempty a] (f : a → b) :\n    ∃ g : b → a, f ∘ g ∘ f = f := by", "initial": "a b : Type\ninst✝ : Nonempty a\nf : a → b\n⊢ ∃ g, f ∘ g ∘ f = f", "lines": [{"code": "  refine ⟨Function.invFun f, ?_⟩", "note": {"en": "`Function.invFun f` picks a preimage when there is one, and a default point of a (which exists since a ≠ ∅) otherwise.", "ja": "`Function.invFun f` は逆像があればその点を、なければ a の既定の点（a ≠ ∅ なので存在する）を選ぶ。"}, "state": "a b : Type\ninst✝ : Nonempty a\nf : a → b\n⊢ f ∘ Function.invFun f ∘ f = f", "wrong": [{"code": "  refine ⟨f, ?_⟩", "why": {"en": "f goes from a to b, but g must go from b to a.", "ja": "f は a から b への写像だが、g は b から a でなければならない。"}, "lean_error": "Application type mismatch: The argument\n  f\nhas type\n  a → b\nbut is expected to have type\n  b → a\nin the application\n  Exists.intro f"}, {"code": "  refine ⟨id, ?_⟩", "why": {"en": "`id : b → b` does not land in a.", "ja": "`id : b → b` は a に値をとらない。"}, "lean_error": "Application type mismatch: The argument\n  id\nhas type\n  ?m.12 → ?m.12\nbut is expected to have type\n  b → a\nin the application\n  Exists.intro id"}]}, {"code": "  funext x", "note": {"en": "Check f(g(f(x))) = f(x) at each x.", "ja": "各 x で f(g(f(x))) = f(x) を確かめる。"}, "state": "case h\na b : Type\ninst✝ : Nonempty a\nf : a → b\nx : a\n⊢ (f ∘ Function.invFun f ∘ f) x = f x"}, {"code": "  exact Function.invFun_eq ⟨x, rfl⟩", "note": {"en": "f(x) has the preimage x, so invFun picks a genuine preimage of f(x).", "ja": "f(x) は逆像 x をもつので、invFun は f(x) の本当の逆像を選ぶ。"}, "state": "", "wrong": [{"code": "  exact Function.leftInverse_invFun ⟨x, rfl⟩ x", "why": {"en": "That lemma needs f to be injective, and its arguments do not fit.", "ja": "その補題は f が単射であることを必要とし、引数も合わない。"}, "lean_error": "Invalid `⟨...⟩` notation: The expected type\n  ∀ ⦃a₁ a₂ : ?m.23⦄, ?m.26 a₁ = ?m.26 a₂ → a₁ = a₂\nis not an inductive type\n\nNote: This notation can only be used when the expected type is an inductive type with a single constructor"}, {"code": "  rfl", "why": {"en": "invFun is defined by choice; nothing here holds by `rfl`.", "ja": "invFun は選択によって定義されるので、ここでは `rfl` で成り立つものはない。"}, "lean_error": "Tactic `rfl` failed: The left-hand side\n  (f ∘ Function.invFun f ∘ f) x\nis not definitionally equal to the right-hand side\n  f x\n\ncase h\na b : Type\ninst✝ : Nonempty a\nf : a → b\nx : a\n⊢ (f ∘ Function.invFun f ∘ f) x = f x"}]}]}], "lean_sha256": "c3ea910aa1400f854957f81e509f11d75889194a0850c9855ddeef2b95d730d6"}, {"n": 8, "title": {"en": "(ℕ, 0, succ) is initial", "ja": "(ℕ, 0, succ) は始対象"}, "statement": {"en": "Consider the category with objects (X, e, t), where X is a set, e ∈ X, and t : X → X, and with arrows f : (X, e, t) → (X′, e′, t′) the functions f on X to X′ with f e = e′ and f t = t′ f. Prove that this category has an initial object in which X is the set of natural numbers, e = 0, and t is the successor function.", "ja": "対象を (X, e, t)（X は集合、e ∈ X、t : X → X）、射 f : (X, e, t) → (X′, e′, t′) を f e = e′ かつ f t = t′ f を満たす X から X′ への関数とする圏を考える。この圏が、X を自然数の集合、e = 0、t を後者関数とする始対象をもつことを証明せよ。"}, "answer": {"en": "Recursion gives an arrow; induction proves it is the only one.", "ja": "再帰で射が得られ、帰納法でそれが唯一であることが示せる。"}, "nodes": {"one": {"x": 60, "y": 160, "label": "1"}, "N1": {"x": 250, "y": 75, "label": "ℕ"}, "N2": {"x": 470, "y": 75, "label": "ℕ"}, "X1": {"x": 250, "y": 245, "label": "X"}, "X2": {"x": 470, "y": 245, "label": "X"}}, "edges": [{"id": "zero", "src": "one", "dst": "N1", "label": "0", "bend": 0, "dashed": false, "color": null}, {"id": "e", "src": "one", "dst": "X1", "label": "e", "bend": 0, "dashed": false, "color": null}, {"id": "s", "src": "N1", "dst": "N2", "label": "succ", "bend": 0, "dashed": false, "color": null}, {"id": "t", "src": "X1", "dst": "X2", "label": "t", "bend": 0, "dashed": false, "color": null}, {"id": "f1", "src": "N1", "dst": "X1", "label": "f", "bend": 0, "dashed": true, "color": null}, {"id": "f2", "src": "N2", "dst": "X2", "label": "f", "bend": 0, "dashed": true, "color": null}], "click": {"q": {"en": "“Initial” means: exactly one arrow to every object. Click the arrow whose existence and uniqueness we must prove (left copy).", "ja": "「始対象」とは、各対象へちょうど一つ射があること。存在と一意性を示すべき射（左側）をクリックしよう。"}, "answer": "f1", "explain": {"en": "f : ℕ → X must make both triangles/squares commute: f(0) = e and f∘succ = t∘f.", "ja": "f : ℕ → X は三角形と四角形を可換にしなければならない：f(0) = e かつ f∘succ = t∘f。"}}, "steps": [{"text": {"en": "Fix an object (X, e, t). An arrow (ℕ, 0, succ) → (X, e, t) is a function f : ℕ → X with f(0) = e and f∘succ = t∘f.", "ja": "対象 (X, e, t) を固定する。射 (ℕ, 0, succ) → (X, e, t) とは f(0) = e かつ f∘succ = t∘f を満たす関数 f : ℕ → X のこと。"}, "hi": ["f1", "zero", "e"]}, {"text": {"en": "Existence: define f by recursion: f(0) = e, f(n+1) = t(f(n)).", "ja": "存在：再帰で f を定める：f(0) = e, f(n+1) = t(f(n))。"}, "hi": ["f1", "f2"]}, {"text": {"en": "Then f(0) = e and f(succ n) = t(f(n)): both cells of the diagram commute.", "ja": "すると f(0) = e かつ f(succ n) = t(f(n))：図式の両方の部分が可換。"}, "hi": ["zero", "e", "s", "t", "f1", "f2"]}, {"text": {"en": "Uniqueness: let m be any arrow. Then m(0) = e = f(0).", "ja": "一意性：m を任意の射とする。すると m(0) = e = f(0)。"}, "hi": ["zero", "e"]}, {"text": {"en": "Induction: if m(k) = f(k), then m(k+1) = t(m(k)) = t(f(k)) = f(k+1). So m = f.", "ja": "帰納法：m(k) = f(k) ならば m(k+1) = t(m(k)) = t(f(k)) = f(k+1)。よって m = f。"}, "hi": ["s", "t"]}, {"text": {"en": "Exactly one arrow to every object: (ℕ, 0, succ) is initial.", "ja": "各対象へちょうど一つの射：(ℕ, 0, succ) は始対象。"}, "hi": ["f1"]}], "distractors": [{"text": {"en": "f(n) = tⁿ(e) is the only function ℕ → X at all, so uniqueness is automatic.", "ja": "f(n) = tⁿ(e) は ℕ → X の唯一の関数なので、一意性は自動的。"}, "why": {"en": "There are many functions ℕ → X. Uniqueness comes from the two equations, by induction.", "ja": "ℕ → X の関数はたくさんある。一意性は二つの等式から帰納法で得られる。"}}, {"text": {"en": "m and f agree at 0, hence everywhere.", "ja": "m と f は 0 で一致するので、至る所で一致する。"}, "why": {"en": "Agreement at 0 alone is not enough; the induction step uses m∘succ = t∘m.", "ja": "0 での一致だけでは足りない。帰納段階で m∘succ = t∘m を使う。"}}], "lean": [{"name": "natRec_unique", "header": "theorem natRec_unique (A : PtDyn) (m : natPtDyn ⟶ A) : m = natRec A := by", "initial": "A : PtDyn\nm : natPtDyn ⟶ A\n⊢ m = natRec A", "lines": [{"code": "  apply PtDyn.Hom.ext", "note": {"en": "Two arrows are equal when their underlying functions are.", "ja": "二つの射は、その関数が等しければ等しい。"}, "state": "case f\nA : PtDyn\nm : natPtDyn ⟶ A\n⊢ m.f = (natRec A).f"}, {"code": "  funext n", "note": {"en": "Compare them at each natural number n.", "ja": "各自然数 n で比べる。"}, "state": "case f.h\nA : PtDyn\nm : natPtDyn ⟶ A\nn : natPtDyn.X\n⊢ m.f n = (natRec A).f n"}, {"code": "  induction n with", "note": {"en": "Induction on n.", "ja": "n についての帰納法。"}, "state": null}, {"code": "  | zero => exact m.map_e", "note": {"en": "Base case: m(0) = e, because m preserves the point.", "ja": "基底：m は点を保つので m(0) = e。"}, "state": null, "wrong": [{"code": "  | zero => rfl", "why": {"en": "m is arbitrary, so m(0) is not e by definition; use `m.map_e`.", "ja": "m は任意なので m(0) は定義的には e でない。`m.map_e` を使う。"}, "lean_error": "Tactic `rfl` failed: The left-hand side\n  m.f Nat.zero\nis not definitionally equal to the right-hand side\n  (natRec A).f Nat.zero\n\ncase f.h.zero\nA : PtDyn\nm : natPtDyn ⟶ A\n⊢ m.f Nat.zero = (natRec A).f Nat.zero"}, {"code": "  | zero => exact m.map_t 0", "why": {"en": "`m.map_t 0` is about m(succ 0), not m(0).", "ja": "`m.map_t 0` は m(succ 0) についてで、m(0) ではない。"}, "lean_error": "failed to synthesize instance of type class\n  OfNat natPtDyn.X 0\nnumerals are polymorphic in Lean, but the numeral `0` cannot be used in a context where the expected type is\n  natPtDyn.X\ndue to the absence of the instance above\n\nHint: Type class instance resolution failures can be inspected with the `set_option trace.Meta.synthInstance true` command."}]}, {"code": "  | succ k ih =>", "note": {"en": "Induction step, with ih : m(k) = f(k).", "ja": "帰納段階。帰納法の仮定 ih : m(k) = f(k)。"}, "s   tabLean: { en: "③ Lean 4 proof", ja: "③ Lean 4 の証明" },
  bridge: {
    en: "Notation: the book writes <b>g∘f</b> (or <b>g f</b>) for “first f, then g”; Lean/Mathlib writes the same arrow as <code>f ≫ g</code>. Monic = left-cancellable (f∘u = f∘v ⇒ u = v), epi = right-cancellable (u∘f = v∘f ⇒ u = v).",
    ja: "記法：本では「f の次に g」を <b>g∘f</b>（または <b>g f</b>）と書き、Lean/Mathlib では同じ射を <code>f ≫ g</code> と書く。モニック＝左簡約可能（f∘u = f∘v ⇒ u = v）、エピ＝右簡約可能（u∘f = v∘f ⇒ u = v）。"
  },

    en: "Every Lean proof, every goal state and every rejected option in this expansion is checked by Lean 4 + Mathlib (<code>lake build RequestProject.BossAll</code>, files <code>RequestProject/Boss/Ex1.lean</code> … <code>Ex9.lean</code>). The informal proof texts are not machine-checked.",
    ja: "この拡張版の Lean の証明・ゴールの状態・誤答として退けられる選択肢は、すべて Lean 4 + Mathlib で検査済み（<code>lake build RequestProject.BossAll</code>、ファイル <code>RequestProject/Boss/Ex1.lean</code> … <code>Ex9.lean</code>）。日常言語の証明文は機械検証されていない。"

const ACTS = ["diagram", "proof", "lean"];
const EN = () => Game.lang === "en";
function t(obj) { return obj[Game.lang]; }
const rnd = (k) => Math.floor(Math.random() * k);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
/* `code` spans in plain explanation texts */
function md(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }

/* ===================== Arrow diagrams ===================== */
function nodeBox(n) {
  const w = Math.max(44, 12 * [...n.label].length + 18);
  return { hw: w / 2, hh: 20 };
}
/* point where the ray from the centre of node n towards (px,py) leaves its box */
function boundary(n, px, py) {
  const { hw, hh } = nodeBox(n);
  const dx = px - n.x, dy = py - n.y;
  if (dx === 0 && dy === 0) return [n.x, n.y];
  const s = Math.min(dx === 0 ? Infinity : hw / Math.abs(dx), dy === 0 ? Infinity : hh / Math.abs(dy));
  return [n.x + dx * s, n.y + dy * s];
}
/* Draw a diagram. opts.hi: Set of edge ids to highlight; opts.dim: Set highlighted earlier;
   opts.clickable: edges call Game.onEdge(id); opts.mark: {id: "good"|"bad"} */
function drawDiagram(ex, opts = {}) {
  const hi = opts.hi || new Set(), dim = opts.dim || new Set(), mark = opts.mark || {};
  let s = `<svg class="diagram" viewBox="0 0 560 320" role="img">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d8d6ff"/></marker>
      <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffcc4d"/></marker>
      <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5be49b"/></marker>
      <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b81"/></marker>
      <marker id="ahD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a24a"/></marker>
    </defs>`;
  for (const e of ex.edges) {
    const A = ex.nodes[e.src], B = ex.nodes[e.dst];
    let d, lx, ly, anchor = "middle";
    if (e.src === e.dst) {               /* loop above (bend<0) or below (bend>0) */
      const sg = e.bend < 0 ? -1 : 1, { hh } = nodeBox(A);
      const y0 = A.y + sg * hh, y1 = A.y + sg * (hh + 52);
      d = `M ${A.x - 12} ${y0} C ${A.x - 46} ${y1}, ${A.x + 46} ${y1}, ${A.x + 12} ${y0}`;
      lx = A.x; ly = A.y + sg * (hh + 50) + (sg < 0 ? -6 : 16);
    } else {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const nx = dy / len, ny = -dx / len;           /* normal (points "up" for left-to-right arrows) */
      const cx = mx - nx * e.bend * 1.0, cy = my - ny * e.bend * 1.0;
      const [x1, y1] = boundary(A, cx, cy), [x2, y2] = boundary(B, cx, cy);
      d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
      const qx = 0.25 * x1 + 0.5 * cx + 0.25 * x2, qy = 0.25 * y1 + 0.5 * cy + 0.25 * y2;
      const side = e.bend > 0 ? 1 : e.bend < 0 ? -1 : (Math.abs(dy) > Math.abs(dx) ? 1 : -1);
      const off = 14;
      /* push the label away from the curve, on the side of the bend */
      lx = qx - nx * side * off; ly = qy - ny * side * off + 5;
      if (e.bend === 0 && Math.abs(dy) > Math.abs(dx)) { lx = qx + 9; ly = qy + 5; anchor = "start"; }
    }
    let col = e.color || "#d8d6ff", mk = "ah", w = 2;
    if (dim.has(e.id)) { col = "#c9a24a"; mk = "ahD"; w = 2.5; }
    if (hi.has(e.id)) { col = "#ffcc4d"; mk = "ahA"; w = 3.5; }
    if (mark[e.id] === "good") { col = "#5be49b"; mk = "ahG"; w = 3.5; }
    if (mark[e.id] === "bad") { col = "#ff6b81"; mk = "ahB"; w = 3.5; }
    if (e.color && mk === "ah") mk = e.color === "#ff6b81" ? "ahB" : "ah";
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" ${e.dashed ? 'stroke-dasharray="7 5"' : ""} marker-end="url(#${mk})"/>`;
    s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="15" fill="${col}" font-style="italic">${esc(e.label)}</text>`;
    if (opts.clickable)
      s += `<path class="edge-hit" data-edge="${e.id}" d="${d}" fill="none" stroke="transparent" stroke-width="18" onclick="Game.onEdge('${e.id}')"><title>${esc(e.label)}</title></path>`;
  }
  for (const [id, n] of Object.entries(ex.nodes)) {
    const { hw, hh } = nodeBox(n);
    s += `<rect x="${n.x - hw}" y="${n.y - hh}" width="${2 * hw}" height="${2 * hh}" rx="14" fill="#191a36" stroke="#6ec8ff" stroke-width="2"/>
          <text x="${n.x}" y="${n.y + 6}" text-anchor="middle" font-size="17" fill="#f2f0ff" font-weight="700">${esc(n.label)}</text>`;
  }
  return s + "</svg>";
}

/* ===================== Activities ===================== */
/* Each activity object: {kind, ...state}; Game drives hearts and stars. */
function makeDiagramAct(ex) { return { kind: "diagram", mark: {}, solved: false }; }
function makeProofAct(ex) {
  const pool = shuffle([
    ...ex.steps.map((_, i) => ({ k: "step", i })),
    ...ex.distractors.map((_, j) => ({ k: "dist", j }))
  ]);
  return { kind: "proof", placed: 0, pool, solved: false };
}
function makeLeanAct(ex) {
  return { kind: "lean", th: 0, line: 0, sel: -1, opts: null, disabled: new Set(), solvedTh: false, solved: false };
}
const MAKERS = { diagram: makeDiagramAct, proof: makeProofAct, lean: makeLeanAct };

/* Lean helpers: reveal fixed lines up to the next gap */
function leanTheorem(ex, act) { return ex.lean[act.th]; }
function isGap(line) { return Array.isArray(line.wrong); }
function gapOptions(line) { return shuffle([{ code: line.code, ok: true }, ...line.wrong.map((w, i) => ({ code: w.code, ok: false, w: i }))]); }
/* nearest recorded goal state at or before line index i (−1 = initial) */
function stateAt(th, i) {
  for (let k = i; k >= 0; k--) if (th.lines[k].state !== null && th.lines[k].state !== undefined) return { k, s: th.lines[k].state };
  return { k: -1, s: th.initial };
}

/* ===================== Game ===================== */
function loadJSON(key, dflt) { try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? dflt : v; } catch (e) { return dflt; } }
const Game = {
  lang: loadJSON("aq-lang", "en"),
  progress: loadJSON("aq-boss-progress", {}),   /* "n" -> {diagram: stars, proof: stars, lean: stars} */
  score: loadJSON("aq-boss-score", 0),
  view: "home", exIdx: 0, actName: "diagram", act: null, hearts: 3, mistakes: 0, feedback: null,
  showAnswer: false, failed: false,

  save() {
    try {
      localStorage.setItem("aq-lang", JSON.stringify(this.lang));
      localStorage.setItem("aq-boss-progress", JSON.stringify(this.progress));
      localStorage.setItem("aq-boss-score", JSON.stringify(this.score));
    } catch (e) { /* storage unavailable: play without saving */ }
  },
  ex() { return DATA[this.exIdx]; },
  stars(n, a) { const p = this.progress[n]; return p && p[a] ? p[a] : 0; },
  chamberDone(n) { return ACTS.every(a => this.stars(n, a) > 0); },
  toggleLang() { this.lang = this.lang === "en" ? "ja" : "en"; this.save(); this.rerender(); },
  resetProgress() { this.progress = {}; this.score = 0; this.save(); this.rerender(); },
  home() { this.view = "home"; this.feedback = null; this.rerender(); },
  openChamber(i) { this.exIdx = i; this.view = "chamber"; this.showAnswer = false; this.startAct("diagram"); },
  startAct(name) {
    this.actName = name; this.act = MAKERS[name](this.ex()); this.hearts = 3; this.mistakes = 0;
    this.feedback = null; this.failed = false;
    if (name === "lean") this.leanAdvance();
    this.rerender();
  },
  toggleAnswer() { this.showAnswer = !this.showAnswer; this.rerender(); },

  /* ---- scoring ---- */
  good(msg, pts = 10) { this.score += pts; this.feedback = { ok: true, msg }; this.save(); },
  bad(msg) {
    this.hearts--; this.mistakes++; this.score = Math.max(0, this.score - 2);
    this.feedback = { ok: false, msg };
    if (this.hearts <= 0) this.failed = true;
    this.save();
  },
  complete() {
    const st = Math.max(1, 3 - this.mistakes), n = this.ex().n;
    this.progress[n] = this.progress[n] || {};
    this.progress[n][this.actName] = Math.max(this.progress[n][this.actName] || 0, st);
    this.act.solved = true; this.lastStars = st; this.save();
  },

  /* ---- ① diagram ---- */
  onEdge(id) {
    const ex = this.ex(), a = this.act;
    if (this.view !== "chamber" || this.actName !== "diagram" || a.solved || this.failed) return;
    if (id === ex.click.answer) {
      a.mark = { [id]: "good" };
      this.good(t(ex.click.explain)); this.complete();
    } else {
      a.mark = { [id]: "bad" };
      const lab = ex.edges.find(e => e.id === id).label;
      this.bad((EN() ? `“${lab}” is not the one. ` : `「${lab}」ではない。`) + t(TEXT.clickHint));
    }
    this.rerender();
  },

  /* ---- ② category proof ---- */
  pick(pi) {
    const ex = this.ex(), a = this.act;
    if (a.solved || this.failed) return;
    const item = a.pool[pi];
    if (!item) return;
    if (item.k === "dist") {
      a.pool.splice(pi, 1);
      this.bad(`<b>${t(TEXT.trap)}</b> ${esc(t(ex.distractors[item.j].text))}<br>${md(t(ex.distractors[item.j].why))}`);
    } else if (item.i === a.placed) {
      a.pool.splice(pi, 1); a.placed++;
      this.good(md(t(ex.steps[item.i].text)), 10);
      if (a.placed === ex.steps.length) this.complete();
    } else {
      this.bad(t(TEXT.notYet));
    }
    this.rerender();
  },

  /* ---- ③ Lean proof ---- */
  leanAdvance() {           /* prepare options when the next line is a gap */
    const a = this.act, th = leanTheorem(this.ex(), a);
    a.opts = null; a.disabled = new Set();
    if (a.line < th.lines.length && isGap(th.lines[a.line])) a.opts = gapOptions(th.lines[a.line]);
    if (a.line >= th.lines.length) {
      a.solvedTh = true;
      if (a.th === this.ex().lean.length - 1) this.complete();
    }
  },
  leanStep() {              /* reveal the next fixed line */
    const a = this.act, th = leanTheorem(this.ex(), a);
    if (a.solved || this.failed || a.line >= th.lines.length || isGap(th.lines[a.line])) return;
    a.sel = a.line; a.line++; this.feedback = null;
    this.leanAdvance(); this.rerender();
  },
  leanChoose(oi) {
    const a = this.act, th = leanTheorem(this.ex(), a);
    if (a.solved || this.failed || !a.opts || a.disabled.has(oi)) return;
    const o = a.opts[oi], line = th.lines[a.line];
    if (o.ok) {
      a.sel = a.line; a.line++;
      this.good(md(t(line.note)));
      this.leanAdvance();
    } else {
      a.disabled.add(oi);
      const w = line.wrong[o.w];
      this.bad(md(t(w.why)) + (w.lean_error ? `<details class="lean-err"><summary>${t(TEXT.leanSays)}</summary><pre>${esc(w.lean_error)}</pre></details>` : ""));
    }
    this.rerender();
  },
  leanSelect(i) { const a = this.act; if (i < a.line) { a.sel = i; this.rerender(); } },
  leanNextTheorem() {
    const a = this.act;
    if (!a.solvedTh || a.th >= this.ex().lean.length - 1) return;
    a.th++; a.line = 0; a.sel = -1; a.solvedTh = false; this.feedback = null;
    this.leanAdvance(); this.rerender();
  },

  /* ===================== rendering ===================== */
  rerender() {
    if (typeof document === "undefined") return;
    document.documentElement.lang = this.lang;
    document.getElementById("brand").innerHTML = t(TEXT.brand);
    document.getElementById("lang-btn").textContent = t(TEXT.langBtn);
    document.getElementById("hud-score").textContent = `${t(TEXT.score)}: ${this.score}`;
    const h = Math.min(3, Math.max(this.hearts, 0));
    document.getElementById("hud-hearts").textContent = this.view === "chamber" && this.act && !this.act.solved ? "♥".repeat(h) + "♡".repeat(3 - h) : "";
    document.getElementById("footer").innerHTML = t(TEXT.footer);
    document.getElementById("app").innerHTML = this.render();
  },
  render() { return this.view === "home" ? this.renderHome() : this.renderChamber(); },

  renderHome() {
    const cards = DATA.map((ex, i) => {
      const st = ACTS.map((a, k) => {
        const s = this.stars(ex.n, a);
        return `${TEXT.acts[this.lang][k]} ${s ? "★".repeat(s) + "☆".repeat(3 - s) : "☆☆☆"}`;
      }).join(" · ");
      return `<button class="card" onclick="Game.openChamber(${i})">
        <div class="num">${t(TEXT.chamber)} ${ex.n} — ${t(TEXT.exercise)} I.5.${ex.n} ${this.chamberDone(ex.n) ? "✅" : ""}</div>
        <div class="ttl">${esc(t(ex.title))}</div>
        <div class="stars">${st}</div></button>`;
    }).join("");
    const all = DATA.length > 0 && DATA.every(ex => this.chamberDone(ex.n));
    return `<div class="panel"><h1>${t(TEXT.title)}</h1><div class="sub">${t(TEXT.subtitle)}</div>
      <div class="bridge">${t(TEXT.bridge)}</div>
      <div class="choices"><a href="index.html"><button class="small">${t(TEXT.mainGame)}</button></a></div></div>
      ${all ? `<div class="panel center"><div class="big">🏆</div><h2>${t(TEXT.allDone)}</h2></div>` : ""}
      <div class="grid">${cards}</div>
      <div class="choices" style="justify-content:flex-end"><button class="small" onclick="Game.resetProgress()">${t(TEXT.reset)}</button></div>`;
  },

  renderChamber() {
    const ex = this.ex(), a = this.act;
    const tabs = ACTS.map((name, k) => {
      const s = this.stars(ex.n, name);
      const lab = [TEXT.tabDiagram, TEXT.tabProof, TEXT.tabLean][k];
      return `<button class="tab ${this.actName === name ? "active" : ""}" onclick="Game.startAct('${name}')">${t(lab)} ${s ? "★".repeat(s) : ""}</button>`;
    }).join("");
    /* diagram highlights depend on the activity */
    let hi = new Set(), dim = new Set(), mark = {};
    if (this.actName === "diagram") mark = a.mark;
    if (this.actName === "proof") {
      for (let i = 0; i < a.placed; i++) for (const id of ex.steps[i].hi) (i === a.placed - 1 ? hi : dim).add(id);
      for (const id of hi) dim.delete(id);
    }
    const head = `<div class="panel">
      <div class="choices" style="margin-top:0;justify-content:space-between">
        <button class="small" onclick="Game.home()">${t(TEXT.back)}</button>
        <span class="tag">${t(TEXT.exercise)} I.5.${ex.n}</span></div>
      <h2 style="margin-top:10px">${t(TEXT.chamber)} ${ex.n}: ${esc(t(ex.title))}</h2>
      <div class="quote">${esc(t(ex.statement))}</div>
      <div class="bridge">${t(TEXT.bridge)}</div>
      <div class="choices"><button class="small" onclick="Game.toggleAnswer()">${t(TEXT.showAnswer)}</button></div>
      ${this.showAnswer ? `<div class="note"><b>${t(TEXT.answer)}:</b> ${t(ex.answer)}</div>` : ""}
    </div>
    <div class="panel">${drawDiagram(ex, { hi, dim, mark, clickable: this.actName === "diagram" && !a.solved && !this.failed })}</div>
    <div class="tabs">${tabs}</div>`;
    let body = "";
    if (this.actName === "diagram") body = this.renderDiagramAct(ex, a);
    else if (this.actName === "proof") body = this.renderProofAct(ex, a);
    else body = this.renderLeanAct(ex, a);
    return head + `<div class="panel" style="border-top-left-radius:0">${body}${this.renderFooter(ex, a)}</div>`;
  },

  renderFeedback() {
    if (!this.feedback) return "";
    const f = this.feedback;
    return `<div class="feedback ${f.ok ? "good" : "bad"}"><b>${f.ok ? t(TEXT.correct) : t(TEXT.wrong)}</b> ${f.msg}</div>`;
  },
  renderFooter(ex, a) {
    if (this.failed)
      return `<div class="feedback bad"><b>${t(TEXT.failed)}</b></div>
        <div class="choices"><button class="primary" onclick="Game.startAct('${this.actName}')">${t(TEXT.retry)}</button></div>`;
    if (!a.solved) return "";
    const k = ACTS.indexOf(this.actName);
    const next = k < ACTS.length - 1
      ? `<button class="primary" onclick="Game.startAct('${ACTS[k + 1]}')">${t(TEXT.nextAct)}</button>`
      : this.exIdx < DATA.length - 1
        ? `<button class="primary" onclick="Game.openChamber(${this.exIdx + 1})">${t(TEXT.nextChamber)}</button>`
        : `<button class="primary" onclick="Game.home()">${t(TEXT.back)}</button>`;
    return `<div class="feedback good"><b>${t(TEXT.done)}</b> ${"★".repeat(this.lastStars)}${"☆".repeat(3 - this.lastStars)}</div>
      <div class="choices">${next}</div>`;
  },

  renderDiagramAct(ex, a) {
    return `<div class="question">${ex.click.q[this.lang]}</div>
      <div class="sub">${t(TEXT.clickHint)}</div>${this.renderFeedback()}`;
  },

  renderProofAct(ex, a) {
    const placed = ex.steps.slice(0, a.placed).map((s, i) =>
      `<li class="${i === a.placed - 1 ? "latest" : ""}">${md(t(s.text))}</li>`).join("");
    const pool = a.solved ? "" : a.pool.map((it, pi) => {
      const txt = it.k === "step" ? ex.steps[it.i].text : ex.distractors[it.j].text;
      return `<button ${this.failed ? "disabled" : ""} onclick="Game.pick(${pi})">${md(t(txt))}</button>`;
    }).join("");
    return `<h3>${t(TEXT.proofSoFar)}</h3>
      <ol class="proof-list">${placed || `<li style="padding-left:12px;list-style:none" class="sub">${t(TEXT.empty)}</li>`}</ol>
      ${a.solved ? "" : `<h3>${t(TEXT.pickNext)}</h3><div class="pool">${pool}</div>`}
      ${this.renderFeedback()}`;
  },

  renderLeanAct(ex, a) {
    const th = leanTheorem(ex, a);
    const hdr = th.header.split("\n").map(l => `<span class="ln hdr"><span class="no"></span>${esc(l)}</span>`).join("");
    const lines = th.lines.map((l, i) => {
      if (i < a.line) return `<span class="ln ${i === a.sel ? "sel" : ""}" onclick="Game.leanSelect(${i})"><span class="no">${i + 1}</span>${esc(l.code)}</span>`;
      const ind = l.code.length - l.code.trimStart().length;
      if (i === a.line && isGap(l)) return `<span class="ln gap sel"><span class="no">${i + 1}</span>${" ".repeat(ind)}?   ◀</span>`;
      if (i === a.line) return `<span class="ln hidden"><span class="no">${i + 1}</span>${" ".repeat(ind)}…</span>`;
      return `<span class="ln hidden"><span class="no">${i + 1}</span>${" ".repeat(ind)}${isGap(l) ? "?" : "…"}</span>`;
    }).join("");
    /* goal panel */
    const sel = a.sel;
    let title, st;
    if (sel < 0) { title = t(TEXT.goalStart); st = th.initial; }
    else {
      const r = stateAt(th, sel);
      st = r.s;
      title = `${t(TEXT.goalAfter)} ${sel + 1}` + (r.k !== sel ? ` ${t(TEXT.goalNear)} ${r.k + 1}${EN() ? ")" : "）"}` : "");
      if (r.k < 0) title = t(TEXT.goalStart);
    }
    const goal = st === "" ? t(TEXT.noGoals) : esc(st);
    const note = sel >= 0 ? `<div class="note"><b>${sel + 1}.</b> ${md(t(th.lines[sel].note))}</div>` : "";
    let controls = "";
    if (!a.solvedTh) {
      if (a.opts) {
        controls = `<div class="question" style="margin-top:12px">${t(TEXT.chooseGap)}</div><div class="pool">` +
          a.opts.map((o, oi) => `<button class="opt" ${a.disabled.has(oi) || this.failed ? "disabled" : ""} onclick="Game.leanChoose(${oi})">${esc(o.code.trim())}</button>`).join("") + "</div>";
      } else controls = `<div class="choices"><button class="primary" ${this.failed ? "disabled" : ""} onclick="Game.leanStep()">${t(TEXT.stepBtn)}</button></div>`;
    } else {
      controls = `<div class="feedback good"><b>${t(TEXT.proofDone)}</b></div>` +
        (a.th < ex.lean.length - 1 ? `<div class="choices"><button class="primary" onclick="Game.leanNextTheorem()">${t(TEXT.nextTheorem)}</button></div>` : "");
    }
    return `<div class="sub">${t(TEXT.theorem)} ${a.th + 1} ${t(TEXT.of)} ${ex.lean.length}: <code>${esc(th.name)}</code> · ${t(TEXT.clickLines)}</div>
      <div class="lean-wrap"><div><pre class="code">${hdr}${lines}</pre>${controls}${this.renderFeedback()}</div>
      <div><div class="goal-title">${title}</div><div class="goal">${goal}</div>${note}</div></div>`;
  }
};

if (typeof module !== "undefined") module.exports = { Game, DATA, TEXT, drawDiagram, stateAt, isGap, md, esc };
Game.rerender();
</script>
</body>
</html>
