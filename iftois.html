<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From If to Is — a pixel atlas of non-classical logics</title>
<style>
  :root { --bg: #eef7ff; --bg2: #fff3c4; --panel: #f4ecd8; --ink: #23203f; --dim: #6b6585;
    --acc: #ffcc4d; --ok: #3fa34d; --when: #3b7dd8; --part: #b07d12; --bad: #c0563f; --edge: #23203f; }
  body.contrast { --bg: #fff; --bg2: #fff; --panel: #fff; --ink: #000; --dim: #333; --acc: #ffd400;
    --ok: #006b1b; --when: #003fbf; --part: #7a4f00; --edge: #000; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: bold 15px/1.45 "Courier New", ui-monospace, Menlo, Consolas, monospace; }
  body.calm * { transition: none !important; animation: none !important; }
  #app { max-width: 900px; margin: 0 auto; padding: 8px; }
  #hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--ink); background: var(--bg2);
    padding: 6px 10px; box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px #e0b84a; margin: 6px 6px 12px; }
  #hud .title { color: #c0561a; letter-spacing: 2px; margin-right: auto; }
  #hearts { color: #d23a4e; }
  #scene { display: block; width: calc(100% - 12px); margin: 0 6px 12px; aspect-ratio: 16 / 9; max-height: 44vh;
    image-rendering: pixelated; image-rendering: crisp-edges; background: #cfe9ff; box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px #9cc4e8; }
  #panel { background: var(--panel); margin: 0 6px; padding: 14px 16px 16px; min-height: 260px;
    box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px #b9ad8c, 0 6px 0 6px var(--edge); }
  h1, h2 { margin: 0 0 8px; letter-spacing: 1px; } h1 { font-size: 21px; } h2 { font-size: 18px; }
  .sub { color: var(--dim); font-size: 13px; margin: 6px 0; }
  .q { font-size: 16px; margin: 8px 0; }
  .formula { font-size: 20px; background: #fffaf0; border-left: 6px solid var(--acc); padding: 8px 12px; margin: 6px 0 12px; }
  .formula.claim { font-size: 16px; font-style: italic; }
  .ex { background: #fffaf0; border-left: 6px solid var(--acc); padding: 6px 10px; margin: 10px 0; }
  .cards { display: grid; gap: 8px; }
  .cards.places { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .card { text-align: left; font: inherit; color: var(--ink); background: #fff; border: 0; cursor: pointer; padding: 9px 12px;
    box-shadow: 0 0 0 3px var(--ink), 0 4px 0 3px var(--ink); margin: 3px 3px 6px; }
  .card:hover { background: #fff6d6; } .card.sel { background: #fff0b3; } .card.cross { background: #f3ecff; }
  .card.struck { background: #e6eefb; color: #45618f; box-shadow: 0 0 0 3px var(--when); }
  .card.right { background: #e3f4e5; box-shadow: 0 0 0 3px var(--ok); }
  .toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .tog { font: inherit; font-size: 13px; text-align: left; background: #fff; border: 0; padding: 6px 8px; cursor: pointer; box-shadow: 0 0 0 2px var(--ink); }
  .tog.on { background: #fff0b3; }
  .note { margin: 10px 0 0; padding: 8px 10px; background: #fff; border-left: 6px solid var(--dim); }
  .note.ok { border-color: var(--ok); } .note.when { border-color: var(--when); } .note.part { border-color: var(--part); } .note.trap { border-color: var(--bad); }
  .note b.tag, .lensbox b.tag, .insight b.tag, .strip b.tag { display: block; font-size: 12px; letter-spacing: 1px; margin-bottom: 2px; }
  .proof { background: #fffaf0; padding: 6px 10px; margin: 6px 0; box-shadow: inset 0 0 0 2px #d8cba6; white-space: pre-wrap; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .btn { font: inherit; background: var(--ink); color: #fff; border: 0; padding: 8px 14px; cursor: pointer; box-shadow: 0 4px 0 var(--edge); }
  .btn.alt { background: #6b6585; } .btn.gold { background: var(--acc); color: var(--ink); }
  .rhead { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { display: inline-block; background: #3b4a7a; color: #fff; padding: 2px 8px; font-size: 12px; }
  .chip.logic { background: #6a4fc2; }
  .lensbox { margin-top: 10px; padding: 8px 10px; background: #efe7ff; border-left: 6px solid #6a4fc2; }
  .strip { grid-column: 1 / -1; margin-top: 4px; padding: 8px; background: #fff; box-shadow: inset 0 0 0 2px #d8cba6; }
  .pill { display: inline-block; margin: 3px 6px 3px 0; padding: 2px 8px; font-size: 13px; }
  .pill.yes { background: #e3f4e5; } .pill.no { background: #fbe4df; }
  .insight { margin: 8px 0; padding: 8px 10px; background: #fff; border-left: 6px solid var(--dim); }
  .insight.book { border-color: #b07d12; } .insight.mind { border-color: var(--ok); } .insight.cat { border-color: #6a4fc2; }
  .insight.locked { color: var(--dim); }
  button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span class="title">FROM IF TO IS</span><span id="where">Atlas</span><span id="hearts">♥ ∞</span><span id="couldbe">could-bes 0</span><span id="ins">insights</span></div>
  <canvas id="scene" width="320" height="180" aria-label="pixel map of the atlas of logics"></canvas>
  <div id="panel" aria-live="polite"></div>
</div>
<script id="engine">
"use strict";
// ===================================================================================
// From If to Is — engine: formulas, the logics of Priest's book, validity, models.
// Pure JavaScript; no DOM. (Loaded by the game and by game/tests/iftois_test.js.)
// ===================================================================================
var IFI = (function () {
  // ------------------------------------------------------------------ formulas
  function tokenize(s) {
    var out = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (c === " ") { i++; continue; }
      if ("pqrs".indexOf(c) >= 0) { out.push({ t: "atom", v: c }); i++; continue; }
      if (c === "¬" || c === "~") { out.push({ t: "not" }); i++; continue; }
      if (c === "□") { out.push({ t: "box" }); i++; continue; }
      if (c === "◇") { out.push({ t: "dia" }); i++; continue; }
      if (c === "∧" || c === "&") { out.push({ t: "and" }); i++; continue; }
      if (c === "∨" || c === "|") { out.push({ t: "or" }); i++; continue; }
      if (c === "⊃") { out.push({ t: "bin", op: "imp", sym: "⊃" }); i++; continue; }
      if (c === "→") { out.push({ t: "bin", op: "imp", sym: "→" }); i++; continue; }
      if (c === "⥽") { out.push({ t: "bin", op: "strict", sym: "⥽" }); i++; continue; }
      if (c === ">") { out.push({ t: "bin", op: "cond", sym: ">" }); i++; continue; }
      if (c === "(" || c === ")") { out.push({ t: c }); i++; continue; }
      throw new Error("bad character '" + c + "' in " + s);
    }
    return out;
  }
  function parse(s) {
    var toks = tokenize(s), pos = 0;
    function peek() { return toks[pos]; }
    function unary() {
      var t = toks[pos++];
      if (!t) throw new Error("unexpected end in " + s);
      if (t.t === "atom") return { op: "atom", name: t.v };
      if (t.t === "not" || t.t === "box" || t.t === "dia") return { op: t.t, a: unary() };
      if (t.t === "(") { var e = cond(); if (!toks[pos] || toks[pos].t !== ")") throw new Error("missing ) in " + s); pos++; return e; }
      throw new Error("unexpected token in " + s);
    }
    function conj() { var a = unary(); while (peek() && peek().t === "and") { pos++; a = { op: "and", a: a, b: unary() }; } return a; }
    function disj() { var a = conj(); while (peek() && peek().t === "or") { pos++; a = { op: "or", a: a, b: conj() }; } return a; }
    function cond() {
      var a = disj();
      if (peek() && peek().t === "bin") { var t = toks[pos++]; return { op: t.op, sym: t.sym, a: a, b: cond() }; }
      return a;
    }
    var e = cond();
    if (pos !== toks.length) throw new Error("trailing input in " + s);
    return e;
  }
  var BINSYM = { and: "∧", or: "∨" };
  function show(f) {
    if (typeof f === "string") f = parse(f);
    function sub(g) { return (g.op === "atom" || g.op === "not" || g.op === "box" || g.op === "dia") ? show(g) : "(" + show(g) + ")"; }
    switch (f.op) {
      case "atom": return f.name;
      case "not": return "¬" + sub(f.a);
      case "box": return "□" + sub(f.a);
      case "dia": return "◇" + sub(f.a);
      case "and": case "or": return sub(f.a) + " " + BINSYM[f.op] + " " + sub(f.b);
      default: return sub(f.a) + " " + f.sym + " " + sub(f.b);
    }
  }
  function P(f) { return typeof f === "string" ? parse(f) : f; }
  function atomsOf(fs) {
    var set = {};
    (function walk(list) { list.forEach(function (f) { f = P(f); if (f.op === "atom") set[f.name] = 1; else { if (f.a) walk([f.a]); if (f.b) walk([f.b]); } }); })(fs);
    return Object.keys(set).sort();
  }
  function subformulas(f) {
    f = P(f); var out = [], seen = {};
    (function walk(g) { if (g.a) walk(g.a); if (g.b) walk(g.b); var k = show(g); if (!seen[k]) { seen[k] = 1; out.push(g); } })(f);
    return out;
  }
  function condSubs(f, op) { return subformulas(f).filter(function (g) { return g.op === op; }); }

  // ------------------------------------------------------------------ many-valued
  function r3(x) { return Math.round(x * 1000) / 1000; }
  var kimp = function (x, y) { return Math.max(1 - x, y); };
  var limp = function (x, y) { return r3(Math.min(1, 1 - x + y)); };
  var rmimp = function (x, y) { return x < y ? 1 : (y < x ? 0 : Math.max(x, 1 - x)); };
  var FZGRID = []; for (var g = 0; g <= 20; g++) FZGRID.push(g / 20);

  // the atlas of logics
  var LOGICS = {
    CL:  { name: "Classical", ch: 1, kind: "mv", vals: [1, 0], des: [1], imp: kimp },
    K3:  { name: "K3", ch: 7, kind: "mv", vals: [1, 0.5, 0], des: [1], imp: kimp },
    L3:  { name: "Ł3", ch: 7, kind: "mv", vals: [1, 0.5, 0], des: [1], imp: limp },
    LP:  { name: "LP", ch: 7, kind: "mv", vals: [1, 0.5, 0], des: [1, 0.5], imp: kimp },
    RM3: { name: "RM3", ch: 7, kind: "mv", vals: [1, 0.5, 0], des: [1, 0.5], imp: rmimp },
    FDE: { name: "FDE", ch: 8, kind: "fde" },
    FZ:  { name: "Łukasiewicz fuzzy L", ch: 11, kind: "fz", vals: FZGRID, imp: limp },
    K:   { name: "K", ch: 2, kind: "modal", conds: [] },
    KR:  { name: "Kρ (T)", ch: 3, kind: "modal", conds: ["refl"] },
    KS:  { name: "Kσ", ch: 3, kind: "modal", conds: ["sym"] },
    KT:  { name: "Kτ", ch: 3, kind: "modal", conds: ["trans"] },
    KE:  { name: "Kη (D)", ch: 3, kind: "modal", conds: ["serial"] },
    S4:  { name: "Kρτ (S4)", ch: 3, kind: "modal", conds: ["refl", "trans"] },
    S5:  { name: "Kρστ (S5)", ch: 3, kind: "modal", conds: ["refl", "sym", "trans"] },
    N:   { name: "N (non-normal)", ch: 4, kind: "modal", conds: [], nonnormal: true },
    C:   { name: "C (conditional)", ch: 5, kind: "cond", conds: [] },
    IL:  { name: "Intuitionist", ch: 6, kind: "int", conds: ["refl", "trans", "hered"] },
    STAR:{ name: "FDE, star worlds", ch: 8, kind: "star", conds: ["star"] },
    K4:  { name: "K4", ch: 9, kind: "k4", conds: [] },
    N4:  { name: "N4", ch: 9, kind: "k4", conds: [], nonnormal: true },
    B:   { name: "B (basic relevant)", ch: 10, kind: "B", conds: ["star"], nonnormal: true }
  };
  function L(id) { var l = LOGICS[id]; if (!l) throw new Error("no logic " + id); return l; }
  function valName(v) { return v === 1 ? "1" : v === 0 ? "0" : v === 0.5 ? "i" : String(v); }
  function fzName(v) { return String(r3(v)); }

  function evalMV(id, f, nu) {
    var lg = L(id); f = P(f);
    switch (f.op) {
      case "atom": if (!(f.name in nu)) throw new Error("no value for " + f.name); return nu[f.name];
      case "not": return r3(1 - evalMV(id, f.a, nu));
      case "and": return Math.min(evalMV(id, f.a, nu), evalMV(id, f.b, nu));
      case "or": return Math.max(evalMV(id, f.a, nu), evalMV(id, f.b, nu));
      case "imp": return lg.imp(evalMV(id, f.a, nu), evalMV(id, f.b, nu));
      default: throw new Error(f.op + " is not truth-functional in " + lg.name);
    }
  }
  function designated(id, v, eps) {
    var lg = L(id);
    if (lg.kind === "fz") return v >= (eps === undefined ? 1 : eps) - 1e-9;
    return lg.des.indexOf(v) >= 0;
  }
  // ---- FDE (relational semantics 8.2.6): a value is [true?, false?]
  var FDEV = { t: [true, false], f: [false, true], b: [true, true], n: [false, false] };
  var FDENAME = { t: "true only", f: "false only", b: "both", n: "neither" };
  function code4(v) { return v[0] ? (v[1] ? "b" : "t") : (v[1] ? "f" : "n"); }
  function evalFDE4(f, rho) { // returns [T,F]
    f = P(f);
    switch (f.op) {
      case "atom": return FDEV[rho[f.name]];
      case "not": var a = evalFDE4(f.a, rho); return [a[1], a[0]];
      case "and": var x = evalFDE4(f.a, rho), y = evalFDE4(f.b, rho); return [x[0] && y[0], x[1] || y[1]];
      case "or": var u = evalFDE4(f.a, rho), w = evalFDE4(f.b, rho); return [u[0] || w[0], u[1] && w[1]];
      case "imp": var m = evalFDE4(f.a, rho), k = evalFDE4(f.b, rho); return [m[1] || k[0], m[0] && k[1]]; // ¬A ∨ B (8.2.1)
      default: throw new Error(f.op + " not in FDE");
    }
  }
  function evalFDE(f, rho) { return code4(evalFDE4(f, rho)); }

  function allAssignments(atoms, vals) {
    var out = [{}];
    atoms.forEach(function (a) {
      var nx = []; out.forEach(function (o) { vals.forEach(function (v) { var c = Object.assign({}, o); c[a] = v; nx.push(c); }); }); out = nx;
    });
    return out;
  }
  // value of a formula in a truth-functional logic; returns comparable value
  function evalTF(id, f, nu) { return L(id).kind === "fde" ? evalFDE(f, nu) : evalMV(id, f, nu); }
  function desTF(id, v, eps) { return L(id).kind === "fde" ? FDEV[v][0] : designated(id, v, eps); }
  function valsOf(id) { var lg = L(id); return lg.kind === "fde" ? ["t", "f", "b", "n"] : lg.vals; }
  function isCounterTF(id, prem, concl, nu, eps) {
    return prem.every(function (A) { return desTF(id, evalTF(id, A, nu), eps); }) && !desTF(id, evalTF(id, concl, nu), eps);
  }
  // returns a counter-model (assignment) or null; fuzzy: at threshold eps over the grid
  function counterTF(id, prem, concl, eps) {
    var atoms = atomsOf(prem.concat([concl]));
    var all = allAssignments(atoms, valsOf(id));
    for (var i = 0; i < all.length; i++) if (isCounterTF(id, prem, concl, all[i], eps)) return all[i];
    return null;
  }

  // ------------------------------------------------------------------ world models
  // model: { n, R:{ "i,j":1 }, val:{ atom:[bool..] } | val4:{ atom:[code..] }, normal:[bool], star:[int],
  //          f:{ antecedentKey:[ [worlds], ... per world ] }, nn:{ "w|key": code }, R3:{ "w,x,y":1 } }
  function hasR(m, i, j) { return !!m.R[i + "," + j]; }
  function evalW(id, m, f, w) { // returns boolean truth (for k4/B: truth = relates to 1)
    var lg = L(id); f = P(f);
    if (lg.kind === "k4") return ev4w(id, m, f, w)[0];
    var normal = !m.normal || m.normal[w];
    switch (f.op) {
      case "atom": return !!m.val[f.name][w];
      case "not":
        if (lg.kind === "int") { for (var j = 0; j < m.n; j++) if (hasR(m, w, j) && evalW(id, m, f.a, j)) return false; return true; }
        if (lg.kind === "star" || lg.kind === "B") return !evalW(id, m, f.a, m.star[w]);
        return !evalW(id, m, f.a, w);
      case "and": return evalW(id, m, f.a, w) && evalW(id, m, f.b, w);
      case "or": return evalW(id, m, f.a, w) || evalW(id, m, f.b, w);
      case "imp":
        if (lg.kind === "int") { for (var k = 0; k < m.n; k++) if (hasR(m, w, k) && evalW(id, m, f.a, k) && !evalW(id, m, f.b, k)) return false; return true; }
        if (lg.kind === "B") {
          if (normal) { for (var x = 0; x < m.n; x++) if (evalW(id, m, f.a, x) && !evalW(id, m, f.b, x)) return false; return true; }
          for (var x2 = 0; x2 < m.n; x2++) for (var y2 = 0; y2 < m.n; y2++)
            if (m.R3[w + "," + x2 + "," + y2] && evalW(id, m, f.a, x2) && !evalW(id, m, f.b, y2)) return false;
          return true;
        }
        if (lg.kind === "star") throw new Error("no conditional in star FDE");
        return !evalW(id, m, f.a, w) || evalW(id, m, f.b, w);
      case "box":
        if (!normal) return false;
        for (var a = 0; a < m.n; a++) if (hasR(m, w, a) && !evalW(id, m, f.a, a)) return false; return true;
      case "dia":
        if (!normal) return true;
        for (var b = 0; b < m.n; b++) if (hasR(m, w, b) && evalW(id, m, f.a, b)) return true; return false;
      case "strict": // A ⥽ B is □(A ⊃ B)
        return evalW(id, m, { op: "box", a: { op: "imp", sym: "⊃", a: f.a, b: f.b } }, w);
      case "cond": // A > B: every world in f_A(w) makes B true (5.3.4)
        var fa = (m.f[show(f.a)] || [])[w] || [];
        return fa.every(function (x) { return evalW(id, m, f.b, x); });
      default: throw new Error("unknown " + f.op);
    }
  }
  function ev4w(id, m, f, w) { // K4 / N4: FDE at each world, → over all worlds (9.2.4, 9.4.7)
    var normal = !m.normal || m.normal[w];
    switch (f.op) {
      case "atom": return FDEV[m.val4[f.name][w]];
      case "not": var a = ev4w(id, m, f.a, w); return [a[1], a[0]];
      case "and": var x = ev4w(id, m, f.a, w), y = ev4w(id, m, f.b, w); return [x[0] && y[0], x[1] || y[1]];
      case "or": var u = ev4w(id, m, f.a, w), v = ev4w(id, m, f.b, w); return [u[0] || v[0], u[1] && v[1]];
      case "imp":
        if (!normal) return FDEV[(m.nn && m.nn[w + "|" + show(f)]) || "n"];
        var tr = true, fa = false;
        for (var k = 0; k < m.n; k++) {
          var A = ev4w(id, m, f.a, k), B = ev4w(id, m, f.b, k);
          if (A[0] && !B[0]) tr = false;
          if (A[0] && B[1]) fa = true;
        }
        return [tr, fa];
      default: throw new Error(f.op + " not in K4");
    }
  }
  function frameReport(id, m) { // which required conditions hold
    var lg = L(id), out = [];
    lg.conds.forEach(function (c) { out.push({ cond: c, ok: checkCond(c, m) }); });
    return out;
  }
  function checkCond(c, m) {
    var n = m.n, i, j, k;
    if (c === "refl") { for (i = 0; i < n; i++) if (!hasR(m, i, i)) return false; return true; }
    if (c === "sym") { for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (hasR(m, i, j) && !hasR(m, j, i)) return false; return true; }
    if (c === "trans") { for (i = 0; i < n; i++) for (j = 0; j < n; j++) for (k = 0; k < n; k++) if (hasR(m, i, j) && hasR(m, j, k) && !hasR(m, i, k)) return false; return true; }
    if (c === "serial") { for (i = 0; i < n; i++) { var any = false; for (j = 0; j < n; j++) if (hasR(m, i, j)) any = true; if (!any) return false; } return true; }
    if (c === "hered") { // heredity (6.3.3) for every parameter
      for (var a in m.val) for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (hasR(m, i, j) && m.val[a][i] && !m.val[a][j]) return false;
      return true;
    }
    if (c === "star") { for (i = 0; i < n; i++) if (m.star[m.star[i]] !== i) return false; return true; }
    throw new Error("unknown condition " + c);
  }
  var CONDNAME = { refl: "ρ reflexive", sym: "σ symmetric", trans: "τ transitive", serial: "η extendable",
    hered: "heredity", star: "w** = w" };
  // is the model a counter-model at world `at` (default 0)?
  function isCounterW(id, m, prem, concl, at) {
    at = at || 0;
    if (m.normal && !m.normal[at]) return false;
    if (!L(id).conds.every(function (c) { return checkCond(c, m); })) return false;
    return prem.every(function (A) { return evalW(id, m, A, at); }) && !evalW(id, m, concl, at);
  }

  // ---- exhaustive search for small counter-models (used by tests and the Shuffle Sea)
  function subsets(list) { var out = [[]]; list.forEach(function (x) { out = out.concat(out.map(function (s) { return s.concat([x]); })); }); return out; }
  function* models(id, n, fs) {

    var normals = lg.nonnormal ? subsets(range(n).slice(1)).map(function (nn) { return range(n).map(function (w) { return nn.indexOf(w) < 0; }); }) : [null];
    var stars = (lg.kind === "star" || lg.kind === "B") ? involutions(n) : [null];
    var vals = lg.kind === "k4" ? allAssignments(atoms, allTuples(["t", "f", "b", "n"], n)) : allAssignments(atoms, allTuples([false, true], n));

    var fChoices = ants.length ? allAssignments(ants, allTuples(subsets(range(n)), n)) : [null];
    for (var r = 0; r < Rs.length; r++) for (var a = 0; a < normals.length; a++) for (var s = 0; s < stars.length; s++)
      for (var fc = 0; fc < fChoices.length; fc++) {
        var R = {}; Rs[r].forEach(function (p) { R[p] = 1; });
        var base = { n: n, R: R, normal: normals[a], star: stars[s], f: fChoices[fc] || {} };
        var nnKeys = [];
        if (lg.kind === "k4" && normals[a]) {

          range(n).forEach(function (w) { if (!normals[a][w]) conds.forEach(function (c) { nnKeys.push(w + "|" + c); }); });
        }
        var r3s = [null];
        if (lg.kind === "B" && normals[a]) {

        }
        var nnChoices = nnKeys.length ? allAssignments(nnKeys, ["t", "f", "b", "n"]) : [null];
        for (var v = 0; v < vals.length; v++) for (var q = 0; q < nnChoices.length; q++) for (var t = 0; t < r3s.length; t++) {
          var m = Object.assign({}, base);
          if (lg.kind === "k4") m.val4 = vals[v]; else m.val = vals[v];
          m.nn = nnChoices[q] || {};
          var R3 = {}; (r3s[t] || []).forEach(function (p) { R3[p] = 1; }); m.R3 = R3;

        }
      }
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function uniqKeys(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function allTuples(vals, n) { var out = [[]]; for (var i = 0; i < n; i++) { var nx = []; out.forEach(function (t) { vals.forEach(function (v) { nx.push(t.concat([v])); }); }); out = nx; } return out; }
  function involutions(n) { return allTuples(range(n), n).filter(function (s) { return s.every(function (x, i) { return s[x] === i; }); }); }
  function counterW(id, prem, concl, maxN) {
    var fs = prem.concat([concl]).map(P);
    for (var n = 1; n <= (maxN || 3); n++) {
      var it = models(id, n, fs), x;
      while (!(x = it.next()).done) if (isCounterW(id, x.value, fs.slice(0, -1), fs[fs.length - 1], 0)) return x.value;
    }
    return null;
  }
  // a single verdict for any logic: { valid, counter } (world logics: "no counter-model up to maxN worlds")
  function verdict(id, prem, concl, opts) {
    opts = opts || {};
    var lg = L(id);
    if (lg.kind === "mv" || lg.kind === "fde") { var c = counterTF(id, prem, concl); return { valid: !c, counter: c }; }
    if (lg.kind === "fz") { // valid iff valid at every ε (11.4.8); checked on a grid of ε and values
      var eps = opts.eps ? [opts.eps] : [0.05, 0.25, 0.5, 0.55, 0.75, 0.8, 0.9, 1];
      for (var e = 0; e < eps.length; e++) { var cz = counterTF(id, prem, concl, eps[e]); if (cz) return { valid: false, counter: cz, eps: eps[e] }; }
      return { valid: true, counter: null };
    }
    // world logics: search all models up to 3 worlds (2 for the FDE-based K4, N4, B, whose models are larger)
    var cw = counterW(id, prem, concl, opts.maxN || (lg.kind === "k4" || lg.kind === "B" ? 2 : 3));
    return { valid: !cw, counter: cw };
  }
  // human-readable description of a truth-functional counter-model
  function describeTF(id, nu) {
    return Object.keys(nu).sort().map(function (a) {
      var v = nu[a]; var lg = L(id);
      return "ν(" + a + ") = " + (lg.kind === "fde" ? FDENAME[v] : lg.kind === "fz" ? fzName(v) : valName(v));
    }).join(", ");
  }
  function describeW(id, m) {
    var lg = L(id), parts = [];
    parts.push(m.n + " world" + (m.n > 1 ? "s" : ""));
    if (lg.kind === "modal" || lg.kind === "int") {
      var arrows = Object.keys(m.R).filter(function (k) { return m.R[k]; }).map(function (k) { var a = k.split(","); return "w" + a[0] + "→w" + a[1]; });
      parts.push(arrows.length ? "arrows " + arrows.join(" ") : "no arrows");
    }
    if (m.normal && m.normal.some(function (x) { return !x; })) parts.push("non-normal: " + m.normal.map(function (x, i) { return x ? null : "w" + i; }).filter(Boolean).join(" "));
    if (m.star) parts.push("star: " + m.star.map(function (s, i) { return "w" + i + "*=w" + s; }).join(" "));
    if (m.val) Object.keys(m.val).sort().forEach(function (a) { var t = m.val[a].map(function (x, i) { return x ? "w" + i : null; }).filter(Boolean); parts.push(a + " true at " + (t.length ? t.join(",") : "no world")); });
    if (m.val4) Object.keys(m.val4).sort().forEach(function (a) { parts.push(a + ": " + m.val4[a].map(function (x, i) { return "w" + i + " " + FDENAME[x]; }).join(", ")); });
    Object.keys(m.f || {}).forEach(function (A) { (m.f[A] || []).forEach(function (s, w) { if (s.length) parts.push("f_" + (A.length > 1 ? "(" + A + ")" : A) + "(w" + w + ") = {" + s.map(function (x) { return "w" + x; }).join(",") + "}"); }); });
    Object.keys(m.nn || {}).forEach(function (k) { var a = k.split("|"); parts.push(a[1] + " at w" + a[0] + ": " + FDENAME[m.nn[k]]); });
    Object.keys(m.R3 || {}).forEach(function (k) { if (m.R3[k]) parts.push("R" + k.split(",").map(function (x) { return "w" + x; }).join("")); });
    return parts.join("; ");
  }
  function describeCounter(id, v) { return v ? (v.n !== undefined ? describeW(id, v) : describeTF(id, v)) : ""; }

  // evaluation trace (show the working) for truth-functional logics

  }

  // variable sharing (10.4a.15): a necessary condition for A → B being a logical truth of R and B
  function sharesParameter(f) {
    f = P(f); if (f.op !== "imp") return null;
    var a = atomsOf([f.a]), b = atomsOf([f.b]);
    return a.some(function (x) { return b.indexOf(x) >= 0; });
  }

  function lukAnd(x, y) { return r3(Math.max(0, x + y - 1)); }

  return {
    parse: parse, show: show, atomsOf: atomsOf, subformulas: subformulas, condSubs: condSubs,
    LOGICS: LOGICS, L: L, evalMV: evalMV, evalFDE: evalFDE, evalTF: evalTF, desTF: desTF, valsOf: valsOf,
    designated: designated, isCounterTF: isCounterTF, counterTF: counterTF, valName: valName, fzName: fzName,
    FDENAME: FDENAME, FDEV: FDEV, evalW: evalW, ev4w: ev4w, checkCond: checkCond, frameReport: frameReport, CONDNAME: CONDNAME,
    isCounterW: isCounterW, counterW: counterW, models: models, verdict: verdict, describeCounter: describeCounter,

<script id="content">
"use strict";
// ===================================================================================
// From If to Is — content: insights, lands (chapters of Priest's book), crossroads, rounds.
// Answers are not stored here: the engine computes them (values, verdicts, counter-models).
// ===================================================================================
var IFC = (function () {
  // ---- insight cards: book = Priest (paraphrased, with sections), mind = Langer, The Power of
  //      Mindful Learning (paraphrased), cat = category-theory patterns (lean: proved in RequestProject/IfToIs.lean)
  var INSIGHTS = {
    b1: { src: "book", title: "The material conditional (ch. 1)", text: "Classically, A ⊃ B is false only when A is true and B false. So q ⊨ p ⊃ q and ¬p ⊨ p ⊃ q are valid: the 'paradoxes' of 1.7 that motivate the rest of the book." },
    b2: { src: "book", title: "Possible worlds (ch. 2)", text: "□A is true at w when A is true at every world w can 'see'; ◇A when at some such world. A world that sees nothing makes every □A true there (2.3)." },
    b3: { src: "book", title: "Frame conditions (ch. 3)", text: "Constraints on accessibility give the normal logics: ρ reflexive, σ symmetric, τ transitive, η extendable. Kρ, Kη, Kρσ, Kρτ, Kρστ are T, D, B, S4, S5 (3.2.5)." },
    b4: { src: "book", title: "Non-normal worlds (ch. 4)", text: "At a non-normal world nothing is necessary and everything is possible (4.2.3). Validity looks only at normal worlds. Strict implication A ⥽ B is □(A ⊃ B), with its own paradoxes (4.6)." },
    b5: { src: "book", title: "Conditional logic C (ch. 5)", text: "A > B is true at w when B holds at every world in f_A(w): the worlds where A is true and which are, ceteris paribus, like w (5.3). Antecedent strengthening, transitivity and contraposition all fail." },
    b6: { src: "book", title: "Intuitionist worlds (ch. 6)", text: "Frames are reflexive and transitive, and truth is hereditary: once proved, always proved (6.3.3). ¬A is in effect □¬A and A ⊃ B is □(A ⊃ B). Excluded middle fails." },
    b7: { src: "book", title: "Many values (ch. 7)", text: "K3 and LP share their truth tables and differ only in what is designated: {1} versus {1, i}. Ł3 and RM3 change the conditional. In LP even modus ponens fails (7.4.5)." },
    b8: { src: "book", title: "First Degree Entailment (ch. 8)", text: "In FDE a formula may relate to 1, to 0, to both or to neither (8.2.5). Explosion, excluded middle and the disjunctive syllogism all fail. Negation can also be read with a star world: ¬A is true at w iff A is false at w* (8.5)." },
    b9: { src: "book", title: "Gaps, gluts and worlds (ch. 9)", text: "K4 adds → to FDE by quantifying over worlds (9.2.4). It still has ⊨ p → (q → q) (9.4.2). N4 adds non-normal worlds, where conditionals may take any value: worlds where laws of logic can fail (9.4.4–9.4.7)." },
    b10: { src: "book", title: "Relevant logic B (ch. 10)", text: "At non-normal worlds, A → B is evaluated with a ternary relation Rxyz: roughly, if A → B holds at x and A at y, then B at z (10.2.2). In R and its sub-systems, a logically true A → B always has A and B sharing a parameter (10.4a.15)." },
    b11: { src: "book", title: "Fuzzy logic (ch. 11)", text: "Values are all reals in [0, 1]; ¬x = 1 − x, ∧ = min, ∨ = max, and x → y = min(1, 1 − x + y). Context fixes an acceptability level ε; validity means valid for every ε (11.4.6–8). Modus ponens fails, which defuses sorites arguments (11.6)." },

    m_could: { src: "mind", title: "'Could be', not 'is'", text: "Langer reports studies in which material taught conditionally ('this could be…', '1 plus 1 could be 2') was later used more flexibly and creatively than the same material taught as absolute fact. In this game every verdict is conditional: valid in a logic." },
    m_novelty: { src: "mind", title: "Noticing new things", text: "In Langer's attention study, people told to notice different things about each shape remembered more, and found the task less effortful, than people told just to 'pay attention'. Each world model here is a shape to notice new things about." },
    m_distinct: { src: "mind", title: "Drawing distinctions", text: "Langer argues that information swallowed whole, as a 'package', stays locked up, while drawing distinctions keeps it available for new contexts. ρ, σ, τ and η are distinctions: the same □ means different things in each frame." },
    m_reverse: { src: "mind", title: "The reversed fact", text: "Langer describes presenting data with the figures reversed: students readily explain the 'fact', then learn it was the opposite, and see how easily one view becomes 'the' answer. The flip rounds do this with logic." },
    m_context: { src: "mind", title: "Sensitivity to context", text: "Langer lists the facets of mindfulness as openness to novelty, alertness to distinction, sensitivity to different contexts, awareness of multiple perspectives and orientation in the present. A counterfactual 'if' is a context-sensitive 'if'." },
    m_doubt: { src: "mind", title: "The value of doubt", text: "Teaching things conditionally, Langer writes, sets the stage for doubt and for noticing that different situations call for different responses. The intuitionist doubts excluded middle until there is a proof." },
    m_basics: { src: "mind", title: "Whose basics?", text: "Langer suggests that for everyone there are certain basics, but no such thing as the basics. Classical logic is one land of the atlas, not its foundation stone." },
    m_actor: { src: "mind", title: "Actor and observer", text: "Langer contrasts predictions made from an actor's changing experience with an observer's stable categories. A gap (neither) and a glut (both) are the same middle value seen from two sides." },
    m_soft: { src: "mind", title: "Soft vigilance", text: "Langer contrasts a locked, tiring hypervigilance with a soft vigilance that stays open to new information. Here: keep the whole frame in view, not just the one arrow you think matters." },
    m_right: { src: "mind", title: "The illusion of right answers", text: "In Langer's story the judge tells both quarrelling men 'That's right' — and the onlooker too. Viewing the same information from several perspectives makes us more open to it, not less steady." },
    m_linear: { src: "mind", title: "Linear versus mindful problem solving", text: "Langer contrasts the direct path from problem to single resolution with staying open to several ways of viewing a situation. Fuzzy logic keeps the borderline open instead of forcing a cut-off." },
    m_judge: { src: "mind", title: "When right becomes wrong", text: "A fact that is right from one perspective can be wrong from another; Langer argues that seeing this makes information more usable. K3 and LP are each other's mirror image." },
    m_sideways: { src: "mind", title: "Sideways learning", text: "Instead of top-down lectures or bottom-up drill, Langer proposes sideways learning: varying the basics and attending to several ways of carving up the same domain. Same frames, two logics." },
    m_play: { src: "mind", title: "Turning work into play", text: "Langer notes that a crossword is fun until it is graded for speed and accuracy, and that puzzles with several solutions are more fun than those with one. Hearts here never run out, and some rounds have several answers." },
    m_rote: { src: "mind", title: "Locking up information", text: "Langer's example: 'Battle of Hastings/1066' learned as a package is hard to use anywhere else. '→ means if' is such a package; the rapids unpack it." },
    m_present: { src: "mind", title: "Orientation in the present", text: "Mindfulness, for Langer, includes orientation in the present: basic skills guide what we do now rather than run us like a program. Every Shuffle Sea round is new." },

    c_category: { src: "cat", title: "Entailment is a category", text: "Formulas are objects; A ⊨ B is an arrow. A ⊨ A is the identity and if A ⊨ B and B ⊨ C then A ⊨ C is composition. Every logic in the atlas gives such a category (a preorder)." },
    c_dual: { src: "cat", title: "□ and ◇ are dual", text: "¬□¬A and ◇A always agree (2.3.9). Negation turns □ into ◇: a duality, the way reversing all arrows turns products into coproducts." },
    c_comonad: { src: "cat", title: "□ in S4 is a comonad", text: "In reflexive transitive frames □A ⊨ A (the counit) and □A ⊨ □□A (the comultiplication), and □ is monotone (a functor). That is a comonad on the entailment preorder.", lean: "s4_counit, s4_comult, box_mono" },
    c_functor_break: { src: "cat", title: "When □ stops being a functor", text: "In K, if A ⊨ B then □A ⊨ □B. In N, ◇(q ∧ ¬q) ⊨ r but □◇(q ∧ ¬q) ⊭ □r: a normal world can see a non-normal one, where validity never looked.", lean: "k_box_functor_instance, n_box_not_functor" },
    c_indexed: { src: "cat", title: "A family of boxes", text: "Priest notes that each formula A gives its own necessity operator [A], and A > B is [A]B (5.3.4). A conditional is a box indexed by its antecedent." },
    c_exponential: { src: "cat", title: "The intuitionist ⊃ is an exponential", text: "For hereditary propositions, X ∧ A ⊨ B exactly when X ⊨ A ⊃ B: conjunction with A is left adjoint to A ⊃ (−). This is the 'currying' law of a Heyting algebra.", lean: "heyting_adjunction" },
    c_internal_hom: { src: "cat", title: "LP has no internal hom", text: "If ⊃ internalised ⊨ we would have A ∧ B ⊨ C exactly when A ⊨ B ⊃ C. In LP, p ⊃ q ⊨ p ⊃ q (an identity), yet (p ⊃ q) ∧ p ⊭ q. The adjunction fails, and so does modus ponens.", lean: "lp_no_adjunction" },
    c_product: { src: "cat", title: "FDE values are a product", text: "An FDE value is a pair (true?, false?): the four values form Bool × Bool. K3 is FDE without the glut, LP is FDE without the gap, and both embeddings preserve the connectives — so FDE-valid implies K3- and LP-valid.", lean: "fde_to_k3, fde_to_lp" },
    c_identity: { src: "cat", title: "Identity arrows and impossible worlds", text: "q → q is an identity arrow. K4 keeps it everywhere, so p → (q → q) holds. N4 lets identities fail at non-normal worlds, and a conditional at a normal world looks at every world." },
    c_ternary: { src: "cat", title: "A three-place arrow", text: "The ternary relation Rxyz behaves like a 'combine x and y into z' operation: a conditional at x applied to its antecedent at y gives the consequent at z. It is an analogy with composition, not an identity." },
    c_residuation: { src: "cat", title: "Residuation", text: "The Łukasiewicz t-norm x ⊗ y = max(0, x + y − 1) and the conditional satisfy x ⊗ y ≤ z ⟺ x ≤ (y → z) on [0, 1]: ⊗ y is left adjoint to y → (−).", lean: "luk_residuation" },
    c_duality: { src: "cat", title: "A contravariant functor", text: "A ⊨ B in K3 exactly when ¬B ⊨ ¬A in LP. Negation reverses every arrow and swaps the two logics: K3 and LP are opposite categories of each other (for single premises).", lean: "k3_lp_duality" },
    c_thin: { src: "cat", title: "Frames as thin categories", text: "A reflexive transitive frame is a preorder, a category with at most one arrow between worlds. Heredity says a proposition is an up-set: it is carried along every arrow." },
    c_journey: { src: "cat", title: "Journeys compose", text: "The atlas paths are arrows between logics (add a value, drop a value, add worlds…). Walking two paths in a row is their composite; staying put is the identity." },
    c_restrict: { src: "cat", title: "Restriction commutes", text: "On the values 0, ½, 1 the fuzzy conditional is exactly Ł3's, and on 0, 1 it is classical (11.4.5): restricting values and applying a connective can be done in either order.", lean: "lukImp_restricts_to_L3" }
  };

  // ---- world-model helper for authored models
  function M(n, arrows, val, extra) {
    var R = {}; arrows.forEach(function (a) { R[a[0] + "," + a[1]] = 1; });
    return Object.assign({ n: n, R: R, val: val, f: {}, nn: {}, R3: {} }, extra || {});
  }

  var LANDS = [
    { id: "ch1", key: "1", name: "Material Meadow", ch: "Ch. 1", logics: ["CL"], color: "#7ec850", x: 34, y: 92,
      intro: "Classical logic and the material conditional ⊃. Everything here could be otherwise elsewhere.",
      insights: ["b1", "m_could", "c_category"],
      rounds: [
        { type: "value", logic: "CL", f: "(p ⊃ q) ∨ (q ⊃ p)", nu: { p: 1, q: 0 }, ref: "1.3",
          mind: "Could any classical valuation make this 0? Try it in your head: it is a tautology classically — but visit the Constructive Keep." },
        { type: "verdict", logic: "CL", prem: ["q"], concl: "p ⊃ q", side: ["K3", "L3", "LP", "RM3"], ref: "1.7, 7.5.2",
          mind: "Valid here. Could be invalid: look at the sideways strip." },
        { type: "forge", logic: "CL", prem: ["p ⊃ q"], concl: "q ⊃ p", ref: "1.5",
          q: "Build a counter-model: make the premise true and the conclusion false." },
        { type: "verdict", logic: "CL", prem: ["p ⊃ r"], concl: "(p ∧ q) ⊃ r", side: ["K3", "LP", "RM3"], ref: "1.9, 5.2",
          mind: "Antecedent strengthening: valid for ⊃ in every truth-functional land. Could 'if' fail it? In the Ceteris Paribus Cove (ch. 5) it does." },
        { type: "pick", q: "Which of these is a 'paradox of the material conditional' (valid classically, but odd for 'if')?", ref: "1.7",
          opts: [
            { t: "¬p ⊨ p ⊃ q", kind: "ok", note: "Yes: a false antecedent makes any conditional true." },
            { t: "p, p ⊃ q ⊨ q", kind: "when", note: "Modus ponens is no paradox — but it could fail: in LP it does (Three-Valued Isles)." },
            { t: "p ⊃ q ⊨ q ⊃ p", kind: "when", note: "Not valid classically (it would be the converse fallacy). It would fit a question about invalid forms." }
          ] },
        { type: "pick", q: "Arrows compose. q ⊨ p ⊃ q, and p ⊃ q ⊨ ¬q ⊃ ¬p. Which arrow is their composite?", ref: "1.3", cat: "Composition of entailments is transitivity: A ⊨ B and B ⊨ C give A ⊨ C.",
          opts: [
            { t: "q ⊨ ¬q ⊃ ¬p", kind: "ok", note: "Yes: follow the first arrow, then the second." },
            { t: "¬q ⊃ ¬p ⊨ q", kind: "when", note: "That would be the reverse arrow; it is not valid classically (take q false, p false)." },
            { t: "p ⊃ q ⊨ q", kind: "when", note: "That would compose the arrows the wrong way round, and it is invalid (q false, p false)." }
          ] }
      ] },

    { id: "ch2", key: "2", name: "Possible Worlds Port", ch: "Ch. 2", logics: ["K"], color: "#5ab4e6", x: 84, y: 40,
      intro: "Basic modal logic K: □ is 'at every world I can see', ◇ is 'at some world I can see'.",
      insights: ["b2", "m_novelty", "c_dual"],
      rounds: [
        { type: "wvalue", logic: "K", f: "◇p ∧ ¬□p", at: 0, model: M(3, [[0, 1], [0, 2]], { p: [false, true, false] }), ref: "2.3" },

      if (kind === "verdict" || kind === "forge") {

    });

    if (st.walk && !calm) { var f = placeById(st.walk.from), t = Math.min(1, st.walk.t); if (f) { sx = f.x + (here.x - f.x) * t; sy = f.y - 14 + (here.y - f.y) * t; } }

    text("♥ ∞", 286, 12, "#b0102a", 10);
  }
  function animate() {
    if (!st.walk || typeof window.requestAnimationFrame !== "function" || st.save.calm) { st.walk = null; return; }
    window.requestAnimationFrame(function step() { if (!st.walk) return; st.walk.t += 0.06; draw(); if (st.walk.t < 1) window.requestAnimationFrame(step); else { st.walk = null; draw(); } });
  }
  function drawRoundScene() {

    px(0, 0, W, H, "#eef7ff"); px(0, 0, W, 16, p.color); text(p.name + (r.logic ? "  ·  " + lname(r.logic) : ""), 6, 11, "#111", 9);
    text("♥ ∞", 286, 11, "#b0102a", 10);
    var model = r.type === "build" ? rs.model : r.type === "wvalue" ? r.model : null;

    if (r.logic && I.L(r.logic).kind === "fde") return drawDiamond(r, rs);
    if (r.type === "forge" || r.type === "value") return drawBars(r, rs);

  }
  // premises → conclusion as an arrow (an entailment is a morphism)
  function drawArrow(r, rs) {

    px(14, 60, 120, 40, "#f4ecd8"); px(186, 60, 120, 40, "#f4ecd8");
    text(prem.length > 22 ? prem.slice(0, 21) + "…" : prem, 20, 84, "#23203f", 8);
    text(concl.length > 22 ? concl.slice(0, 21) + "…" : concl, 192, 84, "#23203f", 8);
    var known = null;
    if (r.type === "verdict" && rs.done) known = verdict(r.logic, r.prem, r.concl, r.eps).valid;
    for (var x = 138; x < 178; x += known === false ? 6 : 2) px(x, 79, known === false ? 3 : 2, 2, known === null ? "#8a84c0" : known ? "#3fa34d" : "#c0563f");
    px(176, 76, 4, 8, known === null ? "#c0561a" : known ? "#3fa34d" : "#c0563f"); px(180, 78, 2, 4, known === null ? "#c0561a" : known ? "#3fa34d" : "#c0563f");
    text("⊨", 150, 72, "#c0561a", 10);
    text(r.logic ? lname(r.logic) : r.type === "atlas" ? "in every land?" : "which land?", 120, 118, "#4a4380", 8);
    if (known === false) text("✗ no arrow here", 120, 132, "#c0563f", 8);
    if (known === true) text("✓ an arrow", 130, 132, "#2e7d3a", 8);
    if (r.type === "atlas") r.logics.forEach(function (id, i) {
      var m = rs.marks[i]; px(20 + i * 58, 146, 52, 14, rs.locked[i] ? "#3fa34d" : m === null ? "#4a4380" : "#6b6585");
      text(lname(id).slice(0, 7) + (m === null ? " ?" : m ? " ✓" : " ✗"), 22 + i * 58, 156, "#fff", 7);
    });
  }
  function worldPos(n, w) {
    if (n === 1) return [150, 90];
    if (n === 2) return [[90, 95], [220, 95]][w];
    return [[80, 120], [160, 50], [240, 120]][w];
  }
  function drawWorlds(r, m) {
    var lg = I.L(r.logic);
    Object.keys(m.R || {}).forEach(function (k) {
      if (!m.R[k]) return; var a = k.split(",").map(Number), A = worldPos(m.n, a[0]), B = worldPos(m.n, a[1]);
      if (a[0] === a[1]) { px(A[0] - 4, A[1] - 26, 9, 2, "#8a84c0"); px(A[0] - 4, A[1] - 26, 2, 8, "#8a84c0"); px(A[0] + 3, A[1] - 26, 2, 8, "#8a84c0"); return; }
      for (var i = 2; i < 22; i++) px(A[0] + (B[0] - A[0]) * i / 24, A[1] + (B[1] - A[1]) * i / 24 + (a[0] < a[1] ? -3 : 3), 2, 2, "#8a84c0");
      px(A[0] + (B[0] - A[0]) * 0.8 - 2, A[1] + (B[1] - A[1]) * 0.8 - 2 + (a[0] < a[1] ? -3 : 3), 5, 5, "#c0561a");
    });
    if (m.star && m.star[0] === 1) { var s0 = worldPos(m.n, 0), s1 = worldPos(m.n, 1); for (var j = 3; j < 21; j += 3) px(s0[0] + (s1[0] - s0[0]) * j / 24, s0[1] + 16, 2, 2, "#c0307a"); text("✶ star", 140, 128, "#c0307a", 8); }
    I.range(m.n).forEach(function (w) {

      px(P[0] - 14, P[1] - 12, 28, 24, nn ? "#5a4a7a" : "#3f6f4a"); px(P[0] - 12, P[1] - 10, 24, 20, nn ? "#7a6aa0" : "#6ab070");
      text("w" + w, P[0] - 6, P[1] + 4, "#111", 9);
      var atoms = m.val ? Object.keys(m.val).filter(function (a) { return m.val[a][w]; }) : Object.keys(m.val4 || {}).map(function (a) { return a + ":" + m.val4[a][w].toUpperCase(); });
      text(atoms.join(" ") || "—", P[0] - 14, P[1] + 24, "#23203f", 8);
      if (nn) text("non-normal", P[0] - 22, P[1] - 16, "#6a4fc2", 7);
      if (r.concl) { var t = I.evalW(r.logic, m, r.concl, w); px(P[0] + 10, P[1] - 12, 4, 4, t ? "#3fa34d" : "#c0563f"); }
    });
    var r3 = Object.keys(m.R3 || {}).filter(function (k) { return m.R3[k]; });
    if (r3.length) text("R: " + r3.map(function (k) { return "(" + k.split(",").map(function (x) { return "w" + x; }).join(" ") + ")"; }).join(" "), 6, 168, "#c0561a", 8);
    if (lg.kind === "cond" && m.f) Object.keys(m.f).forEach(function (A, k) { text("f_" + A + "(w0) = {" + m.f[A][0].map(function (x) { return "w" + x; }).join(",") + "}", 6, 160 + k * 9, "#c0561a", 8); });
  }
  function drawBars(r, rs) {

    if (r.eps !== undefined) { var ey = 150 - Math.round(r.eps * 110); for (var x2 = 40; x2 < 290; x2 += 4) px(x2, ey, 2, 1, "#c0561a"); text("ε", 292, ey + 3, "#c0561a", 9); }
  }

    [["t", "b"], ["t", "n"], ["b", "f"], ["n", "f"]].forEach(function (e) { var A = pos[e[0]], B = pos[e[1]]; for (var i = 0; i < 20; i++) px(A[0] + (B[0] - A[0]) * i / 20, A[1] + (B[1] - A[1]) * i / 20, 2, 2, "#8a84c0"); });

  }

  // ------------------------------------------------------------------ boot
  window.IFIUI = { st: st, render: render, makeShuffle: makeShuffle, builderToggles: builderToggles, PLACES: PLACES, KEYS: KEYS };
