   <h2>Scorecard</h2>
   <p style="font-size:20px">Elo <b style="color:var(--acc)">${st.elo}</b> — <b>${rankOf(st.elo)}</b></p>
   <p>${ok} correct out of ${done} attempted${done === 50 ? " — you reached the top of the citadel! 🎉" : ""}. Best streak: ${st.best}.</p>
   <p class="dim">Ranks: ${RANKS.map(([e, r]) => `${r} (${e ? "≥ " + e : "below 950"})`).join(" · ")}. The maximum is ${maxElo()}.</p>
   <table><tr><th>#</th><th>Puzzle</th><th>Kind</th><th>Result</th><th>Elo</th></tr>`;
  for (const p of PUZZLES) {
    const a = st.attempts[p.n];
    h += `<tr><td>${p.n}</td><td>${a ? `<a href="#" data-act="open" data-n="${p.n}" style="color:var(--blue)">${esc(p.title)}</a>` : esc(p.title)}</td><td>${kindLabel(p)}</td>
     <td>${a ? (a.ok ? "✔ " : "✘ ") + a.mode : "—"}</td><td>${a ? (a.delta > 0 ? "+" : "") + a.delta : ""}</td></tr>`;
  }
  return h + `</table></div>`;
}

/* ---------- browser wiring ---------- */
if (typeof document !== "undefined") {
  const KEY = "deltaCitadel.v1";
  let st;
  try { st = Object.assign(newState(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { st = newState(); }
  let cur = null;
  const ui = { mode: "type", fills: [], chosen: [] };
  const app = document.getElementById("app");
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const hud = () => {
    document.getElementById("elo").textContent = st.elo;
    document.getElementById("streak").textContent = st.streak;
    document.getElementById("solved").textContent = solvedCount(st);
  };
  const toast = msg => { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); };
  const show = (html, keepScroll) => { app.innerHTML = html; hud(); if (!keepScroll) window.scrollTo(0, 0); };
  const shake = el => { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); };
  const openPuzzle = (n, keepChoices) => {
    if (!isUnlocked(st, n)) return;
    const p = PUZZLES[n - 1];
    if (cur !== n || !keepChoices) {
      ui.fills = p.kind === "eval" ? tokenize(p.answer).filter(t => t.slot).map(() => "?") : [];
      ui.chosen = p.kind === "fill" ? p.holes.map(() => null) : [];
    }
    cur = n;
    show(viewPuzzle(st, n, ui, null), keepChoices);
    const inp = document.getElementById("typed"); if (inp) inp.focus();
  };
  const finish = r => {
    save();
    if (r.ok && r.first && st.streak > 0 && st.streak % 5 === 0) toast(`🔥 ${st.streak} in a row!`);
    if (r.first && cur % 5 === 0 && cur < 50) toast(`Floor ${cur / 5 + 1} unlocked`);
    show(viewPuzzle(st, cur, ui, r));
  };
  const submit = () => {
    const p = PUZZLES[cur - 1];
    let given;
    if (p.kind === "fill") {
      if (ui.chosen.includes(null)) { toast("Choose an option for every hole first"); shake(app.querySelector("pre.code")); return; }
      given = ui.chosen.slice();
      return finish(grade(st, cur, given, "fill"));
    }
    if (ui.mode === "type") {
      given = document.getElementById("typed").value;
      if (!given.trim()) { shake(document.getElementById("typed")); return; }
    } else {
      document.querySelectorAll("#builder input").forEach(i => { ui.fills[+i.dataset.i] = i.value.trim() || "?"; });
      if (ui.fills.includes("?")) { shake(document.getElementById("builder")); toast("Fill every slot first"); return; }
      given = assemble(tokenize(p.answer), ui.fills);
    }
    finish(grade(st, cur, given, ui.mode));
  };
  app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input")) submit(); });
  document.body.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    e.preventDefault();
    const act = el.dataset.act;
    if (act === "map") show(viewMap(st));
    else if (act === "open") openPuzzle(+el.dataset.n);
    else if (act === "next") { let n = 1; while (n < 50 && st.attempts[n]) n++; openPuzzle(n); }
    else if (act === "random") { const open = PUZZLES.filter(p => isUnlocked(st, p.n)); openPuzzle(open[Math.floor(Math.random() * open.length)].n); }
    else if (act === "stats") show(viewStats(st));
    else if (act === "atlas") show(viewAtlas(st, null));
    else if (act === "pattern") { show(viewAtlas(st, el.dataset.p)); const t = document.getElementById("pat-" + el.dataset.p); if (t && t.scrollIntoView) t.scrollIntoView(); }
    else if (act === "reset") { if (confirm("Erase all progress and start again at Elo 1000?")) { st = newState(); save(); show(viewMap(st)); } }
    else if (act === "mode") { ui.mode = el.dataset.mode; openPuzzle(cur); }
    else if (act === "cycle") { const v = el.dataset.v === "true" ? "false" : "true"; el.dataset.v = v; el.textContent = v; el.className = "slot-b " + v[0]; ui.fills[+el.dataset.i] = v; }
    else if (act === "choose") { const i = +el.dataset.i; ui.chosen[i] = PUZZLES[cur - 1].holes[i].choices[+el.dataset.c]; openPuzzle(cur, true); }
    else if (act === "focus") { /* clicking a hole in the code just scrolls to its options */ const o = app.querySelectorAll(".opts")[+el.dataset.k - 1]; if (o && o.scrollIntoView) o.scrollIntoView({ block: "center" }); }
    else if (act === "submit") submit();
    else if (act === "retry") openPuzzle(cur);
    else if (act === "reveal") { const p = PUZZLES[cur - 1]; const r = grade(st, cur, p.kind === "fill" ? p.holes.map(() => null) : "", "reveal"); finish(r); }
  });
  show(viewMap(st));
}
if (typeof module !== "undefined") module.exports = { DATA, PUZZLES, FLOORS, PATTERNS, POINTS, START_ELO, RANKS, normalize, tokenize, assemble, maxPoints, maxElo, newState, isUnlocked, floorUnlocked, judge, grade, solvedCount, attemptedCount, rankOf, puzzlesWithPattern, highlight, codeWithHoles, inlineMd, viewMap, viewPuzzle, viewAtlas, viewStats, esc };
</script>
</body>
</html>
