<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δ-Citadel · Kalkulus-vár — 50 Lean calculus puzzles</title>
<style>
:root{--bg:#0f1a1c;--panel:#17272a;--panel2:#20363a;--ink:#e8f6f3;--dim:#9dbfb9;--acc:#ffd166;--good:#5ee59a;--bad:#ff6b81;--blue:#7fd3ff;--code:#0a1314;--cat:#c3a6ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#1f5550,var(--bg) 60%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#08100fcc;position:sticky;top:0;z-index:5;border-bottom:1px solid #2b4a4e;flex-wrap:wrap}
header h1{font-size:18px;margin:0;cursor:pointer}
header .sp{flex:1}
.pill{background:var(--panel2);padding:4px 10px;border-radius:99px;font-size:14px;white-space:nowrap}
.pill b{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:18px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid #3d6268;border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:#2a1d00;border-color:var(--acc);font-weight:600}
.card{background:var(--panel);border:1px solid #2b4a4e;border-radius:16px;padding:18px;margin:14px 0}
.dim{color:var(--dim)}
.floor{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center;padding:12px 16px;margin:10px 0;background:var(--panel);border-radius:14px;border:1px solid #2b4a4e}
.floor.locked{opacity:.4}
.floor h3{margin:0;font-size:16px}
.doors{display:flex;gap:10px;flex-wrap:wrap}
.door{width:128px;height:76px;border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12.5px;line-height:1.2;text-align:center;padding:4px}
.door .num{font-size:17px;font-weight:700}
.door .kind{font-size:11px;color:var(--dim)}
.door.ok{background:#1d4733;border-color:var(--good)}
.door.ko{background:#4a1f2a;border-color:var(--bad)}
.door.open{border-color:var(--acc);box-shadow:0 0 12px #ffd16655}
pre.code{background:var(--code);border:1px solid #23403f;border-radius:12px;padding:14px;overflow-x:auto;font:14px/1.5 "JetBrains Mono",Menlo,Consolas,monospace;margin:10px 0}
code{font-family:"JetBrains Mono",Menlo,Consolas,monospace;background:#0a1314;padding:1px 5px;border-radius:5px;font-size:.92em}
.kw{color:#c792ea}.cm{color:#6f9690;font-style:italic}.nu{color:#f78c6c}.bo{color:#82aaff}.st{color:#c3e88d}.ev{color:#ffcb6b;font-weight:700}.ta{color:#89ddff}
.hole{display:inline-block;border:2px dashed var(--acc);border-radius:7px;padding:0 6px;color:var(--acc);cursor:pointer;min-width:2.2em;text-align:center}
.hole.set{border-style:solid;background:#2d2a12}
.hole.good{border-color:var(--good);color:var(--good);background:#143823}
.hole.bad{border-color:var(--bad);color:var(--bad);background:#3d1720}
.opts{margin:8px 0 14px}
.opts .lbl{font-weight:600;margin-right:8px;color:var(--acc)}
.opts button{font:14px "JetBrains Mono",Menlo,monospace;margin:4px 6px 4px 0;padding:6px 10px}
.opts button.sel{border-color:var(--acc);background:#3a3518}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button.sel{border-color:var(--acc);background:#2d4a3c}
input.typed{width:100%;font:16px "JetBrains Mono",Menlo,monospace;padding:10px;border-radius:10px;border:1px solid #3d6268;background:var(--code);color:var(--ink)}
.builder{font:18px "JetBrains Mono",Menlo,monospace;background:var(--code);padding:14px;border-radius:12px;line-height:2.4;border:1px solid #23403f}
.builder .slot-b{font:inherit;padding:2px 8px;min-width:64px;border-radius:8px}
.builder .slot-b.t{color:var(--blue)}.builder .slot-b.f{color:#ff9fb0}
.builder input{font:inherit;width:3.4em;text-align:center;border-radius:8px;border:1px solid #3d6268;background:#122224;color:#f78c6c;padding:2px}
.verdict{font-size:22px;font-weight:700;margin:6px 0}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.lean{border-left:4px solid var(--good);padding-left:12px}
.lens{border-left:4px solid var(--cat);padding:4px 12px;background:#1d1d33;border-radius:0 10px 10px 0;margin:12px 0}
.lens h3{margin:4px 0;color:var(--cat);font-size:16px}
.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:#2a2547;color:var(--cat);border:1px solid #4a3f80;margin:2px 4px 2px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:#23403f;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--good))}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#2a1d00;padding:10px 18px;border-radius:99px;font-weight:700;animation:pop 2.4s forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid #2b4a4e;text-align:left;font-size:14px;vertical-align:top}
.pat{border-bottom:1px solid #2b4a4e;padding:12px 0}
.pat h3{margin:0 0 4px}
@media (max-width:680px){.floor{grid-template-columns:1fr}.door{width:100px}}
</style>
</head>
<body>
<header>
  <h1 data-act="map">🏰 Δ-Citadel <span class="dim" style="font-weight:400">· Kalkulus-vár</span></h1>
  <span class="sp"></span>
  <button data-act="atlas" style="padding:4px 10px;font-size:14px">🧭 Pattern atlas</button>
  <span class="pill">Elo <b id="elo">1000</b></span>
  <span class="pill">Streak <b id="streak">0</b></span>
  <span class="pill">Solved <b id="solved">0</b>/50</span>
</header>
<main id="app"></main>
<script>
"use strict";
const DATA = {"puzzles": [{"n": 1, "floor": 1, "elo": 1100, "kind": "eval", "title": "Multiples of four", "hu": "A néggyel osztható pozitív egészek", "src": "gy. 1.3 e), 1.4 a)", "patterns": ["OMEGA"], "code": "-- A set given by a formula is a filter.\ndef inS (n : ℕ) : Bool := 0 < n && n % 4 == 0\n\ndef output := (List.range 30).filter inS\n#eval output", "explanation": "`List.range 30` is `[0, …, 29]`. `0` fails the `0 < n` test, so the smallest element is `4`. That is the lower bound (indeed the minimum) of the set in 1.4 a). The set has no upper bound.", "lens": "`inS : ℕ → Bool` is the characteristic map of the set, and `filter inS` is the pullback of `true` along it.", "file": "RequestProject/Puzzles/Kalkulus/K01.lean", "answer": "[4, 8, 12, 16, 20, 24, 28]"}, {"n": 2, "floor": 1, "elo": 1108, "kind": "eval", "title": "The good village shepherd", "hu": "A jó falusi juhász", "src": "gy. 1.2 (Russell)", "patterns": ["DIAG"], "code": "-- The shepherd looks after exactly those who do not look after themselves.\n-- If `b` says whether he looks after his own sheep, the rule demands `!b`.\ndef rule (b : Bool) : Bool := !b\n\ndef output := [false, true].map (fun b => rule b == b)\n#eval output", "explanation": "Neither truth value is consistent: `rule false = true ≠ false` and `rule true = false ≠ true`. So no such shepherd exists. This is Russell's paradox in miniature.", "lens": "Negation `Ω → Ω` has no fixed point. By Lawvere's fixed-point theorem, no set can list all of its own subsets: there is no surjection A → (A → Ω).", "file": "RequestProject/Puzzles/Kalkulus/K02.lean", "answer": "[false, false]"}, {"n": 3, "floor": 1, "elo": 1116, "kind": "eval", "title": "1/n: max but no min", "hu": "{1/n}: van max, nincs min", "src": "gy. 1.4 c)", "patterns": ["UNIV"], "code": "def xs : List ℚ := (List.range 10).map (fun n => 1 / (n + 1))\n\ndef output := (xs.foldl max 0, xs.foldl min 1)\n#eval output", "explanation": "Over the first ten terms the largest is `1/1` and the smallest is `1/10`. For the whole set {1/n}, sup = max = 1, but inf = 0 is never attained, since every finite stage still has a positive minimum.", "lens": "sup is a colimit in the poset (ℚ, ≤). Here it happens to be an element of the set (a maximum). inf exists in ℝ but is not a member, so the limit exists without a minimum.", "file": "RequestProject/Puzzles/Kalkulus/K03.lean", "answer": "(1, 1 / 10)"}, {"n": 4, "floor": 1, "elo": 1124, "kind": "eval", "title": "A grid of fractions", "hu": "p/q rács", "src": "gy. 1.4 d)", "patterns": ["UNIV", "REP"], "code": "def grid : List ℚ :=\n  [1, 2, 3, 4].flatMap (fun p => [101, 102, 103, 104].map (fun q => p / q))\n\ndef output := (grid.foldl max 0, grid.foldl min 1)\n#eval output", "explanation": "p/q increases in p and decreases in q. So the maximum takes the largest p and the smallest q, and the minimum takes the smallest p and the largest q.", "lens": "(p, q) ↦ p/q is monotone on ℚ>0 × (ℚ>0)ᵒᵖ, a functor between posets. Such a map takes the top element of the product, (max p, min q), to the maximum of the image.", "file": "RequestProject/Puzzles/Kalkulus/K04.lean", "answer": "(4 / 101, 1 / 104)"}, {"n": 5, "floor": 1, "elo": 1132, "kind": "eval", "title": "The frog and the kiss", "hu": "A szélesszájú kisbéka", "src": "gy. 1.6", "patterns": ["UNIV", "NNO"], "code": "-- Position after n jumps: 1/2 + 1/4 + ... + 1/2^n\ndef pos (n : ℕ) : ℚ := ∑ i ∈ Finset.range n, 1 / 2 ^ (i + 1)\n\ndef output := (List.range 5).map pos\n#eval output", "explanation": "After n jumps the frog is at 1 − 1/2ⁿ, always strictly below 1. The supremum of its positions is 1, but it is never reached, so no kiss. Lean prints fractions with spaces: `1 / 2`.", "lens": "The positions form a chain in (ℚ, ≤) whose colimit (sup) is 1. The remaining gap halves at each step, which makes the jump map a contraction.", "file": "RequestProject/Puzzles/Kalkulus/K05.lean", "answer": "[0, 1 / 2, 3 / 4, 7 / 8, 15 / 16]"}, {"n": 6, "floor": 2, "elo": 1140, "kind": "eval", "title": "Quantifier order", "hu": "A kvantorok sorrendje", "src": "gy. 1.7 · PATTERNS P10", "patterns": ["ADJ"], "code": "open Finset in\ndef output :=\n  ( decide (∀ e ∈ Icc 1 4, ∃ d ∈ Icc 1 4, d ≤ e),\n    decide (∃ d ∈ Icc 1 4, ∀ e ∈ Icc 1 4, d ≤ e),\n    decide (∀ d ∈ Icc 1 4, ∃ e ∈ Icc 1 4, e < d),\n    decide (∃ e ∈ Icc 1 4, ∀ d ∈ Icc 1 4, d ≤ e) )\n#eval output", "explanation": "1) Take d = e. 2) d = 1 works for every e. 3) Fails for d = 1, since nothing in {1,…,4} is below 1. 4) e = 4 is above everything. On a finite set, `decide` checks quantifiers by trying every case.", "lens": "∃ and ∀ are adjoints to weakening, and ∃∀ ⇒ ∀∃ always holds (one witness for all). The converse needs a single witness that does not depend on the outer variable.", "file": "RequestProject/Puzzles/Kalkulus/K06.lean", "answer": "(true, true, false, true)"}, {"n": 7, "floor": 2, "elo": 1148, "kind": "eval", "title": "Divisible by 4 ⇒ even", "hu": "Néggyel osztható ⇒ páros", "src": "gy. 1.7 a)", "patterns": ["OMEGA", "ADJ"], "code": "def output :=\n  ( decide (∀ n ∈ Finset.range 100, n % 4 = 0 → n % 2 = 0),\n    decide (∀ n ∈ Finset.range 100, n % 2 = 0 → n % 4 = 0) )\n#eval output", "explanation": "Every multiple of 4 is even. The converse fails already at `n = 2`. As a formula: ∀n (4 ∣ n → 2 ∣ n).", "lens": "Implication between predicates is inclusion of subobjects: 4ℕ ↪ 2ℕ is a monic arrow, but 2ℕ does not factor through 4ℕ.", "file": "RequestProject/Puzzles/Kalkulus/K07.lean", "answer": "(true, false)"}, {"n": 8, "floor": 2, "elo": 1156, "kind": "fill", "title": "Choosing δ for ε", "hu": "δ választása ε-hoz", "src": "PATTERNS Drills 9 · gy. 3.1", "patterns": ["ADJ"], "code": "theorem forall_exists_small : ∀ ε > (0 : ℝ), ∃ δ > 0, δ < ε := by\n  intro ε hε\n  refine ⟨__1__, ?_, ?_⟩ <;> linarith", "explanation": "δ must be positive and smaller than ε. `ε / 2` gives `0 < ε/2` and `ε/2 < ε`, and `linarith` closes both from `hε`. With `0`, positivity fails; with `ε` or `2 * ε`, the inequality fails.", "lens": "A proof of ∀ε ∃δ is a function ε ↦ δ(ε), here δ = ε/2, called a Skolem function. Proving ∃ means giving a witness, that is, a point of the solution set.", "file": "RequestProject/Puzzles/Kalkulus/K08.lean", "holes": [{"k": 1, "choices": ["0", "ε / 2", "2 * ε", "ε"], "correct": "ε / 2"}], "solution": "theorem forall_exists_small : ∀ ε > (0 : ℝ), ∃ δ > 0, δ < ε := by\n  intro ε hε\n  refine ⟨ε / 2, ?_, ?_⟩ <;> linarith"}, {"n": 9, "floor": 2, "elo": 1164, "kind": "fill", "title": "∃δ ∀ε is false", "hu": "∃δ ∀ε hamis", "src": "PATTERNS Drills 9", "patterns": ["DIAG", "ADJ"], "code": "theorem not_exists_forall : ¬ ∃ δ > (0 : ℝ), ∀ ε > 0, δ < ε := by\n  rintro ⟨δ, hδ, h⟩\n  have hδδ : δ < δ := __1__\n  linarith", "explanation": "Specialise the ∀ε to ε := δ itself (allowed, since δ > 0). That gives δ < δ, which is impossible. The arguments come in order: first the number, then the proof that it is positive.", "lens": "Plugging δ into its own ∀ is the diagonal move. Specialising a ∀ is precomposition with a point, that is, pulling back along `δ : 1 → ℝ`.", "file": "RequestProject/Puzzles/Kalkulus/K09.lean", "holes": [{"k": 1, "choices": ["hδ δ", "lt_irrefl δ", "h δ hδ", "h hδ δ"], "correct": "h δ hδ"}], "solution": "theorem not_exists_forall : ¬ ∃ δ > (0 : ℝ), ∀ ε > 0, δ < ε := by\n  rintro ⟨δ, hδ, h⟩\n  have hδδ : δ < δ := h δ hδ\n  linarith"}, {"n": 10, "floor": 2, "elo": 1172, "kind": "fill", "title": "ℕ has no upper bound", "hu": "ℕ felülről nem korlátos", "src": "gy. 1.4 a) · jegyzet 2.3", "patterns": ["ADJ", "UNIV"], "code": "theorem nat_unbounded : ¬ ∃ K : ℝ, ∀ n : ℕ, (n : ℝ) ≤ K := by\n  push_neg\n  intro K\n  __1__", "explanation": "`push_neg` turns ¬∃K ∀n, n ≤ K into ∀K ∃n, K < n. That is exactly the Archimedean property `exists_nat_gt K`. Using `0` instead of `K` proves the wrong statement.", "lens": "Negation moves through quantifiers by swapping ∃ and ∀ (De Morgan for adjoints). The Archimedean property says ℕ → ℝ is cofinal.", "file": "RequestProject/Puzzles/Kalkulus/K10.lean", "holes": [{"k": 1, "choices": ["linarith", "exact exists_nat_gt K", "exact ⟨0, le_refl K⟩", "exact exists_nat_gt 0"], "correct": "exact exists_nat_gt K"}], "solution": "theorem nat_unbounded : ¬ ∃ K : ℝ, ∀ n : ℕ, (n : ℝ) ≤ K := by\n  push_neg\n  intro K\n  exact exists_nat_gt K"}, {"n": 11, "floor": 3, "elo": 1180, "kind": "eval", "title": "Triangular numbers", "hu": "Háromszögszámok", "src": "gy. 1.14 a)", "patterns": ["NNO"], "code": "def S (n : ℕ) : ℕ := ∑ i ∈ Finset.range (n + 1), i\n\ndef output := (List.range 6).map S\n#eval output", "explanation": "S(n) = 0 + 1 + ⋯ + n = n(n+1)/2. Note `range (n + 1)` includes `n`. Each value adds the next integer: this is the step F(n+1) − F(n) = n+1 of the master theorem.", "lens": "S is the unique map from the initial algebra (ℕ, 0, succ) into (ℕ, 0, s ↦ s + (n+1)). Any closed formula with the same base case and step must equal it.", "file": "RequestProject/Puzzles/Kalkulus/K11.lean", "answer": "[0, 1, 3, 6, 10, 15]"}, {"n": 12, "floor": 3, "elo": 1188, "kind": "eval", "title": "Nicomachus", "hu": "Nikomakhosz", "src": "gy. 1.14 b) · Kobosszeg-Kapcsolatok 3.1", "patterns": ["NNO"], "code": "def cubes (n : ℕ) : ℕ := ∑ i ∈ Finset.range (n + 1), i ^ 3\ndef tri (n : ℕ) : ℕ := ∑ i ∈ Finset.range (n + 1), i\n\ndef output := (List.range 5).map (fun n => (cubes n, tri n ^ 2))\n#eval output", "explanation": "1³ + ⋯ + n³ = (1 + ⋯ + n)². Both sides start at 0 and grow by (n+1)³ at each step, because ((n+1)(n+2)/2)² − (n(n+1)/2)² = (n+1)³.", "lens": "Two maps out of the initial algebra with the same base case and the same step are equal (the equalizer argument). Geometrically, the n × n square of side 1 + ⋯ + n splits into L-shaped layers of area k³.", "file": "RequestProject/Puzzles/Kalkulus/K12.lean", "answer": "[(0, 0), (1, 1), (9, 9), (36, 36), (100, 100)]"}, {"n": 13, "floor": 3, "elo": 1196, "kind": "eval", "title": "The difference operator", "hu": "A Δ különbség-operátor", "src": "gy. 1.15 b)", "patterns": ["NNO"], "code": "def F (n : ℕ) : ℕ := n * (n + 1) * (n + 2) / 3\ndef diff (G : ℕ → ℕ) (n : ℕ) : ℕ := G (n + 1) - G n\n\ndef output := (List.range 5).map (diff F)\n#eval output", "explanation": "F takes the values 0, 2, 8, 20, 40, 70, and the differences are (n+1)(n+2). So F(n) = 1·2 + 2·3 + ⋯ + n(n+1), which is 1.15 b). To check a sum formula, apply Δ to it.", "lens": "Δ and Σ are inverse to each other: ΔF = f with F(0) = 0 is equivalent to F = Σf. This is the discrete fundamental theorem of calculus, and F is a discrete antiderivative.", "file": "RequestProject/Puzzles/Kalkulus/K13.lean", "answer": "[2, 6, 12, 20, 30]"}, {"n": 14, "floor": 3, "elo": 1204, "kind": "fill", "title": "Gauss by induction", "hu": "Gauss indukcióval", "src": "gy. 1.14 a)", "patterns": ["NNO"], "code": "theorem gauss (n : ℕ) : ∑ i ∈ Finset.range (n + 1), (i : ℚ) = n * (n + 1) / 2 := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    rw [__1__, ih]\n    push_cast\n    ring", "explanation": "`Finset.sum_range_succ` splits off the last term: Σ_{i<k+2} = Σ_{i<k+1} + (k+1). This exposes the induction hypothesis `ih` for rewriting. The other lemmas do not match the goal, or they produce a shape where `ih` no longer applies.", "lens": "This is the step arrow of the initial algebra: the sum up to n+1 is step(sum up to n). Rewriting by `ih` is the equalizer argument in action.", "file": "RequestProject/Puzzles/Kalkulus/K14.lean", "holes": [{"k": 1, "choices": ["Finset.sum_range_one", "Finset.sum_range_zero", "Finset.range_succ", "Finset.sum_range_succ"], "correct": "Finset.sum_range_succ"}], "solution": "theorem gauss (n : ℕ) : ∑ i ∈ Finset.range (n + 1), (i : ℚ) = n * (n + 1) / 2 := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    rw [Finset.sum_range_succ, ih]\n    push_cast\n    ring"}, {"n": 15, "floor": 3, "elo": 1212, "kind": "fill", "title": "1.15 a) in two moves", "hu": "1.15 a) két lépésben", "src": "gy. 1.15 a)", "patterns": ["NNO"], "code": "theorem ex1_15a (n : ℕ) : ∑ i ∈ Finset.Icc 1 n, i * (3 * i + 1) = n * (n + 1) ^ 2 := by\n  induction n with\n  | zero => __1__\n  | succ k ih =>\n    rw [Finset.sum_Icc_succ_top (by omega), ih]\n    __2__", "explanation": "Base case: the empty sum is 0 and 0·1² = 0, which `simp` handles. Step: after splitting off the top term and using `ih`, we need k(k+1)² + (k+1)(3(k+1)+1) = (k+1)(k+2)². This is a polynomial identity, so `ring` proves it. `omega` gives up on products of variables, and `ih` has already been used, so it is not the goal.", "lens": "Master theorem with F(n) = n(n+1)² and f(i) = i(3i+1). In binomial coordinates, i(3i+1) = 6·C(i,2) + 4·C(i,1), the 'LEGO basis'.", "file": "RequestProject/Puzzles/Kalkulus/K15.lean", "holes": [{"k": 1, "choices": ["exact ih", "linarith", "omega", "simp"], "correct": "simp"}, {"k": 2, "choices": ["ring", "simp", "omega", "exact ih"], "correct": "ring"}], "solution": "theorem ex1_15a (n : ℕ) : ∑ i ∈ Finset.Icc 1 n, i * (3 * i + 1) = n * (n + 1) ^ 2 := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    rw [Finset.sum_Icc_succ_top (by omega), ih]\n    ring"}, {"n": 16, "floor": 4, "elo": 1220, "kind": "eval", "title": "Base-case trap", "hu": "Csapda a kezdőesetnél", "src": "gy. 1.15 d) · Kalkulus-Gyakorlo-Indukcio", "patterns": ["BASE", "MUL"], "code": "-- 1.15 d) claims n! < ((n+1)/2)^n for all n ≥ 1\ndef claim (n : ℕ) : Bool := decide ((Nat.factorial n : ℚ) < ((n + 1 : ℚ) / 2) ^ n)\n\ndef output := (List.range' 1 5).map claim\n#eval output", "explanation": "`List.range' 1 5` is `[1, 2, 3, 4, 5]`. At n = 1 both sides equal 1, so the strict `<` fails: the sheet's statement is false as printed. From n = 2 on it holds (2 < 9/4, 6 < 8, …), so the induction must start at 2.", "lens": "The set of good n is closed under +1 but does not contain 1. It contains the sub-algebra generated by 2, that is ℕ≥2. Always check where the induction should start.", "file": "RequestProject/Puzzles/Kalkulus/K16.lean", "answer": "[false, true, true, true, true]"}, {"n": 17, "floor": 4, "elo": 1228, "kind": "eval", "title": "Bernoulli in numbers", "hu": "Bernoulli számokkal", "src": "jegyzet 2.5.4 Tétel", "patterns": ["MUL"], "code": "def output := (List.range 5).map (fun (n : ℕ) => ((1 + (1 : ℚ) / 2) ^ n, 1 + n * ((1 : ℚ) / 2)))\n#eval output", "explanation": "(1 + x)ⁿ ≥ 1 + nx with x = 1/2. Equality holds for n = 0 and n = 1. After that the power wins: 9/4 > 2, 27/8 > 5/2, 81/16 > 3. The left side multiplies, while the right side only adds.", "lens": "Exponentials turn sums into products: (1+x)^(m+n) = (1+x)^m·(1+x)^n, a monoid homomorphism (ℕ, +) → (ℚ, ·). Bernoulli compares this with its linear approximation.", "file": "RequestProject/Puzzles/Kalkulus/K17.lean", "answer": "[(1, 1), (3 / 2, 3 / 2), (9 / 4, 2), (27 / 8, 5 / 2), (81 / 16, 3)]"}, {"n": 18, "floor": 4, "elo": 1236, "kind": "fill", "title": "Bernoulli's step", "hu": "A Bernoulli-lépés", "src": "jegyzet 2.5.4 Tétel · gy. 1.15 d)", "patterns": ["MUL", "ORD"], "code": "theorem bernoulli (x : ℝ) (hx : -1 ≤ x) (n : ℕ) : 1 + n * x ≤ (1 + x) ^ n := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    have h1 : 0 ≤ 1 + x := by linarith\n    have h2 : 0 ≤ (k : ℝ) * x ^ 2 := by positivity\n    calc 1 + ((k + 1 : ℕ) : ℝ) * x ≤ (1 + k * x) * (1 + x) := by push_cast; nlinarith\n      _ ≤ (1 + x) ^ k * (1 + x) := __1__\n      _ = (1 + x) ^ (k + 1) := by ring", "explanation": "We have `ih : 1 + k·x ≤ (1+x)^k` and want to multiply both sides on the right by 1 + x ≥ 0. That is `mul_le_mul_of_nonneg_right ih h1`. The `_left` version multiplies on the other side, and swapping the arguments gives a type error. Here x ≥ −1 is used, through h1.", "lens": "Multiplying by c ≥ 0 is a monotone map, that is, a functor (ℝ, ≤) → (ℝ, ≤). It carries the arrow `ih` to a new arrow. A multiplicative induction step needs exactly this.", "file": "RequestProject/Puzzles/Kalkulus/K18.lean", "holes": [{"k": 1, "choices": ["mul_le_mul_of_nonneg_right ih h1", "mul_le_mul_of_nonneg_left ih h1", "mul_le_mul_of_nonneg_right h1 ih", "add_le_add_right ih 1"], "correct": "mul_le_mul_of_nonneg_right ih h1"}], "solution": "theorem bernoulli (x : ℝ) (hx : -1 ≤ x) (n : ℕ) : 1 + n * x ≤ (1 + x) ^ n := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    have h1 : 0 ≤ 1 + x := by linarith\n    have h2 : 0 ≤ (k : ℝ) * x ^ 2 := by positivity\n    calc 1 + ((k + 1 : ℕ) : ℝ) * x ≤ (1 + k * x) * (1 + x) := by push_cast; nlinarith\n      _ ≤ (1 + x) ^ k * (1 + x) := mul_le_mul_of_nonneg_right ih h1\n      _ = (1 + x) ^ (k + 1) := by ring"}, {"n": 19, "floor": 4, "elo": 1244, "kind": "fill", "title": "Summing inequalities", "hu": "Egyenlőtlenségek összegzése", "src": "gy. 1.15 c) · K2", "patterns": ["ORD", "NNO"], "code": "theorem ordered_master (F f : ℕ → ℝ) (h0 : F 0 = 0)\n    (hstep : ∀ n, F (n + 1) - F n ≤ f (n + 1)) :\n    ∀ n, F n ≤ ∑ i ∈ Finset.range n, f (i + 1) := by\n  intro n\n  induction n with\n  | zero => simp [h0]\n  | succ k ih =>\n    rw [Finset.sum_range_succ]\n    have := hstep k\n    __1__", "explanation": "Add the two arrows `ih : F k ≤ Σ` and `this : F(k+1) − F k ≤ f(k+1)`. The result F(k+1) ≤ Σ + f(k+1) is a linear combination of them, so `linarith` proves it. Neither hypothesis on its own is the goal.", "lens": "The ordered master theorem is the same initial-algebra argument in the preorder (ℝ, ≤). With F(n) = 2√n and f(i) = 1/√i it gives the bounds in 1.15 c).", "file": "RequestProject/Puzzles/Kalkulus/K19.lean", "holes": [{"k": 1, "choices": ["simp", "exact this", "exact ih", "linarith"], "correct": "linarith"}], "solution": "theorem ordered_master (F f : ℕ → ℝ) (h0 : F 0 = 0)\n    (hstep : ∀ n, F (n + 1) - F n ≤ f (n + 1)) :\n    ∀ n, F n ≤ ∑ i ∈ Finset.range n, f (i + 1) := by\n  intro n\n  induction n with\n  | zero => simp [h0]\n  | succ k ih =>\n    rw [Finset.sum_range_succ]\n    have := hstep k\n    linarith"}, {"n": 20, "floor": 4, "elo": 1252, "kind": "fill", "title": "2ⁿ ≤ n! from 4 on", "hu": "2ⁿ ≤ n! (n ≥ 4)", "src": "gy. 1.15 d) · K3", "patterns": ["BASE", "MUL"], "code": "theorem two_pow_le_fact (n : ℕ) (hn : 4 ≤ n) : 2 ^ n ≤ Nat.factorial n := by\n  induction n, hn using Nat.le_induction with\n  | base => __1__\n  | succ k hk ih =>\n    rw [pow_succ, Nat.factorial_succ]\n    __2__", "explanation": "Base: 2⁴ = 16 ≤ 24 = 4!. This is a closed statement about numerals, so `decide` evaluates it. Step: we need 2ᵏ·2 ≤ (k+1)·k! from `ih : 2ᵏ ≤ k!` and k ≥ 4. This multiplies two inequalities, which needs `nlinarith`. `Nat.le_induction` starts the induction at 4, since it fails for n = 1, 2, 3.", "lens": "A multiplicative step: (k+1)! = (k+1)·k!. Taking log turns it into an additive master theorem. The induction runs over the initial algebra ℕ≥4.", "file": "RequestProject/Puzzles/Kalkulus/K20.lean", "holes": [{"k": 1, "choices": ["omega", "rfl", "exact hk", "decide"], "correct": "decide"}, {"k": 2, "choices": ["omega", "nlinarith", "linarith", "simp"], "correct": "nlinarith"}], "solution": "theorem two_pow_le_fact (n : ℕ) (hn : 4 ≤ n) : 2 ^ n ≤ Nat.factorial n := by\n  induction n, hn using Nat.le_induction with\n  | base => decide\n  | succ k hk ih =>\n    rw [pow_succ, Nat.factorial_succ]\n    nlinarith"}, {"n": 21, "floor": 5, "elo": 1260, "kind": "eval", "title": "A row of Pascal's triangle", "hu": "A Pascal-háromszög egy sora", "src": "gy. 1.19 a)", "patterns": ["PASCAL"], "code": "def output := (List.range 6).map (Nat.choose 5)\n#eval output", "explanation": "`Nat.choose 5 k` for k = 0, …, 5. The row is symmetric, C(5,k) = C(5,5−k), and each entry is the sum of the two above it in row 4: 1 4 6 4 1.", "lens": "C(5,k) is the number of k-element subsets of a 5-element set. Symmetry is the bijection S ↦ complement of S.", "file": "RequestProject/Puzzles/Kalkulus/K21.lean", "answer": "[1, 5, 10, 10, 5, 1]"}, {"n": 22, "floor": 5, "elo": 1268, "kind": "eval", "title": "Row sums are powers of 2", "hu": "A sorok összege 2-hatvány", "src": "gy. 1.19 b) with a = b = 1", "patterns": ["PASCAL"], "code": "def rowSum (n : ℕ) : ℕ := ∑ k ∈ Finset.range (n + 1), Nat.choose n k\n\ndef output := (List.range 6).map rowSum\n#eval output", "explanation": "Put a = b = 1 in the binomial theorem: Σ C(n,k) = 2ⁿ.", "lens": "Counting all subsets by size gives |P(n)| = 2ⁿ, because P(n) ≅ (n → Bool) = (n → Ω), the characteristic maps once more.", "file": "RequestProject/Puzzles/Kalkulus/K22.lean", "answer": "[1, 2, 4, 8, 16, 32]"}, {"n": 23, "floor": 5, "elo": 1276, "kind": "eval", "title": "The hockey stick", "hu": "A hokiütő", "src": "gy. 1.19 c)", "patterns": ["PASCAL", "NNO"], "code": "def output := (∑ i ∈ Finset.range 7, Nat.choose i 2, Nat.choose 7 3)\n#eval output", "explanation": "C(0,2) + C(1,2) + ⋯ + C(6,2) = 0 + 0 + 1 + 3 + 6 + 10 + 15 = 35 = C(7,3). The diagonal sums to the entry just below and to the right of where it stops.", "lens": "A master theorem whose step is Pascal's rule. Bijectively: sort the 3-subsets of {0,…,6} by their largest element i; the other two elements form a 2-subset of {0,…,i−1}.", "file": "RequestProject/Puzzles/Kalkulus/K23.lean", "answer": "(35, 35)"}, {"n": 24, "floor": 5, "elo": 1284, "kind": "fill", "title": "Pascal's rule", "hu": "Pascal-szabály", "src": "gy. 1.19 a)", "patterns": ["PASCAL"], "code": "theorem pascal (n k : ℕ) :\n    Nat.choose n k + Nat.choose n (k + 1) = Nat.choose (n + 1) (k + 1) := by\n  __1__", "explanation": "Mathlib states the rule as `choose (n+1) (k+1) = choose n k + choose n (k+1)`, the other way round, so we flip it with `.symm`. Plain `simp` does not know it as a simplification, and `choose_succ_self_right` is a different identity, C(n+1, n) = n + 1.", "lens": "A coproduct decomposition: a (k+1)-subset of {0..n} either contains n (and is then a k-subset of {0..n−1} plus n) or it does not.", "file": "RequestProject/Puzzles/Kalkulus/K24.lean", "holes": [{"k": 1, "choices": ["simp", "exact Nat.choose_symm_diff", "exact Nat.choose_succ_self_right n", "exact (Nat.choose_succ_succ n k).symm"], "correct": "exact (Nat.choose_succ_succ n k).symm"}], "solution": "theorem pascal (n k : ℕ) :\n    Nat.choose n k + Nat.choose n (k + 1) = Nat.choose (n + 1) (k + 1) := by\n  exact (Nat.choose_succ_succ n k).symm"}, {"n": 25, "floor": 5, "elo": 1292, "kind": "fill", "title": "Hockey stick by induction", "hu": "Hokiütő indukcióval", "src": "gy. 1.19 c) · K6", "patterns": ["PASCAL", "NNO"], "code": "theorem hockey (n k : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), Nat.choose (i + k) k = Nat.choose (n + k + 1) (k + 1) := by\n  induction n with\n  | zero => simp\n  | succ m ih =>\n    rw [__1__, ih]\n    rw [show m + 1 + k + 1 = (m + k + 1) + 1 by ring, __2__,\n      show m + 1 + k = m + k + 1 by ring]\n    ring", "explanation": "Split off the last term and use `ih`. Then re-index m+1+k+1 as (m+k+1)+1 so that Pascal's rule at (m+k+1, k) applies, and finish with `ring`. Pascal's rule at the wrong level (m+k) does not match.", "lens": "This is the master theorem whose step check is Pascal's rule. Re-indexing (`show … by ring`) moves the expression to a form where the step lemma matches, without changing its value.", "file": "RequestProject/Puzzles/Kalkulus/K25.lean", "holes": [{"k": 1, "choices": ["Finset.range_succ", "Nat.choose_succ_succ", "Finset.sum_range_succ", "Finset.sum_range_one"], "correct": "Finset.sum_range_succ"}, {"k": 2, "choices": ["Nat.choose_symm_diff", "Nat.choose_succ_succ (m + k + 1) k", "Nat.choose_succ_self_right", "Nat.choose_succ_succ (m + k) k"], "correct": "Nat.choose_succ_succ (m + k + 1) k"}], "solution": "theorem hockey (n k : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), Nat.choose (i + k) k = Nat.choose (n + k + 1) (k + 1) := by\n  induction n with\n  | zero => simp\n  | succ m ih =>\n    rw [Finset.sum_range_succ, ih]\n    rw [show m + 1 + k + 1 = (m + k + 1) + 1 by ring, Nat.choose_succ_succ (m + k + 1) k,\n      show m + 1 + k = m + k + 1 by ring]\n    ring"}, {"n": 26, "floor": 6, "elo": 1300, "kind": "eval", "title": "When is the triangle tight?", "hu": "Mikor éles a háromszög-egyenlőtlenség?", "src": "jegyzet 2.5.1 Tétel", "patterns": ["LAX"], "code": "def output := [(3, -5), (-2, -7), (4, 4)].map\n  (fun ((a, b) : ℤ × ℤ) => (|a + b|, |a| + |b|))\n#eval output", "explanation": "|a + b| ≤ |a| + |b|, with equality exactly when a and b have the same sign (or one of them is 0). With opposite signs the terms partly cancel: |3 − 5| = 2 < 8.", "lens": "|·| is a lax monoid morphism: it preserves 0 and maps + to ≤ +.", "file": "RequestProject/Puzzles/Kalkulus/K26.lean", "answer": "[(2, 8), (9, 9), (8, 8)]"}, {"n": 27, "floor": 6, "elo": 1308, "kind": "eval", "title": "Solving |x + 2| ≤ 4", "hu": "|x + 2| ≤ 4 megoldása", "src": "gy. 1.12 a)", "patterns": ["PRE"], "code": "def output := ((List.range 21).map (fun i => (i : ℤ) - 10)).filter (fun x => |x + 2| ≤ 4)\n#eval output", "explanation": "|x + 2| ≤ 4 ⇔ −4 ≤ x + 2 ≤ 4 ⇔ −6 ≤ x ≤ 2. 1.12 a) asks for the complement, |x + 2| > 4, which is x < −6 or x > 2. The list shows the integers in [−10, 10] that are not solutions.", "lens": "The solution set is the preimage of the ball [−4, 4] under x ↦ x + 2. Preimages preserve complements, so the solution set of the strict inequality is the complement of this one.", "file": "RequestProject/Puzzles/Kalkulus/K27.lean", "answer": "[-6, -5, -4, -3, -2, -1, 0, 1, 2]"}, {"n": 28, "floor": 6, "elo": 1316, "kind": "eval", "title": "Reverse triangle, exhaustively", "hu": "Fordított háromszög-egyenlőtlenség", "src": "gy. 1.11", "patterns": ["LIP"], "code": "def pts : List ℤ := (List.range 7).map (fun i => (i : ℤ) - 3)\n\ndef output :=\n  ( pts.all (fun x => pts.all (fun y => |(|x| - |y|)| ≤ |x - y|)),\n    pts.all (fun x => pts.all (fun y => |x - y| ≤ |(|x| - |y|)|)) )\n#eval output", "explanation": "||x| − |y|| ≤ |x − y| holds for all 49 pairs. The reverse fails, for example at x = 1, y = −1, where the left side is 2 and the right side is 0.", "lens": "x ↦ |x| is a non-expanding map ℝ → ℝ. In Lawvere's view of metric spaces as enriched categories, it is an enriched functor.", "file": "RequestProject/Puzzles/Kalkulus/K28.lean", "answer": "(true, false)"}, {"n": 29, "floor": 6, "elo": 1324, "kind": "fill", "title": "Reverse triangle inequality", "hu": "Fordított háromszög-egyenlőtlenség", "src": "gy. 1.11", "patterns": ["LIP"], "code": "theorem rev_triangle (x y : ℝ) : |(|x| - |y|)| ≤ |x - y| := by\n  __1__", "explanation": "`abs_sub_abs_le_abs_sub` is the weaker one-sided version `|x| − |y| ≤ |x − y|`, without the outer bars. The two-sided statement with outer bars is `abs_abs_sub_abs_le_abs_sub`. On paper: apply the one-sided version twice, with x and y swapped.", "lens": "Non-expanding (1-Lipschitz) maps compose and contain the identity, so they form a category. This is why |f| inherits continuity from f.", "file": "RequestProject/Puzzles/Kalkulus/K29.lean", "holes": [{"k": 1, "choices": ["exact abs_sub_abs_le_abs_sub x y", "exact abs_abs_sub_abs_le_abs_sub x y", "exact abs_sub_comm x y ▸ le_refl _", "exact abs_add_le x y"], "correct": "exact abs_abs_sub_abs_le_abs_sub x y"}], "solution": "theorem rev_triangle (x y : ℝ) : |(|x| - |y|)| ≤ |x - y| := by\n  exact abs_abs_sub_abs_le_abs_sub x y"}, {"n": 30, "floor": 6, "elo": 1332, "kind": "fill", "title": "Triangle inequality for n terms", "hu": "Általánosított háromszög-egyenlőtlenség", "src": "gy. 1.13 · K4", "patterns": ["LAX", "NNO"], "code": "theorem abs_sum_le (l : List ℝ) : |l.sum| ≤ (l.map (fun a => |a|)).sum := by\n  induction l with\n  | nil => __1__\n  | cons a t ih =>\n    simp only [List.sum_cons, List.map_cons]\n    calc |a + t.sum| ≤ |a| + |t.sum| := __2__\n      _ ≤ |a| + (t.map (fun a => |a|)).sum := by linarith", "explanation": "Empty list: |0| ≤ 0, which `simp` proves. Cons step: the two-term triangle inequality `abs_add_le a t.sum` (in that argument order), then the induction hypothesis on the tail (`linarith` uses `ih`).", "lens": "Induction over lists, the free monoid. A lax monoid morphism's two-term law extends uniquely to all finite sums.", "file": "RequestProject/Puzzles/Kalkulus/K30.lean", "holes": [{"k": 1, "choices": ["exact le_abs_self 0", "exact abs_nonneg 0", "linarith", "simp"], "correct": "simp"}, {"k": 2, "choices": ["abs_add_le a t.sum", "le_abs_self (a + t.sum)", "abs_sub_abs_le_abs_sub a t.sum", "abs_add_le t.sum a"], "correct": "abs_add_le a t.sum"}], "solution": "theorem abs_sum_le (l : List ℝ) : |l.sum| ≤ (l.map (fun a => |a|)).sum := by\n  induction l with\n  | nil => simp\n  | cons a t ih =>\n    simp only [List.sum_cons, List.map_cons]\n    calc |a + t.sum| ≤ |a| + |t.sum| := abs_add_le a t.sum\n      _ ≤ |a| + (t.map (fun a => |a|)).sum := by linarith"}, {"n": 31, "floor": 7, "elo": 1340, "kind": "eval", "title": "Testing injectivity", "hu": "Injektivitás tesztelése", "src": "gy. 2.2", "patterns": ["MONO"], "code": "-- f is injective on {0,…,n-1} iff its list of values has no duplicates\ndef injOn (f : ℕ → ℕ) (n : ℕ) : Bool := decide ((List.range n).map f).Nodup\n\ndef output := (injOn (fun x => x ^ 2) 5, injOn (fun x => x % 3) 5, injOn (fun x => 2 * x + 1) 5)\n#eval output", "explanation": "x² is injective on natural numbers (2.2 a): x² on [0,1]). On ℝ it is not, since (−1)² = 1². x % 3 repeats (0 and 3 both give 0). 2x + 1 is strictly increasing.", "lens": "Injective means monic in Set: f∘x = f∘y ⇒ x = y for all pairs of points x, y : 1 → A.", "file": "RequestProject/Puzzles/Kalkulus/K31.lean", "answer": "(true, false, true)"}, {"n": 32, "floor": 7, "elo": 1348, "kind": "eval", "title": "An involution", "hu": "Involúció", "src": "gy. 2.7", "patterns": ["INV"], "code": "def f (x : ℚ) : ℚ := (x + 1) / (x - 1)\n\ndef output := [2, 3, -1, 5 / 2].map (fun x => (f x, f (f x)))\n#eval output", "explanation": "f(f(x)) = x for every x ≠ 1, so f is its own inverse (f⁻¹ = f, as 2.7 claims). For example f(2) = 3 and f(3) = 2.", "lens": "f ∘ f = id, so f is an isomorphism and its own inverse: an action of ℤ/2. As a Möbius map, its matrix [[1,1],[1,−1]] squares to 2·I, which is the identity up to scaling.", "file": "RequestProject/Puzzles/Kalkulus/K32.lean", "answer": "[(3, 2), (2, 3), (0, -1), (7 / 3, 5 / 2)]"}, {"n": 33, "floor": 7, "elo": 1356, "kind": "eval", "title": "Commuting polynomials", "hu": "Felcserélhető polinomok", "src": "gy. 2.11", "patterns": ["REP"], "code": "def f (x : ℤ) : ℤ := 2 * x ^ 2 - 1        -- T₂\ndef g (x : ℤ) : ℤ := 4 * x ^ 3 - 3 * x    -- T₃\n\ndef output := [0, 1, 2, -1].map (fun x => (f (g x), g (f x)))\n#eval output", "explanation": "f ∘ g = g ∘ f, as 2.11 asks you to prove. For example g(2) = 26, f(26) = 1351 and f(2) = 7, g(7) = 1351. Both composites equal T₆(x) = 32x⁶ − 48x⁴ + 18x² − 1.", "lens": "T_n(cos θ) = cos(nθ). So n ↦ T_n is a monoid homomorphism (ℕ, ·) → (polynomials, ∘), and T₂∘T₃ = T₆ = T₃∘T₂ because 2·3 = 3·2.", "file": "RequestProject/Puzzles/Kalkulus/K33.lean", "answer": "[(-1, -1), (1, 1), (1351, 1351), (1, 1)]"}, {"n": 34, "floor": 7, "elo": 1364, "kind": "fill", "title": "Injective ∘ injective", "hu": "Injektív ∘ injektív", "src": "gy. 2.18 · Goldblatt Ex. 1", "patterns": ["MONO"], "code": "theorem inj_comp {α β γ : Type} (f : α → β) (g : β → γ)\n    (hf : Function.Injective f) (hg : Function.Injective g) :\n    Function.Injective (g ∘ f) := by\n  intro a b h\n  exact __1__", "explanation": "`h : g (f a) = g (f b)`. Cancel the outer g first, `hg h : f a = f b`, then the inner f, `hf (hg h) : a = b`. The cancellations happen in the reverse order of application.", "lens": "Monic arrows are closed under composition. The proof unwinds g∘f from the outside in, just as (g∘f)⁻¹ = f⁻¹∘g⁻¹.", "file": "RequestProject/Puzzles/Kalkulus/K34.lean", "holes": [{"k": 1, "choices": ["hg (hf h)", "hg h", "hf h", "hf (hg h)"], "correct": "hf (hg h)"}], "solution": "theorem inj_comp {α β γ : Type} (f : α → β) (g : β → γ)\n    (hf : Function.Injective f) (hg : Function.Injective g) :\n    Function.Injective (g ∘ f) := by\n  intro a b h\n  exact hf (hg h)"}, {"n": 35, "floor": 7, "elo": 1372, "kind": "fill", "title": "If g ∘ f is injective, so is f", "hu": "Ha g ∘ f injektív, akkor f is", "src": "Goldblatt Ex. 2 · gy. 2.6", "patterns": ["MONO"], "code": "theorem inj_of_comp {α β γ : Type} (f : α → β) (g : β → γ)\n    (h : Function.Injective (g ∘ f)) : Function.Injective f := by\n  intro a b hab\n  apply h\n  exact __1__", "explanation": "After `apply h` the goal is `(g ∘ f) a = (g ∘ f) b`, which unfolds to `g (f a) = g (f b)`. Apply g to both sides of `hab : f a = f b`. Note that g itself need not be injective.", "lens": "g∘f monic ⇒ f monic. The dual statement (g must be monic) is false: 1 → Bool → 1 is a counterexample, Goldblatt's G3.", "file": "RequestProject/Puzzles/Kalkulus/K35.lean", "holes": [{"k": 1, "choices": ["hab", "congrArg f hab", "congrArg g hab", "h hab"], "correct": "congrArg g hab"}], "solution": "theorem inj_of_comp {α β γ : Type} (f : α → β) (g : β → γ)\n    (h : Function.Injective (g ∘ f)) : Function.Injective f := by\n  intro a b hab\n  apply h\n  exact congrArg g hab"}, {"n": 36, "floor": 8, "elo": 1380, "kind": "eval", "title": "g∘f∘f = f∘g∘g", "hu": "g∘f∘f = f∘g∘g", "src": "gy. 2.15", "patterns": ["REP"], "code": "def f (x : ℕ) : ℕ := 3 * x + 1\ndef g (x : ℕ) : ℕ := x + 3\n\ndef output := (List.range 10).filter (fun x => g (f (f x)) = f (g (g x)))\n#eval output", "explanation": "g(f(f(x))) = 9x + 7 and f(g(g(x))) = 3x + 19. These are equal iff 6x = 12, that is x = 2.", "lens": "Affine maps x ↦ ax + b compose like the matrices [[a,b],[0,1]]. The slope of a composite is the product of the slopes (9 versus 3), a functor to (ℚ^×, ·). So the two sides can only agree at one point.", "file": "RequestProject/Puzzles/Kalkulus/K36.lean", "answer": "[2]"}, {"n": 37, "floor": 8, "elo": 1388, "kind": "eval", "title": "A Möbius map and its inverse", "hu": "Möbius-függvény és inverze", "src": "Goldblatt-Patterns 1a · gy. 2.3", "patterns": ["REP", "INV"], "code": "def mob (a b c d : ℚ) (x : ℚ) : ℚ := (a * x + b) / (c * x + d)\n\ndef h := mob 3 4 1 2           -- h(x) = (3x+4)/(x+2), matrix [[3,4],[1,2]]\ndef hinv := mob 2 (-4) (-1) 3  -- adjugate matrix [[2,-4],[-1,3]]\n\ndef output := [0, 1, 5].map (fun x => (h x, hinv (h x)))\n#eval output", "explanation": "h(0) = 2, h(1) = 7/3, h(5) = 19/7, and hinv sends each value back to its x. The inverse of [[a,b],[c,d]] is the adjugate [[d,−b],[−c,a]] up to a scalar factor, and scalars do not change a Möbius map.", "lens": "Möbius maps form a group isomorphic to PGL₂, so inverting the map is inverting the matrix: a functor preserves inverses (pattern G4).", "file": "RequestProject/Puzzles/Kalkulus/K37.lean", "answer": "[(2, 0), (7 / 3, 1), (19 / 7, 5)]"}, {"n": 38, "floor": 8, "elo": 1396, "kind": "eval", "title": "Composition is matrix product", "hu": "Kompozíció = mátrixszorzás", "src": "Goldblatt-Patterns 1a (`mob_comp`)", "patterns": ["REP"], "code": "def mob (a b c d : ℚ) (x : ℚ) : ℚ := (a * x + b) / (c * x + d)\n\n-- [[3,4],[1,2]] · [[1,1],[0,1]] = [[3,7],[1,3]]\ndef output := (mob 3 4 1 2 (mob 1 1 0 1 2), mob 3 7 1 3 2)\n#eval output", "explanation": "mob 1 1 0 1 is x ↦ x + 1, so the left side is h(3) = 13/5. The product matrix gives (3·2 + 7)/(2 + 3) = 13/5, the same value.", "lens": "The representation M ↦ mob M is a functor: mob(MN) = mob M ∘ mob N. Composition turns into multiplication (P6 in PATTERNS.md).", "file": "RequestProject/Puzzles/Kalkulus/K38.lean", "answer": "(13 / 5, 13 / 5)"}, {"n": 39, "floor": 8, "elo": 1404, "kind": "eval", "title": "A chain of graph transformations", "hu": "Elemi transzformációk láncban", "src": "gy. 2.16 a) · jegyzet 2.8", "patterns": ["FREE"], "code": "-- a(x) = -2(x+1)^2 + 4 as a chain: shift, square, scale by -2, shift up\ndef steps : List (ℤ → ℤ) := [(· + 1), (· ^ 2), (· * (-2)), (· + 4)]\ndef run (x : ℤ) : ℤ := steps.foldl (fun acc s => s acc) x\n\ndef output := [-3, -1, 0, 1].map run\n#eval output", "explanation": "For example run(−3): −3 + 1 = −2, squared 4, times −2 gives −8, plus 4 gives −4. The vertex is at x = −1 with value 4. Reordering the steps would give a different function.", "lens": "The list of steps is a word in the free monoid. `foldl` is the unique monoid map into (ℤ → ℤ, ∘). Steps applied to x (inside) appear in the opposite order from steps applied to y (outside).", "file": "RequestProject/Puzzles/Kalkulus/K39.lean", "answer": "[-4, 4, 2, -4]"}, {"n": 40, "floor": 8, "elo": 1412, "kind": "fill", "title": "A left inverse gives injectivity", "hu": "Bal oldali inverz ⇒ injektív", "src": "Goldblatt G2′ · beadandó h(x)=(3x+4)/(x+2)", "patterns": ["MONO", "INV"], "code": "theorem inj_of_leftInv {α β : Type} (f : α → β) (r : β → α) (h : ∀ x, r (f x) = x) :\n    Function.Injective f := by\n  intro a b hab\n  calc a = r (f a) := (h a).symm\n    _ = r (f b) := __1__\n    _ = b := h b", "explanation": "The middle step applies r to both sides of `hab : f a = f b`. For h(x) = (3x+4)/(x+2), the left inverse is h⁻¹(y) = (2y−4)/(3−y), which is how injectivity of the Möbius map is proved.", "lens": "If r ∘ f = 1 (f has a retraction), then f is monic. Dually, f ∘ s = 1 makes f epic, which is how you show a value is taken: exhibit s(y).", "file": "RequestProject/Puzzles/Kalkulus/K40.lean", "holes": [{"k": 1, "choices": ["congrArg f hab", "h b", "congrArg r hab", "hab"], "correct": "congrArg r hab"}], "solution": "theorem inj_of_leftInv {α β : Type} (f : α → β) (r : β → α) (h : ∀ x, r (f x) = x) :\n    Function.Injective f := by\n  intro a b hab\n  calc a = r (f a) := (h a).symm\n    _ = r (f b) := congrArg r hab\n    _ = b := h b"}, {"n": 41, "floor": 9, "elo": 1420, "kind": "eval", "title": "δ as a function of ε", "hu": "δ mint ε függvénye", "src": "gy. 3.1 · beadandó M1", "patterns": ["ADJ", "LIP"], "code": "-- lim_{x→2} (3x - 1) = 5 :  |(3x-1) - 5| = 3|x - 2| < ε  when  |x - 2| < ε/3\ndef delta (ε : ℚ) : ℚ := ε / 3\n\ndef output := [1, 1 / 10, 3 / 100].map delta\n#eval output", "explanation": "Since the map stretches distances by 3, δ = ε/3 works. A smaller ε needs a smaller δ. (3/100)/3 = 1/100.", "lens": "A proof of ∀ε ∃δ gives a function ε ↦ δ(ε). For a composite map, the δ-functions compose: δ_{g∘f} = δ_f ∘ δ_g.", "file": "RequestProject/Puzzles/Kalkulus/K41.lean", "answer": "[1 / 3, 1 / 30, 1 / 100]"}, {"n": 42, "floor": 9, "elo": 1428, "kind": "eval", "title": "0/0: the value at the point does not matter", "hu": "0/0: a pontbeli érték nem számít", "src": "gy. 3.4 · beadandó M2", "patterns": ["GERM"], "code": "def q (x : ℚ) : ℚ := (x ^ 2 - 4) / (x - 2)\n\ndef output := [3, 21 / 10, 201 / 100, 2].map q\n#eval output", "explanation": "For x ≠ 2, q(x) = x + 2, so the values approach 4. At x = 2, Lean computes 0/0, and Lean's convention is x/0 = 0, so it prints 0, not 4. The limit is 4 anyway, because a limit ignores the point itself.", "lens": "Cancelling (x − 2) is an isomorphism on the punctured neighbourhood. The limit depends only on the germ of q at 2.", "file": "RequestProject/Puzzles/Kalkulus/K42.lean", "answer": "[5, 41 / 10, 401 / 100, 0]"}, {"n": 43, "floor": 9, "elo": 1436, "kind": "eval", "title": "At infinity the leading terms decide", "hu": "A végtelenben a főtagok döntenek", "src": "gy. 3.2 a) · beadandó M4", "patterns": ["DEG"], "code": "def r (n : ℚ) : ℚ := (2 * n ^ 3 + 7) / (n ^ 3 - n ^ 2 + n + 7)\n\ndef output := [10, 100, 1000].map (fun n => decide (|r n - 2| < 1 / 100))\n#eval output", "explanation": "Both degrees are 3, so r → 2/1 = 2. The convergence is slow, because the −n² term matters for a while: r(10) ≈ 2.19 and r(100) ≈ 2.0200, still more than 0.01 away. r(1000) ≈ 2.002 is within 0.01.", "lens": "Only the leading coefficients survive at ∞. Degree is a monoid homomorphism (deg pq = deg p + deg q), and comparing degrees settles the limit.", "file": "RequestProject/Puzzles/Kalkulus/K43.lean", "answer": "[false, false, true]"}, {"n": 44, "floor": 9, "elo": 1444, "kind": "fill", "title": "An ε–δ proof", "hu": "ε–δ bizonyítás", "src": "gy. 3.1 · jegyzet 3.2.1 Def. · beadandó M1", "patterns": ["LIP", "ADJ"], "code": "theorem lim_linear : ∀ ε > 0, ∃ δ > 0, ∀ x : ℝ, |x - 2| < δ → |(3 * x - 1) - 5| < ε := by\n  intro ε hε\n  refine ⟨ε / 3, by positivity, ?_⟩\n  intro x hx\n  have h : (3 * x - 1) - 5 = 3 * (x - 2) := by ring\n  have h3 : |(3 : ℝ)| = 3 := by norm_num\n  rw [h, abs_mul]\n  __1__", "explanation": "The goal is |3|·|x − 2| < ε. First replace |3| by 3, using h3. Then 3|x − 2| < 3·(ε/3) = ε follows linearly from hx. Without the rewrite, `linarith` sees |3|·|x−2| as an unknown product and fails.", "lens": "The standard scheme: choose δ, introduce x, rewrite the error so that |x − a| appears, and finish with a bound. Here δ = ε/L with Lipschitz constant L = 3.", "file": "RequestProject/Puzzles/Kalkulus/K44.lean", "holes": [{"k": 1, "choices": ["rw [h3]; linarith", "rw [h3]; exact hx", "rw [h3]; positivity", "linarith"], "correct": "rw [h3]; linarith"}], "solution": "theorem lim_linear : ∀ ε > 0, ∃ δ > 0, ∀ x : ℝ, |x - 2| < δ → |(3 * x - 1) - 5| < ε := by\n  intro ε hε\n  refine ⟨ε / 3, by positivity, ?_⟩\n  intro x hx\n  have h : (3 * x - 1) - 5 = 3 * (x - 2) := by ring\n  have h3 : |(3 : ℝ)| = 3 := by norm_num\n  rw [h, abs_mul]\n  rw [h3]; linarith"}, {"n": 45, "floor": 9, "elo": 1452, "kind": "fill", "title": "Limits compose", "hu": "Határértékek kompozíciója", "src": "jegyzet 4.1.2 Tétel · PATTERNS P7", "patterns": ["LIM"], "code": "theorem limit_comp (f g : ℝ → ℝ) (a b c : ℝ)\n    (hf : Filter.Tendsto f (nhds a) (nhds b))\n    (hg : Filter.Tendsto g (nhds b) (nhds c)) :\n    Filter.Tendsto (g ∘ f) (nhds a) (nhds c) :=\n  __1__", "explanation": "`Tendsto.comp` composes in the same order as `∘`: `hg.comp hf : Tendsto (g ∘ f)`. The swapped versions would need f's target to match g's source in the wrong direction. (Here g has a limit c at b in the full neighbourhood, which means g is continuous at b with value c.)", "lens": "`Tendsto f F G` is an arrow F → G between filters, and `.comp` is composition of arrows. 'Limits compose' is literally associativity plus closure under composition.", "file": "RequestProject/Puzzles/Kalkulus/K45.lean", "holes": [{"k": 1, "choices": ["hf", "hf.comp hg", "Filter.Tendsto.comp hf hg", "hg.comp hf"], "correct": "hg.comp hf"}], "solution": "theorem limit_comp (f g : ℝ → ℝ) (a b c : ℝ)\n    (hf : Filter.Tendsto f (nhds a) (nhds b))\n    (hg : Filter.Tendsto g (nhds b) (nhds c)) :\n    Filter.Tendsto (g ∘ f) (nhds a) (nhds c) :=\n  hg.comp hf"}, {"n": 46, "floor": 10, "elo": 1460, "kind": "fill", "title": "Uniqueness of the supremum", "hu": "A felső határ egyértelmű", "src": "gy. 1.5 · jegyzet 2.3.5 Def.", "patterns": ["UNIV", "COMP"], "code": "theorem sup_unique (S : Set ℝ) (a b : ℝ) (ha : IsLUB S a) (hb : IsLUB S b) : a = b := by\n  apply le_antisymm\n  · exact __1__\n  · exact __2__", "explanation": "`ha.1 : a ∈ upperBounds S` and `ha.2 : a ∈ lowerBounds (upperBounds S)`. a ≤ b holds because a is below every upper bound and b is one, so `ha.2 hb.1`. Symmetrically, b ≤ a is `hb.2 ha.1`.", "lens": "Anything defined by a universal property is unique up to a unique isomorphism. In a poset, an isomorphism means a ≤ b and b ≤ a, so antisymmetry makes it an equality.", "file": "RequestProject/Puzzles/Kalkulus/K46.lean", "holes": [{"k": 1, "choices": ["ha.2 hb.1", "hb.2 ha.1", "ha.1 hb.2", "hb.1"], "correct": "ha.2 hb.1"}, {"k": 2, "choices": ["ha.1", "hb.1 ha.2", "ha.2 hb.1", "hb.2 ha.1"], "correct": "hb.2 ha.1"}], "solution": "theorem sup_unique (S : Set ℝ) (a b : ℝ) (ha : IsLUB S a) (hb : IsLUB S b) : a = b := by\n  apply le_antisymm\n  · exact ha.2 hb.1\n  · exact hb.2 ha.1"}, {"n": 47, "floor": 10, "elo": 1468, "kind": "fill", "title": "Monic ∘ monic in any category", "hu": "Mono ∘ mono tetszőleges kategóriában", "src": "Goldblatt Ex. 1 · gy. 2.18", "patterns": ["MONO", "COMP"], "code": "open CategoryTheory\n\ntheorem mono_comp' {C : Type*} [Category C] {X Y Z : C} (f : X ⟶ Y) (g : Y ⟶ Z)\n    [Mono f] [Mono g] : Mono (f ≫ g) := by\n  constructor\n  intro W a b h\n  simp only [← Category.assoc] at h\n  exact (cancel_mono __1__).mp ((cancel_mono __2__).mp h)", "explanation": "`f ≫ g` means 'first f, then g'. After re-bracketing, `h : (a ≫ f) ≫ g = (b ≫ f) ≫ g`. Cancel g first (inner hole) to get a ≫ f = b ≫ f, then cancel f (outer hole). This is puzzle 34 (`hf (hg h)`) again, in an arbitrary category.", "lens": "The same proof works in every category, so it applies at once to sets, groups and spaces. With the category of sets it gives 2.18: injective ∘ injective is injective.", "file": "RequestProject/Puzzles/Kalkulus/K47.lean", "holes": [{"k": 1, "choices": ["f ≫ g", "a", "g", "f"], "correct": "f"}, {"k": 2, "choices": ["g", "f ≫ g", "f", "b"], "correct": "g"}], "solution": "open CategoryTheory\n\ntheorem mono_comp' {C : Type*} [Category C] {X Y Z : C} (f : X ⟶ Y) (g : Y ⟶ Z)\n    [Mono f] [Mono g] : Mono (f ≫ g) := by\n  constructor\n  intro W a b h\n  simp only [← Category.assoc] at h\n  exact (cancel_mono f).mp ((cancel_mono g).mp h)"}, {"n": 48, "floor": 10, "elo": 1476, "kind": "fill", "title": "Geometric sum", "hu": "Mértani sor összege", "src": "gy. 1.14 c) (corrected: from i = 0)", "patterns": ["NNO", "MUL", "COMP"], "code": "theorem geom (q : ℚ) (hq : q ≠ 1) (n : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), q ^ i = (q ^ (n + 1) - 1) / (q - 1) := by\n  have hq' : q - 1 ≠ 0 := sub_ne_zero.mpr hq\n  induction n with\n  | zero => __1__\n  | succ k ih =>\n    rw [__2__, ih]\n    __3__", "explanation": "Base: Σ_{i<1} qⁱ = 1 = (q − 1)/(q − 1), which needs `div_self hq'`. Step: split off qᵏ⁺¹ and use ih. Then clear the denominator q − 1 with `field_simp`, which uses hq', and finish with `ring`. Plain `ring` cannot cancel (q−1)/(q−1). As printed, the sheet's sum starts at i = 1, which is false (q = 2, n = 1: 2 ≠ 3), so the sum must start at i = 0.", "lens": "qⁿ is an eigenfunction of Δ: Δ(qⁿ) = (q−1)qⁿ. So F(n) = (qⁿ⁺¹ − 1)/(q − 1) is a discrete antiderivative, and the master theorem is applied in the field ℚ, where we may divide by q − 1.", "file": "RequestProject/Puzzles/Kalkulus/K48.lean", "holes": [{"k": 1, "choices": ["simp [hq]", "simp [div_self hq']", "ring", "linarith"], "correct": "simp [div_self hq']"}, {"k": 2, "choices": ["pow_succ", "Finset.mul_sum", "Finset.sum_range_succ", "Finset.sum_range_zero"], "correct": "Finset.sum_range_succ"}, {"k": 3, "choices": ["simp", "ring", "field_simp; ring", "linarith"], "correct": "field_simp; ring"}], "solution": "theorem geom (q : ℚ) (hq : q ≠ 1) (n : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), q ^ i = (q ^ (n + 1) - 1) / (q - 1) := by\n  have hq' : q - 1 ≠ 0 := sub_ne_zero.mpr hq\n  induction n with\n  | zero => simp [div_self hq']\n  | succ k ih =>\n    rw [Finset.sum_range_succ, ih]\n    field_simp; ring"}, {"n": 49, "floor": 10, "elo": 1484, "kind": "fill", "title": "Sum of cubes via Gauss", "hu": "Köbösszeg a Gauss-képlettel", "src": "gy. 1.14 b) · Kobosszeg-Kapcsolatok", "patterns": ["NNO", "COMP"], "code": "theorem gauss_sum (n : ℕ) : ∑ i ∈ Finset.range (n + 1), (i : ℚ) = n * (n + 1) / 2 := by\n  induction n with\n  | zero => simp\n  | succ k ih => rw [Finset.sum_range_succ, ih]; push_cast; ring\n\ntheorem nicomachus (n : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), (i : ℚ) ^ 3 = (∑ i ∈ Finset.range (n + 1), (i : ℚ)) ^ 2 := by\n  rw [__1__]\n  induction n with\n  | zero => __2__\n  | succ k ih =>\n    rw [Finset.sum_range_succ, ih]\n    push_cast\n    __3__", "explanation": "First rewrite the right-hand side with the proven lemma `gauss_sum`, so the goal becomes Σi³ = (n(n+1)/2)². Then the master theorem: the base case by `simp`; in the step, split off (k+1)³, use ih, and check (k(k+1)/2)² + (k+1)³ = ((k+1)(k+2)/2)² with `ring`.", "lens": "Composite proof = composite arrow. The lemma `gauss_sum` is an arrow proved once and reused by rewriting. Nicomachus then becomes a pure master-theorem computation.", "file": "RequestProject/Puzzles/Kalkulus/K49.lean", "holes": [{"k": 1, "choices": ["Finset.sum_range_zero", "Finset.sum_pow", "gauss_sum", "Finset.sum_range_id_mul_two"], "correct": "gauss_sum"}, {"k": 2, "choices": ["simp", "rfl", "positivity", "omega"], "correct": "simp"}, {"k": 3, "choices": ["omega", "simp", "ring", "positivity"], "correct": "ring"}], "solution": "theorem gauss_sum (n : ℕ) : ∑ i ∈ Finset.range (n + 1), (i : ℚ) = n * (n + 1) / 2 := by\n  induction n with\n  | zero => simp\n  | succ k ih => rw [Finset.sum_range_succ, ih]; push_cast; ring\n\ntheorem nicomachus (n : ℕ) :\n    ∑ i ∈ Finset.range (n + 1), (i : ℚ) ^ 3 = (∑ i ∈ Finset.range (n + 1), (i : ℚ)) ^ 2 := by\n  rw [gauss_sum]\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    rw [Finset.sum_range_succ, ih]\n    push_cast\n    ring"}, {"n": 50, "floor": 10, "elo": 1492, "kind": "fill", "title": "x³ + x + 2 is injective", "hu": "x³ + x + 2 injektív", "src": "gy. 2.6 b)", "patterns": ["MONO", "ORD", "COMP"], "code": "theorem ex2_6b : Function.Injective (fun x : ℝ => x ^ 3 + x + 2) := by\n  apply StrictMono.injective\n  intro a b hab\n  have h : 0 < (b - a) * (a ^ 2 + a * b + b ^ 2 + 1) := by\n    apply mul_pos\n    · __1__\n    · __2__\n  simp only\n  __3__", "explanation": "Strictly increasing ⇒ injective. Factor: g(b) − g(a) = (b − a)(a² + ab + b² + 1). The first factor is positive by `hab` (`linarith`). The second is positive because a² + ab + b² = ½(a + b)² + ½(a² + b²) ≥ 0; `positivity` cannot see this because of the ab term. Finally, `nlinarith` expands h, and g(a) < g(b) follows linearly.", "lens": "A strictly monotone map between linear orders is a functor that reflects the order, hence monic. So the order argument (ORD) gives the injectivity statement (MONO).", "file": "RequestProject/Puzzles/Kalkulus/K50.lean", "holes": [{"k": 1, "choices": ["linarith", "positivity", "norm_num", "exact hab"], "correct": "linarith"}, {"k": 2, "choices": ["linarith", "nlinarith [sq_nonneg (a + b), sq_nonneg a, sq_nonneg b]", "positivity", "norm_num"], "correct": "nlinarith [sq_nonneg (a + b), sq_nonneg a, sq_nonneg b]"}, {"k": 3, "choices": ["positivity", "exact hab", "exact h", "nlinarith"], "correct": "nlinarith"}], "solution": "theorem ex2_6b : Function.Injective (fun x : ℝ => x ^ 3 + x + 2) := by\n  apply StrictMono.injective\n  intro a b hab\n  have h : 0 < (b - a) * (a ^ 2 + a * b + b ^ 2 + 1) := by\n    apply mul_pos\n    · linarith\n    · nlinarith [sq_nonneg (a + b), sq_nonneg a, sq_nonneg b]\n  simp only\n  nlinarith"}], "floors": [{"en": "Number Sets", "hu": "Számhalmazok", "src": "gy. 1.1–1.6 · jegyzet 2.3"}, {"en": "Quantifiers", "hu": "Kvantorok", "src": "gy. 1.7 · jegyzet 2.2"}, {"en": "Induction I: the master theorem", "hu": "Indukció I: mester-tétel", "src": "gy. 1.14–1.15 a,b"}, {"en": "Induction II: inequalities", "hu": "Indukció II: egyenlőtlenségek", "src": "gy. 1.15 c,d · jegyzet 2.5.4"}, {"en": "Pascal & binomials", "hu": "Pascal és binomiális együtthatók", "src": "gy. 1.19 · jegyzet 2.4.1"}, {"en": "Absolute value", "hu": "Abszolút érték", "src": "gy. 1.11–1.13 · jegyzet 2.5.1"}, {"en": "Functions & inverses", "hu": "Függvények és inverzek", "src": "gy. 2.2–2.18 · jegyzet 2.6, 2.9"}, {"en": "Möbius maps & transformations", "hu": "Möbius-függvények, transzformációk", "src": "gy. 2.3, 2.15, 2.16 · jegyzet 2.8"}, {"en": "Limits", "hu": "Határérték", "src": "gy. 3.1–3.10 · jegyzet 3.2–3.4"}, {"en": "Composite proofs", "hu": "Összetett bizonyítások", "src": "gy. 1.5, 1.14, 2.6 · Goldblatt"}], "patterns": {"OMEGA": {"en": "Subsets are maps to Ω", "hu": "Részhalmaz = karakterisztikus leképezés", "idea": "A subset S ⊆ X is the same thing as its characteristic map χ : X → Bool. A `filter` keeps exactly the points that χ sends to `true`.", "lens": "In a topos, subobjects of X correspond to arrows X → Ω. In Set, Ω = {false, true}, and S is the pullback of `true` along χ."}, "DIAG": {"en": "Diagonal argument", "hu": "Átlós érvelés (Russell, Cantor)", "idea": "Feed something to itself. Russell's barber, Cantor's theorem and \"∃δ ∀ε, δ < ε is false\" all work by plugging a thing into itself.", "lens": "Lawvere's fixed-point theorem: if there were a surjection A → (A → Ω), then every map Ω → Ω would have a fixed point. Negation has none, so there is no such surjection."}, "UNIV": {"en": "Defined by a universal property", "hu": "Univerzális tulajdonság (sup, inf)", "idea": "The supremum is the least upper bound: it is an upper bound, and it is below every other upper bound. Two such numbers must be equal.", "lens": "A poset is a category with at most one arrow between two objects. There, sup is a colimit (a join) and inf is a limit (a meet). Universal objects are unique up to a unique isomorphism, and in a poset an isomorphism is an equality."}, "ADJ": {"en": "Quantifiers: order, negation, adjoints", "hu": "Kvantorok sorrendje és tagadása", "idea": "∀ε ∃δ lets δ depend on ε, but ∃δ ∀ε does not, so swapping them changes the meaning. ¬∀ = ∃¬ and ¬∃ = ∀¬.", "lens": "∃ and ∀ are the left and right adjoints of pulling back along a projection (∃ ⊣ weakening ⊣ ∀). A proof of ∀ε ∃δ is a function ε ↦ δ(ε), called a Skolem function."}, "NNO": {"en": "Master theorem: ℕ is an initial algebra", "hu": "Mester-tétel: ℕ kezdő algebra", "idea": "If F(0) = 0 and F(n+1) − F(n) = f(n+1), then F(n) = f(1) + ⋯ + f(n). Every \"prove this sum formula by induction\" exercise has this shape.", "lens": "(ℕ, 0, succ) is the initial algebra (the natural numbers object). There is exactly one map from it into any (A, a₀, step), so two maps that satisfy the same base case and the same step are equal. This is the equalizer argument."}, "ORD": {"en": "Ordered master theorem", "hu": "Rendezett mester-tétel (K2)", "idea": "Summing inequalities: if each step satisfies ≤, then so does the sum. The set of good n contains the starting point and is closed under +1.", "lens": "The sum is a monotone map, that is, a functor between preorder categories. It carries arrows a ≤ b to arrows Σa ≤ Σb."}, "MUL": {"en": "Multiplicative step", "hu": "Szorzatos lépés (K3)", "idea": "For products such as n! or (1+x)ⁿ, the induction step multiplies. You then need a separate inequality, often proved by its own induction (Bernoulli).", "lens": "log is a monoid homomorphism (ℝ>0, ·) → (ℝ, +), a functor between one-object categories. A product-type master theorem is the image of the sum-type one."}, "BASE": {"en": "Check the base case", "hu": "A kezdőeset ellenőrzése", "idea": "With a strict inequality, the first case is often an equality. Then the induction has to start one step later (n = 2 instead of n = 1).", "lens": "The good set is closed under succ but misses 1. It contains the sub-algebra generated by 2, which is ℕ≥2, again an initial algebra."}, "PASCAL": {"en": "Pascal's rule as the induction step", "hu": "Pascal-szabály és átindexelés (K6)", "idea": "C(n,k) + C(n,k+1) = C(n+1,k+1) is the step in the hockey stick identity and in the binomial theorem.", "lens": "Categorification: C(n,k) counts k-subsets. Pascal's rule splits the subsets of {0,…,n} by whether they contain n, which is a coproduct decomposition. The binomial theorem is P(A ⊔ B) ≅ P(A) × P(B)."}, "LAX": {"en": "From two terms to n terms", "hu": "Kéttagúból n-tagú (K4)", "idea": "|x + y| ≤ |x| + |y| for two terms gives |a₁ + ⋯ + aₙ| ≤ |a₁| + ⋯ + |aₙ| by induction on the list.", "lens": "|·| is a lax monoid morphism (ℝ, +, 0) → (ℝ≥0, +, 0). Lists form the free monoid, so the two-term law extends uniquely to n terms."}, "PRE": {"en": "Solution sets are preimages", "hu": "Megoldáshalmaz = ősképhalmaz", "idea": "{x : |x + 2| ≤ 4} is the preimage of the closed ball [−4, 4] under x ↦ x + 2. Inequalities are solved by pulling sets back along maps.", "lens": "Taking preimages f⁻¹ is a functor P(Y) → P(X) that preserves ∩, ∪ and complements. It is a Boolean algebra homomorphism, with ∃_f ⊣ f⁻¹ ⊣ ∀_f."}, "LIP": {"en": "Non-expanding maps", "hu": "Lipschitz-tulajdonság", "idea": "||x| − |y|| ≤ |x − y|: absolute value never increases distances. A map that stretches by at most L lets you choose δ = ε/L.", "lens": "Lawvere: a metric space is a category enriched over ([0,∞], ≥, +). Non-expanding maps are exactly the enriched functors."}, "MONO": {"en": "Injective = monic", "hu": "Injektív = monomorfizmus", "idea": "To prove injectivity, take f(a) = f(b) and derive a = b. Injective ∘ injective is injective. If g ∘ f is injective then f is. A left inverse makes a map injective.", "lens": "Goldblatt, Topoi, ch. 3: monic arrows are closed under composition, g∘f monic ⇒ f monic, and a retraction r∘f = 1 ⇒ f monic. In Set, monic = injective."}, "INV": {"en": "Inverses and involutions", "hu": "Inverz és involúció", "idea": "f(x) = (x+1)/(x−1) satisfies f∘f = id, so f is its own inverse. Writing down a left or right inverse proves injectivity or surjectivity.", "lens": "An isomorphism is an arrow with a two-sided inverse. An involution is an action of the two-element group ℤ/2."}, "REP": {"en": "Composition becomes multiplication", "hu": "Kompozíció ↦ szorzás (reprezentáció)", "idea": "Möbius maps (ax+b)/(cx+d) compose like 2×2 matrices multiply, and affine maps compose by multiplying slopes. Chebyshev polynomials commute because T_m ∘ T_n = T_mn.", "lens": "A functor from the monoid of maps under ∘ to a monoid of matrices or numbers under ·. Inverse maps go to inverse matrices."}, "FREE": {"en": "Chains of steps: the free monoid", "hu": "Transzformációs lánc", "idea": "A graph transformation is a list of elementary steps such as shift, square, scale and reflect. Running the list is a fold, and the order matters.", "lens": "Lists of steps form the free monoid on the steps. Evaluating them is the unique monoid map into (End X, ∘) given by its universal property."}, "LIM": {"en": "Limits compose", "hu": "Határértékek kompozíciója (Heine)", "idea": "If f → b as x → a, and g → c as y → b (and g is continuous at b, or f avoids b), then g∘f → c. δ for g∘f is found by chaining the two δ choices.", "lens": "`Filter.Tendsto f F G` is an arrow F → G between filters. Composing limits is composing these arrows (P7 in PATTERNS.md)."}, "GERM": {"en": "A limit only sees nearby points", "hu": "A határérték csak a pont körül néz", "idea": "lim_{x→2} (x²−4)/(x−2) = 4 even though the formula is undefined at 2. Cancelling (x−2) is allowed because x ≠ 2 throughout the punctured neighbourhood.", "lens": "Cancelling the common factor is an isomorphism on the punctured domain. The limit depends only on the germ at the point, not on the value there."}, "DEG": {"en": "At ∞ the leading term decides", "hu": "A végtelenben a legnagyobb kitevő dönt", "idea": "A ratio of polynomials tends to the ratio of the leading coefficients when the degrees are equal, to 0 when the denominator has the higher degree, and to ±∞ otherwise.", "lens": "Degree is a valuation: deg(pq) = deg p + deg q. It is a monoid homomorphism to (ℕ, +), and the limit at ∞ only sees this coarse data plus the leading coefficients."}, "COMP": {"en": "Composite proof = composite arrow", "hu": "Összetett bizonyítás", "idea": "Big proofs are small proven lemmas glued together: rewrite with a lemma, run the master theorem, cancel. Each step is an arrow, and the proof is their composite.", "lens": "Curry–Howard–Lambek: propositions are objects, proofs are arrows, and using a lemma inside a proof is composition."}}};
const PUZZLES = DATA.puzzles || [], FLOORS = DATA.floors || [], PATTERNS = DATA.patterns || {};

/* ---------- pure logic (tested by game/test_kalkulus.js) ---------- */
const START_ELO = 1000;
const POINTS = { type: 10, build: 5, single: 10, perHole: 5 };
const RANKS = [
  [0, "ε-Novice"], [950, "δ-Seeker"], [1100, "Inductor"], [1250, "Functor Adept"], [1400, "Δ-Master"]
];
const CIRCLED = ["", "①", "②", "③", "④", "⑤", "⑥"];

function normalize(s) { return String(s).replace(/\s+/g, ""); }

/* split an output such as [(1, 3 / 2), -4] into literal pieces and slots */
function tokenize(answer) {
  const re = /true|false|-?\d+|[\[\](){},\/]|\s+/y;
  const out = [];
  re.lastIndex = 0;
  while (re.lastIndex < answer.length) {
    const at = re.lastIndex;
    const m = re.exec(answer);
    if (!m) throw new Error("cannot tokenize answer at " + at + ": " + answer);
    const t = m[0];
    if (t === "true" || t === "false") out.push({ slot: "bool", value: t });
    else if (/^-?\d+$/.test(t)) out.push({ slot: "num", value: t });
    else out.push({ lit: t });
  }
  return out;
}
function assemble(tokens, fills) {
  let k = 0;
  return tokens.map(t => t.lit !== undefined ? t.lit : (fills[k++] ?? "?")).join("");
}

function maxPoints(p) {
  if (p.kind === "eval") return POINTS.type;
  return p.holes.length === 1 ? POINTS.single : POINTS.perHole * p.holes.length;
}
function maxElo() { return START_ELO + PUZZLES.reduce((s, p) => s + maxPoints(p), 0); }

function newState() { return { elo: START_ELO, streak: 0, best: 0, attempts: {} }; }
function isUnlocked(st, n) { return n === 1 || !!st.attempts[n - 1]; }
function floorUnlocked(st, f) { return isUnlocked(st, f * 5 + 1); }

/* eval puzzle: given is a string; fill puzzle: given is an array of chosen option strings */
function judge(p, given, mode) {
  if (mode === "reveal") {
    return { ok: false, perHole: p.kind === "fill" ? p.holes.map(() => false) : null, delta: -maxPoints(p) };
  }
  if (p.kind === "eval") {
    const ok = normalize(given) === normalize(p.answer);
    const pts = mode === "build" ? POINTS.build : POINTS.type;
    return { ok, perHole: null, delta: ok ? pts : -pts };
  }
  const perHole = p.holes.map((h, i) => given[i] === h.correct);
  const ok = perHole.every(Boolean);
  let delta;
  if (p.holes.length === 1) delta = ok ? POINTS.single : -POINTS.single;
  else delta = perHole.reduce((s, g) => s + (g ? POINTS.perHole : -POINTS.perHole), 0);
  return { ok, perHole, delta };
}

function grade(st, n, given, mode) {
  const p = PUZZLES[n - 1];
  const j = judge(p, given, mode);
  const first = !st.attempts[n];
  let delta = 0;
  if (first) {
    delta = j.delta;
    st.elo += delta;
    st.attempts[n] = { ok: j.ok, mode, delta };
    st.streak = j.ok ? st.streak + 1 : 0;
    st.best = Math.max(st.best, st.streak);
  }
  return { ok: j.ok, perHole: j.perHole, first, delta, given, revealed: mode === "reveal" };
}

function solvedCount(st) { return Object.values(st.attempts).filter(a => a.ok).length; }
function attemptedCount(st) { return Object.keys(st.attempts).length; }
function rankOf(elo) { let r = RANKS[0][1]; for (const [e, name] of RANKS) if (elo >= e) r = name; return r; }
function puzzlesWithPattern(pid) { return PUZZLES.filter(p => p.patterns.includes(pid)).map(p => p.n); }

/* ---------- formatting ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function highlight(code) {
  const re = /(--[^\n]*)|("(?:[^"\\]|\\.)*")|(#eval|#guard_msgs|\/-- info:|-\/)|\b(def|abbrev|theorem|example|where|fun|match|with|if|then|else|let|in|open|namespace|end|by|do|calc|have|show|from|decide)\b|\b(induction|intro|rintro|refine|exact|apply|rw|simp|ring|linarith|nlinarith|positivity|push_neg|push_cast|field_simp|norm_num|omega|constructor|use|obtain|rfl|zero|succ|base)\b|\b(true|false)\b|\b(\d+)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "cm" : m[2] ? "st" : m[3] ? "ev" : m[4] ? "kw" : m[5] ? "ta" : m[6] ? "bo" : "nu";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
/* code of a fill puzzle with the holes replaced by clickable boxes */
function codeWithHoles(p, chosen, perHole) {
  return p.code.split(/(__\d+__)/).map(seg => {
    const m = /^__(\d+)__$/.exec(seg);
    if (!m) return highlight(seg);
    const k = +m[1], i = k - 1, c = chosen[i];
    const cls = perHole ? (perHole[i] ? "good" : "bad") : c ? "set" : "";
    return `<span class="hole ${cls}" data-act="focus" data-k="${k}">${CIRCLED[k]}${c ? " " + esc(c) : ""}</span>`;
  }).join("");
}
function inlineMd(s) {
  return String(s).split("`").map((seg, i) => i % 2
    ? `<code>${esc(seg)}</code>`
    : esc(seg).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(\S(?:.*?\S)?)\*/g, "<em>$1</em>")
  ).join("");
}
function chips(p) {
  return p.patterns.map(pid => `<span class="chip" data-act="pattern" data-p="${pid}" title="${esc(PATTERNS[pid].hu)}">${esc(PATTERNS[pid].en)}</span>`).join("");
}
function kindLabel(p) {
  if (p.kind === "eval") return "#eval";
  return p.holes.length === 1 ? "proof step" : `composite · ${p.holes.length} holes`;
}

/* ---------- views (return HTML strings) ---------- */
function viewMap(st) {
  const done = attemptedCount(st);
  let h = `<div class="card"><h2 style="margin-top:0">Climb the Δ-Citadel <span class="dim" style="font-weight:400">· Mássz fel a Kalkulus-várba</span></h2>
  <p>50 tiny Lean 4 puzzles from the Kalkulus I exercise sheet (<em>gyakorló</em>) and lecture notes (<em>jegyzet</em>). They start with
  <b>#eval puzzles</b> (predict the output), move on to <b>proof steps</b> (choose the tactic or term that fits the hole), and end with
  <b>composite proofs</b> that have several holes. Each puzzle names the structural pattern it trains and the <b>category-theory lens</b> on it.</p>
  <p class="dim">Lean has checked everything here: every output, every correct proof, and the fact that every wrong option makes the proof fail.
  First try only: #eval puzzles score ±${POINTS.type} (typed) or ±${POINTS.build} (built). Proof steps score ±${POINTS.single}. Composite proofs score ±${POINTS.perHole} per hole.
  Opening a door unlocks the next one. Later tries are free practice.</p>
  <div class="bar"><div style="width:${done * 2}%"></div></div>
  <p class="dim" style="margin-bottom:0">${done}/50 doors opened · Rank: <b>${rankOf(st.elo)}</b> · Best streak: ${st.best} · Max Elo ${maxElo()}</p>
  <div class="row" style="margin-top:10px">
   <button class="primary" data-act="next">${done ? "Continue climbing" : "Start at door 1"}</button>
   <button data-act="random">Random practice</button>
   <button data-act="atlas">🧭 Pattern atlas</button>
   <button data-act="stats">Scorecard</button>
   <button data-act="reset">Reset progress</button></div></div>`;
  for (let f = FLOORS.length - 1; f >= 0; f--) {
    const open = floorUnlocked(st, f), F = FLOORS[f];
    h += `<div class="floor ${open ? "" : "locked"}"><div><h3>Floor ${f + 1}: ${esc(F.en)}</h3><div class="dim" style="font-size:13px">${esc(F.hu)} · ${esc(F.src)}</div></div><div class="doors">`;
    for (let n = f * 5 + 1; n <= f * 5 + 5; n++) {
      const a = st.attempts[n], u = isUnlocked(st, n), p = PUZZLES[n - 1];
      const cls = a ? (a.ok ? "ok" : "ko") : u ? "open" : "";
      const icon = a ? (a.ok ? "✔" : "✘") : u ? "🚪" : "🔒";
      h += `<button class="door ${cls}" ${u ? "" : "disabled"} data-act="open" data-n="${n}" title="${esc(p.title + " · " + p.hu)}">
        <span class="num">${icon} ${n}</span><span>${u ? esc(p.title) : "Elo " + p.elo}</span><span class="kind">${kindLabel(p)}</span></button>`;
    }
    h += `</div></div>`;
  }
  return h;
}

function puzzleHead(st, p) {
  const a = st.attempts[p.n];
  return `<div class="row"><button data-act="map">← Citadel</button>
    <span class="pill">Floor ${p.floor} · Puzzle ${p.n}/50</span><span class="pill">${kindLabel(p)}</span><span class="pill">Puzzle Elo <b>${p.elo}</b></span>
    ${a ? `<span class="pill">${a.ok ? "✔ solved" : "✘ missed"} · practice mode</span>` : ""}</div>
    <h2 style="margin-bottom:2px">Puzzle ${p.n}: ${esc(p.title)}</h2>
    <div class="dim">${esc(p.hu)} · Source: ${inlineMd(p.src)}</div>
    <div style="margin-top:6px">${chips(p)}</div>`;
}

function viewPuzzle(st, n, ui, result) {
  const p = PUZZLES[n - 1], a = st.attempts[n];
  let h = `<div class="card">${puzzleHead(st, p)}`;
  if (p.kind === "eval") {
    h += `<pre class="code">${highlight(p.code)}</pre><p><b>What does <code>#eval output</code> print?</b></p>`;
    if (!result) {
      h += `<div class="tabs"><button class="${ui.mode === "type" ? "sel" : ""}" data-act="mode" data-mode="type">⌨ Type it (±${POINTS.type})</button>
        <button class="${ui.mode === "build" ? "sel" : ""}" data-act="mode" data-mode="build">🧩 Build it (±${POINTS.build})</button></div>`;
      if (ui.mode === "type") {
        h += `<input class="typed" id="typed" autocomplete="off" spellcheck="false" placeholder="e.g. [(1, 3 / 2), -4]">
          <p class="dim" style="font-size:13px">Spaces are ignored. Brackets, commas, signs and fractions must match Lean's output exactly. Lean prints rationals as <code>3 / 2</code>.</p>`;
      } else {
        let k = 0;
        h += `<div class="builder" id="builder">` + tokenize(p.answer).map(t => {
          if (t.lit !== undefined) return esc(t.lit);
          const i = k++;
          return t.slot === "bool"
            ? `<button class="slot-b" data-act="cycle" data-i="${i}" data-v="?">?</button>`
            : `<input data-i="${i}" inputmode="numeric" placeholder="?">`;
        }).join("") + `</div><p class="dim" style="font-size:13px">Click a truth value to flip it. Type each integer, including its sign.</p>`;
      }
    }
  } else {
    const chosen = result ? result.given : ui.chosen;
    h += `<pre class="code">${codeWithHoles(p, chosen, result ? result.perHole : null)}</pre>`;
    if (!result) {
      h += `<p><b>Fill ${p.holes.length === 1 ? "the hole" : "every hole"} so that Lean accepts the proof.</b> Exactly one option per hole works.</p>`;
      for (const [i, hole] of p.holes.entries()) {
        h += `<div class="opts"><span class="lbl">${CIRCLED[hole.k]}</span>` + hole.choices.map((c, ci) =>
          `<button class="${chosen[i] === c ? "sel" : ""}" data-act="choose" data-i="${i}" data-c="${ci}">${esc(c)}</button>`).join("") + `</div>`;
      }
    }
  }
  if (!result) {
    h += `<div class="row"><button class="primary" data-act="submit">${p.kind === "eval" ? "Run #eval ▶" : "Check with Lean ▶"}</button>
      <button data-act="reveal">${a ? "Show solution" : `Give up (−${maxPoints(p)})`}</button></div>`;
  } else {
    h += viewResult(st, n, result);
  }
  return h + `</div>`;
}

function viewResult(st, n, r) {
  const p = PUZZLES[n - 1];
  const head = r.revealed ? `<div class="verdict bad">Solution revealed ${r.first ? `${r.delta} Elo` : ""}</div>`
    : r.ok ? `<div class="verdict good">Correct! ${r.first ? `+${r.delta} Elo` : "(practice)"}</div>`
    : `<div class="verdict bad">${r.perHole && r.perHole.some(Boolean) ? "Partly right." : "Not quite."} ${r.first ? `${r.delta > 0 ? "+" : ""}${r.delta} Elo` : "(practice)"}</div>`;
  let body = "";
  if (p.kind === "eval") {
    const check = `/-- info: ${p.answer} -/\n#guard_msgs in\n#eval output`;
    body = `${!r.revealed ? `<p>You answered: <code>${esc(r.given)}</code></p>` : ""}
     <div class="lean"><p style="margin:6px 0">Lean prints:</p><pre class="code">${highlight(p.answer)}</pre>
     <p class="dim" style="font-size:13px">Checked by Lean in <code>${esc(p.file)}</code>:</p><pre class="code">${highlight(check)}</pre></div>`;
  } else {
    const rows = p.holes.map((hole, i) => {
      const wrong = hole.choices.filter(c => c !== hole.correct);
      return `<tr><td>${CIRCLED[hole.k]}</td><td>${r.revealed ? "—" : `<code>${esc(r.given[i])}</code> ${r.perHole[i] ? "✔" : "✘"}`}</td>
        <td><code>${esc(hole.correct)}</code></td><td class="dim">${wrong.map(w => `<code>${esc(w)}</code>`).join(" ")}</td></tr>`;
    }).join("");
    body = `<table><tr><th>Hole</th><th>Your choice</th><th>Correct</th><th>Rejected by Lean</th></tr>${rows}</table>
     <div class="lean"><p style="margin:6px 0">The complete proof, which Lean accepts:</p><pre class="code">${highlight(p.solution)}</pre>
     <p class="dim" style="font-size:13px">Checked in <code>${esc(p.file)}</code>. That file proves this theorem, and for every wrong option it contains a
     <code>fail_if_success</code> check showing that this option alone breaks the proof.</p></div>`;
  }
  return `${head}${body}
   <h3>Why</h3><p>${inlineMd(p.explanation)}</p>
   <div class="lens"><h3>🧭 Category lens</h3><p style="margin:4px 0">${inlineMd(p.lens)}</p>
   <div>${chips(p)}</div></div>
   <div class="row"><button data-act="retry">Try again (practice)</button>
   ${n < 50 ? `<button class="primary" data-act="open" data-n="${n + 1}">Next door →</button>` : `<button class="primary" data-act="stats">See scorecard</button>`}
   <button data-act="map">Back to the citadel</button></div>`;
}

function viewAtlas(st, focus) {
  let h = `<div class="card"><div class="row"><button data-act="map">← Citadel</button></div>
   <h2>🧭 Pattern atlas <span class="dim" style="font-weight:400">· Mintatár</span></h2>
   <p class="dim">The structural patterns behind the puzzles, collected from the project's notes on the calculus sheets (master theorem, K2–K7, Goldblatt's G1–G4, P1–P10, beadandó M1–M7).
   Each pattern has a calculus reading and a category-theory reading. Puzzles you have already unlocked are clickable.</p>`;
  for (const [pid, pt] of Object.entries(PATTERNS)) {
    const ns = puzzlesWithPattern(pid);
    h += `<div class="pat" id="pat-${pid}" ${focus === pid ? 'style="background:#1d2f33;border-radius:10px;padding:12px"' : ""}>
      <h3>${esc(pt.en)} <span class="dim" style="font-weight:400;font-size:14px">· ${esc(pt.hu)} · <code>${pid}</code></span></h3>
      <p style="margin:4px 0">${inlineMd(pt.idea)}</p>
      <div class="lens"><p style="margin:4px 0"><b style="color:var(--cat)">Category lens:</b> ${inlineMd(pt.lens)}</p></div>
      <div class="row">${ns.map(n => `<button ${isUnlocked(st, n) ? "" : "disabled"} data-act="open" data-n="${n}" style="padding:3px 9px;font-size:13px">${st.attempts[n] ? (st.attempts[n].ok ? "✔" : "✘") : ""} ${n}. ${esc(PUZZLES[n - 1].title)}</button>`).join("")}</div></div>`;
  }
  return h + `</div>`;
}

function viewStats(st) {
  const done = attemptedCount(st), ok = solvedCount(st);
  let h = `<div class="card"><div class="row"><button data-act="map">← Citadel</button></div>
