<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rule Forge λD₀ — a pixel game for the derivation rules of λD₀</title>
<style>
:root { color-scheme: light; --day:#eef7ff; --day2:#fff3c4; --sky:#dcefff; --paper:#fffaf0; --ink:#1d1a2a; --fire:#ff7b2e; --gold:#ffd23f; --steel:#8a95a8; --green:#3fa34d; --red:#d1495b; --blue:#3a6ea5; --muted:#6d6a7c; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--day); color: var(--ink); font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--day2); border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 3; }
header .logo { color: var(--fire); font-weight: bold; letter-spacing: 2px; text-shadow: 2px 2px 0 #fff; margin-right: 8px; cursor: pointer; }
#sparks { margin-left: auto; color: #8a6200; font-weight: bold; font-size: 13px; }
main { max-width: 1240px; margin: 0 auto; padding: 10px 12px 14px; }
#app { background: var(--paper); border: 4px solid #000; box-shadow: 6px 6px 0 #000; padding: 14px 18px; }
h1 { font-size: 22px; color: var(--red); margin: 6px 0; text-shadow: 2px 2px 0 #ffe7a8; }
h2 { font-size: 17px; margin: 10px 0 4px; } h3 { font-size: 15px; margin: 8px 0 4px; }
p { max-width: 82ch; margin: 6px 0; }
.btn { font: inherit; cursor: pointer; border: 3px solid #000; background: #fffaf0; color: var(--ink); padding: 4px 10px; box-shadow: 3px 3px 0 #000; }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px dashed var(--blue); outline-offset: 2px; }
.btn.primary { background: var(--gold); }
.btn.nav { background: #cfe0ff; color: var(--ink); }
.btn.nav.cur { background: var(--fire); color: #000; }
.btn.small { padding: 1px 6px; font-size: 13px; box-shadow: 2px 2px 0 #000; }
.btn.good { background: #bfe8c4; } .btn.bad { background: #f4c0c7; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.small { font-size: 12px; color: var(--muted); }
canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; border: 4px solid #000; background: var(--sky); max-width: 100%; height: auto; }
.title canvas { width: 100%; max-width: 640px; height: auto; }
.worlds { display: grid; gap: 14px; }
.world { border: 3px solid #000; background: #fff6e0; padding: 8px 12px; }
.world h2 { margin: 2px 0; color: var(--blue); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tile { min-width: 150px; text-align: left; }
.tile .k { font-size: 11px; color: var(--muted); display: block; }
.tile.done { background: #d7f2d0; }
.layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 14px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.panel { border: 3px solid #000; background: #fffdf6; padding: 8px 10px; }
.panel h3 { margin-top: 0; }
.env { font-size: 13px; background: #f0e6cc; border: 2px dashed #000; padding: 4px 8px; margin: 6px 0; }
.env div { white-space: pre-wrap; }
.tree { list-style: none; padding-left: 0; margin: 0; font-size: 14px; }
.tree ul { list-style: none; padding-left: 18px; margin: 0; border-left: 2px dotted var(--steel); }
.node { display: flex; gap: 6px; align-items: baseline; padding: 1px 4px; cursor: pointer; border: 2px solid transparent; }
.node .st { width: 1.4em; flex: none; text-align: center; font-weight: bold; }
.node .j { flex: 1; word-break: break-word; }
.node .tag { flex: none; font-size: 12px; background: #e6e0f5; border: 1px solid #000; padding: 0 4px; }
.node.open .st { color: var(--fire); }
.node.closed .st { color: var(--green); }
.node.reuse .tag { background: #d7f2d0; }
.node.focus { border-color: var(--fire); background: #fff0d8; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.card { font: inherit; font-size: 11px; text-align: center; cursor: pointer; border: 3px solid #000; background: #fffaf0; box-shadow: 3px 3px 0 #000; padding: 4px; }
.card .nm { font-weight: bold; font-size: 13px; color: var(--blue); }
.card.hint { background: #fff1b8; }
.card.derived { border-style: dashed; }
.frac { display: inline-grid; grid-template-columns: auto auto auto; align-items: center; gap: 2px 10px; margin: 6px 0; }
.frac .rl { grid-row: 1 / span 2; font-style: italic; color: var(--blue); }
.frac .pr { display: flex; flex-wrap: wrap; gap: 6px 22px; justify-content: center; padding: 0 4px 2px; }
.frac .cn { border-top: 2px solid #000; padding: 2px 4px 0; text-align: center; }
.frac .sd { grid-row: 1 / span 2; grid-column: 3; font-size: 12px; color: var(--muted); }
.frac.big { font-size: 16px; }
.hole { background: var(--gold); border: 2px solid #000; padding: 0 6px; }
.msg { border: 3px solid #000; padding: 6px 10px; margin: 8px 0; background: #fff; white-space: pre-wrap; }
.msg.ok { background: #e3f6df; } .msg.no { background: #fde8ea; } .msg.info { background: #eef3fb; }
table.match { border-collapse: collapse; font-size: 13px; margin: 4px 0; }
table.match td { border: 1px solid #000; padding: 1px 6px; }
table.match td:first-child { color: var(--blue); font-weight: bold; }
.term { font-size: 18px; line-height: 2; word-break: break-word; }
.cst { background: #ffe08a; border: 2px solid #000; cursor: pointer; padding: 0 2px; }
.cst:hover { background: var(--fire); }
.path { font-size: 14px; }
ol.lin { font-size: 13px; }
input[type=text] { font: inherit; border: 3px solid #000; padding: 3px 6px; width: 100%; }
select { font: inherit; border: 3px solid #000; padding: 3px; }
.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
body.contrast #app { background: #fff; } body.contrast .node.focus { background: #ffd; border-color: #000; }
</style>
</head>
<body>
<header>
  <span class="logo" id="logo">⚒ RULE FORGE λD₀</span>
  <span id="nav"></span>
  <span id="sparks"></span>
</header>
<main><div id="app"></div></main>
<div id="live" class="sr" aria-live="polite"></div>
<script>
// Rule Forge λD₀ — engine: terms, substitution, βδ-conversion, type checking,
// and the rule patterns of Figures 9.3 and 9.4 (Nederpelt & Geuvers,
// "Type Theory and Formal Proof", chapter 9).
var LD = (function () {
  "use strict";

  // ---------- terms ----------
  var STAR = { k: "star" }, BOX = { k: "box" };
  function V(n) { return { k: "var", n: n }; }
  function App(f, a) { return { k: "app", f: f, a: a }; }
  function Lam(x, ty, b) { return { k: "lam", x: x, ty: ty, b: b }; }
  function Pi(x, ty, b) { return { k: "pi", x: x, ty: ty, b: b }; }
  function C(a, args) { return { k: "const", a: a, args: args }; }
  function isSort(t) { return t.k === "star" || t.k === "box"; }

  function LDError(msg) { this.message = msg; }

  // ---------- free variables / constants ----------
  function fv(t, acc) {
    acc = acc || new Set();
    switch (t.k) {
      case "var": acc.add(t.n); break;
      case "app": fv(t.f, acc); fv(t.a, acc); break;
      case "lam": case "pi": {
        fv(t.ty, acc);
        var inner = fv(t.b);
        inner.delete(t.x);
        inner.forEach(function (v) { acc.add(v); });
        break;
      }
      case "const": t.args.forEach(function (u) { fv(u, acc); }); break;
    }
    return acc;
  }
  function occursFree(x, t) { return fv(t).has(x); }
  function consts(t, acc) {
    acc = acc || new Set();
    switch (t.k) {
      case "app": consts(t.f, acc); consts(t.a, acc); break;
      case "lam": case "pi": consts(t.ty, acc); consts(t.b, acc); break;
      case "const": acc.add(t.a); t.args.forEach(function (u) { consts(u, acc); }); break;
    }
    return acc;
  }

  function freshName(base, avoid) {
    var root = base.replace(/['′]+$/, "");
    var cand = root + "'";
    while (avoid.has(cand)) cand += "'";
    return cand;
  }

  // simultaneous capture-avoiding substitution; sigma: Map name -> term
  function subst(t, sigma) {
    if (sigma.size === 0) return t;
    switch (t.k) {
      case "star": case "box": return t;
      case "var": return sigma.has(t.n) ? sigma.get(t.n) : t;
      case "app": return App(subst(t.f, sigma), subst(t.a, sigma));
      case "const": return C(t.a, t.args.map(function (u) { return subst(u, sigma); }));
      case "lam": case "pi": {
        var ty = subst(t.ty, sigma);
        var s2 = new Map(sigma);
        s2.delete(t.x);
        var bodyFv = fv(t.b);
        var danger = new Set();
        bodyFv.forEach(function (y) { if (s2.has(y)) fv(s2.get(y), danger); });
        var x = t.x;
        if (danger.has(x)) {
          var avoid = new Set(danger);
          bodyFv.forEach(function (y) { avoid.add(y); });
          s2.forEach(function (v, k) { avoid.add(k); });
          x = freshName(t.x, avoid);
          s2.set(t.x, V(x));
        }
        var b = subst(t.b, s2);
        return t.k === "lam" ? Lam(x, ty, b) : Pi(x, ty, b);
      }
    }
    throw new Error("subst: unknown term");
  }
  function subst1(t, x, u) { var m = new Map(); m.set(x, u); return subst(t, m); }

  // ---------- α-equivalence ----------
  function alphaEq(a, b, ea, eb, d) {
    ea = ea || new Map(); eb = eb || new Map(); d = d || 0;
    if (a.k !== b.k) return false;
    switch (a.k) {
      case "star": case "box": return true;
      case "var": {
        var ia = ea.has(a.n) ? ea.get(a.n) : null, ib = eb.has(b.n) ? eb.get(b.n) : null;
        if (ia === null && ib === null) return a.n === b.n;
        return ia === ib;
      }
      case "app": return alphaEq(a.f, b.f, ea, eb, d) && alphaEq(a.a, b.a, ea, eb, d);
      case "const":
        if (a.a !== b.a || a.args.length !== b.args.length) return false;
        for (var i = 0; i < a.args.length; i++) if (!alphaEq(a.args[i], b.args[i], ea, eb, d)) return false;
        return true;
      case "lam": case "pi": {
        if (!alphaEq(a.ty, b.ty, ea, eb, d)) return false;
        var ea2 = new Map(ea), eb2 = new Map(eb);
        ea2.set(a.x, d); eb2.set(b.x, d);
        return alphaEq(a.b, b.b, ea2, eb2, d + 1);
      }
    }
    return false;
  }

  // ---------- environments ----------
  // a definition: { label, a, params: [{x, ty}], body, type }
  function findDef(env, a) {
    for (var i = env.length - 1; i >= 0; i--) if (env[i].a === a) return env[i];
    return null;
  }
  function instSigma(d, args) {
    var m = new Map();
    d.params.forEach(function (p, i) { m.set(p.x, args[i]); });
    return m;
  }

  // ---------- reduction ----------
  var budget = { left: 0 };
  function tick() { if (--budget.left < 0) throw new LDError("This needs too much computation (work limit reached)."); }
  function withBudget(n, f) {
    var old = budget.left; budget.left = n;
    try { return f(); } finally { budget.left = old; }
  }
  function whnf(t, env) {
    for (;;) {
      tick();
      if (t.k === "app") {
        var f = whnf(t.f, env);
        if (f.k === "lam") { t = subst1(f.b, f.x, t.a); continue; }
        return f === t.f ? t : App(f, t.a);
      }
      if (t.k === "const") {
        var d = findDef(env, t.a);
        if (d && d.body) { t = subst(d.body, instSigma(d, t.args)); continue; }
        return t;
      }
      return t;
    }
  }
  function nf(t, env) {
    t = whnf(t, env);
    switch (t.k) {
      case "app": return App(nf(t.f, env), nf(t.a, env));
      case "lam": return Lam(t.x, nf(t.ty, env), nf(t.b, env));
      case "pi": return Pi(t.x, nf(t.ty, env), nf(t.b, env));
      case "const": return C(t.a, t.args.map(function (u) { return nf(u, env); }));
    }
    return t;
  }
  function convertible(a, b, env) {
    if (alphaEq(a, b)) return true;
    return withBudget(200000, function () { return alphaEq(nf(a, env), nf(b, env)); });
  }

  // one δ-step at a path (list of child keys), for the unfolding levels
  function constPaths(t, env, path, acc) {
    path = path || []; acc = acc || [];
    switch (t.k) {
      case "app": constPaths(t.f, env, path.concat(["f"]), acc); constPaths(t.a, env, path.concat(["a"]), acc); break;
      case "lam": case "pi": constPaths(t.ty, env, path.concat(["ty"]), acc); constPaths(t.b, env, path.concat(["b"]), acc); break;
      case "const": {
        var d = findDef(env, t.a);
        if (d && d.body) acc.push(path);
        t.args.forEach(function (u, i) { constPaths(u, env, path.concat([i]), acc); });
        break;
      }
    }
    return acc;
  }
  function getAt(t, path) {
    for (var i = 0; i < path.length; i++) {
      var p = path[i];
      t = typeof p === "number" ? t.args[p] : t[p];
    }
    return t;
  }
  function replaceAt(t, path, u) {
    if (path.length === 0) return u;
    var p = path[0], rest = path.slice(1);
    if (typeof p === "number") {
      var args = t.args.slice(); args[p] = replaceAt(t.args[p], rest, u);
      return C(t.a, args);
    }
    var c = Object.assign({}, t); c[p] = replaceAt(t[p], rest, u);
    return c;
  }
  function unfoldAt(t, path, env) {
    var s = getAt(t, path);
    if (!s || s.k !== "const") throw new LDError("There is no constant here.");
    var d = findDef(env, s.a);
    if (!d || !d.body) throw new LDError(s.a + " is not unfoldable.");
    return replaceAt(t, path, subst(d.body, instSigma(d, s.args)));
  }
  function isDeltaNF(t, env) { return constPaths(t, env).length === 0; }

  // ---------- type inference ----------
  function lookup(ctx, x) {
    for (var i = ctx.length - 1; i >= 0; i--) if (ctx[i].x === x) return ctx[i].ty;
    return null;
  }
  function ctxNames(ctx) { var s = new Set(); ctx.forEach(function (e) { s.add(e.x); }); return s; }

  function sortOf(env, ctx, t, what) {
    var s = whnf(infer(env, ctx, t), env);
    if (!isSort(s)) throw new LDError((what || pp(t)) + " is not a type: its type is " + pp(s) + ", not a sort.");
    return s;
  }

  function infer(env, ctx, t) {
    tick();
    switch (t.k) {
      case "star": return BOX;
      case "box": throw new LDError("□ has no type: no rule has □ on the left of ':'.");
      case "var": {
        var ty = lookup(ctx, t.n);
        if (!ty) throw new LDError("The variable " + t.n + " is not declared in the context.");
        return ty;
      }
      case "app": {
        var tf = infer(env, ctx, t.f);
        var w = whnf(tf, env);
        if (w.k !== "pi") throw new LDError(pp(t.f) + " has type " + pp(tf) + ", which is not a Π-type, so it cannot be applied.");
        var ta = infer(env, ctx, t.a);
        if (!convertible(ta, w.ty, env)) throw new LDError("The argument " + pp(t.a) + " has type " + pp(ta) + ", but " + pp(t.f) + " expects " + pp(w.ty) + ".");
        return subst1(w.b, w.x, t.a);
      }
      case "lam": case "pi": {
        var x = t.x, body = t.b;
        sortOf(env, ctx, t.ty);
        var names = ctxNames(ctx);
        if (names.has(x)) {
          var avoid = new Set(names); fv(body).forEach(function (v) { avoid.add(v); });
          var x2 = freshName(x, avoid); body = subst1(body, x, V(x2)); x = x2;
        }
        var ctx2 = ctx.concat([{ x: x, ty: t.ty }]);
        if (t.k === "pi") return sortOf(env, ctx2, body);
        var tb = infer(env, ctx2, body);
        if (tb.k === "box") throw new LDError("The body " + pp(body) + " has type □, and □ has no type, so this λ is not allowed.");
        sortOf(env, ctx2, tb);
        return Pi(x, t.ty, tb);
      }
      case "const": {
        var d = findDef(env, t.a);
        if (!d) throw new LDError("The constant " + t.a + " is not defined in the environment.");
        if (d.params.length !== t.args.length) throw new LDError(t.a + " needs " + d.params.length + " parameter(s), but gets " + t.args.length + ".");
        var sig = instSigma(d, t.args);
        for (var i = 0; i < t.args.length; i++) {
          var want = subst(d.params[i].ty, sig);
          var got = infer(env, ctx, t.args[i]);
          if (!convertible(got, want, env)) throw new LDError("Parameter " + (i + 1) + " of " + t.a + ": " + pp(t.args[i]) + " has type " + pp(got) + ", but " + pp(want) + " is needed.");
        }
        return subst(d.type, sig);
      }
    }
    throw new Error("infer: unknown term");
  }

  // legality of Δ ; Γ (i.e. whether Δ ; Γ ⊢ * : □ is derivable)
  var legalCache = new Map();
  function legal(env, ctx) {
    var key = envKey(env) + "|" + ctxKey(ctx);
    if (legalCache.has(key)) return legalCache.get(key);
    var r = withBudget(400000, function () {
      try {
        for (var i = 0; i < env.length; i++) {
          var d = env[i], pre = env.slice(0, i);
          if (findDef(pre, d.a)) return { ok: false, why: "The constant " + d.a + " is defined twice in the environment." };
          var r0 = legal(pre, d.params);
          if (!r0.ok) return { ok: false, why: "In the definition of " + d.a + ": " + r0.why };
          var j = typed(pre, d.params, d.body, d.type);
          if (!j.ok) return { ok: false, why: "The definition of " + d.a + " is not correct: " + j.why };
        }
        for (var k = 0; k < ctx.length; k++) {
          var pre2 = ctx.slice(0, k);
          if (lookup(pre2, ctx[k].x)) return { ok: false, why: "The variable " + ctx[k].x + " is declared twice in the context." };
          sortOf(env, pre2, ctx[k].ty, "The declared type " + pp(ctx[k].ty) + " of " + ctx[k].x);
        }
        return { ok: true };
      } catch (e) {
        if (e instanceof LDError) return { ok: false, why: e.message };
        throw e;
      }
    });
    legalCache.set(key, r);
    return r;
  }
  // Δ;Γ ⊢ M : N derivable, assuming Δ;Γ legal
  function typed(env, ctx, M, N) {
    try {
      if (M.k === "box") return { ok: false, why: "□ has no type." };
      var T = infer(env, ctx, M);
      if (alphaEq(T, N)) return { ok: true };
      if (N.k === "box") return { ok: false, why: pp(M) + " has type " + pp(T) + ", not □." };
      sortOf(env, ctx, N);
      if (convertible(T, N, env)) return { ok: true };
      return { ok: false, why: pp(M) + " has type " + pp(T) + ", which is not βδ-convertible to " + pp(N) + "." };
    } catch (e) {
      if (e instanceof LDError) return { ok: false, why: e.message };
      throw e;
    }
  }
  function derivable(J) {
    var l = legal(J.env, J.ctx);
    if (!l.ok) return l;
    return withBudget(400000, function () { return typed(J.env, J.ctx, J.M, J.N); });
  }

  // ---------- judgements ----------
  function J(env, ctx, M, N) { return { env: env, ctx: ctx, M: M, N: N }; }
  function envKey(env) { return env.map(function (d) { return d.a; }).join(","); }
  function ctxKey(ctx) { return ctx.map(function (e) { return e.x + ":" + pp(e.ty); }).join(","); }
  function jKey(j) { return envKey(j.env) + ";" + ctxKey(j.ctx) + "⊢" + pp(j.M) + ":" + pp(j.N); }
  function ctxEq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i].x !== b[i].x || !alphaEq(a[i].ty, b[i].ty)) return false;
    return true;
  }
  function envEq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i] && !defEq(a[i], b[i])) return false;
    return true;
  }
  function defEq(d, e) {
    return d.a === e.a && ctxEq(d.params, e.params) && alphaEq(d.body, e.body) && alphaEq(d.type, e.type);
  }
  function jEq(a, b) { return envEq(a.env, b.env) && ctxEq(a.ctx, b.ctx) && alphaEq(a.M, b.M) && alphaEq(a.N, b.N); }

  // ---------- pretty printing ----------
  var printOpts = { infix: {}, postfix: {} };
  function setPrintOpts(o) { printOpts = o || { infix: {}, postfix: {} }; }
  function ppPrec(t, prec) {
    var s, io = printOpts;
    switch (t.k) {
      case "star": return "*";
      case "box": return "□";
      case "var": return t.n;
      case "const":
        if (t.args.length === 0) return t.a;
        return t.a + "(" + t.args.map(function (u) { return ppPrec(u, 0); }).join(", ") + ")";
      case "app": {
        if (t.f.k === "app" && t.f.f.k === "var" && io.infix && io.infix[t.f.f.n]) {
          s = ppPrec(t.f.a, 2) + " " + io.infix[t.f.f.n] + " " + ppPrec(t.a, 2);
          return prec > 1 ? "(" + s + ")" : s;

      if (U.msg) a.appendChild(h("div", { class: "msg " + U.msg.cls, text: U.msg.text }));
      if (nfNow) {
        a.appendChild(h("div", { class: "msg ok", text: "δ-normal form reached in " + (U.path.length - 1) + " step(s): no unfoldable constant is left. Other orders of unfolding reach the same normal form (the book shows this in Chapter 10)." }));
        a.appendChild(h("div", { class: "row" }, [btn("Continue ▶ (Enter)", finishRound, "primary")]));
      } else {
        a.appendChild(h("div", { class: "row" }, [btn("Start over", function () { S.run = null; render(); }, "small")]));
      }
    } finally {
      LD.setPrintOpts(null);
    }
  }
  function segEls(segs, env, live) {
    return segs.map(function (p) {
      if (typeof p === "string") return doc.createTextNode(p);
      var d = LD.findDef(env, p.name);
      var kids = [doc.createTextNode(p.name)].concat(segEls(p.parts, env, live));
      if (d && d.body && live) return h("span", { class: "cst", onclick: function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); unfold(p.path); }, "data-path": JSON.stringify(p.path), title: "unfold " + p.name }, kids);
      return h("span", null, kids);
    });
  }
  function unfold(path) {
    var U = S.run, l = S.level, env = CONTENT.ENVS[l.env];
    LD.setPrintOpts(CONTENT.ARITH_PRINT);
    try {
      var name = LD.getAt(U.term, path).a;
      U.term = LD.unfoldAt(U.term, path, env);
      U.path.push(LD.pp(U.term));
      U.msg = { cls: "ok", text: "Unfolded one occurrence of " + name + "." };
      clang(); announce(U.msg.text + " Now: " + LD.pp(U.term));
    } finally { LD.setPrintOpts(null); }
    render();
  }

  // ---------- studio ----------
  var studio = { env: "empty", ctx: "A:*", M: "λx:A. x", N: "A → A", msg: null };
  function renderStudio(a) {
    a.appendChild(h("h1", { text: "Studio — forge your own judgement" }));
    a.appendChild(h("p", { text: "Write a judgement Δ ; Γ ⊢ M : N and forge its derivation. Syntax: *  □  λx:A. M  Πx:A. B  A → B  M N  a(U, V). You can type \\ for λ and -> for →." }));
    var sel = h("select", { "data-act": "env", onchange: function (ev) { studio.env = ev.target.value; render(); } }, Object.keys(CONTENT.ENVS).filter(function (k) { return ["empty", "id", "neg", "twice"].indexOf(k) >= 0; }).map(function (k) {
      var o = h("option", { value: k, text: k === "empty" ? "∅" : LD.ppEnv(CONTENT.ENVS[k]) + " (" + CONTENT.ENVS[k].map(function (d) { return d.a; }).join(", ") + ")" });
      if (k === studio.env) o.setAttribute("selected", "selected");
      return o;
    }));
    a.appendChild(h("div", { class: "row" }, [h("b", { text: "Δ =" }), sel]));
    a.appendChild(envPanel(CONTENT.ENVS[studio.env]) || h("span"));
    function field(lbl, key) {
      var inp = h("input", { type: "text", value: studio[key], "data-act": "in-" + key, "aria-label": lbl });
      inp.oninput = function () { studio[key] = inp.value; };
      return h("div", { class: "row" }, [h("b", { text: lbl }), inp]);
    }
    a.appendChild(field("Γ =", "ctx")); a.appendChild(field("M =", "M")); a.appendChild(field("N =", "N"));
    a.appendChild(h("div", { class: "row" }, [btn("Forge it ⚒", studioGo, "primary")]));
    if (studio.msg) a.appendChild(h("div", { class: "msg no", text: studio.msg }));
  }
  function studioGo() {
    var env = CONTENT.ENVS[studio.env];
    var g;
    try { g = LD.parseJ(env, studio.ctx, studio.M, studio.N); }
    catch (e) { studio.msg = "I can't read that: " + (e.message || e); render(); return; }
    var d = LD.derivable(g);
    if (!d.ok) { studio.msg = "This judgement is not derivable, so there is nothing to forge: " + d.why; spark(); render(); return; }
    studio.msg = null;
    S.level = { id: "studio", title: "Your judgement", kind: "forge", custom: g, intro: [] };
    S.round = 0; S.run = null; S.phase = "play"; S.screen = "level";
    render();
  }

  // ---------- keyboard ----------
  function onKey(ev) {
    var k = ev.key;
    if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT")) { if (k === "Enter" && S.screen === "studio") studioGo(); return; }
    if (k === "Escape") { go("map"); return; }
    if (S.screen === "title" && (k === "Enter" || k === " ")) { go("map"); return; }
    if (S.screen !== "level") return;
    var l = S.level;
    if (S.phase === "intro") { if (k === "Enter" || k === " ") { S.phase = "play"; S.run = null; render(); } return; }
    if (S.phase === "levelDone") { if (k === "Enter") { var nx = nextLevel(l); go(nx ? "level" : "map", nx ? nx.id : undefined); } return; }
    if (l.kind === "forge") {
      var F = S.run;
      if (F && F.finished) { if (k === "Enter") { if (l.custom) go("studio"); else finishRound(); } return; }
      for (var i = 0; i < LD.RULES.length; i++) if (LD.RULE_INFO[LD.RULES[i]].key === k) { applyRule(LD.RULES[i]); return; }
      if (k === "u" || k === "U") undo();
      else if (k === "h" || k === "H") hint();
      return;
    }
    var Q = S.run;
    if (Q && Q.phase === "done" && k === "Enter") { finishRound(); return; }
    if (l.kind === "unfold") { if (Q && LD.isDeltaNF(Q.term, CONTENT.ENVS[l.env]) && k === "Enter") finishRound(); return; }
    var rs = roundsOf(l), spec = rs[S.round];
    if (l.kind === "missing" && /^[1-9]$/.test(k)) { var o = spec.options[+k - 1]; if (o !== undefined) answerMissing(spec, o); return; }
    if (l.kind === "name" || l.kind === "broken") {
      var inst = l.kind === "name" ? spec : CONTENT.stepInstance(spec);
      if (Q.phase === "why" && /^[1-5]$/.test(k)) { answerWhy(inst, spec, CONTENT.WHY[+k - 1][0]); return; }
      if (Q.phase !== "ask") return;
      if (l.kind === "broken" && (k === "b" || k === "B")) { answerName(inst, spec, "BROKEN"); return; }
      for (var j = 0; j < LD.RULES.length; j++) if (LD.RULE_INFO[LD.RULES[j]].key === k) { answerName(inst, spec, LD.RULES[j]); return; }
    }
  }

  function init() {
    doc.addEventListener("keydown", onKey);
    var logo = doc.getElementById("logo"); if (logo) logo.onclick = function () { go("title"); };
    render();
  }
  if (!(typeof window !== "undefined" && window.__TEST__)) init();
  return { S: S, init: init, go: go, render: render, applyRule: applyRule, undo: undo, hint: hint, onKey: onKey,
    answerName: answerName, answerWhy: answerWhy, answerMissing: answerMissing, unfold: unfold, studio: studio, studioGo: studioGo,
    provenSet: provenSet, linear: linear, roundsOf: roundsOf, finishRound: finishRound, findLevel: findLevel, allLevels: allLevels };
})();
</script>
</body>
